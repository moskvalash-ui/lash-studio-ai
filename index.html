    // Live-camera-only cinematic scanning screen. No manual shutter —
    // face/eye detection runs continuously on the live video stream
    // (~5 detections/sec), frames are quality-gated, accepted frames
    // feed a rolling buffer, and the scan only finalizes once that
    // buffer is both full AND stable across several seconds. A
    // separate, faster requestAnimationFrame loop redraws the
    // tracking overlay every visual frame from the latest known
    // detection, so graphics track the live face smoothly even
    // though heavy detection itself runs slower.
    // ============================================================
    // EYELID CREASE V2 — DEBUG SHADOW MODE UI. Purely additive,
    // ?debug=1-only, never influences classification. Compares V1
    // (production, unchanged) against detectEyelidCreaseV2's candidate
    // geometry — see the detector's own doc comment above for the
    // full rationale and the t-coordinate direction (0=lid, 1=brow,
    // OPPOSITE of V1's creaseYFrac). Remove together with V2 once
    // real-device validation is complete.
    // ============================================================
    // Compact normalized plot: x = sample position across the eyelid
    // (0=inner, 1=outer), y = anatomical height (brow at top, lid at
    // bottom, for visual readability only — independent of t's own
    // numeric direction). V1 is a single dashed line (it has no x
    // position — it collapsed the whole width into one row); V2 is
    // per-column dots, connected within each linked path.
    function CreaseV2Plot({ v1, v2, v2Multi, v2Linked }) {
      const W = 100, H = 56, TOP = 4, BOTTOM = 52; // reserve 4px margins for the BROW/LID labels
      const yFromT_v1 = (frac01) => TOP + frac01 * (BOTTOM - TOP); // v1.creaseYFrac: 0=brow,1=lid — direct mapping
      const yFromT_v2 = (t) => TOP + (1 - t) * (BOTTOM - TOP); // v2 t: 0=lid,1=brow — inverted mapping, see module doc
      const cols = (v2 && v2.sampledColumns) || (v2Multi && v2Multi.sampledColumns) || 1;
      const xFromSample = (i) => cols > 1 ? (i / (cols - 1)) * W : W / 2;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-14" style={{ background: 'rgba(255,255,255,0.03)', borderRadius: 4 }}>
          <text x={2} y={3} fontSize="3" fill="#8fb3c9">BROW (t=1)</text>
          <text x={2} y={H - 0.5} fontSize="3" fill="#8fb3c9">LID (t=0)</text>
          <line x1={0} y1={TOP} x2={W} y2={TOP} stroke="#3a5a6a" strokeWidth="0.5" />
          <line x1={0} y1={BOTTOM} x2={W} y2={BOTTOM} stroke="#3a5a6a" strokeWidth="0.5" />
          {v1 && v1.valid && (
            <>
              <line x1={0} y1={yFromT_v1(v1.creaseYFrac)} x2={W} y2={yFromT_v1(v1.creaseYFrac)} stroke="#f0a83c" strokeWidth="0.9" strokeDasharray="3,2" />
              <text x={W - 12} y={yFromT_v1(v1.creaseYFrac) - 1} fontSize="3" fill="#f0a83c">V1</text>
            </>
          )}
          {v2 && v2.valid && (v2.paths || []).map((p, pi) => {
            const isDisplay = pi === v2.displayPathIndex;
            const midPt = p.points[Math.floor(p.points.length / 2)];
            return (
              <g key={pi} opacity={isDisplay ? 1 : 0.45}>
                <polyline
                  points={p.points.map(c => `${xFromSample(c.sampleIndex)},${yFromT_v2(c.t)}`).join(' ')}
                  fill="none" stroke={isDisplay ? '#3ce6c8' : '#6b8fa3'} strokeWidth="0.7"
                />
                {p.points.map((c, ci) => (
                  <circle key={ci} cx={xFromSample(c.sampleIndex)} cy={yFromT_v2(c.t)} r={isDisplay ? 1.3 : 0.9}
                    fill={isDisplay ? '#3ce6c8' : '#6b8fa3'} />
                ))}
                {/* Task requirement — every returned path gets an
                    on-graph P# label, not just the display candidate. */}
                {midPt && (
                  <text x={xFromSample(midPt.sampleIndex) + 1.5} y={yFromT_v2(midPt.t) - 1.5} fontSize="3.2"
                    fill={isDisplay ? '#3ce6c8' : '#8fa8b5'} fontWeight={isDisplay ? 'bold' : 'normal'}>
                    {`P${pi}${isDisplay ? '*' : ''}`}
                  </text>
                )}
              </g>
            );
          })}
          {/* V2.1 MULTI-PEAK SHADOW — observation only. Every retained
              peak in every sampled column is plotted as its own dot in
              the SAME coordinate system as V1/V2 above (reuses
              xFromSample/yFromT_v2 unchanged); the current-V2-winner
              peak is drawn distinctly. This dot layer is deliberately
              NOT itself connected by any polyline — the V2.2 layer
              below draws the linked-path polylines separately, so the
              raw (unlinked) peak evidence stays independently visible. */}
          {v2Multi && v2Multi.valid && (v2Multi.columns || []).flatMap((c) => (
            c.peaks || []
          ).map((p) => (
            <circle
              key={`m-${c.sampleIndex}-${p.rankWithinColumn}`}
              cx={xFromSample(c.sampleIndex)} cy={yFromT_v2(p.t)}
              r={p.currentV2Winner ? 0.9 : 0.55}
              fill={p.currentV2Winner ? '#e85fd1' : '#ffffff'}
              opacity={p.currentV2Winner ? 0.9 : 0.5}
            />
          )))}
          {/* V2.2 MULTI-PEAK PATH LINKING SHADOW — observation only.
              Every linked path debugV2LinkMultiPeakPaths found is drawn
              as its own polyline, connecting the SAME V2.1 dots above
              (reuses the identical xFromSample/yFromT_v2 mapping) — a
              path that contains the frozen V2 winner is drawn solid, any
              other linked path (a competing/secondary track) is dashed,
              so a genuinely separate crease candidate stays visually
              distinguishable from the already-known V2 winner's path. */}
          {v2Linked && v2Linked.valid && (v2Linked.paths || []).map((p, pi) => (
            <polyline
              key={`lk-${pi}`}
              points={p.points.map(c => `${xFromSample(c.sampleIndex)},${yFromT_v2(c.t)}`).join(' ')}
              fill="none"
              stroke={p.containsV2Winner ? '#ffd23c' : '#a97cf0'}
              strokeWidth="0.55"
              strokeDasharray={p.containsV2Winner ? undefined : '1.5,1'}
              opacity="0.85"
            />
          ))}
        </svg>
      );
    }

    // DEBUG-UI-ONLY re-display of the SAME heuristic rank
    // detectEyelidCreaseV2 already computes internally to pick
    // displayPathIndex (see DEBUG_HEURISTIC_RANK inside that
    // function). Recomputed here, at the display layer, using the
    // identical formula, purely so every path's score can be shown —
    // this does NOT change which path is selected as the display
    // candidate (that decision is made once, inside detectEyelidCreaseV2,
    // completely untouched) and does NOT touch that function's source
    // at all.
    function debugV2DisplayRank(p) {
      return p.continuityFrac * (p.meanLocalStrength != null ? p.meanLocalStrength : p.meanRawStrength);
    }

    // DEBUG-UI-ONLY derived flag — NOT a V1 code change. detectEyelidCrease
    // (V1) already returns creaseYFrac = peakIdx/(rows-1) with no clamping,
    // so creaseYFrac is EXACTLY 0 or EXACTLY 1 (no floating rounding) if
    // and only if the row-gradient argmax landed on the very first or very
    // last row of its search band — see the boundary-peak audit finding
    // (that case forces prominence to 0 by construction, which is an edge
    // artifact, not evidence of "no crease"). Computed purely from V1's
    // own already-returned output; V1 itself is not read from or altered.
    function debugV1BoundaryPeakFlag(v1) {
      if (!v1 || !v1.valid) return null;
      return v1.creaseYFrac === 0 || v1.creaseYFrac === 1;
    }

    // ============================================================
    // EXPERIMENTAL EYELID-TYPE INTEGRATION — DEBUG-ONLY LOCAL PROTOTYPE.
    // ------------------------------------------------------------
    // classifyFeatures (production, untouched) contains an internal,
    // non-exported `eyeCreaseVerdict` closure that decides per-eye
    // crease evidence using THREE constants: CREASE_PEAK_FLOOR=7,
    // CREASE_PROMINENCE_FLOOR=5, CREASE_ABSENCE_MARGIN=0.5, plus a
    // readQuality>0.28 readability floor — see index.html's eyelid
    // classification block (~line 1610-1637). Since that closure isn't
    // reachable from outside classifyFeatures without modifying it,
    // debugEyeCreaseVerdict below is a byte-for-byte duplicate of its
    // LOGIC using the SAME three constants (re-declared here with the
    // identical values, not new numbers) — a source-guard test
    // confirms these values haven't drifted from production's own.
    // No new anatomical threshold is introduced anywhere in this block.
    const DEBUG_CREASE_PEAK_FLOOR = 7;
    const DEBUG_CREASE_PROMINENCE_FLOOR = 5;
    const DEBUG_CREASE_ABSENCE_MARGIN = 0.5;
    const DEBUG_CREASE_READABLE_FLOOR = 0.28;
    function debugEyeCreaseVerdict(m) {
      const readable = m.creaseValid > 0.5 && m.creaseReadQuality > DEBUG_CREASE_READABLE_FLOOR;
      if (!readable) return 'uncertain';
      const fold = m.creasePeak > DEBUG_CREASE_PEAK_FLOOR && m.creaseProminence > DEBUG_CREASE_PROMINENCE_FLOOR;
      if (fold) return 'detected';
      const confidentlyAbsent = m.creasePeak < DEBUG_CREASE_PEAK_FLOOR * DEBUG_CREASE_ABSENCE_MARGIN
        && m.creaseProminence < DEBUG_CREASE_PROMINENCE_FLOOR * DEBUG_CREASE_ABSENCE_MARGIN;
      return confidentlyAbsent ? 'confidentlyAbsent' : 'borderline';
    }

    // resolveEyelidCreaseEvidence — DESCRIPTIVE evidence layer, per eye.
    // Deliberately answers only "where/whether a crease-like structure
    // was found", never "what is the eyelid type" (that combination
    // happens one layer up, in computeExperimentalEyelidType, and even
    // there only via the SAME decision tree classifyFeatures already
    // uses). Two structural, non-arbitrary reliability checks on V1
    // (both exact-equality / already-proven, not new tuned numbers):
    //   - boundaryPeak (creaseYFrac === 0 or 1, see debugV1BoundaryPeakFlag)
    //   - prominence === 0 (the same construction artifact)
    // V2.2 evidence is ranked, not thresholded: paths are sorted by the
    // SAME debugV2DisplayRank formula already used to pick V2's own
    // display path (continuityFrac * strength) — an existing, already-
    // reviewed ranking, not a new scoring function. No absolute cutoff
    // is applied to meanT, continuity, strength, or thickness anywhere
    // in this function — per-path numbers are reported in `reasons`
    // descriptively, never converted into a boolean via an invented
    // threshold.
    function resolveEyelidCreaseEvidence(v1, v2Linked) {
      const reasons = [];
      const v1Valid = !!(v1 && v1.valid);
      // v1's debug shape ({valid, peakVal, prominence, creaseYFrac,
      // readQuality}) has no separate creaseValid field — v1.valid
      // already IS that check (mirrors production's readable = creaseValid>0.5 && creaseReadQuality>floor).
      const v1Readable = v1Valid && v1.readQuality > DEBUG_CREASE_READABLE_FLOOR;
      const v1BoundaryArtifact = v1Valid && (v1.creaseYFrac === 0 || v1.creaseYFrac === 1);
      const v1PromZero = v1Valid && v1.prominence === 0;
      const v1Unreliable = !v1Valid || !v1Readable || v1BoundaryArtifact || v1PromZero;
      if (!v1Valid) reasons.push('V1 crease read is invalid for this eye.');
      else {
        if (v1BoundaryArtifact) reasons.push(`V1 peak sits at the search-band boundary (creaseYFrac=${v1.creaseYFrac}) — prominence=0 is a construction artifact, not evidence of absence.`);
        if (v1PromZero && !v1BoundaryArtifact) reasons.push('V1 prominence is exactly 0 outside the boundary case — treated as unreliable for the same structural reason.');
        if (!v1Readable) reasons.push(`V1 read quality (${v1.readQuality != null ? v1.readQuality.toFixed(2) : 'n/a'}) is at/below the existing ${DEBUG_CREASE_READABLE_FLOOR} readability floor already used in production.`);
      }
      const v1Verdict = v1Unreliable ? 'unreliable' : debugEyeCreaseVerdict({
        creaseValid: 1, creaseReadQuality: v1.readQuality, creasePeak: v1.peakVal, creaseProminence: v1.prominence,
      });
      if (!v1Unreliable) reasons.push(`V1 verdict (via the same production floors): ${v1Verdict}.`);

      const validPaths = (v2Linked && v2Linked.valid) ? (v2Linked.paths || []) : [];
      const rankedPaths = validPaths.slice().sort((a, b) => debugV2DisplayRank(b) - debugV2DisplayRank(a));
      const selectedPath = rankedPaths.length ? rankedPaths[0] : null;
      const alternativePaths = rankedPaths.slice(1);
      if (selectedPath) {
        reasons.push(`V2.2 found ${validPaths.length} linked path(s); top-ranked spans ${(selectedPath.continuityFrac * 100).toFixed(0)}% of sampled columns at meanT=${selectedPath.meanT.toFixed(3)} (tVar=${selectedPath.tVariation.toFixed(3)}, thickness=${selectedPath.meanThickness.toFixed(2)}).`);
      } else {
        reasons.push('V2.2 found no linked paths for this eye.');
      }

      let state;
      if (v1Unreliable && !selectedPath) {
        state = 'unreliable';
        reasons.push('Both V1 and V2.2 evidence are unreliable/absent for this eye — no basis to assert a state.');
      } else if (v1Unreliable && selectedPath) {
        state = 'crease_detected';
        reasons.push('V1 evidence is unreliable; deferring to V2.2\'s top-ranked persistent path as descriptive evidence a fold-like structure exists (its anatomical meaning is not decided here).');
      } else if (!v1Unreliable && !selectedPath) {
        state = v1Verdict === 'detected' ? 'crease_detected' : v1Verdict === 'confidentlyAbsent' ? 'crease_not_detected' : 'conflicting';
        reasons.push('V1 evidence is reliable; V2.2 produced no candidate paths to cross-check against.');
      } else if (v1Verdict === 'detected') {
        state = 'crease_detected';
        reasons.push('V1 detected a fold and V2.2 independently found at least one persistent path — evidence agrees on existence.');
      } else if (v1Verdict === 'confidentlyAbsent') {
        state = 'conflicting';
        reasons.push('V1 reads confidently-absent, but V2.2 independently found a persistent linked path — conflicting evidence, not auto-resolved.');
      } else {
        state = 'conflicting';
        reasons.push('V1 verdict is borderline; V2.2 found candidate path(s), but agreement cannot be established without inventing a new anatomical threshold — deliberately left unresolved.');
      }

      const evidenceQuality = clamp01(
        (v1Unreliable ? 0 : (v1.readQuality != null ? v1.readQuality : 0)) * 0.5
        + (selectedPath ? selectedPath.continuityFrac : 0) * 0.5
      );

      return { state, evidenceQuality, selectedPath, alternativePaths, reasons, v1Verdict, v1Unreliable };
    }

    // Maps a per-eye evidence state onto the SAME vocabulary
    // classifyFeatures' own eyeCreaseVerdict already uses, so the
    // EXACT SAME bilateral-agreement + decision-tree logic below can be
    // reused verbatim rather than reinvented.
    function debugEvidenceToVerdict(evidence) {
      switch (evidence.state) {
        case 'crease_detected': return 'detected';
        case 'crease_not_detected': return 'confidentlyAbsent';
        case 'conflicting': return 'borderline';
        default: return 'uncertain'; // 'unreliable'
      }
    }

    // computeExperimentalEyelidType — combines LEFT+RIGHT evidence using
    // the IDENTICAL bilateral-agreement rule and decision-tree branches
    // classifyFeatures' own eyelidType block already uses (same
    // structure, same eyelidCategory geometry input, same 0.62
    // ambiguous-position boundary and 'hooded'/'monolid'/'uncertain'/
    // 'openCrease' outcomes) — the ONLY difference from production is
    // that the per-eye verdict comes from resolveEyelidCreaseEvidence
    // (which can defer to V2.2 when V1 is unreliable) instead of raw V1
    // alone. eyelidCategory is read from the REAL classifyFeatures
    // result passed in — never recomputed or mutated here, so Eye
    // Geometry stays exactly as independent as in production.
    function computeExperimentalEyelidType(leftEvidence, rightEvidence, eyelidCategory) {
      const leftVerdict = debugEvidenceToVerdict(leftEvidence);
      const rightVerdict = debugEvidenceToVerdict(rightEvidence);
      const combined = (leftVerdict === rightVerdict) ? leftVerdict : 'uncertain';

      // Position (V1's creaseYFrac convention: 0=brow,1=lid) used only
      // for the SAME ambiguous-low-position branch production already
      // has. When V1 is unreliable for an eye, its V2.2 selectedPath.t
      // (0=lid,1=brow — the OPPOSITE convention, per the V2 module doc)
      // is converted via 1-t so the two sources are never compared on
      // mismatched axes.
      const eyeYFrac = (v1, evidence) => {
        if (!evidence.v1Unreliable && v1 && v1.valid) return v1.creaseYFrac;
        if (evidence.selectedPath) return 1 - evidence.selectedPath.meanT;
        return null;
      };

      let eyelidType;
      let why;
      if (combined === 'uncertain' || combined === 'borderline') {
        eyelidType = 'uncertain';
        why = (leftVerdict !== rightVerdict)
          ? `left/right evidence disagree (left=${leftVerdict}, right=${rightVerdict})`
          : 'evidence is borderline on both eyes';
      } else if (combined === 'detected') {
        if (eyelidCategory === 'moderate' || eyelidCategory === 'pronounced') {
          eyelidType = 'hooded';
          why = `crease evidence detected on both eyes AND geometry independently reads ${eyelidCategory}`;
        } else {
          const lyf = eyeYFrac(null, leftEvidence), ryf = eyeYFrac(null, rightEvidence);
          const avgYFrac = (lyf != null && ryf != null) ? (lyf + ryf) / 2 : null;
          if (avgYFrac != null && avgYFrac > 0.62) {
            eyelidType = 'uncertain';
            why = 'clear fold on both eyes at a low position, but geometry does not independently read moderate/pronounced — ambiguous, not forced either way';
          } else {
            eyelidType = 'openCrease';
            why = 'crease evidence detected on both eyes; geometry reads open/mild';
          }
        }
      } else { // 'confidentlyAbsent'
        if (eyelidCategory === 'open') {
          eyelidType = 'monolid';
          why = 'crease confidently absent on both eyes AND geometry independently reads open';
        } else {
          eyelidType = 'uncertain';
          why = `crease confidently absent on both eyes but geometry reads ${eyelidCategory}, not open — a real conflict, not a confirmation`;
        }
      }

      return { eyelidType, why, leftVerdict, rightVerdict, combined };
    }

    // ============================================================
    // REAL EYELID FRAME TRACE — DEBUG-ONLY OBSERVABILITY.
    // ------------------------------------------------------------
    // Pure functions only — no React state here. buildEyelidFrameTrace
    // classifies ONE already-accepted production buffer frame (the
    // EXACT object shape pushed to bufferRef.current — same technique
    // already used for the debug "CURRENT TYPE" preview: aggregateBuffer
    // ([frameEntry]) + classifyFeatures(..., {singleFrame:true,...}),
    // i.e. the REAL, unmodified production functions, never a parallel
    // approximation. Reuses the existing debugEyeCreaseVerdict (same
    // CREASE_PEAK_FLOOR/PROMINENCE_FLOOR/ABSENCE_MARGIN/readable-floor
    // constants as production) and debugV1BoundaryPeakFlag — no new
    // anatomical threshold. The "low_image_quality"/"pose_issue" reason
    // flags reuse assessFrameQuality's OWN existing acceptance
    // thresholds (45/235/10/18/0.32/0.25/1.3) verbatim — see the drift
    // test comparing these literals against assessFrameQuality's source.
    // ============================================================
    function buildEyelidFrameTrace(index, frameEntry, brightness, sharpness) {
      const singleAggregated = aggregateBuffer([frameEntry]);
      const result = classifyFeatures(singleAggregated, { singleFrame: true, stability: null, imageQuality: frameEntry.qualityScore });
      const leftVerdict = debugEyeCreaseVerdict(frameEntry.leftMetrics);
      const rightVerdict = debugEyeCreaseVerdict(frameEntry.rightMetrics);
      const leftBoundary = debugV1BoundaryPeakFlag({ valid: frameEntry.leftMetrics.creaseValid > 0.5, creaseYFrac: frameEntry.leftMetrics.creaseYFrac });
      const rightBoundary = debugV1BoundaryPeakFlag({ valid: frameEntry.rightMetrics.creaseValid > 0.5, creaseYFrac: frameEntry.rightMetrics.creaseYFrac });
      const leftUnreliable = leftVerdict !== 'detected' && leftVerdict !== 'confidentlyAbsent';
      const rightUnreliable = rightVerdict !== 'detected' && rightVerdict !== 'confidentlyAbsent';
      const creaseDisagreement = leftVerdict !== rightVerdict;
      const geometryConflict = result.eyelidType === 'uncertain' && result.eyelidSignalsConflict === true && !creaseDisagreement;
      const lowImageQuality = brightness < 45 || brightness > 235 || sharpness < 10;
      const poseIssue = Math.abs(frameEntry.headPose.roll) > 18 || Math.abs(frameEntry.headPose.yawProxy) > 0.32
        || frameEntry.headPose.pitchProxy < 0.25 || frameEntry.headPose.pitchProxy > 1.3;
      const reasons = [];
      if (leftUnreliable) reasons.push('left_unreliable');
      if (rightUnreliable) reasons.push('right_unreliable');
      if (creaseDisagreement) reasons.push('crease_disagreement');
      if (geometryConflict) reasons.push('geometry_conflict');
      if (lowImageQuality) reasons.push('low_image_quality');
      if (poseIssue) reasons.push('pose_issue');
      if (leftBoundary || rightBoundary) reasons.push('boundary_artifact');
      const eyeTrace = (metrics, verdict, boundary) => ({
        creaseValid: metrics.creaseValid, creasePeak: metrics.creasePeak, creaseProminence: metrics.creaseProminence,
        creaseYFrac: metrics.creaseYFrac, creaseReadQuality: metrics.creaseReadQuality,
        boundaryArtifact: boundary, verdict,
      });
      return {
        index, t: frameEntry.t != null ? frameEntry.t : null,
        image: {
          imageQuality: frameEntry.qualityScore != null ? frameEntry.qualityScore : null,
          brightness: brightness != null ? brightness : null,
          sharpness: sharpness != null ? sharpness : null,
          earLeft: frameEntry.leftMetrics.ear != null ? frameEntry.leftMetrics.ear : null,
          earRight: frameEntry.rightMetrics.ear != null ? frameEntry.rightMetrics.ear : null,
          roll: frameEntry.headPose.roll != null ? frameEntry.headPose.roll : null,
          yaw: frameEntry.headPose.yawProxy != null ? frameEntry.headPose.yawProxy : null,
          pitch: frameEntry.headPose.pitchProxy != null ? frameEntry.headPose.pitchProxy : null,
        },
        left: eyeTrace(frameEntry.leftMetrics, leftVerdict, leftBoundary),
        right: eyeTrace(frameEntry.rightMetrics, rightVerdict, rightBoundary),
        eyelidCategory: result.eyelidCategory, eyelidType: result.eyelidType, eyelidSignalsConflict: result.eyelidSignalsConflict,
        reasons,
      };
    }

    // Pure — running counts over the accumulated trace array. Purely
    // descriptive tallies, no thresholds.
    function summarizeFrameTrace(frames) {
      const counts = { total: frames.length, openCrease: 0, hooded: 0, monolid: 0, uncertain: 0, leftUnreliable: 0, rightUnreliable: 0, boundary: 0 };
      for (const f of frames) {
        if (f.eyelidType === 'openCrease') counts.openCrease++;
        else if (f.eyelidType === 'hooded') counts.hooded++;
        else if (f.eyelidType === 'monolid') counts.monolid++;
        else counts.uncertain++;
        if (f.reasons.includes('left_unreliable')) counts.leftUnreliable++;
        if (f.reasons.includes('right_unreliable')) counts.rightUnreliable++;
        if (f.reasons.includes('boundary_artifact')) counts.boundary++;
      }
      return counts;
    }

    // DEBUG-UI-ONLY display of one eye's resolveEyelidCreaseEvidence
    // result, per the real-iPhone-capture UI requirement — every value
    // below is read off `evidence` (already computed and returned by
    // resolveEyelidCreaseEvidence) and `v1` (the same V1 debug object
    // CreaseV2EyePanel already reads); nothing here recomputes anything.
    function EvidenceEyeBlock({ label, v1, evidence }) {
      if (!evidence) return null;
      const boundaryArtifact = debugV1BoundaryPeakFlag(v1);
      const sp = evidence.selectedPath;
      return (
        <div className="mt-1 pt-1 border-t border-white/5 grid grid-cols-2 gap-x-2">
          <span className="col-span-2 font-semibold text-orange-200">{label}</span>
          <span className="text-textMuted">V1 peak/prom/yFrac/rq</span>
          <span>{v1 && v1.valid ? `${v1.peakVal.toFixed(1)}/${v1.prominence.toFixed(1)}/${v1.creaseYFrac.toFixed(2)}/${v1.readQuality.toFixed(2)}` : 'invalid'}</span>
          <span className="text-textMuted">V1 reliable</span>
          <span>{evidence.v1Unreliable ? 'no' : 'yes'}</span>
          <span className="text-textMuted">V1 boundary artifact</span>
          <span>{boundaryArtifact === null ? 'n/a' : (boundaryArtifact ? 'yes' : 'no')}</span>
          <span className="text-textMuted">V1 verdict</span>
          <span>{evidence.v1Verdict}</span>
          <span className="text-textMuted">V2.2 selected path</span>
          <span>{sp ? `found (${evidence.alternativePaths.length} alt.)` : 'none'}</span>
          <span className="text-textMuted">V2.2 meanT</span>
          <span>{sp ? sp.meanT.toFixed(3) : '-'}</span>
          <span className="text-textMuted">V2.2 continuity</span>
          <span>{sp ? `${(sp.continuityFrac * 100).toFixed(0)}%` : '-'}</span>
          <span className="text-textMuted">resolved crease evidence</span>
          <span className="text-orange-300">{evidence.state}</span>
          <span className="text-textMuted col-span-2">reason</span>
          <span className="col-span-2 text-textSecondary">{evidence.reasons.join(' ')}</span>
        </div>
      );
    }

    function CreaseV2EyePanel({ label, entry }) {
      if (!entry) return null;
      const { v1, v2, v2Multi, v2Linked } = entry;
      const boundaryPeak = debugV1BoundaryPeakFlag(v1);
      return (
        <div className="mb-1.5 pb-1.5 border-b border-white/10 last:border-0">
          <p className="text-cyan-200 uppercase">{label}</p>
          <CreaseV2Plot v1={v1} v2={v2} v2Multi={v2Multi} v2Linked={v2Linked} />
          <div className="grid grid-cols-2 gap-x-2">
            <span className="text-textMuted">V1 peak/prom/yFrac</span>
            <span>{v1 && v1.valid ? `${v1.peakVal.toFixed(1)}/${v1.prominence.toFixed(1)}/${v1.creaseYFrac.toFixed(2)}` : 'invalid'}</span>
            {boundaryPeak && (
              <>
                <span className="text-amber-300">V1 boundaryPeak</span>
                <span className="text-amber-300">true (peak at band edge — prominence=0 is an artifact, not "no crease")</span>
              </>
            )}
            <span className="text-textMuted">V2 state/paths</span>
            <span>{v2 && v2.valid ? `${v2.debugHeuristicState} (${v2.paths.length})` : 'invalid'}</span>
            <span className="text-textMuted">V2 display path</span>
            <span className="text-cyan-300">{v2 && v2.valid && v2.displayPathIndex >= 0 ? `P${v2.displayPathIndex}` : 'none'}</span>
            <span className="text-textMuted">V2 runtime</span>
            <span>{v2 && v2.valid ? `${v2.v2RuntimeMs.toFixed(1)}ms` : '-'}</span>
            <span className="text-textMuted">V2.1 multi runtime</span>
            <span>{v2Multi && v2Multi.valid ? `${v2Multi.v2MultiRuntimeMs.toFixed(1)}ms` : '-'}</span>
            <span className="text-textMuted">V2.2 linked paths/runtime</span>
            <span>{v2Linked && v2Linked.valid ? `${v2Linked.paths.length} / ${v2Linked.v2LinkedRuntimeMs.toFixed(1)}ms` : '-'}</span>
          </div>
          {/* ALL paths, not just the display candidate — every path
              that detectEyelidCreaseV2 returned gets its own row here,
              unfiltered, unranked-beyond-display-order. */}
          {v2 && v2.valid && v2.paths.map((p, pi) => {
            const isDisplay = pi === v2.displayPathIndex;
            return (
              <div key={pi} className={`mt-1 pt-1 border-t border-white/5 grid grid-cols-2 gap-x-2 ${isDisplay ? 'text-cyan-300' : ''}`}>
                <span className="col-span-2 font-semibold">{`P${pi}${isDisplay ? ' — DISPLAY' : ''}`}</span>
                <span className="text-textMuted">meanT/tVar</span>
                <span>{p.meanT.toFixed(3)} / {p.tVariation.toFixed(3)}</span>
                <span className="text-textMuted">continuity/points</span>
                <span>{(p.continuityFrac * 100).toFixed(0)}% / {p.points.length}</span>
                <span className="text-textMuted">xSpan</span>
                <span>{p.xSpan[0].toFixed(1)}-{p.xSpan[1].toFixed(1)}</span>
                <span className="text-textMuted">raw/local strength</span>
                <span>{p.meanRawStrength.toFixed(2)} / {p.meanLocalStrength != null ? p.meanLocalStrength.toFixed(2) : 'null'}</span>
                <span className="text-textMuted">thickness/rank</span>
                <span>{p.meanThickness.toFixed(2)} / {debugV2DisplayRank(p).toFixed(3)}</span>
              </div>
            );
          })}
          {/* V2.1 MULTI-PEAK SHADOW — observation only, per-column list of
              every retained local peak. Does NOT select, link, or score a
              "true" crease; the [CURRENT] tag only marks whichever peak
              the frozen detectEyelidCreaseV2 itself already picked. */}
          {v2Multi && v2Multi.valid && (
            <div className="mt-1 pt-1 border-t border-white/10">
              <span className="col-span-2 font-semibold text-purple-300">{`V2.1 MULTI-PEAK SHADOW (obs. only, top ${DEBUG_V2_MULTI_MAX_PEAKS})`}</span>
              {v2Multi.columns.map((c) => (
                <div key={c.sampleIndex} className="mt-0.5">
                  <span className="text-textMuted">{`C${c.sampleIndex}`}</span>
                  {c.peaks ? c.peaks.map((p) => (
                    <div key={p.rankWithinColumn} className={`pl-2 ${p.currentV2Winner ? 'text-cyan-300' : 'text-textSecondary'}`}>
                      {`#${p.rankWithinColumn} t=${p.t.toFixed(2)} raw=${p.rawStrength.toFixed(1)} local=${p.localStrength != null ? p.localStrength.toFixed(1) : 'null'} thick=${p.thickness}`}
                      {p.currentV2Winner ? '  [CURRENT]' : ''}
                    </div>
                  )) : <div className="pl-2 text-textMuted">no candidate</div>}
                </div>
              ))}
            </div>
          )}
          {/* V2.2 MULTI-PEAK PATH LINKING SHADOW — observation only.
              Links the SAME V2.1 peaks above across columns (multi-track
              greedy, gap-limited by the existing PATH_LINK_MAX_T_GAP —
              no new threshold). Does NOT rank or select a "true" crease;
              containsV2Winner only marks whether this path happens to
              pass through the frozen V2's own single-argmax candidate. */}
          {v2Linked && v2Linked.valid && v2Linked.paths.map((p, pi) => (
            <div key={pi} className={`mt-1 pt-1 border-t border-white/5 grid grid-cols-2 gap-x-2 ${p.containsV2Winner ? 'text-yellow-300' : 'text-purple-200'}`}>
              <span className="col-span-2 font-semibold">{`L${pi}${p.containsV2Winner ? ' (contains V2 winner)' : ''}`}</span>
              <span className="text-textMuted">meanT/tVar</span>
              <span>{p.meanT.toFixed(3)} / {p.tVariation.toFixed(3)}</span>
              <span className="text-textMuted">continuity/points</span>
              <span>{(p.continuityFrac * 100).toFixed(0)}% / {p.points.length}</span>
              <span className="text-textMuted">xSpan</span>
              <span>{p.xSpan[0].toFixed(1)}-{p.xSpan[1].toFixed(1)}</span>
              <span className="text-textMuted">raw/local strength</span>
              <span>{p.meanRawStrength.toFixed(2)} / {p.meanLocalStrength != null ? p.meanLocalStrength.toFixed(2) : 'null'}</span>
              <span className="text-textMuted">thickness</span>
              <span>{p.meanThickness.toFixed(2)}</span>
            </div>
          ))}
        </div>
      );
    }

    // Pure, testable transform from the live debugCreaseV2 state shape
    // into the exact engineering-report payload shape requested for
    // pasting into an external LLM/analysis tool. Reads only already-
    // computed values off `data` — never recomputes or alters any V1/V2
    // measurement. Missing/invalid values are explicit null, never a
    // substituted 0.
    function buildCreaseV2CopyPayload(data, compare, frameTrace, irisAudit) {
      const eyeV1 = (v1) => (v1 && v1.valid) ? {
        peakVal: v1.peakVal, prominence: v1.prominence, creaseYFrac: v1.creaseYFrac, readQuality: v1.readQuality,
        boundaryPeak: debugV1BoundaryPeakFlag(v1),
      } : { peakVal: null, prominence: null, creaseYFrac: null, readQuality: null, boundaryPeak: null };
      const eyeV2 = (v2) => (v2 && v2.valid) ? {
        displayPathIndex: v2.displayPathIndex >= 0 ? v2.displayPathIndex : null,
        runtimeMs: v2.v2RuntimeMs != null ? v2.v2RuntimeMs : null,
        roi: { w: v2.roiW != null ? v2.roiW : null, h: v2.roiH != null ? v2.roiH : null },
        paths: (v2.paths || []).map((p, i) => ({
          index: i,
          meanT: p.meanT, tVariation: p.tVariation, continuityFrac: p.continuityFrac,
          xSpan: p.xSpan, pointCount: p.points.length,
          meanRawStrength: p.meanRawStrength,
          meanLocalStrength: p.meanLocalStrength != null ? p.meanLocalStrength : null,
          meanThickness: p.meanThickness != null ? p.meanThickness : null,
          points: p.points.map(c => ({
            sampleIndex: c.sampleIndex, x: c.x, y: c.y, t: c.t,
            rawStrength: c.rawStrength, prominence: c.prominence,
            localStrength: c.localStrength != null ? c.localStrength : null,
            thickness: c.thickness != null ? c.thickness : null,
          })),
        })),
      } : { displayPathIndex: null, runtimeMs: null, roi: { w: null, h: null }, paths: null };
      // V2.1 MULTI-PEAK SHADOW — separate field, additive only; does not
      // alter the v1/v2 shapes above in any way.
      const eyeV2Multi = (v2m) => (v2m && v2m.valid) ? {
        runtimeMs: v2m.v2MultiRuntimeMs != null ? v2m.v2MultiRuntimeMs : null,
        columns: (v2m.columns || []).map(c => ({
          sampleIndex: c.sampleIndex, x: c.x,
          peaks: c.peaks ? c.peaks.map(p => ({
            rankWithinColumn: p.rankWithinColumn,
            currentV2Winner: p.currentV2Winner,
            y: p.y, t: p.t, rawStrength: p.rawStrength, prominence: p.prominence,
            localStrength: p.localStrength != null ? p.localStrength : null,
            thickness: p.thickness != null ? p.thickness : null,
          })) : null,
        })),
      } : { runtimeMs: null, columns: null };
      // V2.2 MULTI-PEAK PATH LINKING SHADOW — separate field, additive
      // only; does not alter v1/v2/v2MultiShadow above in any way.
      const eyeV2Linked = (v2l) => (v2l && v2l.valid) ? {
        runtimeMs: v2l.v2LinkedRuntimeMs != null ? v2l.v2LinkedRuntimeMs : null,
        paths: (v2l.paths || []).map((p, i) => ({
          index: i,
          containsV2Winner: p.containsV2Winner,
          meanT: p.meanT, tVariation: p.tVariation, continuityFrac: p.continuityFrac,
          xSpan: p.xSpan, pointCount: p.points.length,
          meanRawStrength: p.meanRawStrength,
          meanLocalStrength: p.meanLocalStrength != null ? p.meanLocalStrength : null,
          meanThickness: p.meanThickness != null ? p.meanThickness : null,
          points: p.points.map(c => ({
            sampleIndex: c.sampleIndex, x: c.x, y: c.y, t: c.t,
            rawStrength: c.rawStrength, prominence: c.prominence,
            localStrength: c.localStrength != null ? c.localStrength : null,
            thickness: c.thickness != null ? c.thickness : null,
          })),
        })),
      } : { runtimeMs: null, paths: null };
      // EXPERIMENTAL EYELID TYPE — separate field, additive only; does
      // not alter v1/v2/v2MultiShadow/v2LinkedShadow above. Reads only
      // already-computed evidence fields (resolveEyelidCreaseEvidence's
      // return shape), same null-safety convention as everything else
      // in this payload.
      const eyeEvidence = (v1, evidence) => {
        const boundaryArtifact = debugV1BoundaryPeakFlag(v1);
        const sp = evidence ? evidence.selectedPath : null;
        return {
          v1: v1 && v1.valid ? { peakVal: v1.peakVal, prominence: v1.prominence, creaseYFrac: v1.creaseYFrac, readQuality: v1.readQuality } : null,
          v1Reliable: evidence ? !evidence.v1Unreliable : null,
          v1BoundaryArtifact: boundaryArtifact,
          v1Verdict: evidence ? evidence.v1Verdict : null,
          v2SelectedPath: sp ? {
            meanT: sp.meanT, continuityFrac: sp.continuityFrac, tVariation: sp.tVariation,
            meanRawStrength: sp.meanRawStrength, meanLocalStrength: sp.meanLocalStrength != null ? sp.meanLocalStrength : null,
            meanThickness: sp.meanThickness, containsV2Winner: sp.containsV2Winner,
          } : null,
          alternativePathCount: evidence ? evidence.alternativePaths.length : null,
          resolvedState: evidence ? evidence.state : null,
          evidenceQuality: evidence ? evidence.evidenceQuality : null,
          reasons: evidence ? evidence.reasons : null,
        };
      };
      const capture = data.capture || {};
      return {
        timestamp: new Date().toISOString(),
        capture: {
          earL: capture.ear ? capture.ear.left : null,
          earR: capture.ear ? capture.ear.right : null,
          roll: capture.roll != null ? capture.roll : null,
          yaw: capture.yaw != null ? capture.yaw : null,
          pitch: capture.pitch != null ? capture.pitch : null,
          brightness: capture.brightness != null ? capture.brightness : null,
          sharpness: capture.sharpness != null ? capture.sharpness : null,
        },
        eyes: {
          left: {
            v1: eyeV1(data.left && data.left.v1), v2: eyeV2(data.left && data.left.v2),
            v2MultiShadow: eyeV2Multi(data.left && data.left.v2Multi),
            v2LinkedShadow: eyeV2Linked(data.left && data.left.v2Linked),
          },
          right: {
            v1: eyeV1(data.right && data.right.v1), v2: eyeV2(data.right && data.right.v2),
            v2MultiShadow: eyeV2Multi(data.right && data.right.v2Multi),
            v2LinkedShadow: eyeV2Linked(data.right && data.right.v2Linked),
          },
        },
        experimentalEyelidType: {
          currentType: compare ? compare.currentType : null,
          experimentalType: compare ? compare.experimentalType : null,
          geometryCategory: compare ? compare.currentCategory : null,
          combinedEvidence: compare ? compare.combined : null,
          why: compare ? compare.why : null,
          left: eyeEvidence(data.left && data.left.v1, compare && compare.leftEvidence),
          right: eyeEvidence(data.right && data.right.v1, compare && compare.rightEvidence),
        },
        // REAL EYELID FRAME TRACE — separate field, additive only. Every
        // sub-value is passed through VERBATIM from what
        // buildEyelidFrameTrace/aggregateBuffer/classifyFeatures already
        // computed (real production functions, real per-frame data) —
        // never truncated, never re-derived here.
        productionEyelidTrace: {
          frames: frameTrace ? frameTrace.frames : null,
          aggregate: frameTrace ? frameTrace.aggregate : null,
          finalClassified: frameTrace ? frameTrace.finalClassified : null,
          finalRecType: frameTrace ? frameTrace.finalRecType : null,
          counts: frameTrace ? frameTrace.counts : null,
        },
        // HOODING V2 — STAGE 1 raw geometry. Separate field, additive
        // only; passed through VERBATIM from buildHoodingV2Debug/
        // buildHoodingV2CrossEye (measure-only, debug-only pure
        // functions — see their own header comments) — never
        // truncated, never re-derived here. Does not alter any field
        // above in any way.
        hoodingV2Raw: {
          left: (data.hoodingV2Raw && data.hoodingV2Raw.left) || null,
          right: (data.hoodingV2Raw && data.hoodingV2Raw.right) || null,
          crossEye: (data.hoodingV2Raw && data.hoodingV2Raw.crossEye) || null,
        },
        // HOODING V2 — STAGE 2B path topology. Separate field,
        // additive only; passed through VERBATIM from
        // buildHoodingTopologyV2B/buildHoodingTopologyV2BCrossEye
        // (measure-only, debug-only pure functions — see their own
        // header comment) — never truncated, never re-derived here.
        // Does not alter hoodingV2Raw or any field above in any way.
        hoodingTopologyV2B: {
          stage: (data.hoodingTopologyV2B && data.hoodingTopologyV2B.stage) || null,
          left: (data.hoodingTopologyV2B && data.hoodingTopologyV2B.left) || null,
          right: (data.hoodingTopologyV2B && data.hoodingTopologyV2B.right) || null,
          crossEye: (data.hoodingTopologyV2B && data.hoodingTopologyV2B.crossEye) || null,
        },
        // IRIS COLOR — DEBUG-ONLY raw pixel audit. Separate field,
        // additive only; passed through VERBATIM from
        // buildIrisColorAudit/buildIrisColorAuditCombined (measure-
        // only, debug-only pure functions that re-run sampleIrisColor/
        // classifyIrisColor/combineIris's OWN unmodified formulas —
        // see their own header comment) — never truncated, never re-
        // derived here. Does not alter any field above in any way.
        irisColorAudit: {
          left: (irisAudit && irisAudit.left) || null,
          right: (irisAudit && irisAudit.right) || null,
          combined: (irisAudit && irisAudit.combined) || null,
        },
      };
    }

    // HOODING V2 — STAGE 1: RAW GEOMETRY visualization. Draws directly
    // on the real captured eye ROI image (not an abstract t-space
    // plot like CreaseV2Plot above) so a human can look at their own
    // eye and identify which, if any, additional path is the lower
    // edge of overhanging skin. Every value shown is read straight off
    // hoodingDebug (buildHoodingV2Debug's already-computed output) —
    // this component computes nothing, classifies nothing, and never
    // labels a path hood/overhang/non-hood on its own.
    function CreaseV2DebugPanel({ data, compare, frameTrace, frameTraceRef, irisAudit }) {
      const [copied, setCopied] = useState(false);
      const copy = () => {
        try {
          // Reads frameTraceRef.current (always the freshest value,
          // updated synchronously at the exact point production
          // computes it) rather than the frameTrace prop — the prop is
          // still used for the live-rendered numbers below, but the
          // Copy action itself must never depend on whether React has
          // already committed/painted the latest render by click time.
          const latestFrameTrace = frameTraceRef ? frameTraceRef.current : frameTrace;
          const payload = JSON.stringify(buildCreaseV2CopyPayload(data, compare, latestFrameTrace, irisAudit), null, 2);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(payload).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }).catch(() => {});
          }
        } catch (e) { /* clipboard unreliable on some iOS versions — the panel above remains the source of truth */ }
      };
      return (
        <div className="absolute left-2 right-2 top-16 z-30 max-h-[58%] flex flex-col rounded-md bg-black/85 font-mono text-[8px] leading-tight text-lime-300">
          {/* Copy control moved ABOVE the long LEFT/RIGHT body (real-
              iPhone finding: it used to sit at the very bottom of a
              scrollable panel and was easy to miss/never reach). */}
          <div className="flex items-center justify-between gap-2 px-2 pt-1.5 pb-1 border-b border-white/10">
            <span className="text-cyan-300 font-semibold">EYELID CREASE V2 — DEBUG SHADOW</span>
            <button onClick={copy} className="shrink-0 px-2 py-1 rounded text-[8px] font-semibold uppercase tracking-wide bg-white/15 text-textSecondary border border-white/20 active:bg-white/25">
              {copied ? 'Copied' : 'Copy V2 JSON'}
            </button>
          </div>
          <div className="px-2 py-1.5 overflow-y-auto flex-1 min-h-0" style={{ WebkitOverflowScrolling: 'touch' }}>
            {/* EXPERIMENTAL EYELID TYPE — DEBUG-ONLY comparison, LOCAL
                PROTOTYPE. Production's own eyelidType (via a real,
                unmodified extra classifyFeatures call) shown next to the
                experimental resolver's result, purely for observation —
                the production result used for onComplete is NOT this
                one (see the module comment at the call site). Every
                field below is read off leftEvidence/rightEvidence,
                which resolveEyelidCreaseEvidence already computes and
                returns — this block only DISPLAYS them, it does not
                change what's computed. */}
            {compare && (
              <div className="mb-1.5 pb-1.5 border-b border-white/10">
                <span className="font-semibold text-orange-300">EXPERIMENTAL EYELID TYPE (local prototype, not production)</span>
                <EvidenceEyeBlock label="LEFT" v1={data.left && data.left.v1} evidence={compare.leftEvidence} />
                <EvidenceEyeBlock label="RIGHT" v1={data.right && data.right.v1} evidence={compare.rightEvidence} />
                <div className="mt-1 pt-1 border-t border-white/10 grid grid-cols-2 gap-x-2">
                  <span className="text-textMuted">CURRENT TYPE</span>
                  <span className="text-cyan-300">{compare.currentType}</span>
                  <span className="text-textMuted">EXPERIMENTAL TYPE</span>
                  <span className={compare.experimentalType === compare.currentType ? 'text-lime-300' : 'text-orange-300'}>{compare.experimentalType}</span>
                  <span className="text-textMuted">GEOMETRY CATEGORY</span>
                  <span>{compare.currentCategory}</span>
                  <span className="text-textMuted">COMBINED EVIDENCE</span>
                  <span>{compare.combined}</span>
                  <span className="text-textMuted col-span-2">WHY</span>
                  <span className="col-span-2 text-textSecondary">{compare.why}</span>
                </div>
              </div>
            )}
            {/* REAL EYELID FRAME TRACE — DEBUG-ONLY observability. Every
                count below is read off frameTrace.counts (already
                computed by summarizeFrameTrace over frameTrace.frames,
                which itself is one buildEyelidFrameTrace(...) entry per
                frame ACTUALLY accepted into bufferRef.current this
                scan). FINAL BUFFER TYPE / FINAL REC TYPE come from the
                REAL aggregateBuffer/classifyFeatures/rec values, filled
                in once at the real finalization call site — null until
                the scan actually finishes. */}
            {frameTrace && (
              <div className="mb-1.5 pb-1.5 border-b border-white/10 grid grid-cols-2 gap-x-2">
                <span className="col-span-2 font-semibold text-purple-300">EYELID FRAME TRACE</span>
                <span className="text-textMuted">Accepted</span>
                <span>{frameTrace.counts.total}</span>
                <span className="text-textMuted">openCrease frames</span>
                <span>{frameTrace.counts.openCrease}</span>
                <span className="text-textMuted">hooded frames</span>
                <span>{frameTrace.counts.hooded}</span>
                <span className="text-textMuted">monolid frames</span>
                <span>{frameTrace.counts.monolid}</span>
                <span className="text-textMuted">uncertain frames</span>
                <span>{frameTrace.counts.uncertain}</span>
                <span className="text-textMuted">LEFT unreliable</span>
                <span>{frameTrace.counts.leftUnreliable}</span>
                <span className="text-textMuted">RIGHT unreliable</span>
                <span>{frameTrace.counts.rightUnreliable}</span>
                <span className="text-textMuted">boundary frames</span>
                <span>{frameTrace.counts.boundary}</span>
                <span className="text-textMuted">FINAL BUFFER TYPE</span>
                <span className="text-cyan-300">{frameTrace.finalClassified ? frameTrace.finalClassified.eyelidType : '-'}</span>
                <span className="text-textMuted">FINAL REC TYPE</span>
                <span className="text-cyan-300">{frameTrace.finalRecType != null ? frameTrace.finalRecType : '-'}</span>
              </div>
            )}
            <p className="text-textMuted mb-1">not used in classification</p>
            <CreaseV2EyePanel label="LEFT" entry={data.left} />
            <CreaseV2EyePanel label="RIGHT" entry={data.right} />
            {/* HOODING V2 — STAGE 1: RAW GEOMETRY. Measure-only
                instrumentation, downstream of the SAME V2.1/V2.2 data
                shown above — no path here is ever auto-labeled hood/
                overhang; see HoodingV2RawGeometryBlock's own comment. */}
            {data.hoodingV2Raw && (
              <div className="mb-1.5 pb-1.5 border-b border-white/10">
                <span className="font-semibold text-yellow-200">HOODING V2 — RAW GEOMETRY (stage 1, measure only)</span>
                <HoodingV2RawGeometryBlock label="LEFT" hoodingDebug={data.hoodingV2Raw.left} roiImage={data.hoodingV2RoiImages && data.hoodingV2RoiImages.left} />
                <HoodingV2RawGeometryBlock label="RIGHT" hoodingDebug={data.hoodingV2Raw.right} roiImage={data.hoodingV2RoiImages && data.hoodingV2RoiImages.right} />
                {data.hoodingV2Raw.crossEye && (
                  <div className="grid grid-cols-2 gap-x-2">
                    <span className="text-textMuted">L/R eyeWidth diff</span>
                    <span>{data.hoodingV2Raw.crossEye.eyeWidthDiffPx != null ? data.hoodingV2Raw.crossEye.eyeWidthDiffPx.toFixed(1) + 'px' : '-'}</span>
                    <span className="text-textMuted">L/R additional-path-count diff</span>
                    <span>{data.hoodingV2Raw.crossEye.additionalPathCountDiff != null ? data.hoodingV2Raw.crossEye.additionalPathCountDiff : '-'}</span>
                    <span className="text-textMuted">L/R lash→crease ratio diff</span>
                    <span>{data.hoodingV2Raw.crossEye.lashCreaseRatioDiff != null ? data.hoodingV2Raw.crossEye.lashCreaseRatioDiff.toFixed(3) : '-'}</span>
                  </div>
                )}
              </div>
            )}
            {/* HOODING V2 — STAGE 2B: PATH TOPOLOGY. Measure-only,
                downstream of the SAME Stage 1 data above — every path
                is retained and ordered, never filtered/classified; see
                HoodingTopologyV2BBlock's own comment. */}
            {data.hoodingTopologyV2B && (
              <div className="mb-1.5 pb-1.5 border-b border-white/10">
                <span className="font-semibold text-orange-200">HOODING V2 — TOPOLOGY (stage 2B, measure only)</span>
                <HoodingTopologyV2BBlock label="LEFT" topology={data.hoodingTopologyV2B.left} />
                <HoodingTopologyV2BBlock label="RIGHT" topology={data.hoodingTopologyV2B.right} />
                {data.hoodingTopologyV2B.crossEye && (
                  <div className="mt-1 pt-1 border-t border-white/10">
                    <span className="text-textMuted">nearestByMeanT (pure argmin, NOT "same structure")</span>
                    {data.hoodingTopologyV2B.crossEye.nearestByMeanT.map((n, i) => (
                      <div key={i} className="grid grid-cols-2 gap-x-2 pl-2">
                        <span>{n.leftPathId} ↔ {n.rightPathId}</span>
                        <span>Δt={n.meanTDiff.toFixed(3)}</span>
                      </div>
                    ))}
                    {data.hoodingTopologyV2B.crossEye.winnerCrossEye && (
                      <div className="grid grid-cols-2 gap-x-2 mt-0.5 pt-0.5 border-t border-white/5">
                        <span className="text-textMuted">winner L↔R</span>
                        <span>{data.hoodingTopologyV2B.crossEye.winnerCrossEye.leftPathId} ↔ {data.hoodingTopologyV2B.crossEye.winnerCrossEye.rightPathId}</span>
                        <span className="text-textMuted">Δt / ΔdistRatio</span>
                        <span>{data.hoodingTopologyV2B.crossEye.winnerCrossEye.meanTDiff.toFixed(3)} / {data.hoodingTopologyV2B.crossEye.winnerCrossEye.distFromLashRatioDiff != null ? data.hoodingTopologyV2B.crossEye.winnerCrossEye.distFromLashRatioDiff.toFixed(3) : '-'}</span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
            {/* IRIS COLOR — RAW PIXEL AUDIT. Measure-only, downstream
                re-run of the SAME sampleIrisColor/classifyIrisColor/
                combineIris formulas (frozen, unmodified) — parity with
                the real production output is asserted by a dedicated
                regression test, see IrisColorAuditBlock's own comment. */}
            {irisAudit && (
              <div className="mb-1.5 pb-1.5 border-b border-white/10">
                <span className="font-semibold text-pink-200">IRIS COLOR — RAW PIXEL AUDIT</span>
                <IrisColorAuditBlock label="LEFT" audit={irisAudit.left} />
                <IrisColorAuditBlock label="RIGHT" audit={irisAudit.right} />
                {irisAudit.combined && (
                  <div className="mt-1 pt-1 border-t border-white/10 grid grid-cols-2 gap-x-2">
                    <span className="text-textMuted">combined category/confidence</span>
                    <span className="text-pink-300">{irisAudit.combined.selectedCategory || '-'} / {irisAudit.combined.confidence != null ? (irisAudit.combined.confidence * 100).toFixed(0) + '%' : '-'}</span>
                    <span className="text-textMuted">L/R RGB distance</span>
                    <span>{irisAudit.combined.rgbDistance != null ? irisAudit.combined.rgbDistance.toFixed(1) : '-'}</span>
                  </div>
                )}
              </div>
            )}
            {data.capture && (
              <div className="grid grid-cols-2 gap-x-2 mb-1.5">
                <span className="text-textMuted">EAR L/R</span>
                <span>{data.capture.ear.left.toFixed(3)}/{data.capture.ear.right.toFixed(3)}</span>
                <span className="text-textMuted">roll/yaw/pitch</span>
                <span>{data.capture.roll.toFixed(1)}/{data.capture.yaw.toFixed(2)}/{data.capture.pitch.toFixed(2)}</span>
                <span className="text-textMuted">bright/sharp</span>
                <span>{data.capture.brightness.toFixed(1)}/{data.capture.sharpness.toFixed(1)}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    // HOODING V2 — STAGE 1: RAW GEOMETRY visualization. Draws directly
    // on the real captured eye ROI image (not an abstract t-space
    // plot like CreaseV2Plot above) so a human can look at their own
    // eye and identify which, if any, additional path is the lower
    // edge of overhanging skin. Every value shown is read straight off
    // hoodingDebug (buildHoodingV2Debug's already-computed output) —
    // this component computes nothing, classifies nothing, and never
    // labels a path hood/overhang/non-hood on its own. Deliberately
    // placed AFTER CreaseV2DebugPanel (which already calls it, via JS
    // function-declaration hoisting — CreaseV2DebugPanel is never
    // itself invoked until React actually renders it, long after this
    // whole script has finished loading) rather than before it, so it
    // does not sit inside the existing buildCreaseV2CopyPayload/
    // CreaseV2EyePanel/CreaseV2DebugPanel source span other tests
    // already extract by position.
    const HOODING_V2_PATH_COLORS = ['#ff6ec7', '#66d9ff', '#ffd23c', '#a97cf0', '#7dffb3', '#ff9d5c', '#c9c9c9'];
    function HoodingV2RawGeometryBlock({ label, hoodingDebug, roiImage }) {
      if (!hoodingDebug || !hoodingDebug.valid || !roiImage) {
        return (
          <div className="mb-1.5 pb-1.5 border-b border-white/10">
            <span className="text-teal-300 uppercase font-semibold">{label} — no data this frame</span>
          </div>
        );
      }
      const w = roiImage.w, h = roiImage.h;
      const allPaths = hoodingDebug.allPaths || [];
      const winnerId = hoodingDebug.creaseWinnerPathId;
      const additionalIdx = {};
      let nextIdx = 0;
      allPaths.forEach(p => { if (p.id !== winnerId) additionalIdx[p.id] = nextIdx++; });
      const colorForPath = (id) => id === winnerId ? '#3ce6c8' : HOODING_V2_PATH_COLORS[(additionalIdx[id] || 0) % HOODING_V2_PATH_COLORS.length];
      const lashPoints = hoodingDebug.columns.filter(c => c.yLash != null).map(c => `${c.x},${c.yLash}`).join(' ');
      return (
        <div className="mb-1.5 pb-1.5 border-b border-white/10">
          <span className="text-teal-300 uppercase font-semibold">{label} — RAW GEOMETRY</span>
          <div className="relative mt-1 mx-auto" style={{ width: '100%', maxWidth: 240 }}>
            <img src={roiImage.dataURL} style={{ width: '100%', display: 'block', borderRadius: 3 }} alt={`${label} ROI`} />
            <svg viewBox={`0 0 ${w} ${h}`} className="absolute inset-0 w-full h-full">
              {lashPoints && <polyline points={lashPoints} fill="none" stroke="#ffffff" strokeWidth="1" strokeDasharray="2,1.5" opacity="0.9" />}
              <text x={2} y={h - 2} fontSize="6" fill="#ffffff">LASH</text>
              {hoodingDebug.productionV1 && hoodingDebug.productionV1.derivedRoiY != null && (
                <>
                  <line x1={0} y1={hoodingDebug.productionV1.derivedRoiY} x2={w} y2={hoodingDebug.productionV1.derivedRoiY} stroke="#f0a83c" strokeWidth="0.8" strokeDasharray="3,2" opacity="0.9" />
                  <text x={2} y={Math.max(6, hoodingDebug.productionV1.derivedRoiY - 1)} fontSize="6" fill="#f0a83c">V1</text>
                </>
              )}
              {allPaths.map((p) => {
                const isWinner = p.id === winnerId;
                const color = colorForPath(p.id);
                const mid = p.points[Math.floor(p.points.length / 2)];
                return (
                  <g key={p.id}>
                    <polyline points={p.points.map(pt => `${pt.x},${pt.y}`).join(' ')} fill="none" stroke={color} strokeWidth={isWinner ? 1.1 : 0.8} opacity={isWinner ? 1 : 0.9} />
                    {mid && (
                      <text x={mid.x + 1} y={Math.max(6, mid.y - 1)} fontSize="6" fill={color} fontWeight={isWinner ? 'bold' : 'normal'}>
                        {isWinner ? `${p.id} (crease winner)` : p.id}
                      </text>
                    )}
                  </g>
                );
              })}
            </svg>
          </div>
          <div className="grid grid-cols-2 gap-x-2 mt-1">
            <span className="text-textMuted">eyeWidthPx</span>
            <span>{hoodingDebug.eyeWidthPx != null ? hoodingDebug.eyeWidthPx.toFixed(1) : '-'}</span>
            <span className="text-textMuted">lash→crease px/ratio</span>
            <span>{hoodingDebug.lashCreaseDistancePx != null ? hoodingDebug.lashCreaseDistancePx.toFixed(1) : '-'} / {hoodingDebug.lashCreaseRatio != null ? hoodingDebug.lashCreaseRatio.toFixed(3) : '-'}</span>
            <span className="text-textMuted">additional paths</span>
            <span>{(hoodingDebug.additionalPathIds || []).length ? hoodingDebug.additionalPathIds.join(', ') : 'none'}</span>
          </div>
          {allPaths.filter(p => p.id !== winnerId).map((p) => (
            <div key={p.id} className="grid grid-cols-2 gap-x-2 mt-0.5 pl-2" style={{ color: colorForPath(p.id) }}>
              <span className="col-span-2 font-semibold">{p.id}</span>
              <span className="text-textMuted">continuity/points</span>
              <span>{(p.continuityFrac * 100).toFixed(0)}% / {p.points.length}</span>
              <span className="text-textMuted">avg dist from lash</span>
              <span>{p.avgDistFromLashPx != null ? p.avgDistFromLashPx.toFixed(1) + 'px' : '-'}</span>
              <span className="text-textMuted">raw/local strength</span>
              <span>{p.meanRawStrength.toFixed(2)} / {p.meanLocalStrength != null ? p.meanLocalStrength.toFixed(2) : 'null'}</span>
            </div>
          ))}
        </div>
      );
    }

    // HOODING V2 — STAGE 2B: PATH TOPOLOGY display. Every linked path
    // Stage 1 found is listed, in the same deterministic meanT order
    // buildHoodingTopologyV2B already computed — nothing is filtered
    // or re-ranked here. The existing V2 winner is marked distinctly
    // (by border, not by relabeling); every other path keeps its
    // plain P# id. No color/label here means or implies hood/
    // overhang/true-crease — this is purely for a human to compare

    // (which already calls it, via JS function-declaration hoisting —
    // same reasoning as HoodingV2RawGeometryBlock above) so it does

    // position.
    function HoodingTopologyV2BBlock({ label, topology }) {

          {orderedPaths.length === 0 && <div className="pl-2 text-textMuted">none</div>}

                  {p.pathId} (order {p.orderedIndex}){isWinner ? ' — existing V2 winner' : ''}
                </span>
                <span className="text-textMuted">meanT/continuity</span>
                <span>{p.meanT.toFixed(3)} / {(p.continuityFrac * 100).toFixed(0)}%</span>
                <span className="text-textMuted">dist from lash px/ratio</span>
                <span>{p.avgDistFromLashPx != null ? p.avgDistFromLashPx.toFixed(1) : '-'} / {p.avgDistFromLashRatio != null ? p.avgDistFromLashRatio.toFixed(3) : '-'}</span>
              </div>
            );
          })}
          {adjacentPairs.length > 0 && (
            <div className="mt-1 pt-1 border-t border-white/5">
              <span className="text-textMuted">adjacent gaps (lower→upper)</span>
              {adjacentPairs.map((pair, i) => (
                <div key={i} className="grid grid-cols-2 gap-x-2 pl-2">
                  <span>{pair.lowerPathId}→{pair.upperPathId}</span>
                  <span>Δt={pair.deltaMeanT.toFixed(3)} Δdist={pair.deltaDistFromLashPx != null ? pair.deltaDistFromLashPx.toFixed(1) + 'px' : '-'}</span>
                </div>
              ))}
            </div>
          )}
          {extrema && extrema.totalLinkedPathCount > 0 && (
            <div className="mt-1 pt-1 border-t border-white/5 grid grid-cols-2 gap-x-2">
              <span className="text-textMuted">largest/smallest Δt gap</span>
              <span>{extrema.largestAdjacentGap ? extrema.largestAdjacentGap.deltaMeanT.toFixed(3) : '-'} / {extrema.smallestAdjacentGap ? extrema.smallestAdjacentGap.deltaMeanT.toFixed(3) : '-'}</span>
              <span className="text-textMuted">nearest to winner</span>
              <span>{extrema.nearestToWinner || '-'}</span>
            </div>
          )}
        </div>
      );
    }

    // IRIS COLOR — RAW PIXEL AUDIT visualization. Renders every
    // candidate pixel buildIrisColorAudit already scanned, each drawn
    // in ITS OWN real sampled color (accepted) or a reason-coded color
    // (rejected) — a literal reconstruction of the exact pixel grid
    // sampleIrisColor (frozen, unmodified) reads, not a fabricated
    // preview. This directly answers "is production actually sampling
    // the iris" — if the accepted-pixel colors look like skin/lash
    // rather than iris, that's visible here. No pixel is ever labeled
    // "iris"/"correct"/"wrong" — only its real color and its real
    // accept/reject reason. Placed after CreaseV2DebugPanel (which
    // already calls it, via JS function-declaration hoisting — same
    // reasoning as HoodingV2RawGeometryBlock/HoodingTopologyV2BBlock
    // above) so it does not sit inside any existing source span other
    // tests extract by position.
    const IRIS_REJECT_COLORS = {
      bright_specular: '#ffe066',
      dark_pupil_or_lash: '#4a4a4a',
      trimmed_outlier: '#ff6ec7',
      insufficient_stage1_samples: '#888888',
    };
    function IrisColorAuditBlock({ label, audit }) {
      if (!audit || !audit.valid) {
        return (
          <div className="mb-1.5 pb-1.5 border-b border-white/10">
            <span className="text-pink-100 uppercase font-semibold">{label} — no audit data</span>
          </div>
        );
      }
      const { roi } = audit;
      const w = roi.w, h = roi.h;
      return (
        <div className="mb-1.5 pb-1.5 border-b border-white/10">
          <span className="text-pink-100 uppercase font-semibold">{label} — {audit.selectedCategory || 'unclassified'}{audit.confidence != null ? ` (${(audit.confidence * 100).toFixed(0)}%)` : ''}</span>
          <div className="relative mt-1" style={{ width: Math.min(200, w * 4), aspectRatio: `${w} / ${h}`, background: '#111' }}>
            <svg viewBox={`0 0 ${w} ${h}`} className="absolute inset-0 w-full h-full">
              <circle cx={w / 2} cy={h / 2} r={roi.radius} fill="none" stroke="#ffffff" strokeWidth="0.4" opacity="0.55" />
              {(audit.acceptedPixels || []).map((p, i) => (
                <rect key={`a${i}`} x={p.x - roi.x0} y={p.y - roi.y0} width="1" height="1" fill={`rgb(${p.r},${p.g},${p.b})`} />
              ))}
              {(audit.rejectedPixels || []).map((p, i) => (
                <rect key={`r${i}`} x={p.x - roi.x0} y={p.y - roi.y0} width="1" height="1" fill={IRIS_REJECT_COLORS[p.reason] || '#ff0000'} opacity="0.85" />
              ))}
            </svg>
          </div>
          <div className="grid grid-cols-2 gap-x-2 mt-1">
            <span className="text-textMuted">candidate/accepted/rejected</span>
            <span>{audit.candidatePixelCount} / {audit.acceptedPixelCount} / {audit.rejectedPixelCount}</span>
            <span className="text-textMuted">accepted fraction</span>
            <span>{audit.acceptedFraction != null ? (audit.acceptedFraction * 100).toFixed(0) + '%' : '-'}</span>
            <span className="text-textMuted">rejection reasons</span>
            <span>{Object.entries(audit.rejectionSummary || {}).map(([k, v]) => `${k}:${v}`).join(' ') || 'none'}</span>
            {audit.classifierInput && (
              <>
                <span className="text-textMuted">classifier RGB</span>
                <span>{audit.classifierInput.r}/{audit.classifierInput.g}/{audit.classifierInput.b}</span>
                <span className="text-textMuted">classifier HSL</span>
                <span>h={audit.classifierInput.h.toFixed(1)} s={audit.classifierInput.s.toFixed(3)} l={audit.classifierInput.l.toFixed(3)}</span>
              </>
            )}
          </div>
          {audit.classifierTrace && (
            <div className="mt-1 pt-1 border-t border-white/5">
              <span className="text-textMuted">classifyIrisColor decision trace (real, unmodified)</span>
              {audit.classifierTrace.map((r, i) => (
                <div key={i} className={`pl-2 ${r.passed ? 'text-pink-300 font-semibold' : 'text-textMuted'}`}>{r.passed ? '✓ ' : '· '}{r.rule}</div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function LiveScanScreen({ onComplete, onBack, modelsLoaded, onSetLang }) {
      const lang = useLang();
      const videoRef = useRef(null);
      const containerRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const procCanvasRef = useRef(null);
      if (!procCanvasRef.current) procCanvasRef.current = document.createElement('canvas');

      const [facingMode, setFacingMode] = useState('user');
      const [stageKey, setStageKey] = useState('stageSearching');
      const [hintKey, setHintKey] = useState(null);
      const [phase, setPhase] = useState('searching');
      const [progress, setProgress] = useState(0);
      const [railSeg, setRailSeg] = useState(-1);
      const [everLocked, setEverLocked] = useState(false);
      const [stabilityLocked, setStabilityLocked] = useState(false);
      // EYELID CREASE V2 — DEBUG SHADOW MODE ONLY. debugAvailable gates
      // whether detectEyelidCreaseV2 runs AT ALL (see the tick handler
      // below) — in normal mode it never executes, so it costs nothing.
      // debugCreaseV2 holds only the latest per-eye V2 result plus the
      // matching V1 snapshot, purely for the debug panel/overlay; it is
      // never read by classifyFeatures or any production code path.
      const debugAvailable = isDebugModeEnabled();
      const [debugCreaseV2, setDebugCreaseV2] = useState(null);
      // EXPERIMENTAL EYELID TYPE — DEBUG-ONLY comparison state. Never
      // read by the real classifyFeatures call / onComplete result.
      const [debugEyelidCompare, setDebugEyelidCompare] = useState(null);
      // REAL EYELID FRAME TRACE — DEBUG-ONLY observability state. frames
      // accumulates one entry per frame ACTUALLY accepted into
      // bufferRef.current this scan; aggregate/finalClassified/
      // finalRecType are filled in once, at the real finalization call
      // site, from the REAL aggregated/classified/rec values — never
      // read by production code, never fed back into them.
      const [debugFrameTrace, setDebugFrameTrace] = useState({ frames: [], counts: summarizeFrameTrace([]), aggregate: null, finalClassified: null, finalRecType: null });
      // IRIS COLOR — DEBUG-ONLY raw pixel audit state. Never read by
      // sampleIrisColor/combineIris/onComplete/rec — see
      // buildIrisColorAudit's own header comment.
      const [debugIrisAudit, setDebugIrisAudit] = useState(null);

      const modelsLoadedRef = useRef(modelsLoaded);
      useEffect(() => { modelsLoadedRef.current = modelsLoaded; }, [modelsLoaded]);
      const onCompleteRef = useRef(onComplete);
      useEffect(() => { onCompleteRef.current = onComplete; }, [onComplete]);
      const langRef = useRef(lang);
      useEffect(() => { langRef.current = lang; }, [lang]);
      const reduceMotionRef = useRef(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      const bufferRef = useRef([]);
      // REAL EYELID FRAME TRACE — a ref (not state) for the same reason
      // bufferRef itself is a ref: the tick loop's closure can be stale
      // between renders, and only a ref mutation (not a read of prior
      // React state) is guaranteed fresh every tick. debugFrameTrace
      // (state, declared above) is a published SNAPSHOT of this ref,
      // refreshed every accepted tick, purely so the debug UI re-renders.
      const frameTraceRef = useRef([]);
      // Source-of-truth snapshot for the Copy button specifically —
      // debugFrameTrace (state) is what the live UI numbers render
      // from, but the Copy button reads THIS ref at click time instead
      // of the state prop, so it can never copy a stale pre-
      // finalization value regardless of React's render/commit timing
      // (a real observed bug: Copy sometimes captured aggregate/
      // finalClassified/finalRecType as still-null even after
      // finalization had already computed them).
      const debugFrameTraceSnapshotRef = useRef({ frames: [], counts: summarizeFrameTrace([]), aggregate: null, finalClassified: null, finalRecType: null });
      const bestFrameRef = useRef(null);
      // IRIS COLOR — DEBUG-ONLY raw pixel audit ref, kept in lockstep
      // with bestFrameRef.current (computed on the SAME ctx/leftEye/
      // rightEye, at the SAME moment, whenever bestFrameRef.current is
      // updated below) so it always reflects the actual best-frame
      // sample production used, never a different frame. Never merged
      // into bestFrameRef.current itself — production's object shape
      // is untouched.
      const debugIrisAuditRef = useRef(null);
      const totalFramesRef = useRef(0);
      const doneRef = useRef(false);
      const busyRef = useRef(false);
      const loopRef = useRef(null);
      const tickImplRef = useRef(null);
      const hadFaceRef = useRef(false);
      const hasHadValidFrameRef = useRef(false);
      // CAMERA FIX — mirrors the current facingMode into a ref so the
      // always-running overlay rAF loop (defined once, no deps) can
      // read it without restarting; only the front ('user') camera
      // preview is mirrored, matching standard selfie-camera UX.
      const facingModeRef = useRef(facingMode);
      useEffect(() => { facingModeRef.current = facingMode; }, [facingMode]);
      const lastDetRef = useRef(null);
      const overlayRafRef = useRef(null);
      const smoothRef = useRef({ box: null, leftEye: null, rightEye: null, mouth: null, presence: 0 });
      const phaseRef = useRef('searching');
      useEffect(() => { phaseRef.current = phase; }, [phase]);
      const completionRef = useRef({ start: -Infinity });
      const acquireStartRef = useRef(-Infinity);
      const isolationStartRef = useRef(-Infinity);
      const dataFlowStartRef = useRef(-Infinity);
      const irisAcquiredStartRef = useRef(-Infinity);
      const tagEventsRef = useRef([]);
      const railSegRef = useRef(-1);
      const stageKeyRef = useRef(stageKey);
      useEffect(() => {
        stageKeyRef.current = stageKey;
        if (stageKey === 'stageComplete') completionRef.current.start = performance.now();
      }, [stageKey]);

      const bumpRail = (seg) => { if (seg > railSegRef.current) { railSegRef.current = seg; setRailSeg(seg); } };

      tickImplRef.current = async () => {
        if (busyRef.current || doneRef.current) return;
        const video = videoRef.current;
        if (!video || video.readyState < 2) return;
        if (!modelsLoadedRef.current) return;
        busyRef.current = true;
        try {
          const canvas = procCanvasRef.current;
          const scale = Math.min(1, 640 / video.videoWidth);
          canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
          canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          totalFramesRef.current += 1;
          console.log('[LSA] FRAME RECEIVED', totalFramesRef.current, canvas.width + 'x' + canvas.height);

          const det = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 })).withFaceLandmarks();
          const now = performance.now();
          bufferRef.current = bufferRef.current.filter(e => now - e.t < BUFFER_WINDOW_MS);

          if (!det) {
            console.log('[LSA] FACE DETECTED: false');
            // CAMERA FIX — face-lost hysteresis: a single missed
            // detectSingleFace() frame (transient blink/motion-blur/
            // frame-drop) no longer immediately flips phase/stageKey
            // to "lost". lastDetRef.current is left untouched during
            // the grace window, so it still holds the last successful
            // detection's ts — the overlay's own existing freshness
            // check (time - d.ts) < FACE_LOST_GRACE_MS already fades
            // it out on the same schedule, so decision state and
            // overlay now expire together instead of the decision
            // state flipping instantly while the overlay lingered.
            const withinGrace = hadFaceRef.current && lastDetRef.current
              && (now - lastDetRef.current.ts) < FACE_LOST_GRACE_MS;
            if (!withinGrace) {
              lastDetRef.current = { hasFace: false, ts: now };
              if (hadFaceRef.current) { setPhase('lost'); setStageKey('stageLost'); }
              else { setPhase('searching'); setStageKey('stageSearching'); }
              hadFaceRef.current = false;
              setHintKey(null);
            }
            setProgress(Math.min(1, bufferRef.current.length / MIN_STABLE_FRAMES));
            return;
          }
          const wasFaceless = !hadFaceRef.current;
          hadFaceRef.current = true;
          if (wasFaceless) {
            // A fresh acquisition (first lock, or reacquisition after
            // loss) — presentation-only trigger for the subject-lock
            // animation. Doesn't affect buffer/quality logic at all.
            acquireStartRef.current = now;
            setEverLocked(true);
            bumpRail(0);
          }
          // boxClipped is a purely presentational geometric check (is
          // the face box touching the frame edge?) used only to pick
          // a more specific "center your face" hint below — it does
          // not feed assessFrameQuality or any measurement math.
          const boxClipped = det.detection.box.x < canvas.width*0.02 || det.detection.box.y < canvas.height*0.02 ||
            (det.detection.box.x + det.detection.box.width) > canvas.width*0.98 ||
            (det.detection.box.y + det.detection.box.height) > canvas.height*0.98;
          // PHYSICAL EYE NORMALIZATION — canonical, physically-correct
          // points for anything that carries a LEFT/RIGHT semantic
          // (brightness sampling below, crease detection, the "L"/"R"
          // overlay target). NOT used for the raw leftEye/rightEye/
          // leftBrow/rightBrow stored just below, which intentionally
          // stay raw face-api output — buildFaceMesh's topology
          // (meshEdgeList/meshTriangleList) has ~15 hardcoded joins
          // that assume that exact raw, image-side ordering; see the
          // getPhysicalEyeLandmarks doc comment for why the purely-
          // visual mesh is deliberately left alone.
          const physicalLeft = getPhysicalEyeLandmarks(det.landmarks, 'left');
          const physicalRight = getPhysicalEyeLandmarks(det.landmarks, 'right');
          lastDetRef.current = {
            hasFace: true, ts: now, videoW: video.videoWidth, videoH: video.videoHeight, aligned: false,
            box: { x: det.detection.box.x/scale, y: det.detection.box.y/scale, width: det.detection.box.width/scale, height: det.detection.box.height/scale },
            leftEye: det.landmarks.getLeftEye().map(p => ({ x: p.x/scale, y: p.y/scale })),
            rightEye: det.landmarks.getRightEye().map(p => ({ x: p.x/scale, y: p.y/scale })),
            leftBrow: det.landmarks.getLeftEyeBrow().map(p => ({ x: p.x/scale, y: p.y/scale })),
            rightBrow: det.landmarks.getRightEyeBrow().map(p => ({ x: p.x/scale, y: p.y/scale })),
            // Physically-correct, canonical — feeds ONLY the "L"/"R"
            // eye-target labels (see the overlay draw loop below).
            physicalLeftEye: physicalLeft.eye.map(p => ({ x: p.x/scale, y: p.y/scale })),
            physicalRightEye: physicalRight.eye.map(p => ({ x: p.x/scale, y: p.y/scale })),
            jaw: det.landmarks.getJawOutline().map(p => ({ x: p.x/scale, y: p.y/scale })),

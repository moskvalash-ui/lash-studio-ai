        round_upturned: [en ? 'Your round eyes have a naturally lifted outer corner, giving the gaze an open, lively character.' : 'Округлые глаза с естественно приподнятым внешним уголком — взгляд от природы открытый и живой.'],
        round_neutral: [en ? 'Your eyes have a soft, round shape with a naturally wide-open look — a great base for a design that adds gentle elongation.' : 'У глаз мягкая округлая форма с естественно широким взглядом — отличная основа для схемы с лёгким визуальным удлинением.'],

        uncertain_neutral: [en ? 'Your eyes have balanced, harmonious proportions that work well with a wide range of lash designs.' : 'У ваших глаз сбалансированные, гармоничные пропорции — они хорошо сочетаются с самыми разными схемами наращивания.'],
        uncertain_downturned: [en ? 'Your eyes have a soft, relaxed outer corner — a gentle lift in the design can add a lovely lifted accent.' : 'У глаз мягкий, спокойный внешний уголок — лёгкий подъём в схеме добавит красивый акцент.'],
      };
      let line = (templates[key] || templates.uncertain_neutral)[0];

      if (c.eyelidCategory === 'pronounced' || c.eyelidCategory === 'moderate') {
        const hoodedAddendums = [
          en ? ' The eyelid shows less of the crease at rest — the artist can pick a curl that keeps the lash line visible when your eyes are open.'
             : ' Складка века у вас чуть менее заметна в спокойном состоянии — мастер может подобрать изгиб, который сохранит видимость линии ресниц с открытым глазом.',

        ];
        line += hoodedAddendums[shape === 'round' || shape === 'narrow' ? 1 : 0];

          en ? ' The eyelid stays clearly visible, giving the artist a lot of freedom with curl and length.'
             : ' Веко хорошо просматривается — это даёт мастеру большую свободу в выборе изгиба и длины.',

    // Static biometric mesh drawn once over the captured result photo
    // — a visual echo of the same real facial-surface-mesh system
    // used live in Scan, built from the SAME landmarks the analysis
    // actually used (result.landmarks). Purely presentational: no
    // lash rendering, no re-analysis, nothing fed back into scoring.
    // PHYSICAL EYE NORMALIZATION — deliberately exempt. This draws the
    // purely-visual buildFaceMesh face outline over the captured/
    // reviewed photo; it asserts no L/R label or semantic claim.
    // meshEdgeList/meshTriangleList have ~15 hardcoded joins that
    // assume face-api's raw, image-side eye/brow ordering (see the
    // getPhysicalEyeLandmarks doc comment) — feeding it normalized
    // points would require rewriting that topology for zero semantic
    // benefit, so raw getLeftEye()/getRightEye()/getLeftEyeBrow()/
    // getRightEyeBrow() calls stay here intentionally, unchanged.
    function ResultMeshOverlay({ landmarks, imageWidth, imageHeight }) {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      useEffect(() => {
        if (!landmarks || !imageWidth || !imageHeight) return;
        const canvas = canvasRef.current, container = containerRef.current;
        if (!canvas || !container) return;
        const draw = () => {
          const rect = container.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
          canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          const map = (p) => mapVideoPointToDisplay(p.x, p.y, imageWidth, imageHeight, w, h);
          const d = {
            jaw: landmarks.getJawOutline().map(map),
            leftBrow: landmarks.getLeftEyeBrow().map(map),
            rightBrow: landmarks.getRightEyeBrow().map(map),
            nose: landmarks.getNose().map(map),
            leftEye: landmarks.getLeftEye().map(map),
            rightEye: landmarks.getRightEye().map(map),
            mouth: landmarks.getMouth().slice(0, 12).map(map),
          };
          const mesh = buildFaceMesh(d);
          if (!mesh) return;
          const xs = d.jaw.map(pt=>pt.x), ys = d.jaw.map(pt=>pt.y).concat(mesh.f2.map(pt=>pt.y));
          const boxCenter = { x: (Math.min(...xs)+Math.max(...xs))/2, y: (Math.min(...ys)+Math.max(...ys))/2 };
          const faceHalfW = Math.max(1, (Math.max(...xs)-Math.min(...xs))/2);
          drawFaceMeshV3(ctx, mesh, { revealMode: false, wavefrontY: 0, beamY: -9999, presence: 0.95, boxCenter, faceHalfW });
        };
        draw();
        window.addEventListener('resize', draw);
        return () => window.removeEventListener('resize', draw);
      }, [landmarks, imageWidth, imageHeight]);
      return (
        <div ref={containerRef} className="absolute inset-0 pointer-events-none">
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />
        </div>
      );
    }

    // Stylized eye diagram — NOT the client's photo. A closed almond
    // outline with iris/pupil reference, lash-line zone markers, and
    // (for textured/creative designs) alternating spike ticks so
    // Wispy/Kim/Manga are visually distinct, not just relabeled.
    function LashMapDiagram({ zones, peakIdx, spikeGeom, hoveredZone, setHoveredZone, curl, technique, lang }) {
      const upperY = (t) => 175 - Math.sin(t*Math.PI) * 78;
      const lowerY = (t) => 175 + Math.sin(t*Math.PI) * 34;
      const xAt = (t) => 55 + t * 290;
      const items = zones.map((len, i) => ({ len, isPeak: i === peakIdx, label: ZONE_NAMES[i] }));
      const upperPath = Array.from({length: 21}, (_,i) => { const tt=i/20; return `${xAt(tt)},${upperY(tt)}`; }).join(' L ');
      const lowerPath = Array.from({length: 21}, (_,i) => { const tt=1-i/20; return `${xAt(tt)},${lowerY(tt)}`; }).join(' L ');

      // Spike/ray layer: pattern-specific rendering so Wispy (soft,
      // jittered), Kim (bold, evenly spaced, high contrast) and Manga
      // (every position tall, sharp triangular tip) are visibly
      // different, not just relabeled ticks. Geometry comes from the
      // shared computeSpikeGeometry() — same numbers as the written
      // Spike/Ray Plan.
      const spikeDraw = (spikeGeom ? spikeGeom.spikes : []).map((sp, i) => {
        const x = xAt(sp.t), y = upperY(sp.t);
        const h = (sp.spikeLen - sp.baseLen) * 3.2 + (sp.tall ? 8 : 4);
        const isMain = sp.tall && sp.spikeLen === spikeGeom.spikeMax;
        return { x, y, h, tall: sp.tall, isMain, len: sp.spikeLen };
      });

      return (
        <svg className="absolute inset-0 w-full h-full" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="eyeBg" cx="50%" cy="50%" r="70%">
              <stop offset="0%" stopColor="rgba(10,140,255,0.07)" />
              <stop offset="100%" stopColor="rgba(2,6,11,0)" />
            </radialGradient>
          </defs>
          <rect x="0" y="0" width="400" height="300" fill="url(#eyeBg)" />
          <path d={`M ${upperPath} L ${lowerPath} Z`} fill="rgba(83,199,255,0.03)" stroke="rgba(83,199,255,0.22)" strokeWidth="1.5" />
          <circle cx={xAt(0.44)} cy={(upperY(0.44)+lowerY(0.44))/2 + 4} r="13" fill="rgba(83,199,255,0.05)" stroke="rgba(83,199,255,0.25)" strokeDasharray="2 3" />
          <circle cx={xAt(0.44)} cy={(upperY(0.44)+lowerY(0.44))/2 + 4} r="5" fill="rgba(83,199,255,0.14)" />
          <text x={xAt(0.44)} y={(upperY(0.44)+lowerY(0.44))/2 + 26} textAnchor="middle" fill="rgba(142,154,168,0.7)" fontSize="8" letterSpacing="1">IRIS</text>
          <text x="52" y="200" textAnchor="middle" fill="rgba(142,154,168,0.7)" fontSize="9" letterSpacing="1">INNER</text>
          <text x="348" y="200" textAnchor="middle" fill="rgba(142,154,168,0.7)" fontSize="9" letterSpacing="1">OUTER</text>

          {spikeDraw.map((s,i) => {
            // Every ray/spike is a tapered polygon (wide-ish at the
            // base, narrowing to a fine point) — never a uniform-
            // width stick — so Wispy/Kim/Manga all read as individual
            // extension fibers, just with different base widths and
            // heights per pattern.
            const baseHalfWidth = spikeGeom.pattern === 'kim' ? (s.tall ? 1.5 : 1) : spikeGeom.pattern === 'manga' ? (s.tall ? 1.7 : 0.9) : (s.tall ? 1.2 : 0.8);
            const fill = s.tall ? (spikeGeom.pattern === 'kim' ? 'rgba(83,199,255,0.9)' : 'rgba(10,140,255,0.72)') : 'rgba(10,140,255,0.34)';
            return (
            <g key={i}>
              <polygon points={`${s.x-baseHalfWidth},${s.y} ${s.x+baseHalfWidth},${s.y} ${s.x},${s.y-s.h}`} fill={fill} />
              {s.isMain && (
                <text x={s.x} y={s.y - s.h - 5} textAnchor="middle" fill="#53C7FF" fontSize="8" fontWeight="600">{s.len}</text>
              )}
            </g>
            );
          })}

          {items.map((z, i) => {
            const t = i / (items.length - 1);
            const x = xAt(t), y = upperY(t) - 4;
            return (
              <g key={i} onClick={() => setHoveredZone(hoveredZone === i ? null : i)} className="cursor-pointer">
                <circle cx={x} cy={y} r={z.isPeak ? 9 : 6} fill={z.isPeak ? '#0A8CFF' : 'rgba(244,247,250,0.22)'} stroke={z.isPeak ? '#53C7FF' : 'none'} strokeWidth="2" className={z.isPeak ? 'peak-glow' : ''} />
                <text x={x} y={y - 16} textAnchor="middle" fill={z.isPeak ? '#53C7FF' : '#F4F7FA'} fontSize="15" fontWeight={z.isPeak ? '700' : '400'}>{z.len}</text>
                <text x={x} y={y + 20} textAnchor="middle" fill="rgba(142,154,168,0.75)" fontSize="7" letterSpacing="1">{z.label}</text>
                {hoveredZone === i && (
                  <g>
                    <rect x={x-52} y={y+26} width="104" height="46" rx="10" fill="rgba(6,16,26,0.96)" stroke="rgba(35,150,255,0.25)"/>
                    <text x={x} y={y+44} textAnchor="middle" fill="#F4F7FA" fontSize="11">{z.len} mm · {curl}</text>
                    <text x={x} y={y+61} textAnchor="middle" fill="rgba(142,154,168,0.85)" fontSize="9">{technique}</text>
                  </g>
                )}
              </g>
            );
          })}
        </svg>
      );
    }

    function LegendItem({ color, label }) {
      return (
        <div className="flex items-center gap-1.5">
          <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: color}}></span>
          <span className="text-[9px] text-textMuted uppercase tracking-wide">{label}</span>
        </div>
      );
    }

    function LashMapScreen({ result, design: designProp, naturalLashProfile, onBack }) {
      const lang = useLang();
      // designProp may have been built (and its text fields baked in)
      // under a different language earlier — e.g. selected on Result
      // right after a scan, then the user switches language here.
      // Re-localize on every render so the whole screen (including
      // generateApplicationPlan below, which reads design.* text
      // fields) always reflects the current language.
      const design = localizeDesign(designProp, result.eyeProfile, lang);
      const [activeEye, setActiveEye] = useState('left');
      const [hoveredZone, setHoveredZone] = useState(null);
      const [mode, setMode] = useState('ai');
      const [technique, setTechnique] = useState(design.defaultTechnique);
      const [curl, setCurl] = useState(design.curlRec.primary);
      const [lengthDelta, setLengthDelta] = useState(0);
      const [density, setDensity] = useState('medium');
      const [customLeft, setCustomLeft] = useState(design.leftZones);
      const [customRight, setCustomRight] = useState(design.rightZones);
      const [customSpikesOn, setCustomSpikesOn] = useState(!!design.texture);
      const [customSpikeFreq, setCustomSpikeFreq] = useState(design.texture ? design.texture.frequency : 2);
      const [customSpikeDiff, setCustomSpikeDiff] = useState(design.texture ? design.texture.baseToSpikeDiff : 1.5);
      const [customSpikePattern, setCustomSpikePattern] = useState(design.texture ? design.texture.pattern : 'uniform');

      const p = result.eyeProfile;
      const aiBase = activeEye === 'left' ? design.leftZones : design.rightZones;
      const otherAiBase = activeEye === 'left' ? design.rightZones : design.leftZones;
      const customBase = activeEye === 'left' ? customLeft : customRight;
      const zones = (mode === 'ai' ? aiBase : customBase).map(v => Math.max(5, v + (mode==='ai'?lengthDelta:0)));
      const otherZones = mode === 'ai' ? otherAiBase : (activeEye === 'left' ? customRight : customLeft);
      const peakIdx = design.peakZone;
      const asym = p.compositeAsymmetry > 0.07;
      const densityLabel = density==='light' ? t('light',lang) : density==='full' ? t('full',lang) : t('medium',lang);
      const diameter = density==='light' ? '0.07 mm' : density==='full' ? '0.12–0.15 mm' : '0.10 mm';
      const availableCurls = [...new Set([...design.curlOptions, design.curlRec.primary, ...design.curlRec.alternatives])];

      const effectiveTexture = mode === 'custom'
        ? (customSpikesOn ? { pattern: customSpikePattern, frequency: customSpikeFreq, baseToSpikeDiff: customSpikeDiff } : null)
        : design.texture;
      const spikeGeom = computeSpikeGeometry(zones, effectiveTexture);
      const plan = generateApplicationPlan(p, design, technique, curl, zones, otherZones, spikeGeom, lang);
      let planNumCounter = 0;
      const planNum = { next: () => ++planNumCounter };
      const lashObsAvailable = !!(naturalLashProfile && (naturalLashProfile.left?.hasData || naturalLashProfile.right?.hasData));
      const lashNotes = lashObsAvailable ? generateLashApplicationNotes(naturalLashProfile.left, naturalLashProfile.right, naturalLashProfile.comparison, lang) : null;

      const setCustomZone = (idx, val) => {
        const setter = activeEye === 'left' ? setCustomLeft : setCustomRight;
        const base = activeEye === 'left' ? customLeft : customRight;
        const next = [...base]; next[idx] = Math.max(5, Math.min(16, val));
        setter(next);
      };

      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <div className="flex flex-col items-center min-w-0">
              <span className="text-sm font-semibold text-textPrimary truncate max-w-[220px]">{design.name}</span>
              <span className="text-[10px] text-textMuted uppercase tracking-widest">{t('lashMapTitle', lang)}</span>
            </div>
            <div className="w-10"></div>
          </div>
          <div className="flex-1 overflow-y-auto hide-scrollbar">
            <div className="px-4 pt-3 pb-2">
              <div className="flex rounded-md bg-surface border border-border p-1 mb-2">
                {['ai','custom'].map(m => (
                  <button key={m} onClick={() => setMode(m)} className={`flex-1 py-2 rounded-sm text-xs font-medium uppercase tracking-wide transition-all ${mode===m ? 'bg-accent text-white' : 'text-textSecondary'}`}>{m==='ai'?t('aiDesignTab',lang):t('customTab',lang)}</button>
                ))}
              </div>
              <div className="flex rounded-md bg-surface border border-border p-1 mb-3">
                {['left','right'].map(eye => (
                  <button key={eye} onClick={() => setActiveEye(eye)} className={`flex-1 py-2 rounded-sm text-sm font-medium uppercase tracking-wide transition-all ${activeEye === eye ? 'bg-white/10 text-textPrimary' : 'text-textSecondary'}`}>{eye==='left'?t('leftEye',lang):t('rightEye',lang)}</button>
                ))}
              </div>
              {asym && mode==='ai' && (
                <div className="glass rounded-md p-3 mb-3 border-peak/25">
                  <p className="text-xs text-peak font-medium mb-1 uppercase tracking-wide">{t('asymBanner', lang)}</p>
                  <p className="text-xs text-textSecondary">
                    {lang==='en'
                      ? `${p.leftEye.width > p.rightEye.width ? 'Right' : 'Left'} eye peak length was adjusted by ${design.correctionMultiplier||1} mm to compensate — measured width difference ${(p.asymmetryBreakdown.width*100).toFixed(1)}%.`
                      : `Пик ${p.leftEye.width > p.rightEye.width ? 'правого' : 'левого'} глаза скорректирован на ${design.correctionMultiplier||1} mm для компенсации — измеренная разница ширины ${(p.asymmetryBreakdown.width*100).toFixed(1)}%.`}
                  </p>
                </div>
              )}
            </div>
            <div className="px-4">
              <div className="relative w-full aspect-[4/3] rounded-lg overflow-hidden bg-surface border border-border mb-3">
                <LashMapDiagram zones={zones} peakIdx={peakIdx} spikeGeom={spikeGeom} hoveredZone={hoveredZone} setHoveredZone={setHoveredZone} curl={curl} technique={technique} lang={lang} />
              </div>
              <div className="flex flex-wrap gap-x-3 gap-y-1 mb-4 px-1">
                <LegendItem color="#0A8CFF" label={t('legendPeak', lang)} />
                <LegendItem color="rgba(244,247,250,0.4)" label={t('legendBase', lang)} />
                {spikeGeom && <LegendItem color="#53C7FF" label={t('legendSpike', lang)} />}
                <LegendItem color="rgba(142,154,168,0.5)" label={t('legendInner', lang)} />
                <LegendItem color="rgba(142,154,168,0.5)" label={t('legendOuter', lang)} />
              </div>

              {mode === 'custom' && (
                <div className="mb-4">
                  <p className="label-tech mb-1">{t('customMapTitle', lang)}</p>
                  <p className="text-xs text-textSecondary mb-3">{t('customMapHint', lang)}</p>
                  <div className="grid grid-cols-5 gap-2 mb-4">
                    {zones.map((v, i) => (
                      <div key={i} className="glass rounded-md p-2 flex flex-col items-center">
                        <span className="text-[9px] text-textMuted mb-1 uppercase">{ZONE_NAMES[i]}</span>
                        <div className="flex items-center gap-1">
                          <button onClick={() => setCustomZone(i, v-1)} className="w-5 h-5 rounded bg-surface text-textPrimary text-xs">−</button>
                          <span className="text-sm font-semibold w-5 text-center">{v}</span>
                          <button onClick={() => setCustomZone(i, v+1)} className="w-5 h-5 rounded bg-surface text-white text-xs">+</button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-between items-center mb-2">
                    <p className="label-tech">{t('spikesToggle', lang)}</p>
                    <button onClick={() => setCustomSpikesOn(v => !v)} className={`px-3 py-1 rounded-md text-xs font-medium uppercase tracking-wide ${customSpikesOn ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{customSpikesOn ? t('spikesOnLabel', lang) : t('spikesOffLabel', lang)}</button>
                  </div>
                  {customSpikesOn && (
                    <div className="space-y-3">
                      <div>
                        <p className="text-[10px] text-textMuted uppercase mb-1">{t('spikeCountCtrl', lang)}</p>
                        <div className="flex items-center gap-3 glass rounded-md p-2">
                          <button onClick={() => setCustomSpikeFreq(f => Math.max(1, f-1))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">−</button>
                          <span className="flex-1 text-center text-sm">{customSpikeFreq}</span>
                          <button onClick={() => setCustomSpikeFreq(f => Math.min(4, f+1))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">+</button>
                        </div>
                      </div>
                      <div>
                        <p className="text-[10px] text-textMuted uppercase mb-1">{t('spikeDiffCtrl', lang)}</p>
                        <div className="flex items-center gap-3 glass rounded-md p-2">
                          <button onClick={() => setCustomSpikeDiff(d => Math.max(0.5, Math.round((d-0.5)*10)/10))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">−</button>
                          <span className="flex-1 text-center text-sm">+{customSpikeDiff} mm</span>
                          <button onClick={() => setCustomSpikeDiff(d => Math.min(5, Math.round((d+0.5)*10)/10))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">+</button>
                        </div>
                      </div>
                      <div>
                        <p className="text-[10px] text-textMuted uppercase mb-1">{t('spikePatternLabel', lang)}</p>
                        <div className="flex gap-2">
                          {['uniform','kim','manga'].map(pat => (
                            <button key={pat} onClick={() => setCustomSpikePattern(pat)} className={`chip flex-1 px-2 py-1.5 rounded-md text-xs font-medium ${customSpikePattern===pat ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{pat==='uniform'?'Wispy':pat==='kim'?'Kim':'Manga'}</button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="glass rounded-lg p-4 mb-4 flex justify-between items-center">
                <div><p className="label-tech mb-1">{t('curlLabel', lang)}</p><p className="text-lg font-semibold text-textPrimary">{curl}</p></div>
                <div><p className="label-tech mb-1">{t('maxLengthLabel', lang)}</p><p className="text-lg font-semibold text-cyan">{Math.max(...zones)} mm</p></div>
                <div><p className="label-tech mb-1">{t('designLabel', lang)}</p><p className="text-lg font-semibold text-textPrimary truncate max-w-[100px]">{design.name}</p></div>
              </div>

              <div className="mb-4">
                <p className="label-tech mb-2">{t('techniqueLabel', lang)}</p>
                <div className="flex flex-wrap gap-2">
                  {TECHNIQUE_CATALOG.map(tech => (
                    <button key={tech.id} onClick={() => setTechnique(tech.label)} className={`chip px-3 py-2 rounded-md text-xs font-medium ${technique===tech.label ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{tech.label}</button>
                  ))}
                </div>
              </div>

              <div className="mb-2">
                <p className="label-tech mb-2">{t('curlCatalogLabel', lang)}</p>
                <div className="flex flex-wrap gap-2">
                  {CURL_CATALOG.map(cc => (
                    <button key={cc.id} onClick={() => setCurl(cc.id)} className={`chip px-4 py-2 rounded-md text-sm font-medium ${curl===cc.id ? 'bg-accent text-white' : availableCurls.includes(cc.id) ? 'bg-surface border border-border text-textPrimary' : 'bg-surface/50 border border-border/50 text-textMuted'}`}>{cc.id}</button>
                  ))}
                </div>
                <p className="text-xs text-textSecondary mt-2">{t('primaryCurl',lang)}: <span className="text-textPrimary font-medium">{design.curlRec.primary}</span> ({t('alternativeCurls',lang)}: {design.curlRec.alternatives.join(' / ')}) — {design.curlRec.reason}</p>
              </div>

              {mode === 'ai' && (
                <div className="mb-4">
                  <p className="label-tech mb-2">{t('maxLengthLabel', lang)}</p>
                  <div className="flex items-center gap-3 glass rounded-md p-2">
                    <button onClick={() => setLengthDelta(d => Math.max(-2, d-1))} className="w-9 h-9 rounded-md bg-surface text-textPrimary font-bold">−</button>
                    <span className="flex-1 text-center text-sm font-medium">{lengthDelta > 0 ? '+' : ''}{lengthDelta} mm</span>
                    <button onClick={() => setLengthDelta(d => Math.min(2, d+1))} className="w-9 h-9 rounded-md bg-surface text-textPrimary font-bold">+</button>
                  </div>
                </div>
              )}

              <div className="mb-6">
                <p className="label-tech mb-2">{t('densityLabel', lang)}</p>
                <div className="flex gap-2">
                  {['light','medium','full'].map(dOpt => (
                    <button key={dOpt} onClick={() => setDensity(dOpt)} className={`chip flex-1 px-3 py-2 rounded-md text-xs font-medium ${density===dOpt ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{dOpt==='light'?t('light',lang):dOpt==='full'?t('full',lang):t('medium',lang)}</button>
                  ))}
                </div>
                <p className="text-xs text-textSecondary mt-2">{technique} · {densityLabel.toLowerCase()} — {t('recommendedDiameter',lang)} {diameter}</p>
              </div>

              <Section title={t('applicationPlanTitle', lang)} defaultOpen>
                <div className="space-y-5">
                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="zoning" title={t('preparationTitle', lang)}>
                    <div className="space-y-1.5">
                      {plan.preparation.map((item,i) => (
                        <div key={i} className="flex gap-2">
                          <span className="text-textMuted text-xs mt-0.5">□</span>
                          <p className="text-sm text-textSecondary leading-relaxed">{item}</p>
                        </div>
                      ))}
                    </div>
                  </PlanSection>

                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="zoning" title={t('zoningTitle', lang)}>
                    <div className="grid grid-cols-5 gap-1.5">
                      {zones.map((v,i) => (
                        <div key={i} className={`rounded-md p-2 text-center border ${i===peakIdx ? 'border-accent/50 bg-accent/10' : 'border-border bg-white/[0.02]'}`}>
                          <p className={`text-sm font-bold ${i===peakIdx ? 'text-cyan' : 'text-textPrimary'}`}>{v}</p>
                          <p className="text-[8px] text-textMuted uppercase mt-0.5 leading-tight">{ZONE_NAMES[i]}</p>
                        </div>
                      ))}
                    </div>
                  </PlanSection>

                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="technique" title={t('stepsTitle', lang)}>
                    <div className="space-y-3">
                      {plan.steps.map((s,i) => (
                        <div key={i}>
                          <p className="text-xs font-semibold text-textPrimary mb-1">{s.title}</p>
                          <p className="text-sm text-textSecondary leading-relaxed">{s.body}</p>
                        </div>
                      ))}
                    </div>
                  </PlanSection>

                  {plan.spikePlan && (
                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="lashmap" title={t('spikePlanTitle', lang)}>
                      <div className="grid grid-cols-2 gap-2 mb-3 text-xs">
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeBaseLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.base}</p></div>
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeSpikesLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.spikes}</p></div>
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeDiffLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.diff}</p></div>
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeCountLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.count}</p></div>
                      </div>
                      <div className="space-y-1.5">
                        {plan.spikePlan.notes.map((n,i) => (
                          <div key={i} className="flex gap-2"><span className="text-cyan text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                        ))}
                      </div>
                    </PlanSection>
                  )}

                  {asym && (
                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="asymmetry" title={t('asymAdjustTitle', lang)}>
                      <p className="text-sm text-textSecondary leading-relaxed">
                        {lang==='en'
                          ? `${p.leftEye.width > p.rightEye.width ? 'Right' : 'Left'} eye peak length was adjusted by ${design.correctionMultiplier||1} mm to compensate — measured width difference ${(p.asymmetryBreakdown.width*100).toFixed(1)}%.`
                          : `Пик ${p.leftEye.width > p.rightEye.width ? 'правого' : 'левого'} глаза скорректирован на ${design.correctionMultiplier||1} mm для компенсации — измеренная разница ширины ${(p.asymmetryBreakdown.width*100).toFixed(1)}%.`}
                      </p>
                    </PlanSection>
                  )}

                  {lashObsAvailable && (
                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="iris" title={t('lashObservationsTitle', lang)}>
                      <div className="space-y-1.5 mb-3">
                        {lashNotes.observations.map((n,i) => (
                          <p key={i} className="text-sm text-textSecondary leading-relaxed">{n}</p>
                        ))}
                      </div>
                      <p className="text-xs font-semibold text-textPrimary uppercase tracking-wider mb-2">{t('lashConsiderationsTitle', lang)}</p>
                      <div className="space-y-1.5">
                        {lashNotes.considerations.map((n,i) => (
                          <div key={i} className="flex gap-2"><span className="text-cyan text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                        ))}
                      </div>
                    </PlanSection>
                  )}

                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="artist" title={t('artistNotesTitle', lang)}>
                    <div className="space-y-1.5">
                      {plan.artistNotes.map((n,i) => (
                        <div key={i} className="flex gap-2"><span className="text-accent text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                      ))}
                    </div>
                  </PlanSection>
                </div>
              </Section>
            </div>
          </div>
        </div>
      );
    }

    // Renders one confidence-factor breakdown ({measurementAgreement,
    // landmarkStability, imageQuality, lrAgreement, poseQuality}) as
    // small labeled bars — the same five factors computeConfidence()
    // actually multiplied together, so it's possible to see WHY a
    // number came out the way it did instead of just trusting it.
    function DebugFactorBars({ factors }) {
      if (!factors) return null;
      return (
        <div className="grid grid-cols-1 gap-1 mt-1">
          {Object.entries(factors).map(([k,v]) => (
            <div key={k} className="flex items-center gap-2">
              <span className="text-[9px] text-textMuted w-28 flex-shrink-0">{k}</span>
              <div className="flex-1 h-1 bg-surface rounded-full overflow-hidden"><div className="h-full bg-cyan" style={{width:`${(v*100).toFixed(0)}%`}}></div></div>
              <span className="text-[9px] text-textMuted w-8 text-right">{(v*100).toFixed(0)}%</span>
            </div>
          ))}
        </div>
      );
    }
    function DebugEyeBlock({ label, m }) {
      if (!m) return null;
      const rows = [['whRatio',m.whRatio],['avgTaperDeg',m.avgTaperDeg],['innerTaperDeg',m.innerTaperDeg],['outerTaperDeg',m.outerTaperDeg],['apertureAsymmetry',m.apertureAsymmetry],['ear',m.ear],['covCenter',m.covCenter],['covInner',m.covInner],['covOuter',m.covOuter],['tiltCorrectedDeg',m.tiltCorrectedDeg]];
      return (
        <div>
          <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">{label}</p>
          <div className="space-y-0.5">
            {rows.map(([k,v]) => (
              <div key={k} className="flex justify-between gap-2 text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono flex-shrink-0">{typeof v === 'number' ? v.toFixed(3) : String(v)}</span></div>
            ))}
          </div>
        </div>
      );
    }
    function DebugPanel({ p }) {
      const d = p.debug;
      if (!d) return null;
      return (
        <div className="space-y-4">

    // ============================================================
    // NLS2 VALIDATION DIAGNOSTIC — temporary real-iPhone validation
    // build for the Natural Lash Scan measurement layer. Everything
    // in this block is debug-only (?debug=1), purely additive, reads
    // already-computed values off `obs`/`comparison`/NLS2_THRESHOLDS
    // and does not alter any measurement value. Remove this whole
    // block (down to the closing "END NLS2 VALIDATION DIAGNOSTIC"
    // marker) once real-device validation is complete.
    // ============================================================
    function nls2TriLabel(v) { return v === true ? 'TRUE' : v === false ? 'FALSE' : 'UNKNOWN'; }
    function nls2Num(v, d) { return (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(d == null ? 3 : d); }
    function nls2Row(label, value) {
      return (
        <div className="flex justify-between text-[9px] gap-2">
          <span className="text-textMuted">{label}</span>
          <span className="text-lime-300 font-mono text-right break-all">{value}</span>
        </div>
      );
    }
    function Nls2SectionLabel({ children }) {
      return <p className="text-[10px] font-semibold text-cyan-300 uppercase tracking-wider mt-3 mb-1 first:mt-0">{children}</p>;
    }

    function Nls2EyeValidationBlock({ label, obs, meta }) {
      if (!obs || !obs.hasData) {
        return (
          <div>
            <Nls2SectionLabel>{label}</Nls2SectionLabel>
            <p className="text-[9px] text-textMuted">no data</p>
          </div>
        );
      }
      const zoneNames = (typeof LASH_ZONE_NAMES !== 'undefined') ? LASH_ZONE_NAMES : ['inner', 'center', 'outer'];
      const diag = obs.diagnostics || {};
      return (
        <div>
          <Nls2SectionLabel>{label} — scan-level (debug diagnostics, NOT lash count)</Nls2SectionLabel>
          <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
            {nls2Row('overall confidence', nls2Num(obs.confidence, 2))}
            {nls2Row('quality level', obs.qualityLevel || '—')}
            {nls2Row('roi w×h (px)', meta ? `${nls2Num(meta.roiW,1)}×${nls2Num(meta.roiH,1)}` : '—')}
            {nls2Row('effective eye width (px)', meta ? nls2Num(meta.effectiveEyeWidthPx, 1) : '—')}
            {nls2Row('accepted frames', meta ? meta.framesAccepted : obs.framesUsed)}
            {nls2Row('frame consistency', meta ? nls2Num(meta.frameConsistency, 2) : '—')}
            {nls2Row('candidate structures (diagnostic, NOT lash count)', `${diag.candidateClusterCount ?? '—'} (${diag.candidateClusterCountLow ?? '—'}–${diag.candidateClusterCountHigh ?? '—'})`)}
          </div>

          <Nls2SectionLabel>{label} — per-zone</Nls2SectionLabel>
          {zoneNames.map((zn) => {
            const z = obs.zones ? obs.zones[zn] : null;
            if (!z) return null;
            return (
              <div key={zn} className="mb-1.5 pb-1.5 border-b border-white/10 last:border-0">
                <p className="text-[9px] text-cyan-200 uppercase">{zn}</p>
                <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
                  {nls2Row('occupancy raw', nls2Num(z.occupancy, 3))}
                  {nls2Row('occupancy level', z.occupancyLevel)}
                  {nls2Row('zone confidence', nls2Num(z.confidence, 2))}
                  {nls2Row('sparseArea', nls2TriLabel(z.sparseArea))}
                  {nls2Row('visibleLengthRatio', nls2Num(z.visibleLengthRatio, 3))}
                  {nls2Row('visibleLengthLevel', z.visibleLengthLevel)}
                  {nls2Row('apparentDirection (HINT ONLY)', z.direction)}
                </div>
              </div>
            );
          })}

          <Nls2SectionLabel>{label} — NLS-2 condition</Nls2SectionLabel>
          {obs.condition && (
            <>
              <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mb-1.5">
                {nls2Row('occupancyUniformity.level', obs.condition.occupancyUniformity.level)}
                {nls2Row('occupancyUniformity.spread', nls2Num(obs.condition.occupancyUniformity.spread, 4))}
                {nls2Row('occupancyUniformity.confidence', nls2Num(obs.condition.occupancyUniformity.confidence, 2))}
                {nls2Row('visibleLengthUniformity.level', obs.condition.visibleLengthUniformity.level)}
                {nls2Row('visibleLengthUniformity.dispersion', nls2Num(obs.condition.visibleLengthUniformity.dispersion, 4))}
                {nls2Row('visibleLengthUniformity.confidence', nls2Num(obs.condition.visibleLengthUniformity.confidence, 2))}
              </div>
              {zoneNames.map((zn) => {
                const c = obs.condition.zones ? obs.condition.zones[zn] : null;
                if (!c) return null;
                return (
                  <div key={zn} className="mb-1.5 pb-1.5 border-b border-white/10 last:border-0">
                    <p className="text-[9px] text-cyan-200 uppercase">{zn} condition</p>
                    <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
                      {nls2Row('locallyReducedOccupancy', nls2TriLabel(c.locallyReducedOccupancy))}
                      {nls2Row('relativeOccupancyReduction', nls2Num(c.relativeOccupancyReduction, 4))}
                      {nls2Row('shortLashConcentration', nls2TriLabel(c.shortLashConcentration))}
                      {nls2Row('shortCandidateFraction', nls2Num(c.shortCandidateFraction, 3))}
                      {nls2Row('withinZoneLengthIrregular', nls2TriLabel(c.withinZoneLengthIrregular))}
                      {nls2Row('visibleIrregularArea', nls2TriLabel(c.visibleIrregularArea))}
                      {nls2Row('condition confidence', nls2Num(c.confidence, 2))}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      );
    }

    // Status classification for L/R comparison fields — best-effort
    // mapping onto the three states the validation spec asks for.
    // `raw`===0 cannot be told apart from "genuinely zero difference"
    // vs "inside dead zone" from the comparison object alone, so a
    // rank/diff of exactly 0 is reported as IGNORED INSIDE DEAD ZONE
    // (both read the same to a lash artist: "not a meaningful diff").
    function nls2CompareStatus(raw) {
      if (raw === null || raw === undefined) return 'UNAVAILABLE DUE TO CONFIDENCE';
      if (Array.isArray(raw)) return raw.length > 0 ? 'ACCEPTED AS MEANINGFUL' : 'IGNORED INSIDE DEAD ZONE / NO DIFFERENCE';
      return raw !== 0 ? 'ACCEPTED AS MEANINGFUL' : 'IGNORED INSIDE DEAD ZONE';
    }
    function nls2CompareValueText(raw) {
      if (raw === null || raw === undefined) return '—';
      if (Array.isArray(raw)) return raw.length ? raw.map(x => `${x.zone}:${x.side}`).join(', ') : '(none)';
      return String(raw);
    }

    function Nls2ComparisonBlock({ comparison }) {
      if (!comparison) return null;
      if (!comparison.hasComparison) {
        return (
          <div>
            <Nls2SectionLabel>L/R comparison</Nls2SectionLabel>
            <p className="text-[9px] text-textMuted">UNAVAILABLE (one or both eyes missing data)</p>
          </div>
        );
      }
      const cc = comparison.conditionComparison || {};
      const fields = [
        ['overall occupancyDiff', comparison.occupancyDiff],
        ['occupancy dead zone', comparison.occupancyDeadZone],
        ['occupancyUniformityDiff', cc.occupancyUniformityDiff],
        ['lengthUniformityDiff', cc.lengthUniformityDiff],
        ['reducedOccupancyDiff (per zone)', cc.reducedOccupancyDiff],
        ['irregularAreaDiff (per zone)', cc.irregularAreaDiff],
      ];
      return (
        <div>
          <Nls2SectionLabel>L/R comparison</Nls2SectionLabel>
          <div className="space-y-1">
            {fields.map(([label, raw]) => (
              <div key={label} className="text-[9px]">
                <div className="flex justify-between gap-2">
                  <span className="text-textMuted">{label}</span>
                  <span className="text-lime-300 font-mono text-right break-all">{nls2CompareValueText(raw)}</span>
                </div>
                {label !== 'occupancy dead zone' && (
                  <div className="text-right text-cyan-300">{nls2CompareStatus(raw)}</div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Nls2ThresholdsBlock() {
      const t = (typeof NLS2_THRESHOLDS !== 'undefined') ? NLS2_THRESHOLDS : null;
      if (!t) return null;
      return (
        <div>
          <Nls2SectionLabel>Current empirical thresholds (display-only, not editable)</Nls2SectionLabel>
          <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
            {Object.entries(t).map(([k, v]) => (
              <div key={k} className="flex justify-between text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono">{typeof v === 'number' ? v : String(v)}</span></div>
            ))}
          </div>
        </div>
      );
    }

    function Nls2ChecklistBlock() {
      const items = [
        ['Test A — normal/even base', 'Expect: no random sparse flags, stable uniformity, no irregular-area false positives.'],
        ['Test B — visibly sparser zone', 'Expect: correct zone identified, reduced occupancy appears for that zone.'],
        ['Test C — visibly shorter/irregular zone', 'Expect: length difference / short-concentration response, no biological interpretation shown anywhere.'],
        ['Test D — repeat scan, same eye', 'Expect: reasonably repeating results; small variation absorbed by dead zones (not flagged as a change).'],
        ['Test E — intentionally poor capture', 'Expect: confidence falls, UNKNOWN appears instead of false confident conclusions.'],
      ];
      return (
        <div>
          <Nls2SectionLabel>Real-device validation checklist</Nls2SectionLabel>
          <div className="space-y-1.5">
            {items.map(([t2, d]) => (
              <div key={t2} className="text-[9px]">
                <p className="text-cyan-200 font-semibold">{t2}</p>
                <p className="text-textMuted">{d}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Nls2ValidationPanel({ left, right, comparison, meta }) {
      const [copied, setCopied] = useState(false);
      const copy = () => {
        try {
          const payload = JSON.stringify({ left, right, comparison, meta }, null, 2);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(payload).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }).catch(() => {});
          }
        } catch (e) { /* clipboard unreliable on some iOS versions — panel above remains the source of truth */ }
      };
      return (
        <Section title="NLS2 VALIDATION DIAGNOSTICS (temporary, debug build)" defaultOpen={false}>
          <div className="select-text max-h-[70vh] overflow-y-auto overflow-x-hidden pr-1">
            <p className="text-[9px] text-textMuted mb-2">Engineering diagnostics for real-device measurement validation. Not part of the product UI — does not expose lash count, health, damage, or safe-load claims.</p>
            <Nls2EyeValidationBlock label="LEFT" obs={left} meta={meta ? meta.left : null} />
            <div className="h-3" />
            <Nls2EyeValidationBlock label="RIGHT" obs={right} meta={meta ? meta.right : null} />
            <div className="h-3" />
            <Nls2ComparisonBlock comparison={comparison} />
            <div className="h-3" />
            <Nls2ThresholdsBlock />
            <div className="h-3" />
            <Nls2ChecklistBlock />
            <button onClick={copy} className="mt-3 w-full py-2 rounded-md text-[10px] font-semibold uppercase tracking-wide bg-white/[0.06] text-textSecondary border border-border press-scale">
              {copied ? 'Copied' : 'Copy NLS Diagnostics'}
            </button>
          </div>
        </Section>
      );
    }
    // ============================================================
    // END NLS2 VALIDATION DIAGNOSTIC
    // ============================================================

    function LashEyeCard({ titleKey, obs, lang }) {
      if (!obs || !obs.hasData) {
        return (
          <div className="glass rounded-lg p-4">
            <p className="label-tech mb-2">{t(titleKey, lang)}</p>
            <p className="text-sm text-textMuted">{t('insufficientData', lang)}</p>
          </div>
        );
      }
      // NLS-1 count-safety fix: no lash-count-like row here (removed
      // natLashVisibleCount/countLow-countHigh) — the audit concluded
      // stable candidate clusters are not a defensible individual-lash
      // estimate. occupancy/visualDensity below remains the master-
      // facing representation of the visible lash base (requirement 6).
      const rows = [
        [t('natLashConfidenceLabel', lang), `${Math.round(obs.confidence*100)}%`],
        [t('natLashVisualDensity', lang), lashDensityLabel(obs.visualDensity, lang)],
        [t('natLashDistribution', lang), lashDistributionText(obs, lang)],
        [t('natLashDirection', lang), obs.zoneDirection.filter(d=>d!=='unknown').length ? lashDirectionLabel(obs.zoneDirection.find(d=>d!=='unknown'), lang) : t('insufficientData', lang)],
        [t('natLashRelLength', lang), lashLengthLabel(obs.overallLenBucket, lang)],
        [t('natLashScanQuality', lang), obs.qualityLevel==='high'?t('qualityHigh',lang):obs.qualityLevel==='medium'?t('qualityMedium',lang):t('qualityLow',lang)],
      ];
      return (
        <div className="glass rounded-lg p-4">
          <p className="label-tech mb-3">{t(titleKey, lang)}</p>
          <div className="space-y-2">
            {rows.map(([label, value], i) => (
              <div key={i} className="flex justify-between items-center py-1.5 border-b border-border/60 last:border-0">
                <span className="text-xs text-textSecondary">{label}</span>
                <span className="text-sm font-medium text-cyan text-right">{value}</span>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-3 gap-1.5 mt-3">
            {LASH_ZONE_KEYS.map((zk, i) => (
              <div key={zk} className="rounded-md p-1.5 text-center border border-border bg-white/[0.02]">
                <p className="text-[8px] text-textMuted uppercase">{t(zk === 'lashInner' ? 'natLashZoneInner' : zk === 'lashCenter' ? 'natLashZoneCenter' : 'natLashZoneOuter', lang)}</p>
                <p className="text-[10px] font-semibold text-textPrimary mt-0.5">{lashDensityLabel(obs.zoneDensity[i], lang)}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function NaturalLashProfileScreen({ profile, onDone, onBack }) {
      const lang = useLang();
      const { left, right, comparison, debugMeta } = profile;
      const notes = generateLashApplicationNotes(left, right, comparison, lang);
      // NLS2 VALIDATION DIAGNOSTIC — debug-only, remove together with
      // the rest of the NLS2 validation build.
      const nls2DebugAvailable = isDebugModeEnabled();
      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <span className="text-sm font-medium text-textPrimary">{t('natLashProfileTitle', lang)}</span>
            <div className="w-10"></div>
          </div>
          <div className="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4">
            <div className="glass rounded-lg p-4">
              <p className="text-xs text-textSecondary leading-relaxed">{t('lashNoLoadClaim', lang)}</p>
            </div>
            <LashEyeCard titleKey="natLashLeftEyeLabel" obs={left} lang={lang} />
            <LashEyeCard titleKey="natLashRightEyeLabel" obs={right} lang={lang} />

            {comparison?.hasComparison && (
              <div className="glass rounded-lg p-4">
                <p className="label-tech mb-2">{t('natLashComparisonTitle', lang)}</p>
                <div className="space-y-1.5">
                  {notes.observations.map((n,i) => <p key={i} className="text-sm text-textSecondary leading-relaxed">{n}</p>)}
                </div>
              </div>
            )}

            <Section title={t('lashConsiderationsTitle', lang)} defaultOpen>
              <div className="space-y-1.5">
                {notes.considerations.map((n,i) => (
                  <div key={i} className="flex gap-2"><span className="text-accent text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                ))}
              </div>
            </Section>

            {nls2DebugAvailable && (
              <Nls2ValidationPanel left={left} right={right} comparison={comparison} meta={debugMeta} />
            )}

            <button onClick={onDone} className="w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]">
              {t('natLashDoneBtn', lang)}
            </button>
          </div>
        </div>
      );
    }

    function ReviewScreen({ result, onConfirm, onBack }) {
      const lang = useLang();
      const initial = result.eyeProfile;
      const [values, setValues] = useState({
        eyeShapeCategory: initial.eyeShapeCategory,
        eyelidType: initial.eyelidType,
        eyeSetCategory: initial.eyeSetCategory,
        tiltTendency: initial.tiltTendency,
        eyeSizeCategory: initial.eyeSizeCategory,
        symmetryCategory: initial.symmetryCategory,
      });
      const optionLabels = {
        eyeShapeCategory: { uncertain: t('shape_uncertain', lang), round: t('shape_round', lang), almond: t('shape_almond', lang), elongatedAlmond: t('shape_elongatedAlmond', lang), narrow: t('shape_narrow', lang) },
        eyelidType: { uncertain: t('eyelidTypeUncertain', lang), hooded: t('eyelidTypeHooded', lang), monolid: t('eyelidTypeMonolid', lang), openCrease: t('eyelidTypeOpenCrease', lang) },
        eyeSetCategory: { close: t('eyeSet_close', lang), balanced: t('eyeSet_balanced', lang), wide: t('eyeSet_wide', lang) },
        tiltTendency: { upturned: t('tiltUpturned', lang), neutral: t('tiltNeutral', lang), downturned: t('tiltDownturned', lang), uncertain: t('tiltUncertain', lang) },
        eyeSizeCategory: { small: t('eyeSize_small', lang), medium: t('eyeSize_medium', lang), large: t('eyeSize_large', lang) },
        symmetryCategory: { balanced: t('symmetry_balanced', lang), mild: t('symmetry_mild', lang), noticeable: t('symmetry_noticeable', lang), uncertain: t('symmetry_uncertain', lang) },
      };
      const fields = [
        ['eyeShapeCategory', t('shapeLabel', lang), ['uncertain', 'round', 'almond', 'elongatedAlmond', 'narrow']],
        ['eyelidType', t('eyelidTypeLabel', lang), ['uncertain', 'hooded', 'monolid', 'openCrease']],
        ['eyeSetCategory', t('spacingLabel', lang), ['close', 'balanced', 'wide']],
        ['tiltTendency', t('tiltLabel', lang), ['upturned', 'neutral', 'downturned', 'uncertain']],
        ['eyeSizeCategory', t('eyeSizeLabel', lang), ['small', 'medium', 'large']],
        ['symmetryCategory', t('symmetryLabel', lang), ['balanced', 'mild', 'noticeable', 'uncertain']],
      ];
      const confirm = () => {
        const legacyShape = { round: 'round', almond: 'almond', elongatedAlmond: 'elongated', narrow: 'mixed', uncertain: 'mixed' };
        const eyelidCategory = values.eyelidType === 'hooded' ? 'moderate' : values.eyelidType === 'monolid' ? 'uncertain' : values.eyelidType === 'openCrease' ? 'open' : 'uncertain';
        const confirmedProfile = {
          ...initial,
          ...values,
          dominantShape: legacyShape[values.eyeShapeCategory],
          isCloseSet: values.eyeSetCategory === 'close',
          isWideSet: values.eyeSetCategory === 'wide',
          isHooded: values.eyelidType === 'hooded',
          hoodingLevel: values.eyelidType === 'hooded' ? 'partial' : 'none',
          hoodedConfidence: values.eyelidType === 'hooded' ? Math.max(initial.eyelidTypeConfidence || 0, 0.8) : 0.25,
          eyelidCategory,
          eyelidCategoryConfidence: values.eyelidType === 'uncertain' ? 0.25 : 0.8,
          eyeShapeConfidence: values.eyeShapeCategory === initial.eyeShapeCategory ? initial.eyeShapeConfidence : 0.8,
          artistConfirmed: true,
        };
        onConfirm({
          ...result,
          eyeProfile: confirmedProfile,
          originalAIProfile: initial,
          designs: rankDesigns(confirmedProfile, lang),
          artistConfirmed: true,
        });
      };
      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <span className="text-sm font-medium text-textPrimary">{t('reviewTitle', lang)}</span>
            <div className="w-10"></div>
          </div>
          {/* Bottom padding here adds the iOS home-indicator / Safari
              floating-toolbar safe area (which, in normal — not
              "Add to Home Screen" — browsing, reports a real nonzero
              env(safe-area-inset-bottom) exactly to let pages avoid
              that overlap) ON TOP of the original 1rem (p-4) padding,
              so the confirm button always scrolls fully clear of
              on-screen browser chrome. env() resolves to 0 on desktop/
              non-iOS, so this is exactly 1rem there — identical to
              the unmodified p-4 default, desktop is unaffected. */}
          <div className="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 1rem)' }}>
            <div className="relative rounded-lg overflow-hidden aspect-[4/5] border border-border">
              <img src={result.originalImage} className="w-full h-full object-cover" alt="client" />
              <ResultMeshOverlay landmarks={result.landmarks} imageWidth={result.imageWidth} imageHeight={result.imageHeight} />
            </div>
            <div className="glass rounded-lg p-4">
              <p className="text-sm text-textSecondary leading-relaxed">{t('reviewIntro', lang)}</p>
            </div>
            <div className="glass rounded-lg p-4">
              {fields.map(([key, label, options]) => (
                <label key={key} className="block py-3 border-b border-border/60 last:border-0">
                  <span className="block text-xs text-textSecondary mb-1.5">{label}</span>
                  <select value={values[key]} onChange={e => setValues(v => ({ ...v, [key]: e.target.value }))} className="w-full rounded-md bg-bg2 border border-border px-3 py-2.5 text-sm text-textPrimary">
                    {options.map(option => <option key={option} value={option}>{optionLabels[key][option]}</option>)}
                  </select>
                  <span className="block text-[10px] text-textMuted mt-1">{t('reviewAiValue', lang)}: {optionLabels[key][initial[key]] || t('reviewUncertain', lang)}</span>
                </label>
              ))}
            </div>
            <button onClick={confirm} className="w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]">
              {t('reviewConfirm', lang)}
            </button>
            <button onClick={onBack} className="w-full py-3 rounded-md border border-border text-sm text-textSecondary">{t('reviewRescan', lang)}</button>
          </div>
        </div>
      );
    }

    function App() {
      const [lang, setLangState] = useState(() => {
        try { return localStorage.getItem('lashStudioLang') || 'ru'; } catch (e) { return 'ru'; }
      });
      const setLang = (l) => {
        setLangState(l);
        try { localStorage.setItem('lashStudioLang', l); } catch (e) {}
      };
      const [screen, setScreen] = useState('home');
      const [result, setResult] = useState(null);
      const [naturalLashProfile, setNaturalLashProfile] = useState(null);
      const [activeDesign, setActiveDesign] = useState(null);
      const [modelsLoaded, setModelsLoaded] = useState(false);
      const [loadError, setLoadError] = useState(false);
      const [loadAttempt, setLoadAttempt] = useState(0);

      // Models load once at the App root and are reused by every
      // screen — Live Scan and Photo Analysis both read the same
      // faceapi.nets singletons, never reloading them per screen.
      useEffect(() => {
        let cancelled = false;
        const load = async () => {
          setLoadError(false);
          try {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            if (!cancelled) setModelsLoaded(true);
          } catch (e) {
            // Store a flag, not a pre-formatted string — the message
            // is localized at render time from current `lang`, so a
            // language switch after a load failure still updates it
            // instead of leaving it frozen in the old language.
            if (!cancelled) setLoadError(true);
          }
        };
        load();
        return () => { cancelled = true; };
      }, [loadAttempt]);

      const handleComplete = (rec) => { setResult(rec); setNaturalLashProfile(null); setScreen('review'); };
      const handleReviewConfirm = (rec) => { setResult(rec); setScreen('hero'); };
      const retryLoad = () => setLoadAttempt(a => a + 1);
      const viewMap = (design) => { setActiveDesign(design); setScreen('lashmap'); };
      const handleLashScanComplete = (profile) => { setNaturalLashProfile(profile); setScreen('lashprofile'); };

      return (
        <LangContext.Provider value={lang}>
          <div className="app-container">
            {screen !== 'scan' && screen !== 'lashscan' && (
              <div className="absolute top-3 right-3 z-30">
                <LangToggle lang={lang} setLang={setLang} />
              </div>
            )}
            {screen === 'home' && <HomeScreen onLive={() => setScreen('scan')} onPhoto={() => setScreen('photo')} modelsLoaded={modelsLoaded} loadError={loadError} onRetry={retryLoad} />}
            {screen === 'scan' && <LiveScanScreen onComplete={handleComplete} onBack={() => setScreen('home')} modelsLoaded={modelsLoaded} onSetLang={setLang} />}
            {screen === 'photo' && <PhotoAnalysisScreen onComplete={handleComplete} onBack={() => setScreen('home')} modelsLoaded={modelsLoaded} />}
            {screen === 'review' && result && <ReviewScreen result={result} onConfirm={handleReviewConfirm} onBack={() => setScreen('home')} />}
            {screen === 'hero' && result && <HeroScreen result={result} naturalLashProfile={naturalLashProfile} onViewMap={viewMap} onDetails={() => setScreen('details')} onAllDesigns={() => setScreen('catalog')} onScanLashes={() => setScreen('lashscan')} onViewLashProfile={() => setScreen('lashprofile')} onBack={() => setScreen('home')} />}
            {screen === 'catalog' && result && <AllDesignsScreen result={result} onSelect={viewMap} onBack={() => setScreen('hero')} />}
            {screen === 'lashmap' && result && activeDesign && <LashMapScreen result={result} design={activeDesign} naturalLashProfile={naturalLashProfile} onBack={() => setScreen('hero')} />}
            {screen === 'details' && result && <DetailsScreen result={result} onBack={() => setScreen('hero')} />}
            {screen === 'lashscan' && <NaturalLashScanScreen onComplete={handleLashScanComplete} onBack={() => setScreen('hero')} modelsLoaded={modelsLoaded} />}
            {screen === 'lashprofile' && naturalLashProfile && <NaturalLashProfileScreen profile={naturalLashProfile} onDone={() => setScreen('hero')} onBack={() => setScreen('hero')} />}
          </div>
        </LangContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

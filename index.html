          // one. Logging the V2 shadow result to console (inspectable
          // via Safari Web Inspector / remote debugging) captures the
          // same engineering data without altering this screen's
          // behavior at all. Never written into leftMetrics/rightMetrics.
          if (isDebugModeEnabled()) {
            console.log('[Photo] EYELID CREASE V2 (debug shadow, not used in classification)', {
              left: { v1: leftCrease, v2: detectEyelidCreaseV2(canvas, leftEye, leftBrowPts) },
              right: { v1: rightCrease, v2: detectEyelidCreaseV2(canvas, rightEye, rightBrowPts) },
            });
          }

          const verticalAsymRaw = (headPose.leftEyeCenter.y - headPose.rightEyeCenter.y) / Math.max(headPose.interEyeDistance, 1);
          const frame = { t: 0, leftMetrics, rightMetrics, headPose, faceBoxWidth: det.detection.box.width, verticalAsymRaw };
          const aggregated = aggregateBuffer([frame, frame, frame]);
          const imageQuality = clamp01(det.detection.score * (1 - Math.min(1, Math.abs(headPose.roll)/30)) * (1 - Math.min(1, Math.abs(headPose.yawProxy)/0.4)));
          const classified = classifyFeatures(aggregated, { singleFrame: true, stability: null, imageQuality });
          classified.overallConfidence = clamp01(classified.overallConfidence * 0.85);

          const leftIris = sampleIrisColor(ctx, leftEye), rightIris = sampleIrisColor(ctx, rightEye);
          const iris = combineIris(leftIris, rightIris);
          // IRIS COLOR — DEBUG SHADOW MODE ONLY. Same read-only-extra-
          // call pattern already used for EYELID CREASE V2 a few lines
          // above in this screen (see that block's own comment) — never
          // written into leftIris/rightIris/iris. Computed ONCE and
          // reused for both the console log AND rec.irisColorAudit
          // below (never a second sample) — this is what lets
          // ResultsScreen's Copy button expose the exact same audit
          // the photo analysis produced, since PhotoAnalysisScreen has
          // no persistent debug panel of its own (see the matching
          // comment at this screen's EYELID CREASE V2 block).
          let irisColorAuditForRec = null;
          if (isDebugModeEnabled()) {
            const resizedLeftAudit=buildIrisColorAudit(ctx,leftEye),resizedRightAudit=buildIrisColorAudit(ctx,rightEye);
            const naturalWidth=img.naturalWidth||img.width,naturalHeight=img.naturalHeight||img.height;
            const mapping=debugBuildIrisNativeMapping(naturalWidth,naturalHeight,canvas.width,canvas.height,leftEye,rightEye,resizedLeftAudit,resizedRightAudit);
            const nativeCanvas=document.createElement('canvas');
            nativeCanvas.width=naturalWidth;nativeCanvas.height=naturalHeight;
            const nativeCtx=nativeCanvas.getContext('2d',{willReadFrequently:true});
            nativeCtx.drawImage(img,0,0,naturalWidth,naturalHeight);
            const nativeLeftAudit=buildIrisColorAudit(nativeCtx,mapping.left.eyePoints,mapping.left.center);
            const nativeRightAudit=buildIrisColorAudit(nativeCtx,mapping.right.eyePoints,mapping.right.center);
            nativeLeftAudit.colorDistributions=debugIrisPixelColorStats(nativeLeftAudit.acceptedPixels);
            nativeRightAudit.colorDistributions=debugIrisPixelColorStats(nativeRightAudit.acceptedPixels);
            resizedLeftAudit.colorDistributions=debugIrisPixelColorStats(resizedLeftAudit.acceptedPixels);
            resizedRightAudit.colorDistributions=debugIrisPixelColorStats(resizedRightAudit.acceptedPixels);
            irisColorAuditForRec = {
              left: resizedLeftAudit, right: resizedRightAudit,
              combined: buildIrisColorAuditCombined(null, null, leftIris, rightIris, iris),
              contextual:debugBuildIrisContextFeatures(ctx,leftEye,rightEye,resizedLeftAudit,resizedRightAudit,leftIris,rightIris),
              nativeVsResized:{
                image:mapping.image,
                left:{native:nativeLeftAudit,resized:resizedLeftAudit,paired:debugBuildPairedIrisStats(nativeCtx,resizedLeftAudit.acceptedPixels,mapping.image.scaleX,mapping.image.scaleY,naturalWidth,naturalHeight)},
                right:{native:nativeRightAudit,resized:resizedRightAudit,paired:debugBuildPairedIrisStats(nativeCtx,resizedRightAudit.acceptedPixels,mapping.image.scaleX,mapping.image.scaleY,naturalWidth,naturalHeight)},
              },
            };
            console.log('[Photo] IRIS COLOR AUDIT (debug shadow, not used in production)', irisColorAuditForRec);
          }
          const designs = rankDesigns(classified, lang);
          console.log('[Photo] DESIGNS RANKED', designs.map(d => d.name + ' ' + d.score + '%').join(', '));

          const photoRec = {
            source: 'photo', eyeProfile: classified, iris, designs,
            originalImage: canvas.toDataURL('image/jpeg', 0.92), landmarks: det.landmarks,
            imageWidth: canvas.width, imageHeight: canvas.height, confidence: classified.overallConfidence,
          };
          // Debug-only, additive field — absent entirely in normal mode.
          if (irisColorAuditForRec) photoRec.irisColorAudit = irisColorAuditForRec;
          onComplete(photoRec);
        } catch (e) {
          console.error('[Photo] PIPELINE ERROR', e);
          setState('error');
        }
      };

      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <span className="text-sm font-medium text-textPrimary">{t('photoBtn', lang)}</span>
            <div className="w-10"></div>
          </div>
          <div className="flex-1 flex flex-col items-center justify-center p-6">
            <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={e => analyze(e.target.files[0])} />
            <div className="w-full aspect-[4/5] rounded-lg bg-surface border border-border overflow-hidden flex items-center justify-center mb-6 relative">
              {previewUrl ? <img src={previewUrl} className="w-full h-full object-cover" alt="preview" /> : (
                <svg className="w-14 h-14 text-textMuted" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 7.5l-4.5-4.5m0 0L7.5 7.5m4.5-4.5v13.5"/></svg>
              )}
              {state === 'analyzing' && (
                <div className="absolute inset-0 bg-bg/80 flex flex-col items-center justify-center gap-3">
                  <div className="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
                  <p className="text-xs text-textSecondary uppercase tracking-wide">{t('photoAnalyzing', lang)}</p>
                </div>
              )}
            </div>
            {state === 'error' && (
              <div className="glass rounded-md p-4 border-danger/25 mb-4 w-full">
                <p className="text-xs text-danger leading-relaxed">{t('photoErrorQuality', lang)}</p>
              </div>
            )}
            <button onClick={() => fileInputRef.current?.click()} disabled={!modelsLoaded || state==='analyzing'} className={`w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale transition-colors disabled:opacity-50 ${!modelsLoaded || state==='analyzing' ? 'bg-white/10 text-textSecondary' : 'bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]'}`}>
              {state === 'error' ? t('photoTryAgain', lang) : t('photoSelect', lang)}
            </button>
            <p className="text-xs text-textMuted text-center mt-3">{t('photoHint', lang)}</p>
          </div>
        </div>
      );
    }

    // Single shared line-icon set — thin stroke, electric blue,
    // geometric, no emoji, no per-icon colors. Reused across Result,
    // Details, Lash Map and Application Plan cards.
    const PARAM_ICON_PATHS = {
      shape: 'M2.5 12c1.7-4 5-6.5 9.5-6.5s7.8 2.5 9.5 6.5c-1.7 4-5 6.5-9.5 6.5S4.2 16 2.5 12z|M12 14.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z',
      position: 'M4 15l5-6 4 3 7-8|M20 4h-4v4',
      size: 'M8 3v4M16 3v4M5 8h14a1 1 0 011 1v9a1 1 0 01-1 1H5a1 1 0 01-1-1V9a1 1 0 011-1z',
      symmetry: 'M12 3v18|M9 6L5 8v8l4 2|M15 6l4 2v8l-4 2',
      lid: 'M4 13c2-2.5 5-4 8-4s6 1.5 8 4|M4 13c2 2 5 3.5 8 3.5s6-1.5 8-3.5',
      iris: 'M12 3v3M12 18v3M3 12h3M18 12h3|circle:12,12,7|circle:12,12,2.6',
      curl: 'M4 18c0-6 4-11 11-11-3 0-6 2-6 6s3 5 6 5-2 4-6 4-5-1.5-5-4z',
      length: 'M4 12h13M13 7l4 5-4 5',
      density: 'M6 5v14M12 3v18M18 5v14',
      technique: 'M4 6h16M4 12h16M4 18h10',
      lashmap: 'M3 17c3-8 7-11 9-11s6 3 9 11|M6 9l1.5 3|M18 9l-1.5 3|M12 6v4',
      recommend: 'M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z',
      zoning: 'M4 5h16v14H4z|M4 12h16|M10 5v14',
      artist: 'M5 19l3.2-1 9-9-2.2-2.2-9 9L5 19z|M14.3 5.7l2.2 2.2',
      asymmetry: 'M12 3v18|M6 8l-2 4 2 4|M18 8l2 4-2 4',
    };
    function ParamIcon({ name, className }) {
      const spec = PARAM_ICON_PATHS[name] || PARAM_ICON_PATHS.shape;
      const parts = spec.split('|');
      return (
        <svg className={className || 'w-4 h-4 text-accent'} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          {parts.map((part, i) => part.startsWith('circle:') ? (
            <circle key={i} cx={part.split(':')[1].split(',')[0]} cy={part.split(':')[1].split(',')[1]} r={part.split(':')[1].split(',')[2]} />
          ) : (
            <path key={i} d={part} />
          ))}
        </svg>
      );
    }

    // Labels/values can legitimately be long ("Удлинённо-миндалевидная",
    // "Needs visual confirmation") — they wrap to a second line instead
    // of being cut off with an ellipsis, per the explicit requirement
    // that mobile UI never truncates these into "...".
    function EyeProfileRow({ icon, label, sublabel, value, confidence }) {
      return (
        <div className="flex justify-between items-start gap-3 py-3 border-b border-border/60 last:border-0">
          <div className="flex items-start gap-3 min-w-0 flex-1">
            <div className="w-8 h-8 rounded-md bg-white/[0.03] border border-border flex items-center justify-center flex-shrink-0 mt-0.5">
              <ParamIcon name={icon} className="w-4 h-4 text-accent" />
            </div>
            <div className="min-w-0">
              <p className="text-sm text-textPrimary leading-snug">{label}</p>
              {sublabel && <p className="text-[11px] text-textMuted leading-snug">{sublabel}</p>}
            </div>
          </div>
          <div className="flex flex-col items-end gap-1 flex-shrink-0 max-w-[42%] text-right">
            <span className="text-sm font-semibold text-cyan leading-snug">{value}</span>
            {typeof confidence === 'number' && <span className="text-[10px] text-textMuted">{Math.round(confidence*100)}%</span>}
          </div>
        </div>
      );
    }

    // Outer-corner tilt is reported as "needs confirmation" (rather than
    // a forced upturned/neutral/downturned guess) when its own computed
    // confidence is too low to trust — not when the value is simply
    // close to zero, since a small, consistently-measured tilt is a
    // real, valid "neutral" reading, not an uncertain one.
    const TILT_CONFIDENCE_FLOOR = 0.22;
    function eyeProfileLabels(p, iris, lang) {
      const shape = t('shape_' + p.eyeShapeCategory, lang);
      const tilt = p.tiltConfidence < TILT_CONFIDENCE_FLOOR ? t('tiltUncertain', lang)
        : p.tiltTendency === 'upturned' ? t('tiltUpturned', lang)
        : p.tiltTendency === 'downturned' ? t('tiltDownturned', lang)
        : t('tiltNeutral', lang);
      const hooding = p.eyelidCategory === 'pronounced' ? t('eyelidPronounced', lang)
        : p.eyelidCategory === 'moderate' ? t('eyelidModerate', lang)
        : p.eyelidCategory === 'mild' ? t('eyelidMild', lang)
        : p.eyelidCategory === 'open' ? t('eyelidOpen', lang)
        : t('eyelidUncertain', lang);
      // Raw crease-read label — always the true computed value, used
      // for the "most likely" note when the two eyelid signals
      // disagree. The DISPLAYED label (below) is suppressed to
      // "needs confirmation" in that case instead of showing a
      // confident diagnosis next to a contradicting one.
      const eyelidTypeRawLabel = p.eyelidType === 'openCrease' ? t('eyelidTypeOpenCrease', lang)
        : p.eyelidType === 'hooded' ? t('eyelidTypeHooded', lang)
        : p.eyelidType === 'monolid' ? t('eyelidTypeMonolid', lang)
        : t('eyelidTypeUncertain', lang);
      const eyelidTypeLabel = p.eyelidSignalsConflict ? t('eyelidTypeUncertain', lang) : eyelidTypeRawLabel;
      // ---- creaseState / hoodingState — see the PRODUCT SEMANTICS
      // SPLIT comment on classifyFeatures' own creaseState/hoodingState
      // computation. p.creaseState/p.hoodingState default to the
      // automatic classifyFeatures read; ReviewScreen confirmation
      // overwrites them on the confirmed profile the same way it
      // already overwrites eyelidType today.
      const creaseStateLabel = p.creaseState === 'visible' ? t('creaseStateVisible', lang)
        : p.creaseState === 'absent' ? t('creaseStateAbsent', lang)
        : t('creaseStateUncertain', lang);
      const hoodingStateLabel = p.hoodingState === 'hooded' ? t('hoodingOptionHooded', lang)
        : p.hoodingState === 'nonHooded' ? t('hoodingOptionNonHooded', lang)
        : t('hoodingStateUncertain', lang);
      const spacing = t('eyeSet_' + p.eyeSetCategory, lang);
      const eyeSize = t('eyeSize_' + p.eyeSizeCategory, lang);
      const symmetry = t('symmetry_' + p.symmetryCategory, lang);
      const irisName = iris?.name ? (lang==='en' ? IRIS_NAMES[iris.name].en : IRIS_NAMES[iris.name].ru) : t('insufficientData', lang);
      return { shape, tilt, hooding, eyelidTypeLabel, eyelidTypeRawLabel, creaseStateLabel, hoodingStateLabel, spacing, eyeSize, symmetry, irisName };
    }

    // ---- Eye Highlight ----
    // A short, positive, personalized line built ONLY from the real
    // classification result (dominant shape x corner direction, with an
    // asymmetry- or eyelid-aware variant) — never a fixed one-size-fits-
    // all sentence, never a numeric "attractiveness" score, never a
    // medical claim. Picks the most specific template it has real
    // evidence for; falls back to a generic-but-still-derived line when
    // shape/tilt are themselves uncertain.
    function generateEyeHighlight(c, lang) {
      const en = lang === 'en';
      const shape = c.eyeShapeCategory || 'uncertain';
      const tiltKnown = c.tiltConfidence >= TILT_CONFIDENCE_FLOOR;
      const tilt = tiltKnown ? c.tiltTendency : 'neutral';

      if (c.compositeAsymmetry > 0.09) {
        const asymBase = {
          almond: [en ? 'Your eyes have a naturally harmonious almond shape, with some individual left/right asymmetry — the artist can use it to personalize the design.' : 'У ваших глаз гармоничная миндалевидная форма с небольшой индивидуальной асимметрией левого и правого глаза — мастер может использовать эту особенность при персонализации схемы.'],
          round: [en ? 'Your round, open eyes carry a touch of natural left/right individuality — the artist can use it to fine-tune the balance of the design.' : 'У округлых, открытых глаз есть небольшая природная индивидуальность левого и правого глаза — мастер может использовать её для тонкой балансировки схемы.'],
          elongatedAlmond: [en ? 'Your elongated almond eyes show a bit of natural left/right individuality — the artist can use it to fine-tune peak position on each side.' : 'У вытянуто-миндалевидных глаз есть небольшая природная индивидуальность левого и правого глаза — мастер может использовать её для точной настройки положения пика с каждой стороны.'],
          narrow: [en ? 'Your eyes have a delicate, narrow opening with some natural left/right individuality — the artist can factor that into a balanced design.' : 'У глаз деликатное, узкое раскрытие с небольшой природной индивидуальностью левого и правого — мастер может учесть это в сбалансированной схеме.'],
        };
        return (asymBase[shape] || [en ? 'There’s a natural, individual asymmetry between your eyes — the artist can use it to personalize the lash design.' : 'У глаз есть естественная индивидуальная асимметрия — мастер может использовать её при персонализации схемы.'])[0];
      }

      const key = shape + '_' + tilt;
      const templates = {
        almond_upturned: [en ? 'Your almond eye shape pairs with a natural upward lift at the outer corner — an expressive combination the lash design can beautifully echo.' : 'Миндалевидная форма глаз сочетается с естественным подъёмом внешнего уголка — эту выразительную особенность легко красиво подчеркнуть направлением схемы.'],
        almond_neutral: [en ? 'Your eyes have a very harmonious almond shape — it supports both natural and more expressive lash designs equally well.' : 'У ваших глаз очень гармоничная миндалевидная форма. Она хорошо поддерживает как натуральные, так и более выразительные схемы наращивания.'],
        almond_downturned: [en ? 'Your almond eyes have a soft, gentle outer corner — a design with a lift toward the outer third can add an elegant accent.' : 'Миндалевидные глаза с мягким, спокойным внешним уголком — схема с акцентом на подъём во внешней трети добавит элегантный штрих.'],
        round_upturned: [en ? 'Your round eyes have a naturally lifted outer corner, giving the gaze an open, lively character.' : 'Округлые глаза с естественно приподнятым внешним уголком — взгляд от природы открытый и живой.'],
        round_neutral: [en ? 'Your eyes have a soft, round shape with a naturally wide-open look — a great base for a design that adds gentle elongation.' : 'У глаз мягкая округлая форма с естественно широким взглядом — отличная основа для схемы с лёгким визуальным удлинением.'],
        round_downturned: [en ? 'Your round eyes have a gentle, relaxed outer corner — a subtle lift in the design can add a soft lifted accent.' : 'Округлые глаза со спокойным, мягким внешним уголком — лёгкий подъём в схеме добавит деликатный акцент.'],
        elongatedAlmond_upturned: [en ? 'Your elongated almond eyes with a naturally upturned corner give the gaze a striking, feline elegance.' : 'Вытянуто-миндалевидные глаза с естественно приподнятым уголком придают взгляду выразительную, кошачью элегантность.'],
        elongatedAlmond_neutral: [en ? 'Your eyes have a beautifully elongated almond shape with balanced proportions — a very versatile, editorial-looking base.' : 'У ваших глаз красивая вытянуто-миндалевидная форма со сбалансированными пропорциями — универсальная, эффектная основа для самых разных схем.'],
        elongatedAlmond_downturned: [en ? 'Your elongated almond eyes have a softly dropped outer corner — a design with lift toward the temple can beautifully balance the look.' : 'Вытянуто-миндалевидные глаза с мягко опущенным внешним уголком — схема с подъёмом к виску красиво сбалансирует взгляд.'],
        narrow_upturned: [en ? 'Your eyes have a delicate, narrow opening with a natural lift at the outer corner — a refined, elongating design can beautifully open the gaze.' : 'У глаз деликатное, узкое раскрытие с естественным подъёмом внешнего уголка — деликатная удлиняющая схема красиво откроет взгляд.'],
        narrow_neutral: [en ? 'Your eyes have a delicate, narrow opening — a design that gently opens the eye along the center can add expressive volume.' : 'У глаз деликатное, узкое раскрытие — схема с мягким акцентом в центре добавит выразительный объём.'],
        narrow_downturned: [en ? 'Your eyes have a delicate, narrow opening with a gentle downward corner — a soft outer lift can add a subtle opening effect.' : 'У глаз деликатное, узкое раскрытие с мягким опущенным уголком — лёгкий подъём во внешней зоне добавит эффект визуального открытия.'],
        uncertain_upturned: [en ? 'Your eyes have a naturally lifted outer corner — a distinctive feature the design can play up.' : 'У глаз естественно приподнятый внешний уголок — эту особенность можно красиво обыграть в схеме.'],
        uncertain_neutral: [en ? 'Your eyes have balanced, harmonious proportions that work well with a wide range of lash designs.' : 'У ваших глаз сбалансированные, гармоничные пропорции — они хорошо сочетаются с самыми разными схемами наращивания.'],
        uncertain_downturned: [en ? 'Your eyes have a soft, relaxed outer corner — a gentle lift in the design can add a lovely lifted accent.' : 'У глаз мягкий, спокойный внешний уголок — лёгкий подъём в схеме добавит красивый акцент.'],
      };
      let line = (templates[key] || templates.uncertain_neutral)[0];

      // PRODUCT SEMANTICS SPLIT — gated on the authoritative,
      // manually-confirmed hoodingState (never the automatic
      // eyelidCategory geometry read, which the hooding audit proved
      // cannot reliably detect isolated upper-lid skin overhang). When
      // hoodingState is still 'uncertain' (not yet confirmed, or the
      // artist picked "unsure"), neither addendum is shown — no
      // confident automatic hooding assumption is made here either.
      if (c.hoodingState === 'hooded') {
        const hoodedAddendums = [
          en ? ' The eyelid shows less of the crease at rest — the artist can pick a curl that keeps the lash line visible when your eyes are open.'
             : ' Складка века у вас чуть менее заметна в спокойном состоянии — мастер может подобрать изгиб, который сохранит видимость линии ресниц с открытым глазом.',
          en ? ' A slightly stronger curl in the center can help keep the lash line visible throughout the day.'
             : ' Чуть более сильный изгиб в центральной зоне поможет сохранить видимость линии ресниц в течение дня.',
        ];
        line += hoodedAddendums[shape === 'round' || shape === 'narrow' ? 1 : 0];
      } else if (c.hoodingState === 'nonHooded') {
        const openAddendums = [
          en ? ' The eyelid stays clearly visible, giving the artist a lot of freedom with curl and length.'
             : ' Веко хорошо просматривается — это даёт мастеру большую свободу в выборе изгиба и длины.',
        ];
        line += openAddendums[0];
      }
      if (c.eyeSizeCategory === 'large' && c.eyeSizeConfidence > 0.45) {
        line += en ? ' Their proportion relative to the face is naturally striking.' : ' Их пропорция относительно лица от природы выразительна.';
      } else if (c.eyeSizeCategory === 'small' && c.eyeSizeConfidence > 0.45) {
        line += en ? ' A design with a soft central peak can add extra openness to the gaze.' : ' Схема с мягким центральным пиком добавит взгляду дополнительную открытость.';
      }
      return line;
    }

    // Static biometric mesh drawn once over the captured result photo
    // — a visual echo of the same real facial-surface-mesh system
    // used live in Scan, built from the SAME landmarks the analysis
    // actually used (result.landmarks). Purely presentational: no
    // lash rendering, no re-analysis, nothing fed back into scoring.
    // PHYSICAL EYE NORMALIZATION — deliberately exempt. This draws the
    // purely-visual buildFaceMesh face outline over the captured/
    // reviewed photo; it asserts no L/R label or semantic claim.
    // meshEdgeList/meshTriangleList have ~15 hardcoded joins that
    // assume face-api's raw, image-side eye/brow ordering (see the
    // getPhysicalEyeLandmarks doc comment) — feeding it normalized
    // points would require rewriting that topology for zero semantic
    // benefit, so raw getLeftEye()/getRightEye()/getLeftEyeBrow()/
    // getRightEyeBrow() calls stay here intentionally, unchanged.
    function ResultMeshOverlay({ landmarks, imageWidth, imageHeight }) {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      useEffect(() => {
        if (!landmarks || !imageWidth || !imageHeight) return;
        const canvas = canvasRef.current, container = containerRef.current;
        if (!canvas || !container) return;
        const draw = () => {
          const rect = container.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
          canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          const map = (p) => mapVideoPointToDisplay(p.x, p.y, imageWidth, imageHeight, w, h);
          const d = {
            jaw: landmarks.getJawOutline().map(map),
            leftBrow: landmarks.getLeftEyeBrow().map(map),
            rightBrow: landmarks.getRightEyeBrow().map(map),
            nose: landmarks.getNose().map(map),
            leftEye: landmarks.getLeftEye().map(map),
            rightEye: landmarks.getRightEye().map(map),
            mouth: landmarks.getMouth().slice(0, 12).map(map),
          };
          const mesh = buildFaceMesh(d);
          if (!mesh) return;
          const xs = d.jaw.map(pt=>pt.x), ys = d.jaw.map(pt=>pt.y).concat(mesh.f2.map(pt=>pt.y));
          const boxCenter = { x: (Math.min(...xs)+Math.max(...xs))/2, y: (Math.min(...ys)+Math.max(...ys))/2 };
          const faceHalfW = Math.max(1, (Math.max(...xs)-Math.min(...xs))/2);
          drawFaceMeshV3(ctx, mesh, { revealMode: false, wavefrontY: 0, beamY: -9999, presence: 0.95, boxCenter, faceHalfW });
        };
        draw();
        window.addEventListener('resize', draw);
        return () => window.removeEventListener('resize', draw);
      }, [landmarks, imageWidth, imageHeight]);
      return (
        <div ref={containerRef} className="absolute inset-0 pointer-events-none">
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />
        </div>
      );
    }

    function MatchBar({ score }) {
      const filled = Math.round(clamp01(score/100) * 8);
      return (
        <div className="flex gap-[3px]" aria-hidden="true">
          {Array.from({length: 8}, (_,i) => (
            <span key={i} className={`w-[9px] h-[3px] rounded-full ${i < filled ? 'bg-accent' : 'bg-white/10'}`}></span>
          ))}
        </div>
      );
    }

    // IRIS COLOR — DEBUG-ONLY Copy button, ResultsScreen (HeroScreen).
    // Exposes the EXACT irisColorAudit produced during the real scan —
    // result.irisColorAudit was attached to rec by LiveScanScreen/
    // PhotoAnalysisScreen (debug-only, see their own comments) and
    // survives ReviewScreen's confirm() unchanged (that function
    // spreads ...result before overriding only eyeProfile/designs/
    // originalAIProfile/artistConfirmed). This component computes
    // nothing and re-samples nothing — it only reads result.irisColorAudit/
    // result.iris (both already real, already computed) and formats
    // them for clipboard. Rendered only when isDebugModeEnabled().
    function CopyIrisDebugButton({ result, lang }) {
      const [state, setState] = useState('idle'); // idle | copied | unavailable | error
      const copy = () => {
        const audit = result.irisColorAudit;
        if (!audit) {

              .then(() => { setState('copied'); setTimeout(() => setState('idle'), 1500); })
              .catch(() => { setState('error'); setTimeout(() => setState('idle'), 3000); });
          } else {
            setState('error'); setTimeout(() => setState('idle'), 3000);

    // Secondary technical diagram retained alongside the photo map.

    function LashMapDiagram({ zones, peakIdx, spikeGeom, curve, hoveredZone, setHoveredZone, curl, technique }) {
      const upperY=t=>175-Math.sin(t*Math.PI)*78,lowerY=t=>175+Math.sin(t*Math.PI)*34,xAt=t=>55+t*290;
      const items = expandLashMapSectors(zones, peakIdx, curve);
      const upper=Array.from({length:21},(_,i)=>`${xAt(i/20)},${upperY(i/20)}`).join(' L ');
      const lower=Array.from({length:21},(_,i)=>`${xAt(1-i/20)},${lowerY(1-i/20)}`).join(' L ');
      return <svg className="absolute inset-0 h-full w-full" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
        <defs><radialGradient id="diagramEyeBg" cx="50%" cy="50%" r="70%"><stop offset="0%" stopColor="rgba(10,140,255,.07)"/><stop offset="100%" stopColor="rgba(2,6,11,0)"/></radialGradient></defs>
        <rect width="400" height="300" fill="url(#diagramEyeBg)"/>
        <path d={`M ${upper} L ${lower} Z`} fill="rgba(83,199,255,.03)" stroke="rgba(83,199,255,.22)" strokeWidth="1.5"/>
        <circle cx={xAt(.44)} cy={(upperY(.44)+lowerY(.44))/2+4} r="13" fill="rgba(83,199,255,.05)" stroke="rgba(83,199,255,.25)" strokeDasharray="2 3"/>
        <circle cx={xAt(.44)} cy={(upperY(.44)+lowerY(.44))/2+4} r="5" fill="rgba(83,199,255,.14)"/>
        {(spikeGeom?.spikes||[]).map((sp,i)=>{const x=xAt(sp.t),y=upperY(sp.t),h=(sp.spikeLen-sp.baseLen)*3.2+(sp.tall?8:4);return <polygon key={`s${i}`} points={`${x-(sp.tall?1.3:.8)},${y} ${x+(sp.tall?1.3:.8)},${y} ${x},${y-h}`} fill={sp.tall?'rgba(83,199,255,.8)':'rgba(10,140,255,.34)'}/>;})}
        {items.map((z,i)=>{const x=xAt(z.t),y=upperY(z.t)-4;return <g key={i} onClick={()=>setHoveredZone(hoveredZone===i?null:i)} className="cursor-pointer">
          <circle cx={x} cy={y} r={z.isPeak?9:z.isKey?6:4} fill={z.isPeak?'#0A8CFF':z.isKey?'rgba(244,247,250,.22)':'rgba(83,199,255,.28)'} stroke={z.isPeak?'#53C7FF':'none'} strokeWidth="2"/>
          <text x={x} y={y-16} textAnchor="middle" fill={z.isPeak?'#53C7FF':'#F4F7FA'} fontSize={z.isKey?15:11} fontWeight={z.isPeak?700:400}>{z.len}</text>
          {z.label&&<text x={x} y={y+20} textAnchor="middle" fill="rgba(142,154,168,.75)" fontSize="7" letterSpacing="1">{z.label}</text>}
          {hoveredZone===i&&<g><rect x={x-52} y={y+26} width="104" height="46" rx="10" fill="rgba(6,16,26,.96)" stroke="rgba(35,150,255,.25)"/><text x={x} y={y+44} textAnchor="middle" fill="#F4F7FA" fontSize="11">{z.len} mm · {curl}</text><text x={x} y={y+61} textAnchor="middle" fill="rgba(142,154,168,.85)" fontSize="9">{technique}</text></g>}
        </g>;})}
      </svg>;
    }

    // Artist-facing map over the exact captured eye. SVG image and

      const items = expandLashMapSectors(zones, peakIdx, curve);

      const {crop,points,path}=projection;
      const labels=selectProfessionalEyeLabels(points,crop);
      const unit=Math.max(crop.width,crop.height)/100;
      const textureLabel=texture ? ({wispy:'Wispy',kim:'Kim',manga:'Manga'}[texture.pattern]||texture.pattern) : (lang==='en'?'Smooth':'Гладкая');
      const peak=points.find(p=>p.isPeak);
      const curlSpec=[curl,...design.curlRec.alternatives.filter(v=>v!==curl)].slice(0,2).join(' / ');

              {points.map((point,i)=>{
                const label=labels[i],sampleRadius=professionalSampleRadius(point.len,unit),r=point.isPeak?sampleRadius*1.18:sampleRadius;
                return <g key={i} data-map-point={i} data-length={point.len} data-peak={point.isPeak?'true':'false'}>
                  <circle data-photo-sample="true" cx={point.x} cy={point.y} r={r} fill={point.isPeak?'#0A8CFF':'rgba(244,247,250,.88)'} stroke={point.isPeak?'#B9E8FF':'rgba(3,8,14,.88)'} strokeWidth={unit*(point.isPeak?.34:.26)}/>
                  {label&&<text x={label.x} y={label.y} textAnchor="middle" paintOrder="stroke" stroke="rgba(2,6,11,.94)" strokeWidth={unit*.95} fill={point.isPeak?'#8DD9FF':'#FFFFFF'} fontSize={unit*(point.isPeak?3.8:3.45)} fontWeight={point.isPeak?'700':'600'} letterSpacing={point.isPeak?unit*.2:unit*.08}>{point.isPeak?`PEAK ${point.len}`:`${point.label} ${point.len}`}</text>}
                </g>;
              })}
            </svg>
            <span className="absolute left-3 top-3 rounded-full border border-white/15 bg-bg/75 px-2.5 py-1 text-[10px] font-semibold tracking-[.14em] text-white backdrop-blur-sm">{side==='left'?t('leftEye',lang):t('rightEye',lang)}</span>
          </button>
          <div className="border-t border-white/[.07] p-3">
            <div className="mb-3 flex items-start justify-between gap-3">
              <div><p className="text-sm font-semibold text-textPrimary">{design.name}</p><p className="text-[10px] uppercase tracking-widest text-textMuted">{side==='left'?t('leftEye',lang):t('rightEye',lang)}</p></div>
              <div className="text-right"><p className="text-[9px] uppercase tracking-widest text-textMuted">{lang==='en'?'Peak':'Пик'}</p><p className="text-sm font-semibold text-cyan">{Math.round((peak?.t||0)*100)}%</p></div>

            <dl className="grid grid-cols-3 gap-2 border-y border-white/[.06] py-2.5">

            <p className="sr-only">{technique}</p>

    function LashMapScreen({ result, design: designProp, naturalLashProfile, onBack }) {

      const [customSpikeFreq, setCustomSpikeFreq] = useState(design.texture ? design.texture.frequency : 2);
      const [customSpikeDiff, setCustomSpikeDiff] = useState(design.texture ? design.texture.baseToSpikeDiff : 1.5);
      const [customSpikePattern, setCustomSpikePattern] = useState(design.texture ? design.texture.pattern : 'uniform');

      const p = result.eyeProfile;
      const aiBase = activeEye === 'left' ? design.leftZones : design.rightZones;
      const otherAiBase = activeEye === 'left' ? design.rightZones : design.leftZones;
      const customBase = activeEye === 'left' ? customLeft : customRight;
      const zones = (mode === 'ai' ? aiBase : customBase).map(v => Math.max(5, v + (mode==='ai'?lengthDelta:0)));
      const otherZones = mode === 'ai' ? otherAiBase.map(v => Math.max(5, v + lengthDelta)) : (activeEye === 'left' ? customRight : customLeft);
      const leftZones=activeEye==='left'?zones:otherZones;
      const rightZones=activeEye==='right'?zones:otherZones;
      // PEAK follows the actual per-eye map being rendered (including
      // measured correction). Custom edits may deliberately move the
      // maximum, so diagram and written plan derive the same peak there.
      const leftPeakIdx=mode==='custom'?leftZones.indexOf(Math.max(...leftZones)):design.leftPeakZone;
      const rightPeakIdx=mode==='custom'?rightZones.indexOf(Math.max(...rightZones)):design.rightPeakZone;
      const peakIdx = mode==='custom' ? zones.indexOf(Math.max(...zones)) : activeEye === 'left' ? design.leftPeakZone : design.rightPeakZone;
      const asym = p.compositeAsymmetry > 0.07 && Math.max(design.leftCorrectionMm || 0, design.rightCorrectionMm || 0) > 0;
      const densityLabel = density==='light' ? t('light',lang) : density==='full' ? t('full',lang) : t('medium',lang);
      const diameter = density==='light' ? '0.07 mm' : density==='full' ? '0.12–0.15 mm' : '0.10 mm';
      const availableCurls = [...new Set([...design.curlOptions, design.curlRec.primary, ...design.curlRec.alternatives])];

      const effectiveTexture = mode === 'custom'
        ? (customSpikesOn ? { pattern: customSpikePattern, frequency: customSpikeFreq, baseToSpikeDiff: customSpikeDiff } : null)
        : design.texture;
      const spikeGeom = computeSpikeGeometry(zones, effectiveTexture);
      const plan = generateApplicationPlan(p, design, technique, curl, zones, otherZones, spikeGeom, design.curve, lang);
      let planNumCounter = 0;
      const planNum = { next: () => ++planNumCounter };
      const lashObsAvailable = !!(naturalLashProfile && (naturalLashProfile.left?.hasData || naturalLashProfile.right?.hasData));
      const lashNotes = lashObsAvailable ? generateLashApplicationNotes(naturalLashProfile.left, naturalLashProfile.right, naturalLashProfile.comparison, lang) : null;

      const setCustomZone = (idx, val) => {
        const setter = activeEye === 'left' ? setCustomLeft : setCustomRight;
        const base = activeEye === 'left' ? customLeft : customRight;
        const next = [...base]; next[idx] = Math.max(5, Math.min(16, val));
        setter(next);
      };

      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <div className="flex flex-col items-center min-w-0">
              <span className="text-sm font-semibold text-textPrimary truncate max-w-[220px]">{design.name}</span>
              <span className="text-[10px] text-textMuted uppercase tracking-widest">{t('lashMapTitle', lang)}</span>
            </div>
            <div className="w-10"></div>
          </div>
          <div className="flex-1 overflow-y-auto hide-scrollbar">
            <div className="px-4 pt-3 pb-2">
              <div className="flex rounded-md bg-surface border border-border p-1 mb-2">
                {['ai','custom'].map(m => (
                  <button key={m} onClick={() => setMode(m)} className={`flex-1 py-2 rounded-sm text-xs font-medium uppercase tracking-wide transition-all ${mode===m ? 'bg-accent text-white' : 'text-textSecondary'}`}>{m==='ai'?t('aiDesignTab',lang):t('customTab',lang)}</button>
                ))}
              </div>
              <div className="flex rounded-md bg-surface border border-border p-1 mb-3">
                {['left','right'].map(eye => (
                  <button key={eye} onClick={() => setActiveEye(eye)} className={`flex-1 py-2 rounded-sm text-sm font-medium uppercase tracking-wide transition-all ${activeEye === eye ? 'bg-white/10 text-textPrimary' : 'text-textSecondary'}`}>{eye==='left'?t('leftEye',lang):t('rightEye',lang)}</button>
                ))}
              </div>
              {asym && mode==='ai' && (
                <div className="glass rounded-md p-3 mb-3 border-peak/25">
                  <p className="text-xs text-peak font-medium mb-1 uppercase tracking-wide">{t('asymBanner', lang)}</p>
                  <p className="text-xs text-textSecondary">
                    {lang==='en'
                      ? `${(design.leftCorrectionMm || 0) > 0 ? 'Left' : 'Right'} eye map was adjusted by ${Math.max(design.leftCorrectionMm || 0, design.rightCorrectionMm || 0)} mm from the measured multi-axis asymmetry.`
                      : `Карта ${(design.leftCorrectionMm || 0) > 0 ? 'левого' : 'правого'} глаза скорректирована на ${Math.max(design.leftCorrectionMm || 0, design.rightCorrectionMm || 0)} мм по измеренной многофакторной асимметрии.`}
                  </p>
                </div>
              )}
            </div>
            <div className="px-4">
              <div className="mb-3 flex rounded-md border border-border bg-surface p-1" aria-label="Lash Map view">
                {['photo','diagram'].map(view=><button key={view} onClick={()=>setViewMode(view)} className={`flex-1 rounded-sm py-2 text-[10px] font-semibold uppercase tracking-[.14em] transition-colors ${viewMode===view?'bg-white/10 text-textPrimary':'text-textMuted'}`}>{view}</button>)}
              </div>
              {viewMode==='photo'?<div className="mb-4 grid grid-cols-1 gap-3 md:grid-cols-2">
                <ProfessionalEyeMap result={result} side="left" zones={leftZones} peakIdx={leftPeakIdx} curve={design.curve} design={design} curl={curl} technique={technique} texture={effectiveTexture} active={activeEye==='left'} onActivate={()=>setActiveEye('left')} lang={lang}/>
                <ProfessionalEyeMap result={result} side="right" zones={rightZones} peakIdx={rightPeakIdx} curve={design.curve} design={design} curl={curl} technique={technique} texture={effectiveTexture} active={activeEye==='right'} onActivate={()=>setActiveEye('right')} lang={lang}/>
              </div>:<div className="relative mb-4 aspect-[4/3] w-full overflow-hidden rounded-lg border border-border bg-surface">
                <LashMapDiagram zones={zones} peakIdx={peakIdx} spikeGeom={spikeGeom} curve={design.curve} hoveredZone={hoveredZone} setHoveredZone={setHoveredZone} curl={curl} technique={technique}/>
              </div>}

              {mode === 'custom' && (
                <div className="mb-4">
                  <p className="label-tech mb-1">{t('customMapTitle', lang)}</p>
                  <p className="text-xs text-textSecondary mb-3">{t('customMapHint', lang)}</p>
                  <div className="grid grid-cols-5 gap-2 mb-4">
                    {zones.map((v, i) => (
                      <div key={i} className="glass rounded-md p-2 flex flex-col items-center">
                        <span className="text-[9px] text-textMuted mb-1 uppercase">{ZONE_NAMES[i]}</span>
                        <div className="flex items-center gap-1">
                          <button onClick={() => setCustomZone(i, v-1)} className="w-5 h-5 rounded bg-surface text-textPrimary text-xs">−</button>
                          <span className="text-sm font-semibold w-5 text-center">{v}</span>
                          <button onClick={() => setCustomZone(i, v+1)} className="w-5 h-5 rounded bg-surface text-white text-xs">+</button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-between items-center mb-2">
                    <p className="label-tech">{t('spikesToggle', lang)}</p>
                    <button onClick={() => setCustomSpikesOn(v => !v)} className={`px-3 py-1 rounded-md text-xs font-medium uppercase tracking-wide ${customSpikesOn ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{customSpikesOn ? t('spikesOnLabel', lang) : t('spikesOffLabel', lang)}</button>
                  </div>
                  {customSpikesOn && (
                    <div className="space-y-3">
                      <div>
                        <p className="text-[10px] text-textMuted uppercase mb-1">{t('spikeCountCtrl', lang)}</p>
                        <div className="flex items-center gap-3 glass rounded-md p-2">
                          <button onClick={() => setCustomSpikeFreq(f => Math.max(1, f-1))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">−</button>
                          <span className="flex-1 text-center text-sm">{customSpikeFreq}</span>
                          <button onClick={() => setCustomSpikeFreq(f => Math.min(4, f+1))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">+</button>
                        </div>
                      </div>
                      <div>
                        <p className="text-[10px] text-textMuted uppercase mb-1">{t('spikeDiffCtrl', lang)}</p>
                        <div className="flex items-center gap-3 glass rounded-md p-2">
                          <button onClick={() => setCustomSpikeDiff(d => Math.max(0.5, Math.round((d-0.5)*10)/10))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">−</button>
                          <span className="flex-1 text-center text-sm">+{customSpikeDiff} mm</span>
                          <button onClick={() => setCustomSpikeDiff(d => Math.min(5, Math.round((d+0.5)*10)/10))} className="w-8 h-8 rounded-md bg-surface text-textPrimary font-bold">+</button>
                        </div>
                      </div>
                      <div>
                        <p className="text-[10px] text-textMuted uppercase mb-1">{t('spikePatternLabel', lang)}</p>
                        <div className="flex gap-2">
                          {['uniform','kim','manga'].map(pat => (
                            <button key={pat} onClick={() => setCustomSpikePattern(pat)} className={`chip flex-1 px-2 py-1.5 rounded-md text-xs font-medium ${customSpikePattern===pat ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{pat==='uniform'?'Wispy':pat==='kim'?'Kim':'Manga'}</button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="glass rounded-lg p-4 mb-4 flex justify-between items-center">
                <div><p className="label-tech mb-1">{t('curlLabel', lang)}</p><p className="text-lg font-semibold text-textPrimary">{curl}</p></div>
                <div><p className="label-tech mb-1">{t('maxLengthLabel', lang)}</p><p className="text-lg font-semibold text-cyan">{Math.max(...zones)} mm</p></div>
                <div><p className="label-tech mb-1">{t('designLabel', lang)}</p><p className="text-lg font-semibold text-textPrimary truncate max-w-[100px]">{design.name}</p></div>
              </div>

              <div className="mb-4">
                <p className="label-tech mb-2">{t('techniqueLabel', lang)}</p>
                <div className="flex flex-wrap gap-2">
                  {TECHNIQUE_CATALOG.map(tech => (
                    <button key={tech.id} onClick={() => setTechnique(tech.label)} className={`chip px-3 py-2 rounded-md text-xs font-medium ${technique===tech.label ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{tech.label}</button>
                  ))}
                </div>
              </div>

              <div className="mb-2">
                <p className="label-tech mb-2">{t('curlCatalogLabel', lang)}</p>
                <div className="flex flex-wrap gap-2">
                  {CURL_CATALOG.map(cc => (
                    <button key={cc.id} onClick={() => setCurl(cc.id)} className={`chip px-4 py-2 rounded-md text-sm font-medium ${curl===cc.id ? 'bg-accent text-white' : availableCurls.includes(cc.id) ? 'bg-surface border border-border text-textPrimary' : 'bg-surface/50 border border-border/50 text-textMuted'}`}>{cc.id}</button>
                  ))}
                </div>
                <p className="text-xs text-textSecondary mt-2">{t('primaryCurl',lang)}: <span className="text-textPrimary font-medium">{design.curlRec.primary}</span> ({t('alternativeCurls',lang)}: {design.curlRec.alternatives.join(' / ')}) — {design.curlRec.reason}</p>
              </div>

              {mode === 'ai' && (
                <div className="mb-4">
                  <p className="label-tech mb-2">{t('maxLengthLabel', lang)}</p>
                  <div className="flex items-center gap-3 glass rounded-md p-2">
                    <button onClick={() => setLengthDelta(d => Math.max(-2, d-1))} className="w-9 h-9 rounded-md bg-surface text-textPrimary font-bold">−</button>
                    <span className="flex-1 text-center text-sm font-medium">{lengthDelta > 0 ? '+' : ''}{lengthDelta} mm</span>
                    <button onClick={() => setLengthDelta(d => Math.min(2, d+1))} className="w-9 h-9 rounded-md bg-surface text-textPrimary font-bold">+</button>
                  </div>
                </div>
              )}

              <div className="mb-6">
                <p className="label-tech mb-2">{t('densityLabel', lang)}</p>
                <div className="flex gap-2">
                  {['light','medium','full'].map(dOpt => (
                    <button key={dOpt} onClick={() => setDensity(dOpt)} className={`chip flex-1 px-3 py-2 rounded-md text-xs font-medium ${density===dOpt ? 'bg-accent text-white' : 'bg-surface border border-border text-textSecondary'}`}>{dOpt==='light'?t('light',lang):dOpt==='full'?t('full',lang):t('medium',lang)}</button>
                  ))}
                </div>
                <p className="text-xs text-textSecondary mt-2">{technique} · {densityLabel.toLowerCase()} — {t('recommendedDiameter',lang)} {diameter}</p>
              </div>

              <Section title={t('applicationPlanTitle', lang)} defaultOpen>
                <div className="space-y-5">
                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="zoning" title={t('preparationTitle', lang)}>
                    <div className="space-y-1.5">
                      {plan.preparation.map((item,i) => (
                        <div key={i} className="flex gap-2">
                          <span className="text-textMuted text-xs mt-0.5">□</span>
                          <p className="text-sm text-textSecondary leading-relaxed">{item}</p>
                        </div>
                      ))}
                    </div>
                  </PlanSection>

                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="zoning" title={t('zoningTitle', lang)}>
                    <div className="grid grid-cols-5 gap-1.5">
                      {plan.displaySectors.map((sector,i) => (
                        <div key={i} className={`rounded-md p-2 text-center border ${sector.isPeak ? 'border-accent/50 bg-accent/10' : 'border-border bg-white/[0.02]'}`}>
                          <p className={`text-sm font-bold ${sector.isPeak ? 'text-cyan' : 'text-textPrimary'}`}>{sector.len}</p>
                          <p className="text-[8px] text-textMuted uppercase mt-0.5 leading-tight">{sector.label || '·'}</p>
                        </div>
                      ))}
                    </div>
                  </PlanSection>

                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="technique" title={t('stepsTitle', lang)}>
                    <div className="space-y-3">
                      {plan.steps.map((s,i) => (
                        <div key={i}>
                          <p className="text-xs font-semibold text-textPrimary mb-1">{s.title}</p>
                          <p className="text-sm text-textSecondary leading-relaxed">{s.body}</p>
                        </div>
                      ))}
                    </div>
                  </PlanSection>

                  {plan.spikePlan && (
                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="lashmap" title={t('spikePlanTitle', lang)}>
                      <div className="grid grid-cols-2 gap-2 mb-3 text-xs">
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeBaseLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.base}</p></div>
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeSpikesLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.spikes}</p></div>
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeDiffLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.diff}</p></div>
                        <div className="glass rounded-md p-2"><p className="text-textMuted text-[10px] uppercase">{t('spikeCountLabel',lang)}</p><p className="font-semibold text-textPrimary">{plan.spikePlan.count}</p></div>
                      </div>
                      <div className="space-y-1.5">
                        {plan.spikePlan.notes.map((n,i) => (
                          <div key={i} className="flex gap-2"><span className="text-cyan text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                        ))}
                      </div>
                    </PlanSection>
                  )}

                  {asym && (
                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="asymmetry" title={t('asymAdjustTitle', lang)}>
                      <p className="text-sm text-textSecondary leading-relaxed">
                        {lang==='en'
                          ? `${(design.leftCorrectionMm || 0) > 0 ? 'Left' : 'Right'} eye map was adjusted by ${Math.max(design.leftCorrectionMm || 0, design.rightCorrectionMm || 0)} mm from the measured multi-axis asymmetry.`
                          : `Карта ${(design.leftCorrectionMm || 0) > 0 ? 'левого' : 'правого'} глаза скорректирована на ${Math.max(design.leftCorrectionMm || 0, design.rightCorrectionMm || 0)} мм по измеренной многофакторной асимметрии.`}
                      </p>
                    </PlanSection>
                  )}

                  {lashObsAvailable && (
                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="iris" title={t('lashObservationsTitle', lang)}>
                      <div className="space-y-1.5 mb-3">
                        {lashNotes.observations.map((n,i) => (
                          <p key={i} className="text-sm text-textSecondary leading-relaxed">{n}</p>
                        ))}
                      </div>
                      <p className="text-xs font-semibold text-textPrimary uppercase tracking-wider mb-2">{t('lashConsiderationsTitle', lang)}</p>
                      <div className="space-y-1.5">
                        {lashNotes.considerations.map((n,i) => (
                          <div key={i} className="flex gap-2"><span className="text-cyan text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                        ))}
                      </div>
                    </PlanSection>
                  )}

                  <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="artist" title={t('artistNotesTitle', lang)}>
                    <div className="space-y-1.5">
                      {plan.artistNotes.map((n,i) => (
                        <div key={i} className="flex gap-2"><span className="text-accent text-xs mt-0.5">•</span><p className="text-sm text-textSecondary leading-relaxed">{n}</p></div>
                      ))}
                    </div>
                  </PlanSection>
                </div>
              </Section>
            </div>
          </div>
        </div>
      );
    }

    // Renders one confidence-factor breakdown ({measurementAgreement,
    // landmarkStability, imageQuality, lrAgreement, poseQuality}) as
    // small labeled bars — the same five factors computeConfidence()
    // actually multiplied together, so it's possible to see WHY a
    // number came out the way it did instead of just trusting it.
    function DebugFactorBars({ factors }) {
      if (!factors) return null;
      return (
        <div className="grid grid-cols-1 gap-1 mt-1">
          {Object.entries(factors).map(([k,v]) => (
            <div key={k} className="flex items-center gap-2">
              <span className="text-[9px] text-textMuted w-28 flex-shrink-0">{k}</span>
              <div className="flex-1 h-1 bg-surface rounded-full overflow-hidden"><div className="h-full bg-cyan" style={{width:`${(v*100).toFixed(0)}%`}}></div></div>
              <span className="text-[9px] text-textMuted w-8 text-right">{(v*100).toFixed(0)}%</span>
            </div>
          ))}
        </div>
      );
    }
    function DebugEyeBlock({ label, m }) {
      if (!m) return null;
      const rows = [['whRatio',m.whRatio],['avgTaperDeg',m.avgTaperDeg],['innerTaperDeg',m.innerTaperDeg],['outerTaperDeg',m.outerTaperDeg],['apertureAsymmetry',m.apertureAsymmetry],['ear',m.ear],['covCenter',m.covCenter],['covInner',m.covInner],['covOuter',m.covOuter],['tiltCorrectedDeg',m.tiltCorrectedDeg]];
      return (
        <div>
          <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">{label}</p>
          <div className="space-y-0.5">
            {rows.map(([k,v]) => (
              <div key={k} className="flex justify-between gap-2 text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono flex-shrink-0">{typeof v === 'number' ? v.toFixed(3) : String(v)}</span></div>
            ))}
          </div>
        </div>
      );
    }
    function DebugPanel({ p }) {
      const d = p.debug;
      if (!d) return null;
      return (
        <div className="space-y-4">
          <div className="grid grid-cols-1 gap-3">
            <DebugEyeBlock label="LEFT" m={d.left} />
            <DebugEyeBlock label="RIGHT" m={d.right} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">AGGREGATED</p>
            <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
              {Object.entries(d.aggregated).map(([k,v]) => (
                <div key={k} className="flex justify-between text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono">{typeof v === 'number' ? v.toFixed(3) : String(v)}</span></div>
              ))}
            </div>
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYE SHAPE — SCORES / DECISION</p>
            <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mb-1">
              {Object.entries(d.shapeScores).map(([k,v]) => (
                <div key={k} className="flex justify-between text-[9px]"><span className="text-textMuted">{k} score</span><span className="text-textSecondary font-mono">{v.toFixed(4)}</span></div>
              ))}
            </div>
            <p className="text-[9px] text-textSecondary">decision: <span className="text-cyan font-mono">{d.shapeDecision}</span> · margin: <span className="font-mono">{d.shapeMargin.toFixed(3)}</span> · rawTop: <span className="font-mono">{d.rawTopScore.toFixed(4)}</span></p>
            <DebugFactorBars factors={d.shapeConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYELID — DECISION</p>
            <p className="text-[9px] text-textSecondary">decision: <span className="text-cyan font-mono">{d.hoodingDecision}</span> · coverageIndex: <span className="font-mono">{d.aggregated.coverageIndex.toFixed(3)}</span> · heightCrossCheck: <span className="font-mono">{d.aggregated.heightCrossCheck.toFixed(3)}</span></p>
            <DebugFactorBars factors={d.hoodingConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYELID CREASE — PIXEL ANALYSIS</p>
            <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mb-1">
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L peak</span><span className="text-textSecondary font-mono">{d.crease.left.peak.toFixed(2)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R peak</span><span className="text-textSecondary font-mono">{d.crease.right.peak.toFixed(2)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L prominence</span><span className="text-textSecondary font-mono">{d.crease.left.prominence.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R prominence</span><span className="text-textSecondary font-mono">{d.crease.right.prominence.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L yFrac</span><span className="text-textSecondary font-mono">{d.crease.left.yFrac.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R yFrac</span><span className="text-textSecondary font-mono">{d.crease.right.yFrac.toFixed(3)}</span></div>

                </div>
                <p className="text-xs text-textSecondary">{t('insufficientData', lang)}</p>

              <div className="flex items-center gap-2 mb-4">

                <div><span className="text-textSecondary">{t('spacingLabel',lang)}:</span> <span className="font-medium text-textPrimary">{p.isCloseSet ? (lang==='en'?'Close':'Близкое') : p.isWideSet ? (lang==='en'?'Wide':'Широкое') : (lang==='en'?'Balanced':'Среднее')} ({(p.spacingConfidence*100).toFixed(0)}%)</span></div>
                <div><span className="text-textSecondary">{lang==='en'?'Rel. eye size':'Отн. размер глаз'}:</span> <span className="font-medium text-textPrimary">{(p.relativeEyeSize*100).toFixed(0)}%</span></div>

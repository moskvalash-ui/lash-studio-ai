    // Details, Lash Map and Application Plan cards.
    const PARAM_ICON_PATHS = {
      shape: 'M2.5 12c1.7-4 5-6.5 9.5-6.5s7.8 2.5 9.5 6.5c-1.7 4-5 6.5-9.5 6.5S4.2 16 2.5 12z|M12 14.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z',
      position: 'M4 15l5-6 4 3 7-8|M20 4h-4v4',
      size: 'M8 3v4M16 3v4M5 8h14a1 1 0 011 1v9a1 1 0 01-1 1H5a1 1 0 01-1-1V9a1 1 0 011-1z',
      symmetry: 'M12 3v18|M9 6L5 8v8l4 2|M15 6l4 2v8l-4 2',
      lid: 'M4 13c2-2.5 5-4 8-4s6 1.5 8 4|M4 13c2 2 5 3.5 8 3.5s6-1.5 8-3.5',
      iris: 'M12 3v3M12 18v3M3 12h3M18 12h3|circle:12,12,7|circle:12,12,2.6',
      curl: 'M4 18c0-6 4-11 11-11-3 0-6 2-6 6s3 5 6 5-2 4-6 4-5-1.5-5-4z',
      length: 'M4 12h13M13 7l4 5-4 5',
      density: 'M6 5v14M12 3v18M18 5v14',
      technique: 'M4 6h16M4 12h16M4 18h10',
      lashmap: 'M3 17c3-8 7-11 9-11s6 3 9 11|M6 9l1.5 3|M18 9l-1.5 3|M12 6v4',
      recommend: 'M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z',
      zoning: 'M4 5h16v14H4z|M4 12h16|M10 5v14',
      artist: 'M5 19l3.2-1 9-9-2.2-2.2-9 9L5 19z|M14.3 5.7l2.2 2.2',
      asymmetry: 'M12 3v18|M6 8l-2 4 2 4|M18 8l2 4-2 4',
    };
    function ParamIcon({ name, className }) {
      const spec = PARAM_ICON_PATHS[name] || PARAM_ICON_PATHS.shape;
      const parts = spec.split('|');
      return (
        <svg className={className || 'w-4 h-4 text-accent'} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          {parts.map((part, i) => part.startsWith('circle:') ? (
            <circle key={i} cx={part.split(':')[1].split(',')[0]} cy={part.split(':')[1].split(',')[1]} r={part.split(':')[1].split(',')[2]} />
          ) : (
            <path key={i} d={part} />
          ))}
        </svg>
      );
    }

    // Labels/values can legitimately be long ("Удлинённо-миндалевидная",
    // "Needs visual confirmation") — they wrap to a second line instead
    // of being cut off with an ellipsis, per the explicit requirement
    // that mobile UI never truncates these into "...".
    function EyeProfileRow({ icon, label, sublabel, value, confidence, valueDetail }) {
      return (
        <div className="flex justify-between items-start gap-3 py-3 border-b border-border/60 last:border-0">
          <div className="flex items-start gap-3 min-w-0 flex-1">
            <div className="w-8 h-8 rounded-md bg-white/[0.03] border border-border flex items-center justify-center flex-shrink-0 mt-0.5">
              <ParamIcon name={icon} className="w-4 h-4 text-accent" />
            </div>
            <div className="min-w-0">
              <p className="text-sm text-textPrimary leading-snug">{label}</p>
              {sublabel && <p className="text-[11px] text-textMuted leading-snug">{sublabel}</p>}
            </div>
          </div>
          <div className="flex flex-col items-end gap-1 flex-shrink-0 max-w-[42%] text-right">
            <span className="text-sm font-semibold text-cyan leading-snug">{value}</span>
            {/* Phase C3d: valueDetail (e.g. the Iris percentage
                breakdown) replaces the bare confidence% for the one row
                that supplies it, to avoid showing two numeric summaries
                stacked on top of each other -- every other row keeps
                its existing confidence% display, untouched. */}
            {valueDetail ? <span className="text-[10px] text-textMuted leading-snug">{valueDetail}</span>
              : typeof confidence === 'number' && <span className="text-[10px] text-textMuted">{Math.round(confidence*100)}%</span>}
          </div>
        </div>
      );
    }

    // Outer-corner tilt is reported as "needs confirmation" (rather than
    // a forced upturned/neutral/downturned guess) when its own computed
    // confidence is too low to trust — not when the value is simply
    // close to zero, since a small, consistently-measured tilt is a
    // real, valid "neutral" reading, not an uncertain one.
    const TILT_CONFIDENCE_FLOOR = 0.22;
    function eyeProfileLabels(p, iris, lang) {
      const shape = t('shape_' + p.eyeShapeCategory, lang);
      const tilt = p.tiltConfidence < TILT_CONFIDENCE_FLOOR ? t('tiltUncertain', lang)
        : p.tiltTendency === 'upturned' ? t('tiltUpturned', lang)
        : p.tiltTendency === 'downturned' ? t('tiltDownturned', lang)
        : t('tiltNeutral', lang);
      const hooding = p.eyelidCategory === 'pronounced' ? t('eyelidPronounced', lang)
        : p.eyelidCategory === 'moderate' ? t('eyelidModerate', lang)
        : p.eyelidCategory === 'mild' ? t('eyelidMild', lang)
        : p.eyelidCategory === 'open' ? t('eyelidOpen', lang)
        : t('eyelidUncertain', lang);
      // Raw crease-read label — always the true computed value, used
      // for the "most likely" note when the two eyelid signals
      // disagree. The DISPLAYED label (below) is suppressed to
      // "needs confirmation" in that case instead of showing a
      // confident diagnosis next to a contradicting one.
      const eyelidTypeRawLabel = p.eyelidType === 'openCrease' ? t('eyelidTypeOpenCrease', lang)
        : p.eyelidType === 'hooded' ? t('eyelidTypeHooded', lang)
        : p.eyelidType === 'monolid' ? t('eyelidTypeMonolid', lang)
        : t('eyelidTypeUncertain', lang);
      const eyelidTypeLabel = p.eyelidSignalsConflict ? t('eyelidTypeUncertain', lang) : eyelidTypeRawLabel;
      // ---- creaseState / hoodingState — see the PRODUCT SEMANTICS
      // SPLIT comment on classifyFeatures' own creaseState/hoodingState
      // computation. p.creaseState/p.hoodingState default to the
      // automatic classifyFeatures read; ReviewScreen confirmation
      // overwrites them on the confirmed profile the same way it
      // already overwrites eyelidType today.
      const creaseStateLabel = p.creaseState === 'visible' ? t('creaseStateVisible', lang)
        : p.creaseState === 'absent' ? t('creaseStateAbsent', lang)
        : t('creaseStateUncertain', lang);
      const hoodingStateLabel = p.hoodingState === 'hooded' ? t('hoodingOptionHooded', lang)
        : p.hoodingState === 'nonHooded' ? t('hoodingOptionNonHooded', lang)
        : t('hoodingStateUncertain', lang);
      const spacing = t('eyeSet_' + p.eyeSetCategory, lang);
      const eyeSize = t('eyeSize_' + p.eyeSizeCategory, lang);
      const symmetry = t('symmetry_' + p.symmetryCategory, lang);
      const irisName = iris?.name ? (lang==='en' ? IRIS_NAMES[iris.name].en : IRIS_NAMES[iris.name].ru) : t('insufficientData', lang);
      // Phase C3d: additive display fields, computed from iris's own
      // compositionLabel/colorComposition (see combineIrisColorComposition/
      // deriveIrisColorCompositionLabel) -- irisName above is kept
      // completely unchanged for any existing consumer.
      const irisCompositionLabel = iris?.compositionLabel ? (lang==='en' ? resolveIrisColorLabel(iris.compositionLabel).en : resolveIrisColorLabel(iris.compositionLabel).ru) : irisName;
      // Breakdown is suppressed whenever the underlying evidence is
      // uncertain -- showing e.g. "Карий 56% · Янтарный 40%" directly
      // under "Оттенок не определён" would contradict the very label it
      // sits beneath.
      const irisCompositionBreakdown = iris?.colorComposition && iris.compositionLabel !== 'uncertain'
        ? formatIrisColorCompositionBreakdown(iris.colorComposition).map(([family, pct]) => `${lang==='en' ? IRIS_FAMILY_NAMES[family].en : IRIS_FAMILY_NAMES[family].ru} ${pct}%`).join(' · ')
        : '';
      return { shape, tilt, hooding, eyelidTypeLabel, eyelidTypeRawLabel, creaseStateLabel, hoodingStateLabel, spacing, eyeSize, symmetry, irisName, irisCompositionLabel, irisCompositionBreakdown };
    }

    // ---- Eye Highlight ----
    // A short, positive, personalized line built ONLY from the real
    // classification result (dominant shape x corner direction, with an
    // asymmetry- or eyelid-aware variant) — never a fixed one-size-fits-
    // all sentence, never a numeric "attractiveness" score, never a
    // medical claim. Picks the most specific template it has real
    // evidence for; falls back to a generic-but-still-derived line when
    // shape/tilt are themselves uncertain.
    function generateEyeHighlight(c, lang) {
      const en = lang === 'en';
      const shape = c.eyeShapeCategory || 'uncertain';
      const tiltKnown = c.tiltConfidence >= TILT_CONFIDENCE_FLOOR;
      const tilt = tiltKnown ? c.tiltTendency : 'neutral';

      if (c.compositeAsymmetry > 0.09) {
        const asymBase = {
          almond: [en ? 'Your eyes have a naturally harmonious almond shape, with some individual left/right asymmetry — the artist can use it to personalize the design.' : 'У ваших глаз гармоничная миндалевидная форма с небольшой индивидуальной асимметрией левого и правого глаза — мастер может использовать эту особенность при персонализации схемы.'],
          round: [en ? 'Your round, open eyes carry a touch of natural left/right individuality — the artist can use it to fine-tune the balance of the design.' : 'У округлых, открытых глаз есть небольшая природная индивидуальность левого и правого глаза — мастер может использовать её для тонкой балансировки схемы.'],
          elongatedAlmond: [en ? 'Your elongated almond eyes show a bit of natural left/right individuality — the artist can use it to fine-tune peak position on each side.' : 'У вытянуто-миндалевидных глаз есть небольшая природная индивидуальность левого и правого глаза — мастер может использовать её для точной настройки положения пика с каждой стороны.'],
          narrow: [en ? 'Your eyes have a delicate, narrow opening with some natural left/right individuality — the artist can factor that into a balanced design.' : 'У глаз деликатное, узкое раскрытие с небольшой природной индивидуальностью левого и правого — мастер может учесть это в сбалансированной схеме.'],
        };
        return (asymBase[shape] || [en ? 'There’s a natural, individual asymmetry between your eyes — the artist can use it to personalize the lash design.' : 'У глаз есть естественная индивидуальная асимметрия — мастер может использовать её при персонализации схемы.'])[0];
      }

      const key = shape + '_' + tilt;
      const templates = {
        almond_upturned: [en ? 'Your almond eye shape pairs with a natural upward lift at the outer corner — an expressive combination the lash design can beautifully echo.' : 'Миндалевидная форма глаз сочетается с естественным подъёмом внешнего уголка — эту выразительную особенность легко красиво подчеркнуть направлением схемы.'],
        almond_neutral: [en ? 'Your eyes have a very harmonious almond shape — it supports both natural and more expressive lash designs equally well.' : 'У ваших глаз очень гармоничная миндалевидная форма. Она хорошо поддерживает как натуральные, так и более выразительные схемы наращивания.'],
        almond_downturned: [en ? 'Your almond eyes have a soft, gentle outer corner — a design with a lift toward the outer third can add an elegant accent.' : 'Миндалевидные глаза с мягким, спокойным внешним уголком — схема с акцентом на подъём во внешней трети добавит элегантный штрих.'],
        round_upturned: [en ? 'Your round eyes have a naturally lifted outer corner, giving the gaze an open, lively character.' : 'Округлые глаза с естественно приподнятым внешним уголком — взгляд от природы открытый и живой.'],
        round_neutral: [en ? 'Your eyes have a soft, round shape with a naturally wide-open look — a great base for a design that adds gentle elongation.' : 'У глаз мягкая округлая форма с естественно широким взглядом — отличная основа для схемы с лёгким визуальным удлинением.'],
        round_downturned: [en ? 'Your round eyes have a gentle, relaxed outer corner — a subtle lift in the design can add a soft lifted accent.' : 'Округлые глаза со спокойным, мягким внешним уголком — лёгкий подъём в схеме добавит деликатный акцент.'],
        elongatedAlmond_upturned: [en ? 'Your elongated almond eyes with a naturally upturned corner give the gaze a striking, feline elegance.' : 'Вытянуто-миндалевидные глаза с естественно приподнятым уголком придают взгляду выразительную, кошачью элегантность.'],
        elongatedAlmond_neutral: [en ? 'Your eyes have a beautifully elongated almond shape with balanced proportions — a very versatile, editorial-looking base.' : 'У ваших глаз красивая вытянуто-миндалевидная форма со сбалансированными пропорциями — универсальная, эффектная основа для самых разных схем.'],
        elongatedAlmond_downturned: [en ? 'Your elongated almond eyes have a softly dropped outer corner — a design with lift toward the temple can beautifully balance the look.' : 'Вытянуто-миндалевидные глаза с мягко опущенным внешним уголком — схема с подъёмом к виску красиво сбалансирует взгляд.'],
        narrow_upturned: [en ? 'Your eyes have a delicate, narrow opening with a natural lift at the outer corner — a refined, elongating design can beautifully open the gaze.' : 'У глаз деликатное, узкое раскрытие с естественным подъёмом внешнего уголка — деликатная удлиняющая схема красиво откроет взгляд.'],
        narrow_neutral: [en ? 'Your eyes have a delicate, narrow opening — a design that gently opens the eye along the center can add expressive volume.' : 'У глаз деликатное, узкое раскрытие — схема с мягким акцентом в центре добавит выразительный объём.'],
        narrow_downturned: [en ? 'Your eyes have a delicate, narrow opening with a gentle downward corner — a soft outer lift can add a subtle opening effect.' : 'У глаз деликатное, узкое раскрытие с мягким опущенным уголком — лёгкий подъём во внешней зоне добавит эффект визуального открытия.'],
        uncertain_upturned: [en ? 'Your eyes have a naturally lifted outer corner — a distinctive feature the design can play up.' : 'У глаз естественно приподнятый внешний уголок — эту особенность можно красиво обыграть в схеме.'],
        uncertain_neutral: [en ? 'Your eyes have balanced, harmonious proportions that work well with a wide range of lash designs.' : 'У ваших глаз сбалансированные, гармоничные пропорции — они хорошо сочетаются с самыми разными схемами наращивания.'],
        uncertain_downturned: [en ? 'Your eyes have a soft, relaxed outer corner — a gentle lift in the design can add a lovely lifted accent.' : 'У глаз мягкий, спокойный внешний уголок — лёгкий подъём в схеме добавит красивый акцент.'],
      };
      let line = (templates[key] || templates.uncertain_neutral)[0];

      // Hooding removed as a recommendation input (product decision:
      // hooding is no longer a trusted parameter) — the hoodingState-
      // gated addendum that used to sit here is deleted, not replaced.
      // eyeSizeCategory below is intentionally UNTOUCHED: eye size stays
      // hidden from the artist as a raw UI row, but this phase does not
      // remove it from recommendation/advisory logic.
      if (c.eyeSizeCategory === 'large' && c.eyeSizeConfidence > 0.45) {
        line += en ? ' Their proportion relative to the face is naturally striking.' : ' Их пропорция относительно лица от природы выразительна.';
      } else if (c.eyeSizeCategory === 'small' && c.eyeSizeConfidence > 0.45) {
        line += en ? ' A design with a soft central peak can add extra openness to the gaze.' : ' Схема с мягким центральным пиком добавит взгляду дополнительную открытость.';
      }
      return line;
    }

    // Static biometric mesh drawn once over the captured result photo
    // — a visual echo of the same real facial-surface-mesh system
    // used live in Scan, built from the SAME landmarks the analysis
    // actually used (result.landmarks). Purely presentational: no
    // lash rendering, no re-analysis, nothing fed back into scoring.
    // PHYSICAL EYE NORMALIZATION — deliberately exempt. This draws the
    // purely-visual buildFaceMesh face outline over the captured/
    // reviewed photo; it asserts no L/R label or semantic claim.
    // meshEdgeList/meshTriangleList have ~15 hardcoded joins that
    // assume face-api's raw, image-side eye/brow ordering (see the
    // getPhysicalEyeLandmarks doc comment) — feeding it normalized
    // points would require rewriting that topology for zero semantic
    // benefit, so raw getLeftEye()/getRightEye()/getLeftEyeBrow()/
    // getRightEyeBrow() calls stay here intentionally, unchanged.
    function ResultMeshOverlay({ landmarks, imageWidth, imageHeight }) {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      useEffect(() => {
        if (!landmarks || !imageWidth || !imageHeight) return;
        const canvas = canvasRef.current, container = containerRef.current;
        if (!canvas || !container) return;
        const draw = () => {
          const rect = container.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
          canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          const map = (p) => mapVideoPointToDisplay(p.x, p.y, imageWidth, imageHeight, w, h);
          const d = {
            jaw: landmarks.getJawOutline().map(map),
            leftBrow: landmarks.getLeftEyeBrow().map(map),
            rightBrow: landmarks.getRightEyeBrow().map(map),
            nose: landmarks.getNose().map(map),
            leftEye: landmarks.getLeftEye().map(map),
            rightEye: landmarks.getRightEye().map(map),
            mouth: landmarks.getMouth().slice(0, 12).map(map),
          };
          const mesh = buildFaceMesh(d);
          if (!mesh) return;
          const xs = d.jaw.map(pt=>pt.x), ys = d.jaw.map(pt=>pt.y).concat(mesh.f2.map(pt=>pt.y));
          const boxCenter = { x: (Math.min(...xs)+Math.max(...xs))/2, y: (Math.min(...ys)+Math.max(...ys))/2 };
          const faceHalfW = Math.max(1, (Math.max(...xs)-Math.min(...xs))/2);
          drawFaceMeshV3(ctx, mesh, { revealMode: false, wavefrontY: 0, beamY: -9999, presence: 0.95, boxCenter, faceHalfW });
        };
        draw();
        window.addEventListener('resize', draw);
        return () => window.removeEventListener('resize', draw);
      }, [landmarks, imageWidth, imageHeight]);
      return (
        <div ref={containerRef} className="absolute inset-0 pointer-events-none">
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />
        </div>
      );
    }

    function MatchBar({ score }) {
      const filled = Math.round(clamp01(score/100) * 8);
      return (
        <div className="flex gap-[3px]" aria-hidden="true">
          {Array.from({length: 8}, (_,i) => (
            <span key={i} className={`w-[9px] h-[3px] rounded-full ${i < filled ? 'bg-accent' : 'bg-white/10'}`}></span>
          ))}
        </div>
      );
    }

    // IRIS COLOR — DEBUG-ONLY Copy button, ResultsScreen (HeroScreen).
    // Exposes the EXACT irisColorAudit produced during the real scan —
    // result.irisColorAudit was attached to rec by LiveScanScreen/
    // PhotoAnalysisScreen (debug-only, see their own comments) and
    // survives ReviewScreen's confirm() unchanged (that function
    // spreads ...result before overriding only eyeProfile/designs/
    // originalAIProfile/artistConfirmed). This component computes
    // nothing and re-samples nothing — it only reads result.irisColorAudit/
    // result.iris (both already real, already computed) and formats
    // them for clipboard. Rendered only when isDebugModeEnabled().
    function CopyIrisDebugButton({ result, lang }) {
      const [state, setState] = useState('idle'); // idle | copied | unavailable | error
      const copy = () => {
        const audit = result.irisColorAudit;
        if (!audit) {
          setState('unavailable');
          setTimeout(() => setState('idle'), 3000);
          return;
        }
        const payload = {
          irisColorAudit: audit,
          productionResult: {
            irisColor: result.iris ? result.iris.name : null,
            irisConfidence: result.iris ? result.iris.confidence : null,
          },
        };
        try {
          const text = JSON.stringify(payload, null, 2);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(() => { setState('copied'); setTimeout(() => setState('idle'), 1500); })
              .catch(() => { setState('error'); setTimeout(() => setState('idle'), 3000); });
          } else {
            setState('error'); setTimeout(() => setState('idle'), 3000);
          }
        } catch (e) {
          setState('error'); setTimeout(() => setState('idle'), 3000);
        }
      };
      return (
        <div className="px-4 pt-3">
          <button onClick={copy} className="w-full py-2.5 rounded-md text-[11px] font-semibold uppercase tracking-wide border border-pink-400/40 bg-pink-500/10 text-pink-200 press-scale">
            {state === 'copied' ? t('copyIrisDebugJsonCopied', lang) : t('copyIrisDebugJson', lang)}
          </button>
          {state === 'unavailable' && <p className="text-[10px] text-amber-300 mt-1 leading-snug">{t('copyIrisDebugJsonUnavailable', lang)}</p>}
          {state === 'error' && <p className="text-[10px] text-red-300 mt-1 leading-snug">{t('copyIrisDebugJsonError', lang)}</p>}
        </div>
      );
    }

    function HeroScreen({ result, naturalLashProfile, onViewMap, onDetails, onAllDesigns, onScanLashes, onViewLashProfile, onBack, onSaveToClient }) {
      const lang = useLang();
      const p = result.eyeProfile;
      const labels = eyeProfileLabels(p, result.iris, lang);
      const correctionOpportunity = generateLashCorrectionOpportunity(p, lang);
      const lashConsiderations = generateLashDesignConsiderations(result, lang);

      return (
        <div className="h-full flex flex-col overflow-y-auto hide-scrollbar fade-in">
          <div className="p-4 flex justify-between items-center sticky top-0 z-10 glass-strong">
            <BackButton onBack={onBack} />
            <div className="flex flex-col items-center">
              <span className="text-[10px] font-semibold tracking-[0.16em] uppercase text-textPrimary">LASH STUDIO <span className="text-accent">AI</span></span>
              <span className="text-[10px] text-textMuted uppercase tracking-widest">{t('resultTitle', lang)}</span>
            </div>
            <div className="w-10"></div>
          </div>
          {isDebugModeEnabled() && <CopyIrisDebugButton result={result} lang={lang} />}
          {onSaveToClient && (
            <div className="px-4 pt-3">
              <button onClick={onSaveToClient} className="w-full py-2.5 rounded-md border border-border bg-white/[0.02] text-textSecondary text-[12px] font-semibold uppercase tracking-wide press-scale flex items-center justify-center gap-2">
                <ClientsIcon className="w-3.5 h-3.5" />
                {t('saveToClientButton', lang)}
              </button>
            </div>
          )}
          <div className="px-4 pb-6">
            <div className="relative rounded-lg overflow-hidden aspect-[4/5] mb-6 border border-border mt-4">
              <img src={result.originalImage} className="w-full h-full object-cover" alt="client" />
              <ResultMeshOverlay landmarks={result.landmarks} imageWidth={result.imageWidth} imageHeight={result.imageHeight} />
              <div className="absolute inset-0 bg-gradient-to-t from-bg via-bg/10 to-transparent"></div>
              <div className="absolute top-4 left-4 px-3 py-1 rounded-md bg-bg/60 border border-border backdrop-blur">
                <span className="text-[10px] font-semibold tracking-wider text-textPrimary uppercase">{result.source==='photo' ? t('photoSource', lang) : t('liveSource', lang)}</span>
              </div>
              <div className="absolute bottom-0 left-0 right-0 p-6">
                <p className="label-tech mb-1">{t('eyeProfileTitle', lang)}</p>
                <h2 className="text-2xl font-bold text-textPrimary text-glow">{labels.shape}</h2>
              </div>
              {typeof result.confidence === 'number' && (
                <div className={`absolute top-4 right-4 px-3 py-1 rounded-md border backdrop-blur ${result.confidence >= 0.6 ? 'bg-bg/60 border-cyan/30' : 'bg-bg/60 border-peak/30'}`}>
                  <span className={`text-xs font-medium ${result.confidence >= 0.6 ? 'text-cyan' : 'text-peak'}`}>{t('analysisConfidence', lang)} {(result.confidence*100).toFixed(0)}%</span>
                </div>
              )}
            </div>
            {p.singleFrame && (
              <div className="glass rounded-md p-3 mb-4">
                <p className="text-xs text-textSecondary">{t('singleFrameNote', lang)}</p>
              </div>
            )}

            <Section title={t('eyeProfileTitle', lang)} defaultOpen>
              {/* UI DISPLAY SCOPE — Results screen shows only the
                  professionally useful parameters (shape, spacing, tilt,
                  symmetry, iris color); crease/hooding/eye-size rows and
                  every row's secondary gray sub-label caption are hidden
                  here on purpose. This is a display-only change: nothing
                  is removed from eyeProfileLabels/classifyFeatures/
                  ReviewScreen/DetailsScreen — every underlying value
                  (labels.creaseStateLabel, labels.hoodingStateLabel,
                  labels.eyeSize, p.eyelidSignalsConflict, all *SubLabel
                  strings) still exists and is still computed exactly as
                  before; it's simply not rendered on this screen. */}

              <div className="mb-6">
                <p className="label-tech mb-2">{t('densityLabel', lang)}</p>
                <div className="flex gap-2">
                  {['light','medium','full'].map(dOpt => (

              <Section title={t('applicationPlanTitle', lang)} defaultOpen>

                  {plan.spikePlan && (

                    <PlanSection num={String(planNum.next()).padStart(2,'0')} icon="iris" title={t('lashObservationsTitle', lang)}>

    // Renders one confidence-factor breakdown ({measurementAgreement,
    // landmarkStability, imageQuality, lrAgreement, poseQuality}) as
    // small labeled bars — the same five factors computeConfidence()
    // actually multiplied together, so it's possible to see WHY a
    // number came out the way it did instead of just trusting it.
    function DebugFactorBars({ factors }) {
      if (!factors) return null;
      return (
        <div className="grid grid-cols-1 gap-1 mt-1">
          {Object.entries(factors).map(([k,v]) => (
            <div key={k} className="flex items-center gap-2">
              <span className="text-[9px] text-textMuted w-28 flex-shrink-0">{k}</span>
              <div className="flex-1 h-1 bg-surface rounded-full overflow-hidden"><div className="h-full bg-cyan" style={{width:`${(v*100).toFixed(0)}%`}}></div></div>
              <span className="text-[9px] text-textMuted w-8 text-right">{(v*100).toFixed(0)}%</span>
            </div>
          ))}
        </div>
      );
    }
    function DebugEyeBlock({ label, m }) {
      if (!m) return null;
      const rows = [['whRatio',m.whRatio],['avgTaperDeg',m.avgTaperDeg],['innerTaperDeg',m.innerTaperDeg],['outerTaperDeg',m.outerTaperDeg],['apertureAsymmetry',m.apertureAsymmetry],['ear',m.ear],['covCenter',m.covCenter],['covInner',m.covInner],['covOuter',m.covOuter],['tiltCorrectedDeg',m.tiltCorrectedDeg]];
      return (
        <div>
          <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">{label}</p>
          <div className="space-y-0.5">
            {rows.map(([k,v]) => (
              <div key={k} className="flex justify-between gap-2 text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono flex-shrink-0">{typeof v === 'number' ? v.toFixed(3) : String(v)}</span></div>
            ))}
          </div>
        </div>
      );
    }
    function DebugPanel({ p }) {
      const d = p.debug;
      if (!d) return null;
      return (
        <div className="space-y-4">
          <div className="grid grid-cols-1 gap-3">
            <DebugEyeBlock label="LEFT" m={d.left} />
            <DebugEyeBlock label="RIGHT" m={d.right} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">AGGREGATED</p>
            <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
              {Object.entries(d.aggregated).map(([k,v]) => (
                <div key={k} className="flex justify-between text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono">{typeof v === 'number' ? v.toFixed(3) : String(v)}</span></div>
              ))}
            </div>
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYE SHAPE — SCORES / DECISION</p>
            <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mb-1">
              {Object.entries(d.shapeScores).map(([k,v]) => (
                <div key={k} className="flex justify-between text-[9px]"><span className="text-textMuted">{k} score</span><span className="text-textSecondary font-mono">{v.toFixed(4)}</span></div>
              ))}
            </div>
            <p className="text-[9px] text-textSecondary">decision: <span className="text-cyan font-mono">{d.shapeDecision}</span> · margin: <span className="font-mono">{d.shapeMargin.toFixed(3)}</span> · rawTop: <span className="font-mono">{d.rawTopScore.toFixed(4)}</span></p>
            <DebugFactorBars factors={d.shapeConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYELID — DECISION</p>
            <p className="text-[9px] text-textSecondary">decision: <span className="text-cyan font-mono">{d.hoodingDecision}</span> · coverageIndex: <span className="font-mono">{d.aggregated.coverageIndex.toFixed(3)}</span> · heightCrossCheck: <span className="font-mono">{d.aggregated.heightCrossCheck.toFixed(3)}</span></p>
            <DebugFactorBars factors={d.hoodingConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYELID CREASE — PIXEL ANALYSIS</p>
            <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mb-1">
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L peak</span><span className="text-textSecondary font-mono">{d.crease.left.peak.toFixed(2)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R peak</span><span className="text-textSecondary font-mono">{d.crease.right.peak.toFixed(2)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L prominence</span><span className="text-textSecondary font-mono">{d.crease.left.prominence.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R prominence</span><span className="text-textSecondary font-mono">{d.crease.right.prominence.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L yFrac</span><span className="text-textSecondary font-mono">{d.crease.left.yFrac.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R yFrac</span><span className="text-textSecondary font-mono">{d.crease.right.yFrac.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">L readQuality</span><span className="text-textSecondary font-mono">{d.crease.left.readQuality.toFixed(3)}</span></div>
              <div className="flex justify-between text-[9px]"><span className="text-textMuted">R readQuality</span><span className="text-textSecondary font-mono">{d.crease.right.readQuality.toFixed(3)}</span></div>
            </div>
            <p className="text-[9px] text-textSecondary">decision: <span className="text-cyan font-mono">{d.eyelidTypeDecision}</span> · readable: <span className="font-mono">{String(d.crease.readable)}</span> · foldDetected: <span className="font-mono">{String(d.crease.foldDetected)}</span></p>
            <DebugFactorBars factors={d.eyelidTypeConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">OUTER CORNER — CONFIDENCE</p>
            <DebugFactorBars factors={d.tiltConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">EYE SET — CONFIDENCE</p>
            <DebugFactorBars factors={d.spacingConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">SYMMETRY — CONFIDENCE</p>
            <DebugFactorBars factors={d.symmetryConfidenceFactors} />
          </div>
          <div>
            <p className="text-[10px] font-semibold text-accent uppercase tracking-wider mb-1">CAPTURE</p>
            <p className="text-[9px] text-textSecondary">imageQuality: <span className="font-mono">{d.imageQuality.toFixed(3)}</span> · poseQuality: <span className="font-mono">{d.poseQuality.toFixed(3)}</span> · singleFrame: <span className="font-mono">{String(d.singleFrame)}</span></p>
          </div>
          <div>
            <p className="text-[10px] font-semibold text-peak uppercase tracking-wider mb-1">NOT RELIABLY MEASURABLE WITH THIS LANDMARK MODEL</p>
            <ul className="list-disc list-inside text-[9px] text-textSecondary space-y-0.5">
              {d.notReliablyMeasurable.map((s,i) => <li key={i}>{s}</li>)}
            </ul>
          </div>
        </div>
      );
    }

    function DetailsScreen({ result, onBack }) {
      const lang = useLang();
      const [showDebug, setShowDebug] = useState(false);
      const debugAvailable = isDebugModeEnabled();
      const p = result.eyeProfile;
      const iris = result.iris || {};
      const irisName = iris.name ? (lang==='en'?IRIS_NAMES[iris.name].en:IRIS_NAMES[iris.name].ru) : null;
      // Phase C3d: additive display fields (see eyeProfileLabels' identical pattern).
      const irisCompositionLabel = iris.compositionLabel ? (lang==='en' ? resolveIrisColorLabel(iris.compositionLabel).en : resolveIrisColorLabel(iris.compositionLabel).ru) : irisName;
      const irisCompositionBreakdown = iris.colorComposition && iris.compositionLabel !== 'uncertain'
        ? formatIrisColorCompositionBreakdown(iris.colorComposition).map(([family, pct]) => `${lang==='en' ? IRIS_FAMILY_NAMES[family].en : IRIS_FAMILY_NAMES[family].ru} ${pct}%`).join(' · ')
        : '';
      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <span className="text-sm font-medium text-textPrimary">{t('detailsTitle', lang)}</span>
            <div className="w-10"></div>
          </div>
          <div className="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4">
            <div className="glass rounded-lg p-4 flex justify-between items-center">
              <span className="label-tech">{t('analysisConfidence', lang)}</span>
              <span className="text-sm font-semibold text-cyan">{typeof result.confidence === 'number' ? (result.confidence*100).toFixed(0) + '%' : '—'}</span>
            </div>

            <div className="glass rounded-lg p-5">
              <div className="flex items-center gap-2 mb-4">
                <ParamIcon name="shape" className="w-4 h-4 text-accent" />
                <h3 className="label-tech">{t('shapeLabel', lang)}</h3>
              </div>
              <div className="space-y-2">
                {Object.entries(p.shapeTendencies).sort((a,b)=>b[1]-a[1]).map(([k,v]) => (
                  <div key={k} className="flex items-center gap-3">
                    <span className="text-xs w-24 capitalize text-textSecondary">{k === 'round' ? (lang==='en'?'Round':'Округлая') : k === 'almond' ? (lang==='en'?'Almond':'Миндалевидная') : (lang==='en'?'Elongated':'Вытянутая')}</span>
                    <div className="flex-1 h-1.5 bg-surface rounded-full overflow-hidden"><div className="h-full bg-accent" style={{width: `${(v*100).toFixed(0)}%`}}></div></div>
                    <span className="text-xs w-9 text-right text-textMuted">{(v*100).toFixed(0)}%</span>
                  </div>
                ))}
              </div>
            </div>

            {/* DISPLAY-ONLY product decision: crease-type and hooding
                cards removed from this screen. p.creaseState/
                p.eyelidTypeConfidence/p.hoodingState/p.hoodedConfidence
                are untouched and still fully computed — see
                eyeProfileLabels/classifyFeatures and ReviewScreen's
                confirm() — simply no longer shown to the artist here. */}
            <div className="glass rounded-lg p-5">
              <div className="flex items-center gap-2 mb-4">
                <ParamIcon name="size" className="w-4 h-4 text-accent" />
                <h3 className="label-tech">{t('depthLabel', lang)}</h3>
              </div>
              <p className="text-sm text-textSecondary leading-relaxed">{t('depthDisclaimer', lang)}</p>
            </div>

            {p.compositeAsymmetry > 0.05 && (
              <div className="glass rounded-lg p-5">
                <div className="flex items-center gap-2 mb-4">
                  <ParamIcon name="asymmetry" className="w-4 h-4 text-accent" />
                  <h3 className="label-tech">{lang==='en'?'L/R Asymmetry':'Асимметрия L/R'}</h3>
                </div>
                <div className="grid grid-cols-2 gap-y-2 text-xs">
                  <span className="text-textSecondary">{lang==='en'?'Width':'Ширина'}</span><span className="text-right text-textPrimary">{(p.asymmetryBreakdown.width*100).toFixed(1)}%</span>
                  <span className="text-textSecondary">{lang==='en'?'Height':'Высота'}</span><span className="text-right text-textPrimary">{(p.asymmetryBreakdown.height*100).toFixed(1)}%</span>
                  <span className="text-textSecondary">{lang==='en'?'Corner angle':'Угол уголков'}</span><span className="text-right text-textPrimary">{p.asymmetryBreakdown.tilt.toFixed(1)}°</span>
                  <span className="text-textSecondary">{lang==='en'?'Openness':'Раскрытие глаз'}</span><span className="text-right text-textPrimary">{(p.asymmetryBreakdown.openness*100).toFixed(1)}%</span>
                  <span className="text-textSecondary">{lang==='en'?'Lid visibility':'Видимость века'}</span><span className="text-right text-textPrimary">{(p.asymmetryBreakdown.hooding*100).toFixed(1)}%</span>
                  <span className="text-textSecondary">{lang==='en'?'Vertical position':'Верт. позиция'}</span><span className="text-right text-textPrimary">{(p.asymmetryBreakdown.vertical*100).toFixed(1)}%</span>
                </div>
              </div>
            )}

            {iris.hex && (
              <div className="glass rounded-lg p-5">

    // ============================================================
    // NLS2 VALIDATION DIAGNOSTIC — temporary real-iPhone validation
    // build for the Natural Lash Scan measurement layer. Everything
    // in this block is debug-only (?debug=1), purely additive, reads
    // already-computed values off `obs`/`comparison`/NLS2_THRESHOLDS
    // and does not alter any measurement value. Remove this whole
    // block (down to the closing "END NLS2 VALIDATION DIAGNOSTIC"
    // marker) once real-device validation is complete.
    // ============================================================
    function nls2TriLabel(v) { return v === true ? 'TRUE' : v === false ? 'FALSE' : 'UNKNOWN'; }
    function nls2Num(v, d) { return (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(d == null ? 3 : d); }
    function nls2Row(label, value) {
      return (
        <div className="flex justify-between text-[9px] gap-2">
          <span className="text-textMuted">{label}</span>
          <span className="text-lime-300 font-mono text-right break-all">{value}</span>
        </div>
      );
    }
    function Nls2SectionLabel({ children }) {
      return <p className="text-[10px] font-semibold text-cyan-300 uppercase tracking-wider mt-3 mb-1 first:mt-0">{children}</p>;
    }

    function Nls2EyeValidationBlock({ label, obs, meta }) {
      if (!obs || !obs.hasData) {
        return (
          <div>
            <Nls2SectionLabel>{label}</Nls2SectionLabel>
            <p className="text-[9px] text-textMuted">no data</p>
          </div>
        );
      }
      const zoneNames = (typeof LASH_ZONE_NAMES !== 'undefined') ? LASH_ZONE_NAMES : ['inner', 'center', 'outer'];
      const diag = obs.diagnostics || {};
      return (
        <div>
          <Nls2SectionLabel>{label} — scan-level (debug diagnostics, NOT lash count)</Nls2SectionLabel>
          <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
            {nls2Row('overall confidence', nls2Num(obs.confidence, 2))}
            {nls2Row('quality level', obs.qualityLevel || '—')}
            {nls2Row('roi w×h (px)', meta ? `${nls2Num(meta.roiW,1)}×${nls2Num(meta.roiH,1)}` : '—')}
            {nls2Row('effective eye width (px)', meta ? nls2Num(meta.effectiveEyeWidthPx, 1) : '—')}
            {nls2Row('accepted frames', meta ? meta.framesAccepted : obs.framesUsed)}
            {nls2Row('frame consistency', meta ? nls2Num(meta.frameConsistency, 2) : '—')}
            {nls2Row('candidate structures (diagnostic, NOT lash count)', `${diag.candidateClusterCount ?? '—'} (${diag.candidateClusterCountLow ?? '—'}–${diag.candidateClusterCountHigh ?? '—'})`)}
          </div>

          <Nls2SectionLabel>{label} — per-zone</Nls2SectionLabel>
          {zoneNames.map((zn) => {
            const z = obs.zones ? obs.zones[zn] : null;
            if (!z) return null;
            return (
              <div key={zn} className="mb-1.5 pb-1.5 border-b border-white/10 last:border-0">
                <p className="text-[9px] text-cyan-200 uppercase">{zn}</p>
                <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
                  {nls2Row('occupancy raw', nls2Num(z.occupancy, 3))}
                  {nls2Row('occupancy level', z.occupancyLevel)}
                  {nls2Row('zone confidence', nls2Num(z.confidence, 2))}
                  {nls2Row('sparseArea', nls2TriLabel(z.sparseArea))}
                  {nls2Row('visibleLengthRatio', nls2Num(z.visibleLengthRatio, 3))}
                  {nls2Row('visibleLengthLevel', z.visibleLengthLevel)}
                  {nls2Row('apparentDirection (HINT ONLY)', z.direction)}
                </div>
              </div>
            );
          })}

          <Nls2SectionLabel>{label} — NLS-2 condition</Nls2SectionLabel>
          {obs.condition && (
            <>
              <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 mb-1.5">
                {nls2Row('occupancyUniformity.level', obs.condition.occupancyUniformity.level)}
                {nls2Row('occupancyUniformity.spread', nls2Num(obs.condition.occupancyUniformity.spread, 4))}
                {nls2Row('occupancyUniformity.confidence', nls2Num(obs.condition.occupancyUniformity.confidence, 2))}
                {nls2Row('visibleLengthUniformity.level', obs.condition.visibleLengthUniformity.level)}
                {nls2Row('visibleLengthUniformity.dispersion', nls2Num(obs.condition.visibleLengthUniformity.dispersion, 4))}
                {nls2Row('visibleLengthUniformity.confidence', nls2Num(obs.condition.visibleLengthUniformity.confidence, 2))}
              </div>
              {zoneNames.map((zn) => {
                const c = obs.condition.zones ? obs.condition.zones[zn] : null;
                if (!c) return null;
                return (
                  <div key={zn} className="mb-1.5 pb-1.5 border-b border-white/10 last:border-0">
                    <p className="text-[9px] text-cyan-200 uppercase">{zn} condition</p>
                    <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
                      {nls2Row('locallyReducedOccupancy', nls2TriLabel(c.locallyReducedOccupancy))}
                      {nls2Row('relativeOccupancyReduction', nls2Num(c.relativeOccupancyReduction, 4))}
                      {nls2Row('shortLashConcentration', nls2TriLabel(c.shortLashConcentration))}
                      {nls2Row('shortCandidateFraction', nls2Num(c.shortCandidateFraction, 3))}
                      {nls2Row('withinZoneLengthIrregular', nls2TriLabel(c.withinZoneLengthIrregular))}
                      {nls2Row('visibleIrregularArea', nls2TriLabel(c.visibleIrregularArea))}
                      {nls2Row('condition confidence', nls2Num(c.confidence, 2))}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      );
    }

    // Status classification for L/R comparison fields — best-effort
    // mapping onto the three states the validation spec asks for.
    // `raw`===0 cannot be told apart from "genuinely zero difference"
    // vs "inside dead zone" from the comparison object alone, so a
    // rank/diff of exactly 0 is reported as IGNORED INSIDE DEAD ZONE
    // (both read the same to a lash artist: "not a meaningful diff").
    function nls2CompareStatus(raw) {
      if (raw === null || raw === undefined) return 'UNAVAILABLE DUE TO CONFIDENCE';
      if (Array.isArray(raw)) return raw.length > 0 ? 'ACCEPTED AS MEANINGFUL' : 'IGNORED INSIDE DEAD ZONE / NO DIFFERENCE';
      return raw !== 0 ? 'ACCEPTED AS MEANINGFUL' : 'IGNORED INSIDE DEAD ZONE';
    }
    function nls2CompareValueText(raw) {
      if (raw === null || raw === undefined) return '—';
      if (Array.isArray(raw)) return raw.length ? raw.map(x => `${x.zone}:${x.side}`).join(', ') : '(none)';
      return String(raw);
    }

    function Nls2ComparisonBlock({ comparison }) {
      if (!comparison) return null;
      if (!comparison.hasComparison) {
        return (
          <div>
            <Nls2SectionLabel>L/R comparison</Nls2SectionLabel>
            <p className="text-[9px] text-textMuted">UNAVAILABLE (one or both eyes missing data)</p>
          </div>
        );
      }
      const cc = comparison.conditionComparison || {};
      const fields = [
        ['overall occupancyDiff', comparison.occupancyDiff],
        ['occupancy dead zone', comparison.occupancyDeadZone],
        ['occupancyUniformityDiff', cc.occupancyUniformityDiff],
        ['lengthUniformityDiff', cc.lengthUniformityDiff],
        ['reducedOccupancyDiff (per zone)', cc.reducedOccupancyDiff],
        ['irregularAreaDiff (per zone)', cc.irregularAreaDiff],
      ];
      return (
        <div>
          <Nls2SectionLabel>L/R comparison</Nls2SectionLabel>
          <div className="space-y-1">
            {fields.map(([label, raw]) => (
              <div key={label} className="text-[9px]">
                <div className="flex justify-between gap-2">
                  <span className="text-textMuted">{label}</span>
                  <span className="text-lime-300 font-mono text-right break-all">{nls2CompareValueText(raw)}</span>
                </div>
                {label !== 'occupancy dead zone' && (
                  <div className="text-right text-cyan-300">{nls2CompareStatus(raw)}</div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Nls2ThresholdsBlock() {
      const t = (typeof NLS2_THRESHOLDS !== 'undefined') ? NLS2_THRESHOLDS : null;
      if (!t) return null;
      return (
        <div>
          <Nls2SectionLabel>Current empirical thresholds (display-only, not editable)</Nls2SectionLabel>
          <div className="grid grid-cols-2 gap-x-3 gap-y-0.5">
            {Object.entries(t).map(([k, v]) => (
              <div key={k} className="flex justify-between text-[9px]"><span className="text-textMuted">{k}</span><span className="text-textSecondary font-mono">{typeof v === 'number' ? v : String(v)}</span></div>
            ))}
          </div>
        </div>
      );
    }

    function Nls2ChecklistBlock() {
      const items = [
        ['Test A — normal/even base', 'Expect: no random sparse flags, stable uniformity, no irregular-area false positives.'],
        ['Test B — visibly sparser zone', 'Expect: correct zone identified, reduced occupancy appears for that zone.'],
        ['Test C — visibly shorter/irregular zone', 'Expect: length difference / short-concentration response, no biological interpretation shown anywhere.'],
        ['Test D — repeat scan, same eye', 'Expect: reasonably repeating results; small variation absorbed by dead zones (not flagged as a change).'],
        ['Test E — intentionally poor capture', 'Expect: confidence falls, UNKNOWN appears instead of false confident conclusions.'],
      ];
      return (
        <div>
          <Nls2SectionLabel>Real-device validation checklist</Nls2SectionLabel>
          <div className="space-y-1.5">
            {items.map(([t2, d]) => (
              <div key={t2} className="text-[9px]">
                <p className="text-cyan-200 font-semibold">{t2}</p>
                <p className="text-textMuted">{d}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Nls2ValidationPanel({ left, right, comparison, meta }) {
      const [copied, setCopied] = useState(false);
      const copy = () => {
        try {
          const payload = JSON.stringify({ left, right, comparison, meta }, null, 2);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(payload).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }).catch(() => {});
          }
        } catch (e) { /* clipboard unreliable on some iOS versions — panel above remains the source of truth */ }
      };
      return (
        <Section title="NLS2 VALIDATION DIAGNOSTICS (temporary, debug build)" defaultOpen={false}>
          <div className="select-text max-h-[70vh] overflow-y-auto overflow-x-hidden pr-1">
            <p className="text-[9px] text-textMuted mb-2">Engineering diagnostics for real-device measurement validation. Not part of the product UI — does not expose lash count, health, damage, or safe-load claims.</p>
            <Nls2EyeValidationBlock label="LEFT" obs={left} meta={meta ? meta.left : null} />
            <div className="h-3" />
            <Nls2EyeValidationBlock label="RIGHT" obs={right} meta={meta ? meta.right : null} />
            <div className="h-3" />
            <Nls2ComparisonBlock comparison={comparison} />
            <div className="h-3" />
            <Nls2ThresholdsBlock />
            <div className="h-3" />
            <Nls2ChecklistBlock />
            <button onClick={copy} className="mt-3 w-full py-2 rounded-md text-[10px] font-semibold uppercase tracking-wide bg-white/[0.06] text-textSecondary border border-border press-scale">
              {copied ? 'Copied' : 'Copy NLS Diagnostics'}
            </button>
          </div>
        </Section>
      );
    }
    // ============================================================
    // END NLS2 VALIDATION DIAGNOSTIC
    // ============================================================

    function LashEyeCard({ titleKey, obs, lang }) {
      if (!obs || !obs.hasData) {
        return (
          <div className="glass rounded-lg p-4">

      // NLS-1 count-safety fix: no lash-count-like row here (removed
      // natLashVisibleCount/countLow-countHigh) — the audit concluded

      // estimate. occupancy/visualDensity below remains the master-

      const rows = [

        [t('natLashRelLength', lang), lashLengthLabel(obs.overallLenBucket, lang)],

      return (

          <div className="space-y-2">

                <p className="text-[10px] font-semibold text-textPrimary mt-0.5">{lashDensityLabel(obs.zoneDensity[i], lang)}</p>

    function ReviewScreen({ result, onConfirm, onBack, onRescan }) {
      const lang = useLang();
      const initial = result.eyeProfile;
      const [values, setValues] = useState({
        eyeShapeCategory: initial.eyeShapeCategory,
        eyelidType: initial.eyelidType,
        // hoodingState: the AUTHORITATIVE hooding signal from here on —
        // see the PRODUCT SEMANTICS SPLIT comment on classifyFeatures.
        // initial.hoodingState is always 'uncertain' straight out of
        // the automatic pipeline (hooding cannot be reliably
        // auto-detected — see the hooding audit), so seeding from it
        // here (same pattern as every other field) already satisfies
        // "do not preselect nonHooded from the old geometry."
        hoodingState: initial.hoodingState,
        eyeSetCategory: initial.eyeSetCategory,
        tiltTendency: initial.tiltTendency,
        eyeSizeCategory: initial.eyeSizeCategory,
        symmetryCategory: initial.symmetryCategory,
      });
      const optionLabels = {
        eyeShapeCategory: { uncertain: t('shape_uncertain', lang), round: t('shape_round', lang), almond: t('shape_almond', lang), elongatedAlmond: t('shape_elongatedAlmond', lang), narrow: t('shape_narrow', lang) },
        eyelidType: { uncertain: t('eyelidTypeUncertain', lang), hooded: t('eyelidTypeHooded', lang), monolid: t('eyelidTypeMonolid', lang), openCrease: t('eyelidTypeOpenCrease', lang) },
        hoodingState: { uncertain: t('hoodingOptionUnsure', lang), hooded: t('hoodingOptionHooded', lang), nonHooded: t('hoodingOptionNonHooded', lang) },
        eyeSetCategory: { close: t('eyeSet_close', lang), balanced: t('eyeSet_balanced', lang), wide: t('eyeSet_wide', lang) },
        tiltTendency: { upturned: t('tiltUpturned', lang), neutral: t('tiltNeutral', lang), downturned: t('tiltDownturned', lang), uncertain: t('tiltUncertain', lang) },
        eyeSizeCategory: { small: t('eyeSize_small', lang), medium: t('eyeSize_medium', lang), large: t('eyeSize_large', lang) },
        symmetryCategory: { balanced: t('symmetry_balanced', lang), mild: t('symmetry_mild', lang), noticeable: t('symmetry_noticeable', lang), uncertain: t('symmetry_uncertain', lang) },
      };
      // DISPLAY-ONLY product decision: eyelidType (crease type),
      // hoodingState (hooding), and eyeSizeCategory (eye size) are
      // intentionally NOT offered as confirmable rows here — the artist
      // never sees or edits them on this screen. Their values in
      // `values`/`confirm()` below are untouched: each still seeds from
      // initial.X and still round-trips onto the confirmed profile,
      // kept for diagnostics/backward compatibility only.
      //
      // hoodingState specifically: eyelidType and eyeSizeCategory each
      // have a real automatically-computed fallback value, so removing
      // their row only removes artist override. hoodingState is
      // different — initial.hoodingState is ALWAYS 'uncertain' straight
      // out of the automatic pipeline (hooding cannot be reliably auto-
      // detected), so this was previously the ONLY mechanism that ever
      // produced a real value. Product decision: hooding is no longer a
      // trusted recommendation parameter, so this is now an accepted
      // consequence rather than a blocker — isHooded/hoodedConfidence/
      // hoodingLevel below will always compute from an 'uncertain'
      // hoodingState, but nothing in DESIGN_CATALOG/recommendCurl/
      // generateEyeHighlight/the Application Plan reads them anymore
      // (see this phase's report), so this never silently coerces an
      // unknown hooding read into a false "confirmed non-hooded" signal
      // that affects any output — it is simply inert, kept for
      // diagnostics/backward compatibility only.
      const fields = [
        ['eyeShapeCategory', t('shapeLabel', lang), ['uncertain', 'round', 'almond', 'elongatedAlmond', 'narrow']],
        ['eyeSetCategory', t('spacingLabel', lang), ['close', 'balanced', 'wide']],
        ['tiltTendency', t('tiltLabel', lang), ['upturned', 'neutral', 'downturned', 'uncertain']],
        ['symmetryCategory', t('symmetryLabel', lang), ['balanced', 'mild', 'noticeable', 'uncertain']],
      ];
      const confirm = () => {
        const legacyShape = { round: 'round', almond: 'almond', elongatedAlmond: 'elongated', narrow: 'mixed', uncertain: 'mixed' };
        // eyelidCategory kept wired to eyelidType exactly as before —
        // legacy/debug-panel-only bucket, no longer read by
        // HeroScreen/recommendations (see PRODUCT SEMANTICS SPLIT).
        const eyelidCategory = values.eyelidType === 'hooded' ? 'moderate' : values.eyelidType === 'monolid' ? 'uncertain' : values.eyelidType === 'openCrease' ? 'open' : 'uncertain';
        // isHooded/hoodedConfidence/hoodingLevel now derive from the
        // manually-confirmed hoodingState — NOT from eyelidType/
        // eyelidCategory — so they become the authoritative hooding
        // signal every recommendation read (DESIGN_CATALOG scores/
        // cautions, generateEyeHighlight, HeroScreen) sees from here on,
        // per the hooding audit. 0.8/0.25 reuse this same function's
        // pre-existing confident-manual-override / not-confident-enough
        // convention — no new threshold invented.
        const isHooded = values.hoodingState === 'hooded';
        const hoodedConfidence = values.hoodingState === 'uncertain' ? 0.25 : 0.8;
        const hoodingLevel = values.hoodingState === 'hooded' ? 'partial' : 'none';
        const confirmedProfile = {
          ...initial,
          ...values,
          dominantShape: legacyShape[values.eyeShapeCategory],
          isCloseSet: values.eyeSetCategory === 'close',
          isWideSet: values.eyeSetCategory === 'wide',
          isHooded, hoodedConfidence, hoodingLevel,
          eyelidCategory,
          eyelidCategoryConfidence: values.eyelidType === 'uncertain' ? 0.25 : 0.8,
          eyeShapeConfidence: values.eyeShapeCategory === initial.eyeShapeCategory ? initial.eyeShapeConfidence : 0.8,
          artistConfirmed: true,
        };
        onConfirm({
          ...result,
          eyeProfile: confirmedProfile,
          originalAIProfile: initial,
          designs: rankDesigns(confirmedProfile, lang),
          artistConfirmed: true,
        });
      };
      return (

              "Add to Home Screen" — browsing, reports a real nonzero
              env(safe-area-inset-bottom) exactly to let pages avoid
              that overlap) ON TOP of the original 1rem (p-4) padding,
              so the confirm button always scrolls fully clear of
              on-screen browser chrome. env() resolves to 0 on desktop/
              non-iOS, so this is exactly 1rem there — identical to
              the unmodified p-4 default, desktop is unaffected. */}
          <div className="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 1rem)' }}>
            <div className="relative rounded-lg overflow-hidden aspect-[4/5] border border-border">
              <img src={result.originalImage} className="w-full h-full object-cover" alt="client" />
              <ResultMeshOverlay landmarks={result.landmarks} imageWidth={result.imageWidth} imageHeight={result.imageHeight} />

                  <span className="block text-xs text-textSecondary mb-1.5">{label}</span>

            <button onClick={confirm} className="w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]">

    // ============================================================
    // CLIENT CARD / CLIENT HISTORY — Phase 2: production UI only.
    // ------------------------------------------------------------
    // Consumes the Phase 1 data layer (window.ClientStore /
    // window.ClientDataConsent) exclusively through their public
    // functions — never reaches into professional-lash-library.js,
    // DESIGN_CATALOG, rankDesigns/rankDesignsAll, calculateEyeLashMap,
    // camera/scan code, Natural Lash Scan, or analytics.js. "New
    // Visit" is visually present on the Client Card but intentionally
    // NOT wired to any scan/result state yet — that integration is a
    // later phase. No photo/Blob storage exists yet; the photo slot is
    // a tasteful placeholder only. Age is never stored — every display
    // of it calls ClientStore.calculateAge(dateOfBirth) at render time.
    // ============================================================
    function ClientsIcon({ className }) {
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="1.6" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 12a4 4 0 100-8 4 4 0 000 8z" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" />
        </svg>
      );
    }

    // Presentational only — never stored. RU uses correct numeral
    // agreement (год/года/лет); EN uses a compact "N y.o." form.
    function formatClientAge(age, lang) {
      if (age === null || age === undefined) return null;
      if (lang === 'ru') {
        const mod100 = age % 100, mod10 = age % 10;
        let suffix = 'лет';
        if (mod100 < 11 || mod100 > 14) {
          if (mod10 === 1) suffix = 'год';
          else if (mod10 >= 2 && mod10 <= 4) suffix = 'года';
        }
        return `${age} ${suffix}`;
      }
      return `${age} y.o.`;
    }

    function formatClientDate(iso, lang) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US');
    }

    const CLIENT_INPUT_CLASS = 'w-full text-[14px] bg-white/[0.03] border border-border rounded-md px-3 py-2.5 text-textPrimary placeholder:text-textMuted focus:outline-none focus:border-borderActive';
    const CLIENT_LABEL_CLASS = 'text-[12px] font-semibold text-textSecondary mb-1.5 block';

    // Separate from ConsentPanel (analytics-only, consent-manager.js).
    // Gates only the moment a NEW client record is first persisted —
    // editing/deleting an already-stored client never re-prompts.
    function ClientDataConsentPrompt({ lang, onAccept, onDecline }) {
      return (
        <div style={{ position: 'absolute', inset: 0, zIndex: 70 }} className="flex items-center justify-center p-4 bg-black/60" onClick={onDecline}>
          <div className="glass-strong rounded-lg p-4 w-full" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start gap-3 mb-3">
              <div className="w-8 h-8 rounded-md bg-white/[0.03] border border-border flex items-center justify-center flex-shrink-0">
                <ShieldIcon className="w-4 h-4 text-accent" />
              </div>
              <h3 className="text-[14px] font-semibold text-textPrimary">{t('clientConsentPromptTitle', lang)}</h3>
            </div>
            <p className="text-[13px] text-textSecondary leading-relaxed mb-4">{t('clientConsentPromptBody', lang)}</p>
            <div className="flex flex-col gap-2">
              <button onClick={onAccept} className="w-full py-3 rounded-md bg-accent text-white text-sm font-semibold press-scale">{t('clientConsentPromptAccept', lang)}</button>
              <button onClick={onDecline} className="w-full py-2 rounded-md text-textMuted text-[13px] font-medium">{t('clientConsentPromptDecline', lang)}</button>
            </div>
          </div>
        </div>
      );
    }

    // CLIENT-3: lightweight, self-dismissing feedback for the Save-to-
    // Client action. Distinguishes a durably persisted Visit
    // (store.whenReady() resolved 'indexeddb') from one that only made
    // it into the in-memory fallback adapter (resolved 'memory') —
    // never presents the latter as safely saved history.
    function SaveVisitToast({ toast, lang, onDismiss }) {
      useEffect(() => {
        if (!toast) return;
        const id = setTimeout(onDismiss, 3200);
        return () => clearTimeout(id);
      }, [toast]);
      if (!toast) return null;
      const message = !toast.ok
        ? t('visitSaveErrorToast', lang)
        : toast.persistent
          ? t('visitSavedToast', lang)
          : t('visitSavedTemporaryToast', lang);
      return (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 80 }} className="p-4 flex justify-center pointer-events-none">
          <div onClick={onDismiss} className={`glass-strong rounded-md px-4 py-3 text-[13px] font-medium pointer-events-auto max-w-full ${toast.ok ? 'text-textPrimary' : 'text-danger'}`}>
            {message}
          </div>
        </div>
      );
    }

    function ClientListCard({ client, stats, lang, onOpen, disabled }) {
      const age = client.dateOfBirth ? ClientStore.calculateAge(client.dateOfBirth) : null;
      return (
        <button disabled={!!disabled} onClick={() => onOpen(client.id)} className="w-full glass rounded-lg p-3 mb-2.5 flex items-center gap-3 text-left press-scale disabled:opacity-60">
          <div className="w-12 h-12 rounded-full bg-white/[0.05] border border-border flex items-center justify-center flex-shrink-0">
            <ClientsIcon className="w-6 h-6 text-textMuted" />
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <p className="text-[14px] font-semibold text-textPrimary truncate">{client.fullName}</p>
              {age !== null && <span className="text-[11px] text-textMuted flex-shrink-0">{formatClientAge(age, lang)}</span>}
            </div>
            <p className="text-[12px] text-textSecondary mt-0.5 truncate">
              {stats.lastVisitDate ? `${t('clientLastVisitLabel', lang)}: ${formatClientDate(stats.lastVisitDate, lang)}` : t('clientNoVisitsYet', lang)}
              {' · '}{t('clientTotalVisitsLabel', lang)}: {stats.totalVisits}
            </p>
          </div>
          <svg className="w-4 h-4 text-textMuted flex-shrink-0" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 18l6-6-6-6"/></svg>
        </button>

    function ClientsListScreen({ lang, store, onOpenClient, onNewClient, onBack, saveMode, onSelectForSave, busy }) {
      const [loading, setLoading] = useState(true);
      const [rows, setRows] = useState([]);
      const [query, setQuery] = useState('');
      const handleOpen = saveMode ? onSelectForSave : onOpenClient;

      useEffect(() => {
        let cancelled = false;
        (async () => {
          if (!store) { setLoading(false); return; }
          const clients = await store.listClients();
          const withStats = await Promise.all(clients.map(async (c) => {
            const visits = await store.listVisitsForClient(c.id);
            return { client: c, stats: ClientStore.deriveClientVisitStats(visits) };
          }));
          withStats.sort((a, b) => a.client.fullName.localeCompare(b.client.fullName));
          if (!cancelled) { setRows(withStats); setLoading(false); }
        })();
        return () => { cancelled = true; };
      }, [store]);

      const filtered = query.trim()
        ? rows.filter(r => r.client.fullName.toLowerCase().includes(query.trim().toLowerCase()))
        : rows;

      return (
        <div className="h-full flex flex-col bg-bg fade-in">
          <div className="px-5 pt-5 pb-4 flex items-center gap-3 border-b border-border/60">

            <button disabled={!!busy} onClick={onNewClient} className="w-full py-3.5 rounded-md font-semibold text-[14px] uppercase tracking-wide press-scale bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)] mb-4 disabled:opacity-60">
              {t('clientsNewButton', lang)}

              <div className="glass rounded-lg p-6 text-center">

                <p className="text-[13px] text-textSecondary leading-relaxed">{t('clientsEmptyBody', lang)}</p>
              </div>

              <p className="text-[13px] text-textMuted text-center py-6">{t('clientsNoResults', lang)}</p>
            ) : (
              filtered.map(({ client, stats }) => (
                <ClientListCard key={client.id} client={client} stats={stats} lang={lang} onOpen={handleOpen} disabled={busy} />
              ))
            )}
          </div>
        </div>
      );
    }

    function ClientFormScreen({ lang, clientId, store, consentGranted, onGrantConsent, onSaved, onCancel }) {
      const isEdit = !!clientId;
      const [loading, setLoading] = useState(isEdit);
      const [fullName, setFullName] = useState('');
      const [dateOfBirth, setDateOfBirth] = useState('');
      const [phone, setPhone] = useState('');
      const [desiredLook, setDesiredLook] = useState('');
      const [preferredEffects, setPreferredEffects] = useState('');
      const [requestNotes, setRequestNotes] = useState('');
      const [artistSensitivityNotes, setArtistSensitivityNotes] = useState('');
      const [error, setError] = useState(false);
      const [saving, setSaving] = useState(false);
      const [consentPromptOpen, setConsentPromptOpen] = useState(false);

      useEffect(() => {
        let cancelled = false;
        if (isEdit && store) {
          store.getClient(clientId).then((c) => {
            if (cancelled || !c) return;
            setFullName(c.fullName || '');
            setDateOfBirth(c.dateOfBirth || '');
            setPhone(c.phone || '');
            setDesiredLook(c.preferences.desiredLook || '');
            setPreferredEffects((c.preferences.preferredEffects || []).join(', '));
            setRequestNotes(c.preferences.requestNotes || '');
            setArtistSensitivityNotes(c.preferences.artistSensitivityNotes || '');
            setLoading(false);
          });
        }
        return () => { cancelled = true; };
      }, [isEdit, clientId, store]);

      const computedAge = dateOfBirth ? ClientStore.calculateAge(dateOfBirth) : null;

      const persist = async () => {
        setSaving(true);
        const payload = {
          fullName: fullName.trim(),
          dateOfBirth: dateOfBirth || null,
          phone: phone.trim() || null,
          preferences: {
            desiredLook: desiredLook.trim() || null,
            preferredEffects: preferredEffects.split(',').map(s => s.trim()).filter(Boolean),
            requestNotes: requestNotes.trim() || null,
            artistSensitivityNotes: artistSensitivityNotes.trim() || null,
          },
        };
        try {
          const record = isEdit ? await store.updateClient(clientId, payload) : await store.createClient(payload);
          onSaved(record);
        } finally {
          setSaving(false);
        }
      };

      const handleSave = () => {
        if (!fullName.trim()) { setError(true); return; }
        setError(false);
        if (!isEdit && !consentGranted) { setConsentPromptOpen(true); return; }
        persist();
      };

      if (loading) {
        return <div className="h-full flex items-center justify-center bg-bg"><p className="text-textMuted text-sm">…</p></div>;
      }

      return (
        <div className="h-full flex flex-col bg-bg fade-in">
          <div className="px-5 pt-5 pb-4 flex items-center gap-3 border-b border-border/60">
            <BackButton onBack={onCancel} />
            <h1 className="text-[17px] font-bold text-textPrimary">{isEdit ? t('clientFormEditTitle', lang) : t('clientFormNewTitle', lang)}</h1>
          </div>
          <div className="flex-1 overflow-y-auto px-4 py-4 hide-scrollbar space-y-4">
            <div className="flex justify-center mb-1">
              <div className="w-20 h-20 rounded-full bg-white/[0.05] border border-dashed border-border flex items-center justify-center">
                <ClientsIcon className="w-9 h-9 text-textMuted" />
              </div>
            </div>
            <p className="text-[11px] text-textMuted text-center -mt-2">{t('clientPhotoPlaceholderHint', lang)}</p>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldFullName', lang)} *</label>
              <input type="text" className={CLIENT_INPUT_CLASS} value={fullName} onChange={(e) => setFullName(e.target.value)} />
              {error && <p className="text-[12px] text-danger mt-1">{t('clientFullNameRequiredError', lang)}</p>}
            </div>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldDob', lang)}</label>
              <input type="date" className={CLIENT_INPUT_CLASS} value={dateOfBirth} onChange={(e) => setDateOfBirth(e.target.value)} />
              {computedAge !== null && <p className="text-[12px] text-textSecondary mt-1.5">{t('clientFieldAgeComputed', lang)}: {formatClientAge(computedAge, lang)}</p>}
            </div>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldPhone', lang)}</label>
              <input type="tel" className={CLIENT_INPUT_CLASS} value={phone} onChange={(e) => setPhone(e.target.value)} />
            </div>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldDesiredLook', lang)}</label>
              <input type="text" className={CLIENT_INPUT_CLASS} value={desiredLook} onChange={(e) => setDesiredLook(e.target.value)} />
            </div>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldPreferredEffects', lang)}</label>
              <input type="text" className={CLIENT_INPUT_CLASS} value={preferredEffects} onChange={(e) => setPreferredEffects(e.target.value)} placeholder={t('clientFieldPreferredEffectsHint', lang)} />
            </div>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldRequestNotes', lang)}</label>
              <textarea rows={3} className={CLIENT_INPUT_CLASS} value={requestNotes} onChange={(e) => setRequestNotes(e.target.value)} />
            </div>

            <div>
              <label className={CLIENT_LABEL_CLASS}>{t('clientFieldArtistNotes', lang)}</label>
              <textarea rows={3} className={CLIENT_INPUT_CLASS} value={artistSensitivityNotes} onChange={(e) => setArtistSensitivityNotes(e.target.value)} />
            </div>
          </div>
          <div className="px-4 pb-5 pt-2 flex gap-2 border-t border-border/60">
            <button onClick={onCancel} className="flex-1 py-3 rounded-md text-textSecondary text-[14px] font-medium bg-white/[0.03] border border-border press-scale">{t('clientFormCancel', lang)}</button>
            <button onClick={handleSave} disabled={saving} className="flex-1 py-3 rounded-md bg-accent text-white text-[14px] font-semibold press-scale disabled:opacity-60">{t('clientFormSave', lang)}</button>
          </div>
          {consentPromptOpen && (
            <ClientDataConsentPrompt
              lang={lang}
              onAccept={() => { onGrantConsent(); setConsentPromptOpen(false); persist(); }}
              onDecline={() => setConsentPromptOpen(false)}
            />
          )}
        </div>
      );
    }

    function ClientCardScreen({ lang, clientId, store, onBack, onEdit, onDeleted }) {

                dead click, so the artist never wonders "did anything

            <button

              {t('clientCardNewVisit', lang)}

              <button onClick={() => onEdit(clientId)} className="flex-1 py-3 rounded-md text-textPrimary text-[13px] font-medium bg-white/[0.03] border border-border press-scale">{t('clientCardEdit', lang)}</button>
              <button onClick={() => setDeleteConfirmOpen(true)} className="flex-1 py-3 rounded-md text-danger text-[13px] font-medium bg-white/[0.03] border border-danger/30 press-scale">{t('clientCardDelete', lang)}</button>
            </div>
          </div>
          {deleteConfirmOpen && (
            <div style={{ position: 'absolute', inset: 0, zIndex: 70 }} className="flex items-center justify-center p-4 bg-black/60" onClick={() => setDeleteConfirmOpen(false)}>
              <div className="glass-strong rounded-lg p-4 w-full" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-[14px] font-semibold text-textPrimary mb-2">{t('clientCardDeleteConfirmTitle', lang)}</h3>
                <p className="text-[13px] text-textSecondary leading-relaxed mb-4">{t('clientCardDeleteConfirmBody', lang)}</p>
                <div className="flex gap-2">
                  <button onClick={() => setDeleteConfirmOpen(false)} className="flex-1 py-3 rounded-md text-textSecondary text-[13px] font-medium bg-white/[0.03] border border-border press-scale">{t('clientCardDeleteConfirmNo', lang)}</button>
                  <button onClick={handleDelete} disabled={deleting} className="flex-1 py-3 rounded-md bg-danger text-white text-[13px] font-semibold press-scale disabled:opacity-60">{t('clientCardDeleteConfirmYes', lang)}</button>
                </div>
              </div>
            </div>
          )}
        </div>

    // This is the "smallest compatibility adapter", not a second engine:
    // it converts referenceTemplate's own shape into exactly the
    // {zones, peakIdx, curve, curl, spikeGeom, ...} shape
    // LegacyLashMapDiagram already consumes for every one of the 21
    // production designs, via lash-design-domain.js's diagramProps
    // path. It never touches the production catalog, calculateEyeLashMap,
    // ClientLashDesign, or lash-design-domain.js -- those remain the
    // only path for the 21 existing designs. Kept inside this DEBUG-ONLY

    // via ?debug=library, same as everything else in this block.
    //
    // Mirror safety (Protected Contract H): `side` is passed straight
    // through to LegacyLashMapDiagram's own unmodified `xAt` mirroring
    // formula and is NEVER used to reorder, reverse, or otherwise branch
    // on any zone/spike DATA below -- the same physical-order arrays are
    // used for both 'left' and 'right'. Physical INNER is always
    // index/order 0 and physical OUTER is always the last index,
    // regardless of `side`.
    function plResolveMm(zone) {
      if (typeof zone.lengthMm === 'number') return zone.lengthMm;
      if (Array.isArray(zone.lengthMmRange)) return (zone.lengthMmRange[0] + zone.lengthMmRange[1]) / 2;
      return 0;

    // Linear interpolation of a physical-order layer (already sorted by

    // directly "under" a spike/ray that may sit at a different zone count
    // than the base (e.g. Wet Look: 4 base points, 5 ray points).
    function plInterpolateAt(layer, t) {
      const n = layer.length;
      if (n === 1) return plResolveMm(layer[0]);
      const clamped = Math.max(0, Math.min(1, t));
      for (let i = 0; i < n - 1; i++) {
        const t0 = i / (n - 1), t1 = (i + 1) / (n - 1);
        if (clamped >= t0 && clamped <= t1) {
          const frac = (clamped - t0) / Math.max(1e-9, t1 - t0);
          return plResolveMm(layer[i]) + (plResolveMm(layer[i + 1]) - plResolveMm(layer[i])) * frac;

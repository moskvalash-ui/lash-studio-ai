    const dist = (a,b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
    const angle = (a,b) => Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI;
    // Shortest circular distance between two angles given in degrees,
    // normalized into [0, 180] — the correct way to diff two angle
    // readings that can each independently fall anywhere in (-180, 180].
    // A naive `Math.abs(a - b)` is wrong whenever the two values sit on
    // opposite sides of the +/-180 seam (e.g. 179 vs -179 is genuinely
    // only 2 degrees apart, not 358): this walks the delta back into
    // (-180, 180] before taking its magnitude, so the seam is never
    // double-counted.
    const shortestAngleDiffDeg = (a, b) => {
      let d = (a - b) % 360;
      if (d > 180) d -= 360; else if (d < -180) d += 360;
      return Math.abs(d);
    };
    // Reflects an angle across the vertical (y) axis: for a vector
    // (dx,dy), negating dx while keeping dy maps atan2(dy,dx)=theta to
    // atan2(dy,-dx)=180-theta (wrapped). This is the exact correction
    // needed for the RIGHT eye's tiltCorrected reading: physical
    // LEFT/RIGHT eye landmarks are read from horizontally mirrored
    // image regions (see getPhysicalEyeLandmarks), so the inner->outer
    // vector's x-component is mirrored between the two eyes by
    // construction — LEFT's inner->outer vector points toward +x,
    // RIGHT's toward -x, for the SAME real-world corner-tilt direction.
    // Reflecting RIGHT's angle back into LEFT's coordinate frame before
    // comparing is what makes the two readings genuinely comparable
    // (proven both analytically and by simulation — see
    // tests/angle-symmetry.test.js). This is a different fix from
    // headPose.roll's +/-90 fold two lines above: roll corrects a
    // single undirected-line ambiguity (0 vs 180 is the same line),
    // while this corrects two SEPARATE per-eye measurements taken in
    // mirrored coordinate frames — folding by +/-90 and comparing
    // magnitudes only (roll's approach) silently misses genuine
    // opposite-direction (one eye upturned, one downturned) asymmetry.
    const mirrorReflectDeg = (deg) => {
      let d = 180 - deg;
      while (d > 180) d -= 360;
      while (d <= -180) d += 360;
      return d;
    };

    function t(key, lang) { const e = STRINGS[key]; if (!e) return key; return e[lang] || e.ru; }

    // Raw-metrics DEBUG/EXPLAINABILITY panel (whRatio, coverageIndex,
    // score breakdowns, confidence factors — internal analysis
    // internals) is developer-facing, not something a production user
    // should ever see. Hidden by default; a developer opts in via
    // ?debug=1 in the URL, which persists across sessions until
    // explicitly turned off with ?debug=0. This gates ONLY visibility —
    // every underlying computation/debug field still exists and runs
    // exactly as before.
    function isDebugModeEnabled() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('debug') === '1') { localStorage.setItem('lashStudioDebug', '1'); return true; }
        if (params.get('debug') === '0') { localStorage.removeItem('lashStudioDebug'); return false; }
        return localStorage.getItem('lashStudioDebug') === '1';
      } catch (e) { return false; }
    }

    // ============================================================
    // LIVE / PHOTO ANALYSIS PIPELINE
    // Shared by both Live Scan and Photo Analysis. Every function
    // below consumes real face-api.js landmarks; thresholds/weights
    // are geometric heuristics applied uniformly to whatever face is
    // detected — nothing here is randomized or hardcoded per face.
    // ============================================================

    const MIN_STABLE_FRAMES = 18;
    const BUFFER_WINDOW_MS = 15000;
    // CAMERA FIX — face-lost grace window, shared by LiveScanScreen and
    // NaturalLashScanScreen. EXISTING BEHAVIOR REUSED: this is the same
    // 900ms "is this detection still fresh" window both screens' overlay
    // draw loops already used (previously an inline literal in each);
    // now also gates the DECISION state (phase/stageKey/hint text) so a
    // single missed detectSingleFace() frame no longer flips the UI to
    // "lost" while the overlay graphics are still visibly present —
    // the two were previously out of sync (decision state flipped
    // instantly, overlay faded gradually over the same 900ms).
    const FACE_LOST_GRACE_MS = 900;

    // ============================================================
    // PHYSICAL EYE NORMALIZATION — face-api.js -> application boundary.
    // ------------------------------------------------------------
    // Proven this session (real face-api.js@0.22.2 detections against
    // 3 independent real photos, using each photo's own nose-centroid
    // as an independent inner/outer reference — see
    // tests/eye-normalization.test.js for the executable proof):
    //
    //   face-api's getLeftEye()/getLeftEyeBrow() (indices 36-41,
    //   17-21) sit on the IMAGE-LEFT side of the (raw, canonical,
    //   un-mirrored) frame — which, for a normal face-to-face camera
    //   frame, is the client's PHYSICAL RIGHT eye/brow. Symmetrically,
    //   getRightEye()/getRightEyeBrow() (42-47, 22-26) = physical LEFT.
    //   face-api's naming is image-side-based, not anatomy-based.
    //
    //   Point order also differs per source: getRightEye()'s raw
    //   6-point order is ALREADY [inner,upperInner,upperOuter,outer,
    //   lowerOuter,lowerInner] (the standard EAR/dlib layout, corner-
    //   for-corner). getLeftEye()'s raw order is the SAME anatomical
    //   layout starting from the opposite corner — not a plain
    //   reverse (that would swap which lower point pairs with which
    //   upper point) — the exact, proven permutation is [3,2,1,0,5,4].
    //   getLeftEyeBrow() is outer-to-inner (opposite of
    //   getRightEyeBrow()'s already-inner-to-outer order); brows have
    //   no upper/lower pairing to preserve, so a plain reverse is
    //   correct there.
    //
    // This is the ONLY place raw getLeftEye()/getRightEye()/
    // getLeftEyeBrow()/getRightEyeBrow() should be called for any
    // semantic/measurement purpose. The sole documented exception is
    // buildFaceMesh's purely-visual face-mesh rendering (LiveScanScreen
    // overlay + ResultMeshOverlay), which has ~15 hardcoded joins
    // (meshEdgeList/meshTriangleList) that assume this exact raw,
    // image-side ordering for its own internal cross-brow/cross-eye
    // stitching — it draws an aesthetic face outline, asserts no L/R
    // claim, and is deliberately left reading raw face-api output
    // unchanged; rewriting its topology for canonical order would be
    // an unrelated, high-risk visual refactor with zero semantic
    // benefit, so it is out of scope here.
    //
    // Depends on NOTHING but `landmarks` — no CSS mirror state, no
    // facingMode, no screen/display coordinates. `landmarks` is itself
    // always built upstream from the raw, un-mirrored processing
    // canvas (ctx.drawImage(video,...) ignores CSS transforms on its
    // source element — proven in the prior camera-fix audit), so
    // preview mirroring can never reach this function.
    // ============================================================
    function normalizeEyePoints(raw, source) {
      if (source === 'getRightEye') return raw.slice();
      if (source === 'getLeftEye') return [raw[3], raw[2], raw[1], raw[0], raw[5], raw[4]];
      throw new Error('normalizeEyePoints: unknown source ' + source);
    }
    function normalizeBrowPoints(raw, source) {
      if (source === 'getRightEyeBrow') return raw.slice();
      if (source === 'getLeftEyeBrow') return raw.slice().reverse();
      throw new Error('normalizeBrowPoints: unknown source ' + source);
    }
    // physicalSide: 'left' | 'right' (the CLIENT'S own anatomical
    // side — matches how every user-facing string in this app already
    // uses "left eye"/"right eye", e.g. natLashMoveLeftCloser).
    // Returns { eye, brow }, both canonically ordered
    // [INNER_CORNER, UPPER_INNER, UPPER_OUTER, OUTER_CORNER,
    //  LOWER_OUTER, LOWER_INNER] / [INNER_END, ..., OUTER_END].
    function getPhysicalEyeLandmarks(landmarks, physicalSide) {
      if (physicalSide === 'left') {
        return {
          eye: normalizeEyePoints(landmarks.getRightEye(), 'getRightEye'),
          brow: normalizeBrowPoints(landmarks.getRightEyeBrow(), 'getRightEyeBrow'),
        };
      }
      if (physicalSide === 'right') {
        return {
          eye: normalizeEyePoints(landmarks.getLeftEye(), 'getLeftEye'),
          brow: normalizeBrowPoints(landmarks.getLeftEyeBrow(), 'getLeftEyeBrow'),
        };
      }
      throw new Error('getPhysicalEyeLandmarks: unknown physicalSide ' + physicalSide);
    }

    function computeHeadPose(landmarks) {
      const nose = landmarks.getNose();
      // PHYSICAL EYE NORMALIZATION — leftEye/rightEye here are now the
      // client's actual physical eyes (see getPhysicalEyeLandmarks
      // above), each already canonically ordered so eye[0]/eye[3] are
      // genuinely inner/outer. roll/interEyeDistance/yawProxy/
      // pitchProxy below are all built from symmetric (order/label-
      // invariant) combinations of the two centers, so their VALUES
      // are unchanged by this fix — only leftEyeCenter/rightEyeCenter
      // in the returned object are now correctly attributed.
      const leftEye = getPhysicalEyeLandmarks(landmarks, 'left').eye;
      const rightEye = getPhysicalEyeLandmarks(landmarks, 'right').eye;
      const leftEyeCenter = { x: (leftEye[0].x + leftEye[3].x) / 2, y: (leftEye[0].y + leftEye[3].y) / 2 };
      const rightEyeCenter = { x: (rightEye[0].x + rightEye[3].x) / 2, y: (rightEye[0].y + rightEye[3].y) / 2 };
      const interEyeDistance = dist(leftEyeCenter, rightEyeCenter);
      let roll = angle(rightEyeCenter, leftEyeCenter);
      if (roll > 90) roll -= 180; else if (roll < -90) roll += 180;
      const noseTip = nose[6] || nose[nose.length - 1];
      const eyeMidX = (leftEyeCenter.x + rightEyeCenter.x) / 2;
      const eyeMidY = (leftEyeCenter.y + rightEyeCenter.y) / 2;
      const yawProxy = interEyeDistance > 0 ? (noseTip.x - eyeMidX) / interEyeDistance : 0;
      const pitchProxy = interEyeDistance > 0 ? (noseTip.y - eyeMidY) / interEyeDistance : 0;
      return { roll, yawProxy, pitchProxy, interEyeDistance, leftEyeCenter, rightEyeCenter };
    }

    function computeEAR(eye) {
      const v1 = dist(eye[1], eye[5]);
      const v2 = dist(eye[2], eye[4]);
      const h = dist(eye[0], eye[3]);
      return h > 0 ? (v1 + v2) / (2 * h) : 0;
    }

    // Interior angle at `vertex` between rays to `a` and `b`, in
    // degrees — rotation-invariant (no head-roll correction needed
    // for the magnitude itself), used as a real per-corner "tapering"
    // signal: a sharp angle reads as a pointed/tapered corner
    // (almond-like), a wide angle reads as a rounder corner.
    function cornerAngleDeg(vertex, a, b) {
      const v1x = a.x-vertex.x, v1y = a.y-vertex.y;
      const v2x = b.x-vertex.x, v2y = b.y-vertex.y;
      const m1 = Math.hypot(v1x,v1y), m2 = Math.hypot(v2x,v2y);
      if (m1 < 0.001 || m2 < 0.001) return 90;
      const cos = Math.max(-1, Math.min(1, (v1x*v2x+v1y*v2y)/(m1*m2)));
      return Math.acos(cos) * 180/Math.PI;
    }

    function computeEyeSideMetrics(landmarks, side, headPose) {
      // PHYSICAL EYE NORMALIZATION — `side` means the client's actual
      // physical side; `eye`/`brow` are canonically ordered so
      // eye[0]/eye[3] are genuinely the inner/outer corners for
      // EITHER side (see getPhysicalEyeLandmarks above). Previously
      // this read face-api's getLeftEye()/getRightEye() directly,
      // which (a) returns the physically OPPOSITE eye from what
      // `side` names, and (b) has eye[0]/eye[3] reversed for one of
      // the two sources — both proven and fixed at that one boundary.
      const { eye, brow } = getPhysicalEyeLandmarks(landmarks, side);
      const inner = eye[0], outer = eye[3];
      const width = dist(inner, outer);
      // Aperture measured independently near EACH corner (not just
      // one averaged "height") — apertureA/eye[1]+eye[5] sit next to
      // the eye[0] corner, apertureB/eye[2]+eye[4] next to eye[3],
      // matching the standard EAR point layout. Comparing the two
      // gives a real tapering-between-ends signal instead of a single
      // blended number.
      const apertureA = dist(eye[1], eye[5]);
      const apertureB = dist(eye[2], eye[4]);
      const height = (apertureA + apertureB) / 2;
      const apertureAsymmetry = Math.max(apertureA, apertureB) > 0 ? Math.min(apertureA, apertureB) / Math.max(apertureA, apertureB) : 1;
      // Real per-corner taper angle — geometric, not inferred from
      // the width/height ratio at all.
      const innerTaperDeg = cornerAngleDeg(inner, eye[1], eye[5]);
      const outerTaperDeg = cornerAngleDeg(outer, eye[2], eye[4]);
      const ear = computeEAR(eye);
      const widthRatio = width / Math.max(headPose.interEyeDistance, 1);
      const rawTilt = angle(inner, outer);
      const tiltCorrected = rawTilt - headPose.roll;
      // Eyelid coverage is sampled at three brow->lid positions (center,
      // inner, outer), not one — a single point pair is too sensitive to
      // landmark jitter and to brow-arch shape at that one spot. Each is
      // normalized by the eye's OWN width (scale-invariant to camera
      // distance/face size), plus a second, independently-based read
      // normalized by the eye's own opening height, used as a cross-
      // check in classifyFeatures rather than just rescaling one number.
      const gapCenter = dist(brow[2], eye[1]);
      const gapInner = dist(brow[0], eye[0]);
      const gapOuter = dist(brow[4], eye[3]);
      const hoodingRatio = gapCenter / Math.max(headPose.interEyeDistance, 1);
      const hoodingRatioByWidth = gapCenter / Math.max(width, 1);
      const covCenterByWidth = gapCenter / Math.max(width, 1);
      const covInnerByWidth = gapInner / Math.max(width, 1);
      const covOuterByWidth = gapOuter / Math.max(width, 1);
      const covByHeight = height > 0 ? gapCenter / height : 0;
      const shapeRatio = width / Math.max(height, 1);
      return { width, height, ear, widthRatio, tiltCorrected, hoodingRatio, hoodingRatioByWidth, shapeRatio, covCenterByWidth, covInnerByWidth, covOuterByWidth, covByHeight, apertureA, apertureB, apertureAsymmetry, innerTaperDeg, outerTaperDeg };
    }

    // ---- Eyelid CREASE detection — real pixel analysis, not landmark
    // distance. --------------------------------------------------
    // The 68-point landmark model has no point for the crease/fold
    // itself, so the brow->lash-line GAP above (covCenterByWidth etc.)
    // cannot tell "open eye where the crease just sits high" apart
    // from "monolid with a similarly-sized gap because there is no
    // fold at all" — both look like a wide gap. This looks for the
    // fold as a real thing: a horizontal-ish brightness-gradient ridge
    // crossing the eyelid skin between the brow and the lash line.
    // Classical CV (grayscale row-gradient profile + prominence over a
    // local baseline), fully deterministic on real captured pixels —
    // same approach and same honesty rules as detectVisibleLashCandidates
    // (Natural Lash Scan): a flat/noisy read reports low readQuality
    // instead of guessing. Reuses extractEyeROI (defined below in the
    // Natural Lash Scan section; function hoisting makes the forward
    // reference safe) so there is only one ROI-cropping implementation.
    function detectEyelidCrease(sourceCanvas, eyePoints, browPoints) {
      const roi = extractEyeROI(sourceCanvas, eyePoints, browPoints, 0.45);
      if (!roi || roi.w < 24 || roi.h < 16) return { valid: false };
      let data;
      try { data = roi.ctx.getImageData(0, 0, roi.w, roi.h).data; } catch (e) { return { valid: false }; }
      const gray = new Float32Array(roi.w * roi.h);
      for (let i = 0; i < roi.w * roi.h; i++) {
        const o = i * 4;
        gray[i] = 0.299 * data[o] + 0.587 * data[o + 1] + 0.114 * data[o + 2];
      }

      const eyeUpperY = Math.min(roi.eyeLocal[1].y, roi.eyeLocal[2].y);
      const browBottomY = Math.max(...roi.browLocal.map(p => p.y));
      // The search band: from just below the brow's lowest point down
      // to the eye-opening's own upper contour — i.e. exactly the strip
      // of skin where a crease fold could physically be.
      const bandTop = Math.max(0, Math.round(browBottomY + (eyeUpperY - browBottomY) * 0.1));
      const bandBottom = Math.min(roi.h - 1, Math.round(eyeUpperY));
      const xMin = Math.max(0, Math.round(Math.min(roi.eyeLocal[0].x, roi.eyeLocal[3].x)));
      const xMax = Math.min(roi.w, Math.round(Math.max(roi.eyeLocal[0].x, roi.eyeLocal[3].x)));
      const bandW = xMax - xMin, rows = bandBottom - bandTop;
      if (bandW < 8 || rows < 5) return { valid: false };

      const rowGrad = new Float32Array(rows);
      const rowMean = new Float32Array(rows);
      for (let ry = 0; ry < rows; ry++) {
        const y = bandTop + ry;
        let sum = 0, gsum = 0, n = 0;
        for (let x = xMin; x < xMax; x++) {
          const idx = y * roi.w + x;
          sum += gray[idx]; n++;
          if (ry > 0) gsum += Math.abs(gray[idx] - gray[idx - roi.w]);
        }
        rowMean[ry] = n ? sum / n : 0;
        rowGrad[ry] = n ? gsum / n : 0;
      }

      // Smooth the per-row gradient (3-row moving average) before
      // looking for a ridge. Without this, picking the single highest
      // of ~20-40 noisy row values (sensor/JPEG noise, stray hairs,
      // pores) ALWAYS finds a "peak" somewhere — flat, crease-free skin
      // produces one just as reliably as real fold does. Smoothing
      // suppresses single-row noise spikes so what's left over is a
      // ridge that genuinely spans more than one row, the way a real
      // fold shadow does.
      const smoothed = new Float32Array(rows);
      for (let ry = 0; ry < rows; ry++) {
        const a = rowGrad[Math.max(0, ry - 1)], b = rowGrad[ry], c = rowGrad[Math.min(rows - 1, ry + 1)];
        smoothed[ry] = (a + b + c) / 3;
      }
      let peakIdx = 0, peakVal = smoothed[0];
      for (let ry = 1; ry < rows; ry++) {
        if (smoothed[ry] > peakVal) { peakVal = smoothed[ry]; peakIdx = ry; }
      }
      // Topographic prominence: how far the peak stands above the
      // DEEPEST valley on whichever side is shallower — an absolute,
      // noise-resistant measure of "how much does this ridge really
      // stick out", unlike a peak/median ratio which blows up when the
      // whole band is just uniformly flat (small denominator).
      let minLeft = Infinity;
      for (let ry = 0; ry <= peakIdx; ry++) minLeft = Math.min(minLeft, smoothed[ry]);
      let minRight = Infinity;
      for (let ry = peakIdx; ry < rows; ry++) minRight = Math.min(minRight, smoothed[ry]);
      const prominence = peakVal - Math.max(minLeft, minRight);
      // 0 = fold right under the brow, 1 = fold right at the lash line.
      const creaseYFrac = rows > 1 ? peakIdx / (rows - 1) : 0.5;

      // Rough proxy for whether the band even carries enough visual
      // information to trust a "found" OR a "not found" read — flat,
      // low-light, low-texture skin looks the same either way.
      const meanOfMeans = rowMean.reduce((a, b) => a + b, 0) / rows;
      const varOfMeans = rowMean.reduce((a, b) => a + (b - meanOfMeans) ** 2, 0) / rows;
      const bandContrast = Math.sqrt(varOfMeans);
      const sortedGrad = Array.from(rowGrad).sort((a, b) => a - b);
      const gradBaseline = sortedGrad[Math.floor(sortedGrad.length * 0.5)] || 0;
      const readQuality = clamp01((bandContrast - 2) / 10) * clamp01(gradBaseline / 3 + 0.3);

      return { valid: true, prominence, peakVal, creaseYFrac, readQuality };
    }

    // ============================================================
    // EYELID CREASE DETECTOR V2 — DEBUG-ONLY EXPERIMENTAL SHADOW DETECTOR.
    // ------------------------------------------------------------
    // NOT wired into production classification anywhere. detectEyelidCrease
    // (V1, above) remains the ONLY crease-evidence source classifyFeatures
    // reads — this function's entire purpose is to run ALONGSIDE V1 in
    // ?debug=1 sessions so its candidate geometry can be visually compared
    // against V1's single row-averaged peak, and eventually a human's own
    // judgment on a real device. Rationale: V1 collapses the whole
    // eye-width band into one 1D row-gradient signal before picking a
    // peak, which structurally favors flat, non-curved edges (like a
    // brow's lower boundary) over a genuinely curved crease.
    //
    // Every numeric constant below that encodes an assumption about
    // sampling density or what counts as "linked" is named and grouped
    // in DEBUG_V2_UNCALIBRATED — none of it has been validated against
    // real capture data, and none of it may be promoted to a production
    // threshold without that validation.
    //
    // t-COORDINATE SEMANTICS — read carefully, this is the OPPOSITE
    // direction from V1's creaseYFrac:
    //   t = (candidateY - upperLidY(x)) / (browY(x) - upperLidY(x))
    //   t = 0  ->  exactly AT the upper-lid contour (lash-line side)
    //   t = 1  ->  exactly AT the brow contour
    //   t is NOT clamped by this implementation (the search window is
    //   defined as exactly [upperLidY(x), browY(x)], so t naturally
    //   lands in [0,1] here) — but callers must not assume a future
    //   version can't report outside that range, and must never treat
    //   V1's creaseYFrac (0=near brow, 1=near lash line) as the same
    //   number without converting.
    // ============================================================
    const DEBUG_V2_UNCALIBRATED = {
      SAMPLE_COLUMNS: 12,        // how many x-positions to sample across the eyelid — not perf/anatomy validated
      COLUMN_HALF_WIDTH: 2,      // px on each side of a sampled x for its local vertical-gradient strip
      PATH_LINK_MAX_T_GAP: 0.15, // max |Δt| between neighboring sampled columns to link into the same path
    };

    // Piecewise-linear lookup along a polyline (list of {x,y} in
    // ROI-local pixel space). Checks each segment's OWN x-range
    // independently rather than assuming the polyline is globally
    // sorted by x — canonical physical-LEFT and physical-RIGHT eyes
    // traverse inner->outer in OPPOSITE x-directions within their own
    // ROI crop (see tests/eyelid-crease-v2.test.js), so this must not
    // assume ascending x.
    function debugV2PolylineY(poly, x) {
      for (let i = 0; i < poly.length - 1; i++) {
        const a = poly[i], b = poly[i + 1];
        const xLo = Math.min(a.x, b.x), xHi = Math.max(a.x, b.x);
        if (x >= xLo && x <= xHi) {
          if (Math.abs(b.x - a.x) < 1e-6) return (a.y + b.y) / 2;
          const frac = (x - a.x) / (b.x - a.x);
          return a.y + frac * (b.y - a.y);
        }
      }
      return null; // x outside every segment's own range — not reliably interpolable
    }

    // Robust local statistics (median + MAD) for a small array of
    // gradient samples — used for the locally-normalized strength
    // (never a global histogram/CLAHE transform).
    function debugV2MedianMad(values) {
      if (!values.length) return { median: 0, mad: 0 };
      const sorted = values.slice().sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)];
      const absDevs = sorted.map(v => Math.abs(v - median)).sort((a, b) => a - b);
      const mad = absDevs[Math.floor(absDevs.length / 2)];
      return { median, mad };
    }

    function detectEyelidCreaseV2(sourceCanvas, eyePoints, browPoints) {
      const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      const roi = extractEyeROI(sourceCanvas, eyePoints, browPoints, 0.45);
      if (!roi || roi.w < 24 || roi.h < 16) return { valid: false, v2RuntimeMs: 0 };
      let data;
      try { data = roi.ctx.getImageData(0, 0, roi.w, roi.h).data; } catch (e) { return { valid: false, v2RuntimeMs: 0 }; }
      const gray = new Float32Array(roi.w * roi.h);
      for (let i = 0; i < roi.w * roi.h; i++) {
        const o = i * 4;
        gray[i] = 0.299 * data[o] + 0.587 * data[o + 1] + 0.114 * data[o + 2];
      }

      // Canonical upper-lid polyline: inner corner -> upperInner -> upperOuter -> outer corner.
      const lidPoly = [roi.eyeLocal[0], roi.eyeLocal[1], roi.eyeLocal[2], roi.eyeLocal[3]];
      const browPoly = roi.browLocal; // canonical, already inner -> outer

      const eyeXInner = lidPoly[0].x, eyeXOuter = lidPoly[3].x;
      const { SAMPLE_COLUMNS, COLUMN_HALF_WIDTH, PATH_LINK_MAX_T_GAP } = DEBUG_V2_UNCALIBRATED;

      const candidates = []; // one slot per sample index, null where no reliable candidate
      for (let s = 0; s < SAMPLE_COLUMNS; s++) {
        const frac = SAMPLE_COLUMNS > 1 ? s / (SAMPLE_COLUMNS - 1) : 0.5; // 0 = inner, 1 = outer, regardless of x-direction
        const x = eyeXInner + frac * (eyeXOuter - eyeXInner);
        const lidY = debugV2PolylineY(lidPoly, x);
        const browY = debugV2PolylineY(browPoly, x);
        if (lidY === null || browY === null) { candidates.push(null); continue; }
        const denom = browY - lidY;
        if (Math.abs(denom) < 2) { candidates.push(null); continue; } // near-zero lid-to-brow separation guard, not a calibrated threshold
        const yTop = Math.min(lidY, browY), yBottom = Math.max(lidY, browY);
        const rowTop = Math.max(0, Math.round(yTop)), rowBottom = Math.min(roi.h - 1, Math.round(yBottom));
        const rows = rowBottom - rowTop;
        if (rows < 3) { candidates.push(null); continue; }
        const xLo = Math.max(0, Math.round(x - COLUMN_HALF_WIDTH)), xHi = Math.min(roi.w, Math.round(x + COLUMN_HALF_WIDTH) + 1);
        if (xHi - xLo < 1) { candidates.push(null); continue; }

        const grad = new Float32Array(rows);
        for (let ry = 1; ry < rows; ry++) {
          const y = rowTop + ry;
          let gsum = 0, n = 0;
          for (let cx = xLo; cx < xHi; cx++) {
            const idx = y * roi.w + cx;
            gsum += Math.abs(gray[idx] - gray[idx - roi.w]);
            n++;
          }
          grad[ry] = n ? gsum / n : 0;
        }
        const smoothed = new Float32Array(rows);
        for (let ry = 0; ry < rows; ry++) {
          const a = grad[Math.max(0, ry - 1)], b = grad[ry], c = grad[Math.min(rows - 1, ry + 1)];
          smoothed[ry] = (a + b + c) / 3;
        }
        let peakIdx = 0, peakVal = smoothed[0];
        for (let ry = 1; ry < rows; ry++) { if (smoothed[ry] > peakVal) { peakVal = smoothed[ry]; peakIdx = ry; } }
        let minLeft = Infinity; for (let ry = 0; ry <= peakIdx; ry++) minLeft = Math.min(minLeft, smoothed[ry]);
        let minRight = Infinity; for (let ry = peakIdx; ry < rows; ry++) minRight = Math.min(minRight, smoothed[ry]);
        const prominence = peakVal - Math.max(minLeft, minRight);
        const candY = rowTop + peakIdx;
        // t computed from the ORIGINAL (non-reordered) lidY/browY so the
        // documented t=0-at-lid / t=1-at-brow direction is correct
        // regardless of which one is numerically larger in pixel space.
        const t = (candY - lidY) / (browY - lidY);
        const { median, mad } = debugV2MedianMad(Array.from(smoothed));
        const madScaled = mad * 1.4826; // DERIVED — standard MAD->std-equivalent scale factor
        const localStrength = madScaled > 1e-6 ? (peakVal - median) / madScaled : null; // null (not Infinity/NaN) when the local band is too flat to normalize against

        // Thickness proxy: consecutive rows around the peak that stay
        // above half of (peak - local min) — "if measurable", not a
        // calibrated anatomical width.
        const localMin = Math.min(minLeft, minRight);
        const halfLevel = localMin + (peakVal - localMin) / 2;
        let thickness = 1;
        for (let ry = peakIdx - 1; ry >= 0 && smoothed[ry] >= halfLevel; ry--) thickness++;
        for (let ry = peakIdx + 1; ry < rows && smoothed[ry] >= halfLevel; ry++) thickness++;

        candidates.push({ sampleIndex: s, x, y: candY, t, rawStrength: peakVal, prominence, localStrength, thickness });
      }

      // ---- Link neighboring sampled columns into paths ----
      const paths = [];
      let current = null;
      for (let s = 0; s < SAMPLE_COLUMNS; s++) {
        const c = candidates[s];
        if (!c) { current = null; continue; }
        if (current && Math.abs(c.t - current[current.length - 1].t) <= PATH_LINK_MAX_T_GAP) {
          current.push(c);
        } else {
          current = [c];
          paths.push(current);
        }
      }
      const pathSummaries = paths.map(pts => {
        const ts = pts.map(p => p.t);
        const meanT = ts.reduce((a, b) => a + b, 0) / ts.length;
        const tVariation = Math.sqrt(ts.reduce((a, b) => a + (b - meanT) ** 2, 0) / ts.length);
        const meanRawStrength = pts.reduce((a, p) => a + p.rawStrength, 0) / pts.length;
        const localVals = pts.map(p => p.localStrength).filter(v => v != null);
        const meanLocalStrength = localVals.length ? localVals.reduce((a, b) => a + b, 0) / localVals.length : null;
        const meanThickness = pts.reduce((a, p) => a + p.thickness, 0) / pts.length;
        return {
          points: pts,
          xSpan: [pts[0].x, pts[pts.length - 1].x],
          continuityFrac: pts.length / SAMPLE_COLUMNS,
          meanT, tVariation, meanRawStrength, meanLocalStrength, meanThickness,
        };
      });

      // ---- DEBUG-ONLY heuristic rank, purely to pick a display
      // candidate for the overlay. Never a production confidence score
      // — every path above is returned regardless of this ranking. ----
      const DEBUG_HEURISTIC_RANK = (p) => p.continuityFrac * (p.meanLocalStrength != null ? p.meanLocalStrength : p.meanRawStrength);
      let displayIdx = -1, bestRank = -Infinity;
      pathSummaries.forEach((p, i) => { const r = DEBUG_HEURISTIC_RANK(p); if (r > bestRank) { bestRank = r; displayIdx = i; } });

      // ---- DEBUG-ONLY descriptive state. Deliberately NOT split into
      // WEAK_CANDIDATE / IMPLAUSIBLE_LOCATION / STABLE_STRONG_PLAUSIBLE
      // here — doing so would require exactly the unvalidated
      // thresholds this phase is avoiding. Only the cases decidable
      // without any threshold (zero paths vs. more than one) are
      // reported; a single path is reported as 'DEBUG_HEURISTIC' with
      // its full raw measurements attached, not a stronger claim. ----
      let debugHeuristicState = 'NO_CANDIDATE';
      if (pathSummaries.length > 1) debugHeuristicState = 'MULTIPLE_CANDIDATES';
      else if (pathSummaries.length === 1) debugHeuristicState = 'DEBUG_HEURISTIC';

      const v2RuntimeMs = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) - t0;
      return {
        valid: true,
        roiW: roi.w, roiH: roi.h,
        lidPoly, browPoly,
        sampledColumns: SAMPLE_COLUMNS,
        candidates,
        paths: pathSummaries,
        displayPathIndex: displayIdx,
        debugHeuristicState,
        v2RuntimeMs,
      };
    }

    // ============================================================
    // EYELID CREASE V2.1 — DEBUG-ONLY MULTI-PEAK SHADOW EXPERIMENT.
    // ------------------------------------------------------------
    // A NEW sibling of detectEyelidCreaseV2 above — that function is
    // NOT modified by this block, byte-for-byte (see the sha256
    // checkpoint test in tests/eyelid-crease-v2.test.js). The audit
    // that preceded this experiment proved detectEyelidCreaseV2 keeps
    // exactly ONE argmax peak per sampled column, discarding any
    // weaker secondary local maximum before it can ever be linked or
    // ranked. This experiment answers one question only: does a
    // weaker secondary peak exist underneath the dominant one? It
    // does NOT decide which peak is anatomically correct, does NOT
    // link secondary peaks into paths, and is NOT wired into
    // classifyFeatures or any production metric.
    //
    // DEBUG_V2_MULTI_MAX_PEAKS is an experimental observation cap,
    // not a validated production constant — kept separate from
    // DEBUG_V2_UNCALIBRATED so that object's own hash stays untouched.
    // ============================================================
    const DEBUG_V2_MULTI_MAX_PEAKS = 3;

    // Local maxima of a per-column smoothed gradient profile, using
    // -Infinity for a missing neighbor at either band edge — so a
    // profile that is still rising all the way to row 0 or row
    // rows-1 correctly reports that edge row as a local maximum
    // (this must be at least as permissive as detectEyelidCreaseV2's
    // own unrestricted argmax, which can itself land on a boundary
    // row — see the V1/V2 boundary-peak audit finding).
    function debugV2FindLocalMaxima(smoothed) {
      const rows = smoothed.length;
      const idxs = [];
      for (let ry = 0; ry < rows; ry++) {
        const left = ry > 0 ? smoothed[ry - 1] : -Infinity;
        const right = ry < rows - 1 ? smoothed[ry + 1] : -Infinity;
        if (smoothed[ry] > left && smoothed[ry] > right) idxs.push(ry);
      }
      return idxs;
    }

    function detectEyelidCreaseV2Multi(sourceCanvas, eyePoints, browPoints) {
      const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      const roi = extractEyeROI(sourceCanvas, eyePoints, browPoints, 0.45);
      if (!roi || roi.w < 24 || roi.h < 16) return { valid: false, v2MultiRuntimeMs: 0 };
      let data;
      try { data = roi.ctx.getImageData(0, 0, roi.w, roi.h).data; } catch (e) { return { valid: false, v2MultiRuntimeMs: 0 }; }
      const gray = new Float32Array(roi.w * roi.h);
      for (let i = 0; i < roi.w * roi.h; i++) {
        const o = i * 4;
        gray[i] = 0.299 * data[o] + 0.587 * data[o + 1] + 0.114 * data[o + 2];
      }

      const lidPoly = [roi.eyeLocal[0], roi.eyeLocal[1], roi.eyeLocal[2], roi.eyeLocal[3]];
      const browPoly = roi.browLocal;
      const eyeXInner = lidPoly[0].x, eyeXOuter = lidPoly[3].x;
      const { SAMPLE_COLUMNS, COLUMN_HALF_WIDTH } = DEBUG_V2_UNCALIBRATED;

      const columns = [];
      for (let s = 0; s < SAMPLE_COLUMNS; s++) {
        const frac = SAMPLE_COLUMNS > 1 ? s / (SAMPLE_COLUMNS - 1) : 0.5;
        const x = eyeXInner + frac * (eyeXOuter - eyeXInner);
        const lidY = debugV2PolylineY(lidPoly, x);
        const browY = debugV2PolylineY(browPoly, x);
        if (lidY === null || browY === null) { columns.push({ sampleIndex: s, x, peaks: null }); continue; }
        const denom = browY - lidY;
        if (Math.abs(denom) < 2) { columns.push({ sampleIndex: s, x, peaks: null }); continue; }
        const yTop = Math.min(lidY, browY), yBottom = Math.max(lidY, browY);
        const rowTop = Math.max(0, Math.round(yTop)), rowBottom = Math.min(roi.h - 1, Math.round(yBottom));
        const rows = rowBottom - rowTop;
        if (rows < 3) { columns.push({ sampleIndex: s, x, peaks: null }); continue; }
        const xLo = Math.max(0, Math.round(x - COLUMN_HALF_WIDTH)), xHi = Math.min(roi.w, Math.round(x + COLUMN_HALF_WIDTH) + 1);
        if (xHi - xLo < 1) { columns.push({ sampleIndex: s, x, peaks: null }); continue; }

        // Identical gradient + smoothing computation to detectEyelidCreaseV2.
        const grad = new Float32Array(rows);
        for (let ry = 1; ry < rows; ry++) {
          const y = rowTop + ry;
          let gsum = 0, n = 0;
          for (let cx = xLo; cx < xHi; cx++) {
            const idx = y * roi.w + cx;
            gsum += Math.abs(gray[idx] - gray[idx - roi.w]);
            n++;
          }
          grad[ry] = n ? gsum / n : 0;
        }
        const smoothed = new Float32Array(rows);
        for (let ry = 0; ry < rows; ry++) {
          const a = grad[Math.max(0, ry - 1)], b = grad[ry], c = grad[Math.min(rows - 1, ry + 1)];
          smoothed[ry] = (a + b + c) / 3;
        }

        // Same single-argmax algorithm as the frozen detectEyelidCreaseV2,
        // computed here verbatim so this experimental multi-peak list is
        // provably anchored to the exact same winner V2 itself reports —
        // this is the control point item 7 of the experiment spec tests.
        let v2PeakIdx = 0, v2PeakVal = smoothed[0];
        for (let ry = 1; ry < rows; ry++) { if (smoothed[ry] > v2PeakVal) { v2PeakVal = smoothed[ry]; v2PeakIdx = ry; } }

        const localMaxIdxs = debugV2FindLocalMaxima(Array.from(smoothed));
        const candidateIdxs = localMaxIdxs.includes(v2PeakIdx) ? localMaxIdxs : localMaxIdxs.concat([v2PeakIdx]);

        const { median, mad } = debugV2MedianMad(Array.from(smoothed));
        const madScaled = mad * 1.4826;

        const built = candidateIdxs.map(ry => {
          const peakVal = smoothed[ry];
          let minLeft = Infinity; for (let r2 = 0; r2 <= ry; r2++) minLeft = Math.min(minLeft, smoothed[r2]);
          let minRight = Infinity; for (let r2 = ry; r2 < rows; r2++) minRight = Math.min(minRight, smoothed[r2]);
          const prominence = peakVal - Math.max(minLeft, minRight);
          const candY = rowTop + ry;
          const t = (candY - lidY) / (browY - lidY);
          const localStrength = madScaled > 1e-6 ? (peakVal - median) / madScaled : null;
          const localMin = Math.min(minLeft, minRight);
          const halfLevel = localMin + (peakVal - localMin) / 2;
          let thickness = 1;
          for (let r2 = ry - 1; r2 >= 0 && smoothed[r2] >= halfLevel; r2--) thickness++;
          for (let r2 = ry + 1; r2 < rows && smoothed[r2] >= halfLevel; r2++) thickness++;
          return { ry, y: candY, t, rawStrength: peakVal, prominence, localStrength, thickness, currentV2Winner: ry === v2PeakIdx };
        });

        // Sort strongest-first; on an exact rawStrength tie the point
        // already tagged currentV2Winner always wins the tiebreak (V2's
        // own argmax loop also resolves ties to a single winner), then
        // lowest row index — deterministic regardless of input order.
        built.sort((a, b) => {
          if (b.rawStrength !== a.rawStrength) return b.rawStrength - a.rawStrength;
          if (a.currentV2Winner !== b.currentV2Winner) return a.currentV2Winner ? -1 : 1;
          return a.ry - b.ry;
        });

        const top = built.slice(0, DEBUG_V2_MULTI_MAX_PEAKS).map((p, i) => ({
          rankWithinColumn: i,
          currentV2Winner: p.currentV2Winner,
          y: p.y, t: p.t, rawStrength: p.rawStrength, prominence: p.prominence,
          localStrength: p.localStrength, thickness: p.thickness,
        }));

        columns.push({ sampleIndex: s, x, peaks: top });
      }

      const v2MultiRuntimeMs = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) - t0;
      return {
        valid: true,
        roiW: roi.w, roiH: roi.h,
        sampledColumns: SAMPLE_COLUMNS,
        columns,
        v2MultiRuntimeMs,
      };
    }

    // ============================================================
    // EYELID CREASE V2.2 — DEBUG-ONLY MULTI-PEAK PATH LINKING SHADOW.
    // ------------------------------------------------------------
    // A NEW, SEPARATE post-processing layer over detectEyelidCreaseV2Multi's
    // OWN already-computed output (its `columns` array). This block does
    // NOT touch pixels, ROI, gradients, or smoothing at all — it takes
    // the peaks V2.1 already retained and links them across columns into
    // candidate paths, generalizing the EXACT linking rule
    // detectEyelidCreaseV2 (frozen) already uses for its own single
    // per-column candidate (see that function's "Link neighboring
    // sampled columns into paths" section, above): a link forms only
    // when |Δt| <= PATH_LINK_MAX_T_GAP, the SAME constant already in
    // DEBUG_V2_UNCALIBRATED — no new anatomical threshold is introduced
    // here, and none is tuned against any specific capture.
    //
    // The single difference from V2's own linker is architectural, not
    // numeric: V2 has exactly one candidate per column, so it only ever
    // tracks ONE open chain. V2.1 can have up to DEBUG_V2_MULTI_MAX_PEAKS
    // per column, so this generalizes the SAME rule to multiple
    // simultaneously open tracks (a direct, minimal extension — not the
    // DP/Viterbi lattice-optimization design sketched as a FUTURE option
    // in the earlier audit, which would require inventing a new scoring
    // function; this deliberately does not).
    //
    // Observation only: returns every linked path it finds, does not
    // rank/select a "true" crease, does not classify lid-vs-crease, and
    // is never wired into classifyFeatures.
    // ============================================================

    // Pure — no pixel/canvas access. Input: the `columns` array already
    // produced by detectEyelidCreaseV2Multi (each `{ sampleIndex, x,
    // peaks: [...] | null }`). Output: an array of raw point arrays
    // (not yet summarized) — each point is `{ sampleIndex, x, ...peak }`.
    //
    // Deterministic multi-track greedy linking: at each column, every
    // currently-open track greedily claims the closest still-unclaimed
    // peak within PATH_LINK_MAX_T_GAP of its own last t (ties broken by
    // lowest peak index, since tracks are processed in stable creation
    // order and peaks are scanned low-to-high); any peak left unclaimed
    // starts a brand-new track; a null/empty column closes every
    // currently-open track (mirroring V2's own "a missing column always
    // breaks the chain" behavior) rather than bridging across it.
    function debugV2LinkMultiPeakPaths(columns, maxTGap) {
      let tracks = [];
      const completed = [];
      for (let s = 0; s < columns.length; s++) {
        const col = columns[s];
        const peaks = (col && col.peaks) || [];
        const claimed = new Set();
        const stillActive = [];
        for (const track of tracks) {
          let bestK = -1, bestGap = Infinity;
          for (let k = 0; k < peaks.length; k++) {
            if (claimed.has(k)) continue;
            const gap = Math.abs(peaks[k].t - track.lastT);
            if (gap <= maxTGap && gap < bestGap) { bestGap = gap; bestK = k; }
          }
          if (bestK >= 0) {
            claimed.add(bestK);
            track.points.push({ sampleIndex: col.sampleIndex, x: col.x, ...peaks[bestK] });
            track.lastT = peaks[bestK].t;
            stillActive.push(track);
          } else {
            completed.push(track.points);
          }
        }
        tracks = stillActive;
        for (let k = 0; k < peaks.length; k++) {
          if (claimed.has(k)) continue;
          tracks.push({ points: [{ sampleIndex: col.sampleIndex, x: col.x, ...peaks[k] }], lastT: peaks[k].t });
        }
      }
      for (const track of tracks) completed.push(track.points);
      return completed;
    }

    // Pure — summarizes one linked path using the SAME fields/formulas
    // detectEyelidCreaseV2's own pathSummaries already use (meanT,
    // tVariation, continuityFrac, meanRawStrength, meanLocalStrength,
    // meanThickness, xSpan), so a V2.2 path can be read side-by-side
    // with a V2 path directly. containsV2Winner additionally marks
    // whether this linked path ever passes through the frozen V2's own
    // single-argmax candidate for that column — purely descriptive.
    function debugV2SummarizeLinkedPath(points, sampledColumns) {
      const ts = points.map(p => p.t);
      const meanT = ts.reduce((a, b) => a + b, 0) / ts.length;
      const tVariation = Math.sqrt(ts.reduce((a, b) => a + (b - meanT) ** 2, 0) / ts.length);
      const meanRawStrength = points.reduce((a, p) => a + p.rawStrength, 0) / points.length;
      const localVals = points.map(p => p.localStrength).filter(v => v != null);
      const meanLocalStrength = localVals.length ? localVals.reduce((a, b) => a + b, 0) / localVals.length : null;
      const meanThickness = points.reduce((a, p) => a + p.thickness, 0) / points.length;
      return {
        points,
        xSpan: [points[0].x, points[points.length - 1].x],
        continuityFrac: points.length / sampledColumns,
        meanT, tVariation, meanRawStrength, meanLocalStrength, meanThickness,
        containsV2Winner: points.some(p => p.currentV2Winner === true),
      };
    }

    // Convenience wrapper combining the two pure functions above, in the
    // same result shape as V2/V2.1 (`{ valid, sampledColumns, paths,
    // v2LinkedRuntimeMs }`) for direct reuse in the debug UI / copy
    // payload. Takes an already-computed V2.1 `columns` array — does not
    // call detectEyelidCreaseV2Multi itself, so wiring it into
    // LiveScanScreen costs no extra pixel work beyond what V2.1 already does.
    function debugV2BuildLinkedPaths(columns, sampledColumns, maxTGap) {
      const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      const rawPaths = debugV2LinkMultiPeakPaths(columns || [], maxTGap);
      const paths = rawPaths.map(pts => debugV2SummarizeLinkedPath(pts, sampledColumns));
      const v2LinkedRuntimeMs = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) - t0;
      return { valid: true, sampledColumns, paths, v2LinkedRuntimeMs };
    }

    // ============================================================
    // HOODING V2 — STAGE 1: RAW GEOMETRY INSTRUMENTATION (measure only).
    // ------------------------------------------------------------
    // Pure downstream consumer of detectEyelidCreaseV2Multi's (V2.1,
    // frozen) `columns` and debugV2BuildLinkedPaths's (V2.2, frozen)
    // `paths` — touches no pixels/canvas/ROI, adds no new edge or peak
    // detection. Its only job is to relate what V2.1/V2.2 already
    // found to the lash-line reference (V2's own returned lidPoly,
    // exposed here — identical geometry V2.1 already builds
    // internally) so a human can visually identify which, if any,
    // additional persistent path is the lower edge of overhanging
    // skin. NO path is labeled hood/overhang/non-hood here — every
    // path beyond V2's own already-selected per-column winner is
    // named neutrally ("additional path"). This does not decide
    // hooding; a future Stage 2 would build a validated classifier
    // FROM this data, not from anything computed here.
    // ============================================================
    const HOODING_V2_STAGE = 1;

    // Exact reconstruction of V1's OWN already-computed creaseYFrac
    // into an ROI-local Y position, so V1's real result can be drawn
    // on the same overlay as V2.1/V2.2 (which already work in
    // ROI-local pixel space). This is NOT a re-detection — V1's real
    // valid/prominence/peakVal/creaseYFrac/readQuality values are used
    // completely unmodified; only the boundary geometry V1 itself
    // derives its search band from (eyeUpperY = min of the two
    // upper-lid points, browBottomY = max of the brow points — see
    // detectEyelidCrease above) is recomputed here, from lidPoly/
    // browPoly. V1 and V2 both derive their ROI from the IDENTICAL
    // extractEyeROI(sourceCanvas, eyePoints, browPoints, 0.45) call
    // (same source canvas, same physical eye/brow points, same 0.45
    // padding — see both functions' own first line), so this
    // reconstructed position is exact given matching inputs, not an
    // approximation.
    function debugV2DeriveV1CreaseY(v1Result, lidPoly, browPoly) {
      if (!v1Result || !v1Result.valid || !lidPoly || !browPoly) return null;
      const eyeUpperY = Math.min(lidPoly[1].y, lidPoly[2].y);
      const browBottomY = Math.max(...browPoly.map(p => p.y));
      const bandTop = browBottomY + (eyeUpperY - browBottomY) * 0.1;
      const bandBottom = eyeUpperY;
      const rows = bandBottom - bandTop;
      if (!(rows > 0)) return null;
      const peakIdxApprox = v1Result.creaseYFrac * (rows - 1);
      return bandTop + peakIdxApprox;
    }

    // Per-eye descriptive structure — pure data relation, zero
    // classification. `v1Result` = the real production
    // detectEyelidCrease output for this eye (unmodified). `v2MultiResult`
    // = detectEyelidCreaseV2Multi's own output (V2.1, frozen).
    // `v2LinkedResult` = debugV2BuildLinkedPaths's own output (V2.2,
    // frozen). `lidPoly`/`browPoly` = V2's own returned reference
    // polylines for this eye (byte-identical geometry V2.1 already
    // built internally — exposed here, not recomputed from pixels).
    // `eyeWidthPx` = the real, already-computed computeEyeSideMetrics
    // width for this eye.
    function buildHoodingV2Debug(v1Result, v2MultiResult, v2LinkedResult, lidPoly, browPoly, eyeWidthPx) {
      const sampledColumns = v2MultiResult && v2MultiResult.valid ? v2MultiResult.sampledColumns : 0;
      const rawColumns = v2MultiResult && v2MultiResult.valid ? v2MultiResult.columns : [];
      const rawPaths = v2LinkedResult && v2LinkedResult.valid ? v2LinkedResult.paths : [];

      // Neutral, stable display IDs assigned left-to-right by each
      // path's own start x — a display convenience only, not a
      // ranking of which path matters more.
      const allPaths = rawPaths.slice()
        .sort((a, b) => a.xSpan[0] - b.xSpan[0])
        .map((p, i) => Object.assign({ id: 'P' + i }, p));
      // The one path (if any) containing V2's own per-column winner —
      // already computed by V2.1/V2.2 (currentV2Winner/containsV2Winner),
      // not a new selection made here. Every other path is "additional"
      // — neutral, never auto-labeled overhang.
      const winnerPath = allPaths.find(p => p.containsV2Winner) || null;
      const additionalPathIds = allPaths.filter(p => p !== winnerPath).map(p => p.id);
      // Per-path average distance to the lash reference — computed
      // once here (not per-render) from the same lidPoly interpolation
      // used everywhere else in this function. Purely descriptive.
      allPaths.forEach(p => {
        const ds = p.points.map(pt => {
          const yLash = lidPoly ? debugV2PolylineY(lidPoly, pt.x) : null;
          return (yLash != null) ? Math.abs(pt.y - yLash) : null;
        }).filter(v => v != null);
        p.avgDistFromLashPx = ds.length ? ds.reduce((a, b) => a + b, 0) / ds.length : null;
      });

      const v1DerivedY = debugV2DeriveV1CreaseY(v1Result, lidPoly, browPoly);

      const columns = rawColumns.map(col => {
        const x = col.x;
        const yLash = lidPoly ? debugV2PolylineY(lidPoly, x) : null;
        const yBrow = browPoly ? debugV2PolylineY(browPoly, x) : null;
        const peaks = col.peaks || [];
        const winnerPeak = peaks.find(p => p.currentV2Winner) || null;
        const pathIdsThroughColumn = allPaths
          .filter(p => p.points.some(pt => pt.sampleIndex === col.sampleIndex))
          .map(p => p.id);
        const additionalPathDistances = allPaths
          .filter(p => p.id !== (winnerPath && winnerPath.id) && p.points.some(pt => pt.sampleIndex === col.sampleIndex))
          .map(p => {
            const pt = p.points.find(pt2 => pt2.sampleIndex === col.sampleIndex);
            return { pathId: p.id, y: pt.y, distFromLashPx: (yLash != null) ? Math.abs(pt.y - yLash) : null };
          });
        return {
          sampleIndex: col.sampleIndex, x,
          yLash, yBrow,
          rawPeaks: peaks, // untruncated — every V2.1 peak this column found, unmodified
          yCreaseWinner: winnerPeak ? winnerPeak.y : null,
          distLashToCreaseWinnerPx: (yLash != null && winnerPeak) ? Math.abs(winnerPeak.y - yLash) : null,
          pathIdsThroughColumn,
          additionalPathDistances,
        };
      });

      const lashYs = columns.map(c => c.yLash).filter(v => v != null);
      const avgLashY = lashYs.length ? lashYs.reduce((a, b) => a + b, 0) / lashYs.length : null;
      const creaseWinnerYs = columns.map(c => c.yCreaseWinner).filter(v => v != null);
      const avgCreaseWinnerY = creaseWinnerYs.length ? creaseWinnerYs.reduce((a, b) => a + b, 0) / creaseWinnerYs.length : null;
      const lashCreaseDistancePx = (avgLashY != null && avgCreaseWinnerY != null) ? Math.abs(avgCreaseWinnerY - avgLashY) : null;
      // Ratio only — a raw measurement, not a classification. Built
      // purely from the lash reference and V2's own already-selected
      // per-column winner (an existing fold-detection signal,
      // unrelated to any hooding/overhang judgment) — no assumption
      // about which additional path, if any, is overhang skin is made
      // or needed to compute this.
      const lashCreaseRatio = (lashCreaseDistancePx != null && eyeWidthPx) ? lashCreaseDistancePx / eyeWidthPx : null;

      return {
        valid: !!(v2MultiResult && v2MultiResult.valid),
        stage: HOODING_V2_STAGE,
        sampledColumns,
        eyeWidthPx: (typeof eyeWidthPx === 'number') ? eyeWidthPx : null,
        lashReference: { avgY: avgLashY, source: "V2's own lidPoly (upper-lid contour) — the same geometry V1/V2/V2.1 all derive from" },
        productionV1: v1Result ? {
          valid: v1Result.valid, prominence: v1Result.prominence, peakVal: v1Result.peakVal,
          creaseYFrac: v1Result.creaseYFrac, readQuality: v1Result.readQuality,
          derivedRoiY: v1DerivedY,
        } : null,
        allPaths, // full raw V2.2 paths (points included, untruncated), IDs assigned
        creaseWinnerPathId: winnerPath ? winnerPath.id : null,
        additionalPathIds,
        lashCreaseDistancePx, lashCreaseRatio,
        columns,
      };
    }

    // L/R descriptive comparison of the per-eye structures above —
    // plain differences only, no classification, no combined verdict.
    function buildHoodingV2CrossEye(leftDebug, rightDebug) {
      if (!leftDebug || !rightDebug) return null;
      const num = (v) => (typeof v === 'number' && Number.isFinite(v)) ? v : null;
      const diff = (a, b) => (num(a) != null && num(b) != null) ? Math.abs(a - b) : null;
      return {
        eyeWidthDiffPx: diff(leftDebug.eyeWidthPx, rightDebug.eyeWidthPx),
        additionalPathCountDiff: diff(leftDebug.additionalPathIds && leftDebug.additionalPathIds.length, rightDebug.additionalPathIds && rightDebug.additionalPathIds.length),
        lashCreaseRatioDiff: diff(leftDebug.lashCreaseRatio, rightDebug.lashCreaseRatio),
        lashCreaseDistancePxDiff: diff(leftDebug.lashCreaseDistancePx, rightDebug.lashCreaseDistancePx),
      };
    }

    // ============================================================
    // HOODING V2 — STAGE 2B: PATH TOPOLOGY (measurement only).
    // ------------------------------------------------------------
    // Pure downstream consumer of buildHoodingV2Debug's own output
    // (Stage 1, unmodified) — which is itself already a pure consumer
    // of V2/V2.1 (frozen)/V2.2 (frozen). Touches no pixels/canvas/ROI,
    // adds no new edge or peak detection, introduces NO calibrated
    // threshold anywhere. Every path Stage 1 found is retained, given
    // a deterministic order, and described relative to its neighbors
    // and to the (unmodified) V2 winner — nothing here selects,
    // ranks-for-truth, filters, or classifies. A future Stage 3 would
    // learn a calibrated signal FROM this data, from real labeled
    // eyes; nothing here decides hooded/non-hooded, and nothing here
    // is fed back into hoodingState/isHooded/hoodedConfidence/
    // hoodingLevel/eyelidType/eyelidCategory/creaseState/
    // finalProfile/rec.eyeProfile.
    // ============================================================
    const HOODING_V2_TOPOLOGY_STAGE = '2B-measurement-only';

    // Structural helper — a plain arithmetic mean, not a threshold.
    function debugV2BMean(values) {
      return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
    }
    // Structural helper — sample standard deviation, not a threshold.
    function debugV2BStdDev(values, mean) {
      if (!values.length) return null;
      const v = values.reduce((a, b) => a + (b - mean) ** 2, 0) / values.length;
      return Math.sqrt(v);
    }
    // Structural helper — safe ratio (zero-division guard only).
    function debugV2BRatio(numer, denom) {
      return (typeof numer === 'number' && typeof denom === 'number' && denom !== 0) ? numer / denom : null;
    }
    // Structural helper — safe absolute difference (null-safe only).
    function debugV2BAbsDiff(a, b) {
      return (typeof a === 'number' && typeof b === 'number') ? Math.abs(a - b) : null;
    }
    // Structural helper — geometric span normalization, not a
    // threshold. xSpan is stored by V2/V2.2 (frozen, unmodified) as
    // [firstPoint.x, lastPoint.x] — i.e. in SAMPLE order, not
    // guaranteed left-to-right. Physical LEFT/RIGHT normalization can
    // walk a path's columns in either x direction (a real RIGHT-eye
    // trace can read xSpan: [59.27, 44.51], not just [44.51, 59.27]),
    // so every Stage 2B computation that treats a span as an interval
    // must normalize through this helper first — never index xSpan[0]/
    // xSpan[1] directly as "start"/"end".
    function debugV2BSpanMinMax(xSpan) {
      return [Math.min(xSpan[0], xSpan[1]), Math.max(xSpan[0], xSpan[1])];
    }

    // Every linked path Stage 1 found (hoodingDebug.allPaths),
    // deterministically ordered ascending by meanT (t=0 near the lash
    // line, t=1 near the brow — V2's own documented convention, see
    // detectEyelidCreaseV2's module comment) — so index 0 is nearest
    // the lash and the last index is nearest the brow. No path is
    // dropped, re-ranked by strength, or filtered by any threshold.
    // Ties broken by the path's own stable P-id (P0 < P1 < ...) so
    // ordering is fully deterministic regardless of input order.
    function debugV2BOrderPaths(hoodingDebug) {
      const paths = (hoodingDebug && hoodingDebug.allPaths) || [];
      const idNum = (id) => parseInt(String(id).replace(/^P/, ''), 10);
      return paths
        .slice()
        .sort((a, b) => (a.meanT - b.meanT) || (idNum(a.id) - idNum(b.id)))
        .map((p, i) => ({
          pathId: p.id,
          orderedIndex: i,
          meanT: p.meanT,
          continuityFrac: p.continuityFrac,
          pointCount: p.points.length,
          xSpan: p.xSpan,
          meanRawStrength: p.meanRawStrength,
          meanLocalStrength: p.meanLocalStrength,
          meanThickness: p.meanThickness,
          containsV2Winner: p.containsV2Winner,
          avgDistFromLashPx: p.avgDistFromLashPx,
          avgDistFromLashRatio: debugV2BRatio(p.avgDistFromLashPx, hoodingDebug.eyeWidthPx),
          tVariation: p.tVariation, // existing V2.2 field, exposed for cross-eye tVariationDiff below
          points: p.points, // kept for column-topology pairing below; not re-derived
        }));
    }

    // N ordered paths -> N-1 adjacent pairs. "lower"/"upper" follow
    // the same meanT convention: lower = smaller meanT = nearer the
    // lash. Descriptive measurements only — no verdict.
    function debugV2BAdjacentPairs(orderedPaths) {
      const pairs = [];
      for (let i = 0; i < orderedPaths.length - 1; i++) {
        const lower = orderedPaths[i], upper = orderedPaths[i + 1];
        const lowerBySample = new Map(lower.points.map(pt => [pt.sampleIndex, pt.y]));
        const seps = [];
        for (const pt of upper.points) {
          if (lowerBySample.has(pt.sampleIndex)) seps.push(Math.abs(pt.y - lowerBySample.get(pt.sampleIndex)));
        }
        const meanSep = debugV2BMean(seps);
        // Normalized to [minX, maxX] first — xSpan's raw stored order
        // (sample order, not left-to-right) must never be indexed
        // directly here, see debugV2BSpanMinMax.
        const [lowerMinX, lowerMaxX] = debugV2BSpanMinMax(lower.xSpan);
        const [upperMinX, upperMaxX] = debugV2BSpanMinMax(upper.xSpan);
        const overlapStart = Math.max(lowerMinX, upperMinX);
        const overlapEnd = Math.min(lowerMaxX, upperMaxX);
        const overlapWidth = Math.max(0, overlapEnd - overlapStart);
        const unionStart = Math.min(lowerMinX, upperMinX);
        const unionEnd = Math.max(lowerMaxX, upperMaxX);
        const unionWidth = unionEnd - unionStart;
        pairs.push({
          lowerPathId: lower.pathId, upperPathId: upper.pathId,
          deltaMeanT: upper.meanT - lower.meanT,
          deltaDistFromLashPx: debugV2BAbsDiff(upper.avgDistFromLashPx, lower.avgDistFromLashPx),
          deltaDistFromLashRatio: debugV2BAbsDiff(upper.avgDistFromLashRatio, lower.avgDistFromLashRatio),
          distFromLashPxRatio: debugV2BRatio(upper.avgDistFromLashPx, lower.avgDistFromLashPx),
          continuityLower: lower.continuityFrac, continuityUpper: upper.continuityFrac,
          pointCountLower: lower.pointCount, pointCountUpper: upper.pointCount,
          xOverlapFrac: unionWidth > 0 ? overlapWidth / unionWidth : null,
          meanVerticalSeparationPx: meanSep,
          verticalSeparationVariationPx: debugV2BStdDev(seps, meanSep),
          strengthRatio: debugV2BRatio(upper.meanRawStrength, lower.meanRawStrength),
          thicknessRatio: debugV2BRatio(upper.meanThickness, lower.meanThickness),
        });
      }
      return pairs;
    }

    // Where the EXISTING, unmodified V2 winner sits within the
    // ordering above. Does not change or re-select the winner.
    function debugV2BWinnerTopology(orderedPaths) {
      const idx = orderedPaths.findIndex(p => p.containsV2Winner);
      if (idx === -1) return null;
      const winner = orderedPaths[idx];
      const lower = idx > 0 ? orderedPaths[idx - 1] : null;
      const upper = idx < orderedPaths.length - 1 ? orderedPaths[idx + 1] : null;
      return {
        pathId: winner.pathId, orderedIndex: idx, pathCount: orderedPaths.length,
        normalizedOrderPosition: orderedPaths.length > 1 ? idx / (orderedPaths.length - 1) : 0,
        meanT: winner.meanT, distFromLashPx: winner.avgDistFromLashPx, distFromLashRatio: winner.avgDistFromLashRatio,
        pathsBelowCount: idx, pathsAboveCount: orderedPaths.length - idx - 1,
        nearestLowerPathId: lower ? lower.pathId : null, nearestUpperPathId: upper ? upper.pathId : null,
        gapToLowerT: lower ? (winner.meanT - lower.meanT) : null,
        gapToUpperT: upper ? (upper.meanT - winner.meanT) : null,
      };
    }

    // Pure argmin/argmax over already-computed values — never a
    // classification rule. Each extremum is exposed as the plain
    // value it is (an id, an index, an array, a number), never
    // reduced to a boolean.
    function debugV2BExtrema(orderedPaths, adjacentPairs, winnerTopology) {
      const argExtreme = (arr, keyFn, better) => {
        let best = null;
        for (const item of arr) {
          const v = keyFn(item);
          if (v == null) continue;
          if (best === null || better(v, keyFn(best))) best = item;
        }
        return best;
      };
      const largest = argExtreme(adjacentPairs, p => p.deltaMeanT, (a, b) => a > b);
      const smallest = argExtreme(adjacentPairs, p => p.deltaMeanT, (a, b) => a < b);
      const maxContinuity = argExtreme(orderedPaths, p => p.continuityFrac, (a, b) => a > b);
      // Span width via debugV2BSpanMinMax, never a raw xSpan[1]-xSpan[0]
      // subtraction — that goes negative for a reversed-order span and
      // would silently pick the wrong "widest" path.
      const maxXSpan = argExtreme(orderedPaths, p => { const [mn, mx] = debugV2BSpanMinMax(p.xSpan); return mx - mn; }, (a, b) => a > b);
      let nearestToWinner = null;
      if (winnerTopology) {
        const gapLower = winnerTopology.gapToLowerT, gapUpper = winnerTopology.gapToUpperT;
        if (gapLower != null && (gapUpper == null || gapLower <= gapUpper)) nearestToWinner = winnerTopology.nearestLowerPathId;
        else if (gapUpper != null) nearestToWinner = winnerTopology.nearestUpperPathId;
      }
      return {
        totalLinkedPathCount: orderedPaths.length,
        orderedMeanTValues: orderedPaths.map(p => p.meanT),
        allAdjacentDeltaMeanT: adjacentPairs.map(p => p.deltaMeanT),
        allAdjacentDistanceRatios: adjacentPairs.map(p => p.distFromLashPxRatio),
        winnerOrderedIndex: winnerTopology ? winnerTopology.orderedIndex : null,
        largestAdjacentGap: largest ? { lowerPathId: largest.lowerPathId, upperPathId: largest.upperPathId, deltaMeanT: largest.deltaMeanT } : null,
        smallestAdjacentGap: smallest ? { lowerPathId: smallest.lowerPathId, upperPathId: smallest.upperPathId, deltaMeanT: smallest.deltaMeanT } : null,
        maxContinuityPath: maxContinuity ? maxContinuity.pathId : null,
        maxXSpanPath: maxXSpan ? maxXSpan.pathId : null,
        nearestToWinner,
      };
    }

    // Per-column view: which paths actually cross each sampled x, and
    // how far apart they sit there — meanT alone (a whole-path
    // average) can hide two paths that cross partway across the eye;
    // this exposes that directly from the SAME points Stage 1 already
    // has, no new sampling. rankByHeight: 0 = smallest y (topmost,
    // nearest the brow) at that column, ascending downward.
    function debugV2BColumns(hoodingDebug, orderedPaths) {
      const cols = (hoodingDebug && hoodingDebug.columns) || [];
      return cols.map(col => {
        const raw = orderedPaths
          .map(p => {
            const pt = p.points.find(ptt => ptt.sampleIndex === col.sampleIndex);
            if (!pt) return null;
            return { pathId: p.pathId, y: pt.y, t: pt.t, distFromLashPx: (col.yLash != null) ? Math.abs(pt.y - col.yLash) : null };
          })
          .filter(v => v != null)
          .sort((a, b) => a.y - b.y);
        const intersections = raw.map((v, i) => Object.assign({ rankByHeight: i }, v));
        const adjacentSeparationsPx = [];
        for (let i = 0; i < intersections.length - 1; i++) adjacentSeparationsPx.push(Math.abs(intersections[i + 1].y - intersections[i].y));
        return { sampleIndex: col.sampleIndex, x: col.x, yLash: col.yLash, yBrow: col.yBrow, intersections, adjacentSeparationsPx };
      });
    }

    // Per-eye entry point — the only function LiveScanScreen calls
    // for one eye's Stage 2B topology.
    function buildHoodingTopologyV2B(hoodingDebug) {
      const orderedPaths = debugV2BOrderPaths(hoodingDebug);
      const adjacentPairs = debugV2BAdjacentPairs(orderedPaths);
      const winnerTopology = debugV2BWinnerTopology(orderedPaths);
      const extrema = debugV2BExtrema(orderedPaths, adjacentPairs, winnerTopology);
      const columns = debugV2BColumns(hoodingDebug, orderedPaths);
      // `points` was only needed internally (adjacent-pair/column
      // pairing above); strip it from the returned orderedPaths so
      // the public shape matches the requested field list exactly
      // (points remain fully available, untruncated, in the sibling
      // hoodingV2Raw.allPaths[].points Stage 1 already exposes).
      const publicOrderedPaths = orderedPaths.map(({ points, ...rest }) => rest);
      return { orderedPaths: publicOrderedPaths, adjacentPairs, winnerTopology, extrema, columns };
    }

    // Every LEFT path x every RIGHT path — no matching threshold, no
    // "same structure" claim. nearestByMeanT is a pure per-left-path
    // argmin over |meanT difference| — a numeric nearest-neighbor
    // pairing only, NEVER an anatomical correspondence claim.
    function buildHoodingTopologyV2BCrossEye(leftTopology, rightTopology) {
      const leftPaths = (leftTopology && leftTopology.orderedPaths) || [];
      const rightPaths = (rightTopology && rightTopology.orderedPaths) || [];
      const pairwisePathDistances = [];
      for (const lp of leftPaths) {
        for (const rp of rightPaths) {
          pairwisePathDistances.push({
            leftPathId: lp.pathId, rightPathId: rp.pathId,
            meanTDiff: debugV2BAbsDiff(lp.meanT, rp.meanT),
            continuityDiff: debugV2BAbsDiff(lp.continuityFrac, rp.continuityFrac),
            pointCountDiff: debugV2BAbsDiff(lp.pointCount, rp.pointCount),
            distFromLashRatioDiff: debugV2BAbsDiff(lp.avgDistFromLashRatio, rp.avgDistFromLashRatio),
            thicknessDiff: debugV2BAbsDiff(lp.meanThickness, rp.meanThickness),
            // Reuses V2.2's OWN existing tVariation field (already
            // computed by debugV2SummarizeLinkedPath from the path's
            // real points) — a spread/variation statistic of t along
            // the path, NOT an actual curvature measure (no second
            // derivative, no arc-length, no direction-change angle is
            // computed anywhere here). Named for exactly what it is,
            // so no later calibration code mistakes it for curvature.
            tVariationDiff: debugV2BAbsDiff(lp.tVariation, rp.tVariation),
          });
        }
      }
      // Pure argmin per LEFT path — deterministic, first-match-wins on
      // an exact tie.
      const nearestByMeanT = leftPaths.map(lp => {
        let best = null;
        for (const rp of rightPaths) {
          const d = debugV2BAbsDiff(lp.meanT, rp.meanT);
          if (d == null) continue;
          if (best === null || d < best.meanTDiff) best = { leftPathId: lp.pathId, rightPathId: rp.pathId, meanTDiff: d };
        }
        return best;
      }).filter(v => v != null);
      let winnerCrossEye = null;
      const lw = leftTopology && leftTopology.winnerTopology;
      const rw = rightTopology && rightTopology.winnerTopology;
      if (lw && rw) {
        winnerCrossEye = {
          leftPathId: lw.pathId, rightPathId: rw.pathId,
          meanTDiff: debugV2BAbsDiff(lw.meanT, rw.meanT),
          distFromLashPxDiff: debugV2BAbsDiff(lw.distFromLashPx, rw.distFromLashPx),
          distFromLashRatioDiff: debugV2BAbsDiff(lw.distFromLashRatio, rw.distFromLashRatio),
          continuityDiff: (() => {
            const lp = leftPaths.find(p => p.pathId === lw.pathId);
            const rp = rightPaths.find(p => p.pathId === rw.pathId);
            return debugV2BAbsDiff(lp && lp.continuityFrac, rp && rp.continuityFrac);
          })(),
          thicknessDiff: (() => {
            const lp = leftPaths.find(p => p.pathId === lw.pathId);
            const rp = rightPaths.find(p => p.pathId === rw.pathId);
            return debugV2BAbsDiff(lp && lp.meanThickness, rp && rp.meanThickness);
          })(),
          leftOrderedIndex: lw.orderedIndex, rightOrderedIndex: rw.orderedIndex,
        };
      }
      return { pairwisePathDistances, nearestByMeanT, winnerCrossEye };
    }

    const REASON_MESSAGES = {
      low_face_confidence: 'hintLowConf',
      head_tilted: 'hintLookStraight',
      head_turned: 'hintLookStraight',
      head_pitch: 'hintLookStraight',
      eyes_closed: 'hintEyesClosed',
      too_dark: 'hintTooDark',
      too_bright: 'hintTooBright',
      blurry: 'hintBlurry',
      too_far: 'hintTooFar',
      too_close: 'hintTooClose',
    };

    function assessFrameQuality({ detScore, headPose, leftEAR, rightEAR, brightness, sharpness, canvasWidth, boxWidth }) {
      const reasons = [];
      if (detScore < 0.6) reasons.push('low_face_confidence');
      if (Math.abs(headPose.roll) > 18) reasons.push('head_tilted');
      if (Math.abs(headPose.yawProxy) > 0.32) reasons.push('head_turned');
      if (headPose.pitchProxy < 0.25 || headPose.pitchProxy > 1.3) reasons.push('head_pitch');
      if (leftEAR < 0.15 || rightEAR < 0.15) reasons.push('eyes_closed');
      if (brightness < 45) reasons.push('too_dark');
      if (brightness > 235) reasons.push('too_bright');
      if (sharpness < 10) reasons.push('blurry');
      const faceRatio = boxWidth / Math.max(canvasWidth, 1);
      if (faceRatio < 0.16) reasons.push('too_far');
      if (faceRatio > 0.78) reasons.push('too_close');
      return { ok: reasons.length === 0, reasons };
    }

    function sampleBrightness(ctx, points) {
      const xs = points.map(p => p.x), ys = points.map(p => p.y);
      const x0 = Math.max(0, Math.round(Math.min(...xs) - 10));
      const y0 = Math.max(0, Math.round(Math.min(...ys) - 10));
      const w = Math.max(1, Math.round(Math.max(...xs) - x0 + 20));
      const h = Math.max(1, Math.round(Math.max(...ys) - y0 + 20));
      try {
        const data = ctx.getImageData(x0, y0, w, h).data;
        let sum = 0, n = 0;
        for (let i = 0; i < data.length; i += 4) { sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]; n++; }
        return n ? sum / n : 128;
      } catch (e) { return 128; }
    }

    function estimateSharpness(ctx, box) {
      try {
        const x0 = Math.max(0, Math.round(box.x)), y0 = Math.max(0, Math.round(box.y));
        const w = Math.min(80, Math.round(box.width)), h = Math.min(80, Math.round(box.height));
        if (w < 8 || h < 8) return 100;
        const data = ctx.getImageData(x0, y0, w, h).data;
        const gray = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) { const o = i * 4; gray[i] = 0.299*data[o] + 0.587*data[o+1] + 0.114*data[o+2]; }
        let sum = 0;
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            const lap = gray[idx-1] + gray[idx+1] + gray[idx-w] + gray[idx+w] - 4*gray[idx];
            sum += lap * lap;
          }
        }
        return sum / ((w-2) * (h-2));
      } catch (e) { return 100; }
    }

    function estimateIrisCenter(ctx, eyePoints) {
      const xs = eyePoints.map(p => p.x), ys = eyePoints.map(p => p.y);
      const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
      const fallback={x:(minX+maxX)/2,y:(minY+maxY)/2};
      const eyeW=maxX-minX, eyeH=maxY-minY;
      const x0=Math.max(0,Math.floor(minX)), y0=Math.max(0,Math.floor(minY));
      const w=Math.max(1,Math.ceil(maxX)-x0+1), h=Math.max(1,Math.ceil(maxY)-y0+1);
      try {
        const data=ctx.getImageData(x0,y0,w,h).data;
        const luma=(x,y)=>{const i=(y*w+x)*4;return .299*data[i]+.587*data[i+1]+.114*data[i+2];};
        const refs=[];
        const search=[];
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const gx=x0+x,gy=y0+y;
          if(!isInsideIrisCenterSearch(gx,gy,fallback,eyeW,eyeH))continue;
          refs.push(luma(x,y)); search.push({x,y,gx,gy});
        }
        if(refs.length<9)return {...fallback,method:'landmark_midpoint',contrast:0};
        const sorted=[...refs].sort((a,b)=>a-b), reference=sorted[Math.floor(sorted.length/2)];
        const windowRadius=Math.max(1,Math.round(eyeH*.10));
        const enclosureRadius=Math.max(windowRadius+2,Math.round(eyeH*.25));
        let best=null;
        for(const c of search){
          let sum=0,n=0;
          for(let yy=-windowRadius;yy<=windowRadius;yy++)for(let xx=-windowRadius;xx<=windowRadius;xx++){
            if(xx*xx+yy*yy>windowRadius*windowRadius)continue;
            const px=c.x+xx,py=c.y+yy;if(px<0||py<0||px>=w||py>=h)continue;
            sum+=luma(px,py);n++;
          }
          if(!n)continue;
          const mean=sum/n;
          // A pupil is a compact dark basin surrounded by lighter iris in
          // nearly every direction.  A lash/eyelid edge can be darker than
          // the pupil, but remains dark along one side of this ring.  Reject
          // those open, elongated dark edges before they can relocate the
          // iris ROI onto eyelid/skin.  This is deliberately luminance-only:
          // light and dark iris colours use the same geometry check.
          const ring=[];
          for(let k=0;k<24;k++){
            const angle=k*Math.PI*2/24;
            const px=Math.round(c.x+enclosureRadius*Math.cos(angle));
            const py=Math.round(c.y+enclosureRadius*Math.sin(angle));
            if(px<0||py<0||px>=w||py>=h)continue;
            ring.push(luma(px,py));
          }
          const enclosed=hasPupilEnclosure(mean,ring);
          if(!enclosed)continue;
          const dx=(c.gx-fallback.x)/Math.max(eyeW*.30,1),dy=(c.gy-fallback.y)/Math.max(eyeH*.22,1);
          const score=mean+8*dx*dx+12*dy*dy;
          if(!best||score<best.score)best={x:c.gx,y:c.gy,mean,score};
        }
        const contrast=best?reference-best.mean:0;
        return best&&contrast>=10?{x:best.x,y:best.y,method:'dark_pupil',contrast}:{...fallback,method:'landmark_midpoint',contrast};
      }catch(e){return {...fallback,method:'landmark_midpoint',contrast:0};}
    }

    function hasPupilEnclosure(centerMean, ringLuma) {
      return ringLuma.length>=18&&ringLuma.filter(v=>v>=centerMean+12).length/ringLuma.length>=5/6;
    }

    function isInsideIrisCenterSearch(x, y, center, eyeW, eyeH) {
      const nx=(x-center.x)/Math.max(eyeW*.30,1);
      const ny=(y-center.y)/Math.max(eyeH*.22,1);
      return nx*nx+ny*ny<=1;
    }

    function analyzeIrisSample(ctx, eyePoints, fixedCenter) {
      const xs = eyePoints.map(p => p.x), ys = eyePoints.map(p => p.y);
      const landmarkCx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const landmarkCy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const eyeW = Math.max(...xs) - Math.min(...xs);
      const eyeH = Math.max(...ys) - Math.min(...ys);
      const center=fixedCenter||estimateIrisCenter(ctx,eyePoints),cx=center.x,cy=center.y;
      // IRIS RADIUS CALIBRATION (evidence-based, see the dedicated
      // regression test below): the 0.22 multiplier measurably
      // underestimated the true visible iris radius -- independently
      // ray-cast measurement across 8 eyes / 4 real full-face images
      // (the BLUE/BROWN/UNCERTAIN E2E fixtures plus an external
      // diagnostic candidate) found the true iris/sclera boundary at
      // 1.32x-1.69x (median ~1.48x) the old estimate, causing the
      // outer/limbal iris band to be discarded via the
      // outside_iris_annulus rejection below before color evidence
      // there could ever be considered. 0.24 was chosen, not a larger
      // value fully closing that gap, because it is the smallest tested
      // increase that: (a) stays safely inside the true boundary with
      // margin on every measured eye, (b) does not disturb the one
      // established real-world green-eye fixture's correct
      // classification, and (c) does not introduce any false-GREEN
      // result anywhere in the existing regression corpus. Do not
      // increase this further without re-running that same multi-image
      // calibration sweep.
      const radius = Math.max(3, Math.min(eyeW, eyeH * 2.4) * 0.24);
      const x0 = Math.max(0, Math.round(cx - radius)), y0 = Math.max(0, Math.round(cy - radius));
      const w = Math.max(1, Math.round(radius * 2)), h = Math.max(1, Math.round(radius * 2));
      const roi = { x0, y0, w, h, cx, cy, radius, eyeW, eyeH, landmarkCx, landmarkCy, centerMethod:center.method, centerContrast:center.contrast };
      let data;
      try { data = ctx.getImageData(x0, y0, w, h).data; } catch (e) {
        return { valid: false, roi, rgb: null, name: null, confidence: 0, samples: 0, candidates: [], accepted: [], rejected: [] };
      }
      const med = arr => { const s = [...arr].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; };
      const samples = [];
      const candidates = [];
      const rejected = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const dx = x - w/2, dy = y - h/2;
          if (dx*dx + dy*dy > radius*radius) continue;
          const idx = (y*w + x) * 4;

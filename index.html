          // that assume that exact raw, image-side ordering; see the
          // getPhysicalEyeLandmarks doc comment for why the purely-
          // visual mesh is deliberately left alone.
          const physicalLeft = getPhysicalEyeLandmarks(det.landmarks, 'left');
          const physicalRight = getPhysicalEyeLandmarks(det.landmarks, 'right');
          lastDetRef.current = {
            hasFace: true, ts: now, videoW: video.videoWidth, videoH: video.videoHeight, aligned: false,
            box: { x: det.detection.box.x/scale, y: det.detection.box.y/scale, width: det.detection.box.width/scale, height: det.detection.box.height/scale },
            leftEye: det.landmarks.getLeftEye().map(p => ({ x: p.x/scale, y: p.y/scale })),
            rightEye: det.landmarks.getRightEye().map(p => ({ x: p.x/scale, y: p.y/scale })),
            leftBrow: det.landmarks.getLeftEyeBrow().map(p => ({ x: p.x/scale, y: p.y/scale })),
            rightBrow: det.landmarks.getRightEyeBrow().map(p => ({ x: p.x/scale, y: p.y/scale })),
            // Physically-correct, canonical — feeds ONLY the "L"/"R"
            // eye-target labels (see the overlay draw loop below).
            physicalLeftEye: physicalLeft.eye.map(p => ({ x: p.x/scale, y: p.y/scale })),
            physicalRightEye: physicalRight.eye.map(p => ({ x: p.x/scale, y: p.y/scale })),
            jaw: det.landmarks.getJawOutline().map(p => ({ x: p.x/scale, y: p.y/scale })),
            nose: det.landmarks.getNose().map(p => ({ x: p.x/scale, y: p.y/scale })),
            mouth: det.landmarks.getMouth().slice(0, 12).map(p => ({ x: p.x/scale, y: p.y/scale })),
          };
          console.log('[LSA] FACE DETECTED', { score: det.detection.score.toFixed(3), box: det.detection.box });
          console.log('[LSA] LANDMARKS DETECTED', det.landmarks ? det.landmarks.positions.length + ' points' : 'MISSING');

          const headPose = computeHeadPose(det.landmarks);
          const leftMetrics = computeEyeSideMetrics(det.landmarks, 'left', headPose);
          const rightMetrics = computeEyeSideMetrics(det.landmarks, 'right', headPose);
          const leftEye = physicalLeft.eye, rightEye = physicalRight.eye;
          const brightness = sampleBrightness(ctx, leftEye.concat(rightEye));
          const sharpness = estimateSharpness(ctx, det.detection.box);

          const metricsNaN = [headPose.roll, headPose.yawProxy, headPose.pitchProxy, leftMetrics.ear, rightMetrics.ear, leftMetrics.widthRatio, rightMetrics.widthRatio, brightness, sharpness].some(v => Number.isNaN(v));
          console.log('[LSA] EYE METRICS', {
            roll: headPose.roll.toFixed(1), yaw: headPose.yawProxy.toFixed(3), pitch: headPose.pitchProxy.toFixed(3),
            leftEAR: leftMetrics.ear.toFixed(3), rightEAR: rightMetrics.ear.toFixed(3),
            brightness: brightness.toFixed(1), sharpness: sharpness.toFixed(1), hasNaN: metricsNaN,
          });
          if (metricsNaN) {
            console.log('[LSA] FRAME REJECTED: NaN in metrics');
            setPhase('adjust'); setStageKey(hasHadValidFrameRef.current ? 'stageRealigning' : 'stageFaceDetected'); setHintKey('hintBlurry');
            return;
          }

          const quality = assessFrameQuality({
            detScore: det.detection.score, headPose, leftEAR: leftMetrics.ear, rightEAR: rightMetrics.ear,
            brightness, sharpness, canvasWidth: canvas.width, boxWidth: det.detection.box.width,
          });

          if (!quality.ok) {
            console.log('[LSA] FRAME REJECTED:', quality.reasons.join(', '));
            setPhase('adjust'); setStageKey(hasHadValidFrameRef.current ? 'stageRealigning' : 'stageFaceDetected');
            setHintKey(boxClipped ? 'hintCenterFace' : (REASON_MESSAGES[quality.reasons[0]] || null));
            setProgress(Math.min(1, bufferRef.current.length / MIN_STABLE_FRAMES));
            return;
          }
          if (lastDetRef.current) lastDetRef.current.aligned = true;
          hasHadValidFrameRef.current = true;
          console.log('[LSA] VALID FRAME accepted into buffer');

          // Crease pixel analysis only runs on frames already accepted
          // by the quality gate above, same as the other per-frame CV
          // work in this tick — cheap enough at this ~5fps tick rate.
          const leftBrowPts = physicalLeft.brow, rightBrowPts = physicalRight.brow;
          const leftCrease = detectEyelidCrease(canvas, leftEye, leftBrowPts);
          const rightCrease = detectEyelidCrease(canvas, rightEye, rightBrowPts);
          leftMetrics.creaseValid = leftCrease.valid ? 1 : 0;
          leftMetrics.creaseProminence = leftCrease.valid ? leftCrease.prominence : 0;
          leftMetrics.creasePeak = leftCrease.valid ? leftCrease.peakVal : 0;
          leftMetrics.creaseYFrac = leftCrease.valid ? leftCrease.creaseYFrac : 0.5;
          leftMetrics.creaseReadQuality = leftCrease.valid ? leftCrease.readQuality : 0;
          rightMetrics.creaseValid = rightCrease.valid ? 1 : 0;
          rightMetrics.creaseProminence = rightCrease.valid ? rightCrease.prominence : 0;
          rightMetrics.creasePeak = rightCrease.valid ? rightCrease.peakVal : 0;
          rightMetrics.creaseYFrac = rightCrease.valid ? rightCrease.creaseYFrac : 0.5;
          rightMetrics.creaseReadQuality = rightCrease.valid ? rightCrease.readQuality : 0;

          // EYELID CREASE V2 — DEBUG SHADOW MODE ONLY. Runs V2 purely
          // for visual/text comparison against V1 in the debug panel
          // below; its result is stored ONLY in debugCreaseV2 (React
          // state), never written into leftMetrics/rightMetrics —
          // classifyFeatures never reads this. In normal mode
          // (debugAvailable === false) this whole block, including the
          // V2 detection calls themselves, never executes, so normal
          // mode pays zero cost for it.
          if (debugAvailable) {
            const v2Left = detectEyelidCreaseV2(canvas, leftEye, leftBrowPts);
            const v2Right = detectEyelidCreaseV2(canvas, rightEye, rightBrowPts);
            // V2.1 MULTI-PEAK SHADOW EXPERIMENT — debug-only, observation-
            // only. Runs alongside frozen V2 above, stored only in this
            // same debugCreaseV2 state, never fed into leftMetrics/
            // rightMetrics or classifyFeatures.
            const v2LeftMulti = detectEyelidCreaseV2Multi(canvas, leftEye, leftBrowPts);
            const v2RightMulti = detectEyelidCreaseV2Multi(canvas, rightEye, rightBrowPts);
            // V2.2 MULTI-PEAK PATH LINKING SHADOW — debug-only, observation
            // only. Pure post-processing over the V2.1 results just
            // computed above; does not touch pixels/ROI again and does
            // not affect V1/V2/V2.1 in any way.
            const v2LeftLinked = debugV2BuildLinkedPaths(
              v2LeftMulti.valid ? v2LeftMulti.columns : [], v2LeftMulti.sampledColumns, DEBUG_V2_UNCALIBRATED.PATH_LINK_MAX_T_GAP
            );
            const v2RightLinked = debugV2BuildLinkedPaths(
              v2RightMulti.valid ? v2RightMulti.columns : [], v2RightMulti.sampledColumns, DEBUG_V2_UNCALIBRATED.PATH_LINK_MAX_T_GAP
            );
            setDebugCreaseV2({
              left: { v1: leftCrease, v2: v2Left, v2Multi: v2LeftMulti, v2Linked: v2LeftLinked },
              right: { v1: rightCrease, v2: v2Right, v2Multi: v2RightMulti, v2Linked: v2RightLinked },
              capture: {
                ear: { left: leftMetrics.ear, right: rightMetrics.ear },
                roll: headPose.roll, yaw: headPose.yawProxy, pitch: headPose.pitchProxy,
                brightness, sharpness,
              },
            });
          }

          const qualityScore = det.detection.score * (1 - Math.min(1, Math.abs(headPose.roll)/30)) * (1 - Math.min(1, Math.abs(headPose.yawProxy)/0.4));
          const verticalAsymRaw = (headPose.leftEyeCenter.y - headPose.rightEyeCenter.y) / Math.max(headPose.interEyeDistance, 1);
          bufferRef.current.push({ t: now, leftMetrics, rightMetrics, headPose, qualityScore, faceBoxWidth: det.detection.box.width, verticalAsymRaw });

          if (!bestFrameRef.current || qualityScore > bestFrameRef.current.qualityScore) {
            bestFrameRef.current = {
              qualityScore,
              dataURL: canvas.toDataURL('image/jpeg', 0.92),
              landmarks: det.landmarks,
              width: canvas.width, height: canvas.height,
              leftIris: sampleIrisColor(ctx, leftEye),
              rightIris: sampleIrisColor(ctx, rightEye),
            };
          }

          const count = bufferRef.current.length;
          console.log('[LSA] STABLE FRAMES', count, '/', MIN_STABLE_FRAMES);
          setProgress(Math.min(1, count / MIN_STABLE_FRAMES));
          setHintKey(null);

          if (count <= 2) { setPhase('aligning'); setStageKey('stageAligning'); bumpRail(railSegmentForPhase('aligning')); return; }
          if (count <= 7) { setPhase('tracking'); setStageKey('stageTracking'); bumpRail(railSegmentForPhase('tracking')); return; }
          if (count <= 11) { setPhase('mapping'); setStageKey('stageMapping'); bumpRail(railSegmentForPhase('mapping')); return; }
          if (count <= 14) {
            if (phaseRef.current !== 'eyelids') { isolationStartRef.current = now; tagEventsRef.current.push({ label: t('tagTilt', langRef.current), ts: now }); }
            setPhase('eyelids'); setStageKey('stageEyelids'); bumpRail(railSegmentForPhase('eyelids')); return;
          }
          if (count <= 16) {
            if (phaseRef.current !== 'iris') tagEventsRef.current.push({ label: t('tagLid', langRef.current), ts: now });
            setPhase('iris'); setStageKey('stageIris'); bumpRail(railSegmentForPhase('iris')); return;
          }
          if (count < MIN_STABLE_FRAMES) {
            if (phaseRef.current !== 'symmetry') {
              tagEventsRef.current.push({ label: t('tagIris', langRef.current), ts: now });
              irisAcquiredStartRef.current = now;
              dataFlowStartRef.current = now;
            }
            setPhase('symmetry'); setStageKey('stageSymmetry'); bumpRail(railSegmentForPhase('symmetry')); return;
          }

          const stability = computeStability(bufferRef.current);
          console.log('[LSA] STABILITY CHECK', stability.stable ? 'STABLE' : 'NOT STABLE', stability.variance);
          if (!stability.stable) {
            setPhase('stabilizing'); setStageKey('stageStabilizing'); bumpRail(railSegmentForPhase('stabilizing'));
            return;
          }
          setStabilityLocked(true);
          tagEventsRef.current.push({ label: t('tagSymmetry', langRef.current), ts: now });

          doneRef.current = true;
          setPhase('finalizing'); setStageKey('stageCalculating'); setHintKey(null);
          bumpRail(railSegmentForPhase('finalizing'));
          if (loopRef.current) clearInterval(loopRef.current);
          console.log('[LSA] ANALYSIS COMPLETE — generating recommendations');

          const aggregated = aggregateBuffer(bufferRef.current);
          const imageQuality = clamp01(median(bufferRef.current.map(e => e.qualityScore)));
          const classified = classifyFeatures(aggregated, { singleFrame: false, stability, imageQuality });
          console.log('[LSA] ANALYSIS CONFIDENCE', classified.overallConfidence.toFixed(3));
          const best = bestFrameRef.current;
          const iris = combineIris(best.leftIris, best.rightIris);
          const designs = rankDesigns(classified, langRef.current);
          console.log('[LSA] DESIGNS RANKED', designs.map(d => d.name + ' ' + d.score + '%').join(', '));

          const rec = {
            source: 'live', eyeProfile: classified, iris, designs,
            originalImage: best.dataURL, landmarks: best.landmarks,
            imageWidth: best.width, imageHeight: best.height,
            confidence: classified.overallConfidence,
          };
          rec.diagnostics = {
            framesAnalyzed: totalFramesRef.current, stableFrames: count,
            measurementVariance: stability.variance, analysisConfidence: classified.overallConfidence,
            headPose: aggregated.headPose, leftEyeMetrics: aggregated.left, rightEyeMetrics: aggregated.right,
            iris, topDesigns: designs.slice(0,3).map(d => ({ name: d.name, score: d.score })),
          };
          console.log('[LSA] RESULT GENERATED', rec.diagnostics);

          setStageKey('stageComplete');
          setTimeout(() => onCompleteRef.current(rec), 1000);
        } catch (e) {
          console.error('[LSA] PIPELINE ERROR', e);
        } finally {
          busyRef.current = false;
        }
      };

      useEffect(() => {
        let stream;
        doneRef.current = false;
        busyRef.current = false;
        bufferRef.current = [];
        bestFrameRef.current = null;
        totalFramesRef.current = 0;
        hadFaceRef.current = false;
        hasHadValidFrameRef.current = false;
        tagEventsRef.current = [];
        railSegRef.current = -1;
        acquireStartRef.current = -Infinity;
        completionRef.current.start = -Infinity;
        setRailSeg(-1); setEverLocked(false); setStabilityLocked(false);
        setStageKey('stageSearching'); setPhase('searching'); setProgress(0); setHintKey(null);

        const start = async () => {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: false });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play();
            }
          } catch (e) {
            setStageKey('stageNoCamera'); setHintKey(null);
            return;
          }
          loopRef.current = setInterval(() => tickImplRef.current(), 200);
        };
        start();

        return () => {
          if (loopRef.current) clearInterval(loopRef.current);
          if (stream) stream.getTracks().forEach(t => t.stop());
        };
      }, [facingMode]);

      // Cinematic overlay redraw loop (~60/sec). Reads the latest
      // real detection (lastDetRef) plus phase/alignment/timestamps
      // set above, applies exponential coordinate smoothing so
      // graphics glide between the slower ~5/sec detection ticks
      // instead of snapping, then composites the layered scanner:
      // subject lock -> depth grid -> holographic face mesh -> scan
      // field -> eye targeting (isolation-aware) -> iris micro-scan
      // -> floating data tags -> data-flow convergence -> completion
      // sequence. Read-only presentation; never calls or duplicates
      // the analysis functions.
      useEffect(() => {
        const draw = () => {
          const canvas = overlayCanvasRef.current, container = containerRef.current;
          if (!canvas || !container) { overlayRafRef.current = requestAnimationFrame(draw); return; }
          const rect = container.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
          if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)) {
            canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
          }
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);

          const time = performance.now();
          const reduceMotion = reduceMotionRef.current;
          const d = lastDetRef.current;
          const fresh = d && d.hasFace && (time - d.ts) < FACE_LOST_GRACE_MS;
          const s = smoothRef.current;
          s.presence = lerpNum(s.presence, fresh ? 1 : 0, fresh ? 0.14 : 0.09);

          if (fresh) {
            // CAMERA FIX — preview-only mirror. The <video> element is
            // CSS-mirrored (scaleX(-1)) for the front camera only, so
            // the overlay's on-screen X position is flipped here to
            // match. This affects ONLY where shapes/text are drawn on
            // screen — det/landmarks/lastDetRef/every measurement path
            // still read the raw, un-mirrored canvas snapshot upstream,
            // completely untouched by this. Text (drawEyeTarget's L/R
            // labels) stays upright since ctx itself is never
            // transformed, only the coordinates fed into it.
            const mirrored = facingModeRef.current === 'user';
            const map = (x,y) => {
              const p = mapVideoPointToDisplay(x, y, d.videoW, d.videoH, w, h);
              return mirrored ? { x: w - p.x, y: p.y } : p;
            };
            // min/abs rather than assuming top-left corner maps to the
            // smaller X: when mirrored, map() flips which corner ends
            // up on the left, so subtracting corners directly (as
            // before) would yield a negative width.
            const tl = map(d.box.x, d.box.y), br = map(d.box.x + d.box.width, d.box.y + d.box.height);
            const targetBox = { x: Math.min(tl.x, br.x), y: Math.min(tl.y, br.y), width: Math.abs(br.x - tl.x), height: Math.abs(br.y - tl.y) };
            s.box = s.box ? {
              x: lerpNum(s.box.x, targetBox.x, 0.22), y: lerpNum(s.box.y, targetBox.y, 0.22),
              width: lerpNum(s.box.width, targetBox.width, 0.22), height: lerpNum(s.box.height, targetBox.height, 0.22),
            } : targetBox;
            const mapAll = (pts) => pts.map(p => map(p.x, p.y));
            const smoothAll = (cur, target, f) => cur && cur.length === target.length ? cur.map((p,i) => lerpPt(p, target[i], f)) : target;
            s.leftEye = smoothAll(s.leftEye, mapAll(d.leftEye), 0.28);
            s.rightEye = smoothAll(s.rightEye, mapAll(d.rightEye), 0.28);
            // PHYSICAL EYE NORMALIZATION — separate from s.leftEye/
            // s.rightEye above (which stay raw/image-side for
            // buildFaceMesh's topology, untouched). These feed ONLY
            // the "L"/"R" eye-target labels below, so those labels
            // land on the client's actual physical left/right eye.
            s.physicalLeftEye = smoothAll(s.physicalLeftEye, mapAll(d.physicalLeftEye), 0.28);
            s.physicalRightEye = smoothAll(s.physicalRightEye, mapAll(d.physicalRightEye), 0.28);
            s.leftBrow = smoothAll(s.leftBrow, mapAll(d.leftBrow), 0.22);
            s.rightBrow = smoothAll(s.rightBrow, mapAll(d.rightBrow), 0.22);
            s.jaw = smoothAll(s.jaw, mapAll(d.jaw), 0.2);
            s.nose = smoothAll(s.nose, mapAll(d.nose), 0.22);
            s.mouth = smoothAll(s.mouth, mapAll(d.mouth), 0.22);
          }

          if (s.presence > 0.01 && s.box) {
            const box = s.box;
            const phaseNow = phaseRef.current;
            const completing = phaseNow === 'finalizing' && stageKeyRef.current === 'stageComplete';
            const finishT = completing ? clamp((time - completionRef.current.start) / 1000, 0, 1) : 0;
            const collapse = completing ? 1 - clamp((finishT-0.75)/0.25, 0, 1) : 1;
            const effPresence = s.presence * collapse;

            const tint = completing ? 'complete' : (d && d.aligned) ? 'cyan' : 'amber';

            const isolating = (phaseNow === 'eyelids' || phaseNow === 'iris') && !completing;
            const microActive = isolating;
            const revealMode = !completing && (time - acquireStartRef.current) < 2700;
            const wavefrontY = box.y + clamp((time - acquireStartRef.current - 700) / 2000, 0, 1) * box.height;

            const beamSoftness = completing ? Math.max(0, 1-finishT*3) : (revealMode ? 0.85 : (microActive ? 0.28 : 0.5));
            const beamY = drawScanBeam(ctx, box, time, 2000, beamSoftness * effPresence, reduceMotion);

            const mesh = buildFaceMesh(d && d.jaw ? { jaw: s.jaw, leftBrow: s.leftBrow, rightBrow: s.rightBrow, nose: s.nose, leftEye: s.leftEye, rightEye: s.rightEye, mouth: s.mouth } : null);
            const meshPresence = completing ? effPresence * (finishT < 0.3 ? 1 : Math.max(0.4, 1-((finishT-0.3)/0.5))) : effPresence;
            drawFaceMeshV3(ctx, mesh, {
              revealMode, wavefrontY, beamY, presence: meshPresence,
              boxCenter: { x: box.x+box.width/2, y: box.y+box.height/2 },
              faceHalfW: Math.max(box.width, box.height) / 2,
            });
            drawDust(ctx, box, beamY, isolating, time);
            drawScanFrame(ctx, box, effPresence, !!(d && d.aligned) && !completing);

            const lockT = (time - acquireStartRef.current) / 500;
            drawSubjectLock(ctx, box, lockT, reduceMotion);
            drawCenterLabel(ctx, box.x+box.width/2, box.y-14, t('stageSubjectLocked', langRef.current), time-acquireStartRef.current-120, 120, 380, 220);

            const eyeOf = (pts) => {
              const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
              const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
              const rx = (Math.max(...xs)-Math.min(...xs))/2 * 1.5 + 6;
              const ry = (Math.max(...ys)-Math.min(...ys))/2 * 2.1 + 6;
              return { center: {x:cx,y:cy}, rx, ry, inner: pts[0], outer: pts[3] };
            };
            // PHYSICAL EYE NORMALIZATION — le/re (and therefore the
            // "L"/"R" labels + inner/outer corner highlight below) use
            // the canonical, physically-correct eye points, not the
            // raw s.leftEye/s.rightEye that buildFaceMesh reads.
            const le = eyeOf(s.physicalLeftEye), re = eyeOf(s.physicalRightEye);

            const illum = (eye) => {
              if (completing) return 0.55;
              const dy = Math.abs(beamY - eye.center.y);
              return Math.max(0, 1 - dy / 46);
            };

            const isolMomentT = time - isolationStartRef.current;
            const showLockLabel = isolMomentT >= 0 && isolMomentT < 750;
            const lPulseSrc = completing ? Math.sin(clamp(finishT/0.5,0,1)*Math.PI) : 0;
            drawEyeTarget(ctx, le.center, le.rx, le.ry, le.inner, le.outer, showLockLabel ? t('eyeLockL', langRef.current) : 'L', illum(le), effPresence, time, isolating, lPulseSrc);
            drawEyeTarget(ctx, re.center, re.rx, re.ry, re.inner, re.outer, showLockLabel ? t('eyeLockR', langRef.current) : 'R', illum(re), effPresence, time, isolating, lPulseSrc);

            if (isolMomentT >= 0 && isolMomentT < 800) {
              const a = clamp(1 - Math.abs(isolMomentT-350)/450, 0, 1) * effPresence;
              ctx.save();
              ctx.globalAlpha = a * 0.35;
              ctx.strokeStyle = 'rgba(190,235,255,0.8)';
              ctx.lineWidth = 1; ctx.setLineDash([2,4]);
              ctx.beginPath(); ctx.moveTo(le.center.x, le.center.y); ctx.lineTo(re.center.x, re.center.y); ctx.stroke();
              ctx.restore();
            }

            if (phaseNow === 'iris' && !completing) {
              drawIrisMicroScan(ctx, le.center, le.rx, le.ry, time);
              drawIrisMicroScan(ctx, re.center, re.rx, re.ry, time);
            }
            const irisAcqAge = time - irisAcquiredStartRef.current - 100;
            drawCenterLabel(ctx, box.x+box.width/2, Math.min(le.center.y, re.center.y)-Math.max(le.ry,re.ry)-14, t('irisAcquired', langRef.current), irisAcqAge, 120, 500, 250);

            const nodeCenter = { x: (le.center.x+re.center.x)/2, y: Math.min(le.center.y,re.center.y) - Math.max(le.ry,re.ry)*0.6 };
            const flowT = (time - dataFlowStartRef.current) / 650;
            if (mesh) {
              drawDataFlowFan(ctx, le.center, [mesh.f1[0], mesh.nose[6], mesh.cheekAU, nodeCenter], flowT);
              drawDataFlowFan(ctx, re.center, [mesh.f1[4], mesh.nose[6], mesh.cheekBU, nodeCenter], flowT);
            } else {
              drawDataFlow(ctx, le.center, re.center, nodeCenter, flowT);
            }
            if (completing) {
              const flowT2 = clamp((finishT-0.2)/0.55, 0, 1);
              drawDataFlow(ctx, le.center, re.center, nodeCenter, flowT2 <= 0 ? -1 : Math.min(1, flowT2*1.4));
            }

            drawDataTags(ctx, box, tagEventsRef.current, time);
            tagEventsRef.current = tagEventsRef.current.filter(ev => time - ev.ts < 1000);

            if (completing) {
              drawCenterLabel(ctx, box.x+box.width/2, box.y-14, t('stageComplete', langRef.current), (time-completionRef.current.start)-350, 150, 350, 200);
              const t2 = Math.min(1, (time - completionRef.current.start) / 650);
              drawCompletionBurst(ctx, box, t2);
            }
          }

          overlayRafRef.current = requestAnimationFrame(draw);
        };
        overlayRafRef.current = requestAnimationFrame(draw);
        return () => { if (overlayRafRef.current) cancelAnimationFrame(overlayRafRef.current); };
      }, []);

      const statusColor = phase === 'searching' ? 'bg-danger' : phase === 'lost' ? 'bg-danger' : phase === 'adjust' ? 'bg-peak' : (phase === 'finalizing' ? 'bg-success' : 'bg-accent');
      const hint = hintKey ? t(hintKey, lang) : null;

      return (
        <div className="h-full flex flex-col relative fade-in">
          <div className="absolute top-0 left-0 right-0 z-20 p-4 flex justify-between items-center">
            <BackButton onBack={onBack} />
            <div className={`px-3 py-1.5 rounded-full glass flex items-center gap-2 ${statusColor.replace('bg-','text-')}`}>
              <div key={stageKey + '-dot'} className={`w-2 h-2 rounded-full ${statusColor} animate-pulse stage-dot-flash`}></div>
              <span key={stageKey} className="text-xs font-medium stage-text">{t(stageKey, lang)}</span>
            </div>
            <button onClick={() => setFacingMode(f => f === 'user' ? 'environment' : 'user')} className="w-10 h-10 rounded-full glass flex items-center justify-center text-white">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
          </div>
          <div ref={containerRef} className="flex-1 relative bg-black overflow-hidden">
            {/* CAMERA FIX — preview-only mirror for the front camera,
                matching standard selfie-camera UX (raw getUserMedia
                video is never mirrored by the browser on its own).
                Rear camera ('environment') stays unmirrored, like a
                normal viewfinder. The overlay canvas below is NOT
                CSS-mirrored — its own draw loop flips coordinates
                instead, so its text labels stay upright; see the
                overlay effect's `map`/`mirrored` comment. */}
            <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" style={facingMode === 'user' ? { transform: 'scaleX(-1)' } : undefined} playsInline muted />
            <div className="absolute inset-0 pointer-events-none" style={{background: 'radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.5) 100%)'}}></div>
            <canvas ref={overlayCanvasRef} className="absolute inset-0 w-full h-full pointer-events-none" />
            {!modelsLoaded && <div className="absolute inset-0 flex items-center justify-center bg-black/80"><p className="text-sm text-textSecondary">{t('modelsLoading', lang)}</p></div>}
            {/* EYELID CREASE V2 — DEBUG SHADOW MODE. Purely additive,
                ?debug=1-only. Compares V1 (production, unchanged) against
                the experimental V2 candidate geometry; nothing here
                influences classification. Remove together with V2 once
                real-device validation is complete. */}
            {debugAvailable && debugCreaseV2 && <CreaseV2DebugPanel data={debugCreaseV2} />}
          </div>
          <div className="p-6 flex flex-col items-center gap-3 bg-bg">
            <div className="w-full flex justify-end -mt-1">
              <LangToggle lang={lang} setLang={onSetLang} />
            </div>
            <div className="w-full flex justify-between gap-1">
              {RAIL_SEGMENTS.map((segKey, i) => (
                <div key={segKey} className="flex-1 flex flex-col items-center gap-1">
                  <div className={`w-2 h-2 rounded-full transition-all duration-300 ${i < railSeg ? 'bg-cyan' : i === railSeg ? 'bg-accent animate-pulse' : 'bg-surface'}`}
                    style={i <= railSeg ? { boxShadow: '0 0 6px rgba(10,140,255,0.7)' } : undefined}></div>
                  <span className={`text-[7px] tracking-widest uppercase ${i <= railSeg ? 'text-textSecondary' : 'text-textMuted'}`}>{t(segKey, lang)}</span>
                </div>
              ))}
            </div>
            <p className="text-xs text-textSecondary text-center min-h-[16px]">{hint || t('holdSteady', lang)}</p>
          </div>
        </div>
      );
    }

    const NAT_LASH_HINT_KEYS = {
      lash_no_eye: 'natLashNoEyeHint', lash_too_far: 'natLashMoveCloserHint', lash_eye_closed: 'natLashEyeClosedHint',
      lash_blurry: 'natLashBlurryHint', lash_too_dark: 'natLashTooDarkHint', lash_too_bright: 'natLashTooBrightHint',
      lash_insufficient_resolution: 'natLashInsufficientResolutionHint',
    };
    const NAT_LASH_FRAMES_NEEDED = 6;

    // Stage 2A — progressive getUserMedia resolution negotiation,
    // NaturalLashScanScreen-only (the other getUserMedia call in this
    // file, in the Live Scan screen, is untouched). Every attempt uses
    // `ideal` only, never `exact`, so a device that can't meet a
    // preferred resolution still gets a stream instead of an
    // OverconstrainedError — the chain just degrades to the next,
    // looser attempt. `track.getSettings()` after acquisition reports
    // what the browser ACTUALLY negotiated; highResAvailable is judged
    // against THAT, never against the requested constraint (a device
    // can ask for 1080p and still be handed 480x640).
    const CAMERA_ATTEMPTS = [
      { video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 16/9 }, frameRate: { ideal: 30 } } },
      { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } },
      { video: { facingMode: 'user', width: { min: 640, ideal: 1280 }, height: { min: 480, ideal: 720 } } },
      { video: { facingMode: 'user' } },
    ];
    async function acquireCameraStream() {
      let lastError = null;
      for (let i = 0; i < CAMERA_ATTEMPTS.length; i++) {
        const constraints = CAMERA_ATTEMPTS[i];
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          const track = stream.getVideoTracks()[0];
          const settings = track ? track.getSettings() : {};
          const highResAvailable = (settings.width || 0) >= 1280 && (settings.height || 0) >= 720;
          return { stream, settings, requestedConstraints: constraints, attemptIndex: i, highResAvailable };
        } catch (e) {
          // OverconstrainedError (or any other rejection) never yields
          // a stream — getUserMedia rejects instead of resolving — so
          // there is nothing to stop/release before the next, looser
          // attempt.
          lastError = e;
        }
      }
      throw lastError || new Error('getUserMedia failed for all attempts');
    }

    // Separate, close-up-only analysis mode (Parts 6-30). Runs the same
    // real face-api detector as Live Scan/Photo Analysis — there is no
    // separate "lash model" to load — but only to keep locating the
    // eye landmarks as the user brings it closer; the actual lash
    // heuristics (extractEyeROI / detectLashLine /
    // detectVisibleLashCandidates / aggregateLashFrames) are pure
    // functions defined earlier and never touch classifyFeatures or
    // the design-ranking pipeline. Detection runs on its own ~5fps
    // tick; the canvas overlay redraws at rAF rate, interpolating
    // between detection results — no React state updates per frame.
    function NaturalLashScanScreen({ onComplete, onBack, modelsLoaded }) {
      const lang = useLang();
      const langRef = useRef(lang); useEffect(() => { langRef.current = lang; }, [lang]);
      const videoRef = useRef(null);
      const containerRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const procCanvasRef = useRef(null);
      if (!procCanvasRef.current) procCanvasRef.current = document.createElement('canvas');
      // TEMP DIAGNOSTIC — on-screen overlay for real-device testing of
      // the effectiveVisibleWidth fix, no Safari Web Inspector needed.
      // Reuses the same ?debug=1 gate as the Details screen's debug
      // panel; remove this whole block (state + overlay JSX below) once
      // the real-iPhone test is done.
      const debugAvailable = isDebugModeEnabled();
      const [diag, setDiag] = useState(null);

      const [side, setSide] = useState('left');
      const [locked, setLocked] = useState(false);
      const [hintKey, setHintKey] = useState('natLashSearching');
      const [progress, setProgress] = useState(0);
      const [leftProfile, setLeftProfile] = useState(null);
      const [rightProfile, setRightProfile] = useState(null);
      // NLS2 VALIDATION DIAGNOSTIC — scan-meta captured alongside each
      // eye's obs (ROI dims / effective eye width aren't stored on obs
      // itself, only exist as local variables in the tick below).
      // debug-only, null in normal mode, purely additive. Remove
      // together with the rest of the NLS2 validation build.
      const [leftMeta, setLeftMeta] = useState(null);
      const [rightMeta, setRightMeta] = useState(null);

      const sideRef = useRef(side); useEffect(() => { sideRef.current = side; }, [side]);
      const lockedRef = useRef(false); useEffect(() => { lockedRef.current = locked; }, [locked]);
      const bufferRef = useRef([]);
      const busyRef = useRef(false);
      const loopRef = useRef(null);
      const overlayRafRef = useRef(null);
      const lastFrameRef = useRef(null); // { box, lashLine, rawCandidates, videoW, videoH, ts }
      const cameraInfoRef = useRef(null); // { stream, settings, requestedConstraints, attemptIndex, highResAvailable } from acquireCameraStream()
      const smoothRef = useRef({ box: null, presence: 0 });
      const lockStartRef = useRef(-Infinity);
      const completionRef = useRef(null);
      const modelsLoadedRef = useRef(modelsLoaded); useEffect(() => { modelsLoadedRef.current = modelsLoaded; }, [modelsLoaded]);
      const onCompleteRef = useRef(onComplete); useEffect(() => { onCompleteRef.current = onComplete; }, [onComplete]);

      const tickImplRef = useRef(null);
      tickImplRef.current = async () => {
        if (busyRef.current || lockedRef.current) return;
        const video = videoRef.current;
        if (!video || video.readyState < 2 || !modelsLoadedRef.current) return;
        busyRef.current = true;
        try {
          const canvas = procCanvasRef.current;
          const scale = Math.min(1, 640 / video.videoWidth);
          canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
          canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const det = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 })).withFaceLandmarks();
          const now = performance.now();
          if (!det) {
            // CAMERA FIX — same face-lost grace window as LiveScanScreen
            // (FACE_LOST_GRACE_MS): a single missed frame no longer
            // immediately clears lastFrameRef / shows the "no eye" hint.
            // Leaving lastFrameRef untouched during the grace window
            // means the overlay's own existing freshness check (based
            // on f.ts) keeps rendering the last known box/lash-line
            // exactly as it already did — no separate timer needed.
            const withinGrace = lastFrameRef.current && (now - lastFrameRef.current.ts) < FACE_LOST_GRACE_MS;
            if (!withinGrace) {
              setHintKey('natLashNoEyeHint');
              lastFrameRef.current = null;
            }
            return;
          }
          const headPose = computeHeadPose(det.landmarks);
          const sd = sideRef.current;
          // PHYSICAL EYE NORMALIZATION — sd is the client's physical
          // side ('left'/'right', matching the "Move your left eye
          // closer" UI text). eyePts/browPts are now canonically
          // ordered INNER->OUTER for either side (see
          // getPhysicalEyeLandmarks above), so extractEyeROI/
          // detectLashLine/computeLashObservations downstream receive
          // correctly normalized input without needing any changes
          // themselves — lash-scan-core.js is untouched.
          const { eye: eyePts, brow: browPts } = getPhysicalEyeLandmarks(det.landmarks, sd);
          const metrics = computeEyeSideMetrics(det.landmarks, sd, headPose);

          const roi = extractEyeROI(canvas, eyePts, browPts, 0.35);
          const eyeWidthPx = dist(eyePts[0], eyePts[3]) / scale;

          // Stage 2B — map the SAME landmarks face-api already found
          // (on the downscaled `canvas` above, unchanged) into native
          // <video> coordinates, and crop the lash ROI directly from
          // the native frame instead of from the downscaled canvas.
          // face-api's own input resolution is NOT increased — only
          // the ROI source for the lash detector changes. Gated on
          // highResAvailable: when the camera itself never negotiated
          // above 1280x720, native extraction would just reproduce
          // the same low-res crop the existing path already makes, so
          // it's skipped and the original low-res path is used as-is
          // (usingFallbackPath below reflects this per tick).
          const mapScaleX = video.videoWidth / canvas.width;
          const mapScaleY = video.videoHeight / canvas.height;
          const toNative = (p) => ({ x: p.x * mapScaleX, y: p.y * mapScaleY });
          const eyePtsNative = eyePts.map(toNative);
          const browPtsNative = browPts.map(toNative);
          const eyeWidthNativePx = dist(eyePtsNative[0], eyePtsNative[3]);
          const camInfo = cameraInfoRef.current;
          const nativeRoi = (camInfo && camInfo.highResAvailable)
            ? extractEyeROI(video, eyePtsNative, browPtsNative, 0.35, video.videoWidth, video.videoHeight)
            : null;
          const roiIsNative = !!nativeRoi;
          const usingFallbackPath = !roiIsNative;
          const effectiveRoi = nativeRoi || roi;
          // The distance/size gate must compare eyeWidthPx against how
          // much of the raw camera frame the user ACTUALLY SEES, not
          // against video.videoWidth (the raw sensor frame). getUserMedia
          // is requested with no aspectRatio/width/height constraint, so
          // on iOS the raw stream is frequently landscape regardless of
          // the portrait container; object-fit:cover then crops that
          // wider raw frame down to what's shown on screen. Measuring
          // against the uncropped raw width means the eye can fill the
          // visible portrait preview yet still read as a tiny fraction
          // of the much-wider raw frame — this is the exact mechanism
          // behind "Поднесите ближе" firing when the eye already looks
          // close. Fix: derive the VISIBLE slice (in raw video pixels)
          // from the actual container box + object-fit:cover math, and
          // gate against that instead. Orientation-agnostic — reduces to
          // the old behavior (effective == full video) whenever the
          // video's own aspect ratio already matches the container's
          // (e.g. a stream that's natively portrait-shot), so a device
          // that never had this problem sees no change at all.
          const containerEl = containerRef.current;
          const containerRect = containerEl ? containerEl.getBoundingClientRect() : null;
          const containerW = containerRect && containerRect.width > 0 ? containerRect.width : video.videoWidth;
          const containerH = containerRect && containerRect.height > 0 ? containerRect.height : video.videoHeight;
          const coverScale = Math.max(containerW / video.videoWidth, containerH / video.videoHeight);
          const effectiveVisibleWidth = containerW / coverScale;
          const effectiveVisibleHeight = containerH / coverScale;
          const quality = assessLashFrameQuality(effectiveRoi, metrics.ear, eyeWidthPx, effectiveVisibleWidth);
          // TEMP DIAGNOSTIC — remove after verifying the fix on a real
          // device. One snapshot object feeds both the console log and
          // the on-screen overlay (below, gated on ?debug=1) so a real
          // "still too far" vs "gate still wrong" case can be told apart
          // directly on the phone, without Safari Web Inspector.
          const diagSnapshot = {
            side: sd,
            videoWidth: video.videoWidth, videoHeight: video.videoHeight,
            containerW, containerH, coverScale: coverScale.toFixed(3),
            effectiveVisibleWidth: effectiveVisibleWidth.toFixed(1), effectiveVisibleHeight: effectiveVisibleHeight.toFixed(1),
            eyeWidthPx: eyeWidthPx.toFixed(1),
            oldWidthFrac: (eyeWidthPx / video.videoWidth).toFixed(3),
            widthFrac: quality.widthFrac?.toFixed(3),
            newWidthFrac: quality.widthFrac?.toFixed(3),
            roiW: effectiveRoi ? effectiveRoi.w.toFixed(1) : null,
            roiH: effectiveRoi ? effectiveRoi.h.toFixed(1) : null,
            roiMinDim: effectiveRoi ? Math.min(effectiveRoi.w, effectiveRoi.h).toFixed(1) : null,
            ear: metrics.ear?.toFixed(3),
            sharpness: quality.sharpness?.toFixed(1), brightness: quality.brightness?.toFixed(1),
            ok: quality.ok, reasons: quality.reasons,
            // Stage 2A/2B — camera negotiation + native-resolution ROI
            // mapping, kept as its own nested block so it reads
            // separately from the pre-existing distance-gate fields
            // above rather than being interleaved with them.
            camera: {
              requestedAttempt: camInfo ? camInfo.attemptIndex : null,
              requestedConstraints: camInfo ? camInfo.requestedConstraints : null,
              actualSettings: camInfo ? { width: camInfo.settings.width, height: camInfo.settings.height, frameRate: camInfo.settings.frameRate, facingMode: camInfo.settings.facingMode } : null,
              videoNative: { width: video.videoWidth, height: video.videoHeight },
              faceApiInput: { width: canvas.width, height: canvas.height },
              mapping: { scaleX: +mapScaleX.toFixed(3), scaleY: +mapScaleY.toFixed(3) },
              eye: { side: sd, eyeWidthFaceSpace: +dist(eyePts[0], eyePts[3]).toFixed(1), eyeWidthNativeSpace: +eyeWidthNativePx.toFixed(1) },
              roi: nativeRoi ? { nativeX: nativeRoi.x0, nativeY: nativeRoi.y0, nativeWidth: nativeRoi.w, nativeHeight: nativeRoi.h } : null,
              highResAvailable: !!(camInfo && camInfo.highResAvailable),
              usingFallbackPath,
            },
          };
          console.log('[NLS DIAG]', diagSnapshot);
          if (debugAvailable) setDiag(diagSnapshot);

          const lashLineLocal = effectiveRoi ? detectLashLine(effectiveRoi.eyeLocal) : null;
          // roiIsNative: effectiveRoi's (x0,y0)/eyeLocal are already in
          // native <video> pixels (cropped straight from `video`), so
          // no /scale conversion applies — unlike the old low-res path,
          // whose roi.x0/eyeLocal live in the downscaled `canvas`'s
          // pixel space and must be divided by `scale` to reach native
          // video coordinates (same conversion the app already used
          // for eyeWidthPx above).
          const lashLineVideo = lashLineLocal ? lashLineLocal.map(p => roiIsNative
            ? { x: p.x + effectiveRoi.x0, y: p.y + effectiveRoi.y0 }
            : { x: (p.x + effectiveRoi.x0) / scale, y: (p.y + effectiveRoi.y0) / scale }) : null;
          const boxVideo = effectiveRoi ? (roiIsNative
            ? { x: effectiveRoi.x0, y: effectiveRoi.y0, width: effectiveRoi.w, height: effectiveRoi.h }
            : { x: effectiveRoi.x0 / scale, y: effectiveRoi.y0 / scale, width: effectiveRoi.w / scale, height: effectiveRoi.h / scale }) : null;

          if (!quality.ok) {
            setHintKey(NAT_LASH_HINT_KEYS[quality.reasons[0]] || 'natLashMoveCloserHint');
            lastFrameRef.current = boxVideo ? { box: boxVideo, lashLine: lashLineVideo, rawCandidates: [], videoW: video.videoWidth, videoH: video.videoHeight, ts: now, roiIsNative } : null;
            return;
          }

          const det2 = detectVisibleLashCandidates(effectiveRoi, lashLineLocal);
          bufferRef.current.push(det2);
          if (bufferRef.current.length > 10) bufferRef.current.shift();
          setHintKey('natLashScanningStatus');
          setProgress(Math.min(1, bufferRef.current.length / NAT_LASH_FRAMES_NEEDED));
          lastFrameRef.current = { box: boxVideo, lashLine: lashLineVideo, rawCandidates: det2.candidates, videoW: video.videoWidth, videoH: video.videoHeight, ts: now, roiIsNative };

          if (bufferRef.current.length >= NAT_LASH_FRAMES_NEEDED) {
            const agg = aggregateLashFrames(bufferRef.current);
            const avgSharp = quality.sharpness, avgWidthFrac = quality.widthFrac;
            // Recalibrated against real-iPhone [NLS DIAG] data after the
            // effectiveVisibleWidth fix + distance gate (0.08): comfortable
            // captures read widthFrac~0.087-0.104, nowhere near the old
            // 0.32/0.24 (calibrated for the pre-fix, much larger raw-frame
            // denominator). New floors are 1.05x/1.5x the 0.08 distance-gate
            // floor itself, so a frame that only just clears the gate reads
            // 'low', a normal working-distance frame (like both real
            // samples) reads 'medium', and 'high' still means genuinely
            // closer/larger framing, not an unreachable number.
            const qualityLevel = (avgSharp > 25 && avgWidthFrac > 0.12) ? 'high' : (avgSharp > 12 && avgWidthFrac > 0.084) ? 'medium' : 'low';
            const steps = bufferRef.current[bufferRef.current.length-1].steps;
            const eyeH = bufferRef.current[bufferRef.current.length-1].eyeH;
            const obs = computeLashObservations(agg, steps, eyeH, qualityLevel, quality);
            obs.qualityLevel = qualityLevel;
            if (sd === 'left') setLeftProfile(obs); else setRightProfile(obs);
            // NLS2 VALIDATION DIAGNOSTIC — debug-only scan-meta snapshot
            // + compact machine-readable console log for real-iPhone
            // capture review. Reads only already-computed values (obs,
            // agg, quality) plus the ROI/eye-width locals above; does
            // not alter obs or any measurement value. Remove together
            // with the rest of the NLS2 validation build.
            if (debugAvailable) {
              const nls2Meta = {
                side: sd,
                roiW: effectiveRoi ? +effectiveRoi.w.toFixed(1) : null,
                roiH: effectiveRoi ? +effectiveRoi.h.toFixed(1) : null,
                effectiveEyeWidthPx: +eyeWidthPx.toFixed(1),
                effectiveVisibleWidth: +effectiveVisibleWidth.toFixed(1),
                framesAccepted: agg.framesUsed,
                frameConsistency: obs.confidenceFactors ? obs.confidenceFactors.consistency : null,
              };
              if (sd === 'left') setLeftMeta(nls2Meta); else setRightMeta(nls2Meta);
              console.log('[NLS2 VALIDATION]', {
                side: sd,
                roi: { w: nls2Meta.roiW, h: nls2Meta.roiH, effectiveEyeWidthPx: nls2Meta.effectiveEyeWidthPx },
                quality: { level: qualityLevel, ok: quality.ok, sharpness: quality.sharpness, widthFrac: quality.widthFrac, framesAccepted: nls2Meta.framesAccepted, frameConsistency: nls2Meta.frameConsistency },
                confidence: obs.confidence,
                zones: obs.zones,
                condition: obs.condition,
                diagnostics: obs.diagnostics,
              });
            }
            setLocked(true);
            lockStartRef.current = now;
            completionRef.current = { candidates: agg.stable, lashLine: lashLineVideo };
          }
        } catch (e) {
          console.error('[NLS] PIPELINE ERROR', e);
        } finally {
          busyRef.current = false;
        }
      };

      useEffect(() => {
        let stream;
        const start = async () => {
          try {
            const cam = await acquireCameraStream();
            stream = cam.stream;
            cameraInfoRef.current = cam;
            if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
          } catch (e) { setHintKey('natLashNoEyeHint'); return; }
          loopRef.current = setInterval(() => tickImplRef.current(), 220);
        };
        start();
        return () => { if (loopRef.current) clearInterval(loopRef.current); if (stream) stream.getTracks().forEach(t => t.stop()); };
      }, []);

      // Overlay redraw — rAF-rate, reads the latest tick's real result
      // (lastFrameRef) and interpolates the box smoothly between the
      // slower ~4.5/sec detection ticks. Candidate nodes shown while
      // scanning are that tick's raw (not-yet-stabilized) reads, drawn
      // at reduced opacity; once locked, only the aggregated STABLE
      // candidates are shown, at full opacity, with a confirming pulse.
      useEffect(() => {
        const draw = () => {
          const canvas = overlayCanvasRef.current, container = containerRef.current;
          if (!canvas || !container) { overlayRafRef.current = requestAnimationFrame(draw); return; }
          const rect = container.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
          if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)) { canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); }
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr,0,0,dpr,0,0);
          ctx.clearRect(0,0,w,h);

          const time = performance.now();
          const f = lastFrameRef.current;
          const fresh = f && (time - f.ts) < FACE_LOST_GRACE_MS;
          const s = smoothRef.current;
          s.presence = lerpNum(s.presence, fresh ? 1 : 0, fresh ? 0.16 : 0.1);

          if (fresh && f.box) {
            // CAMERA FIX — preview-only mirror, always on here since
            // this screen's camera is hardcoded to facingMode:'user'
            // (see acquireCameraStream above). Same non-measurement
            // note as LiveScanScreen's identical block: only affects
            // where the overlay is drawn on screen.
            const map = (x,y) => {
              const p = mapVideoPointToDisplay(x, y, f.videoW, f.videoH, w, h);
              return { x: w - p.x, y: p.y };
            };
            // min/abs, not tl/br subtraction directly — see the
            // matching comment in LiveScanScreen's overlay loop.
            const tl = map(f.box.x, f.box.y), br = map(f.box.x+f.box.width, f.box.y+f.box.height);
            const targetBox = { x: Math.min(tl.x, br.x), y: Math.min(tl.y, br.y), width: Math.abs(br.x-tl.x), height: Math.abs(br.y-tl.y) };
            s.box = s.box ? { x: lerpNum(s.box.x,targetBox.x,0.3), y: lerpNum(s.box.y,targetBox.y,0.3), width: lerpNum(s.box.width,targetBox.width,0.3), height: lerpNum(s.box.height,targetBox.height,0.3) } : targetBox;
            const lineDisp = f.lashLine ? f.lashLine.map(p => map(p.x,p.y)) : null;
            s.lashLine = lineDisp;
            // TEMP DIAGNOSTIC — Stage 2B mapping verification only.
            // Unlike s.box above (lerp-smoothed for visual polish),
            // this is the RAW, unsmoothed native-ROI rect for this
            // exact tick, drawn only when debug mode is on and only
            // when the native (not fallback) ROI path was used —
            // lets the mapping math be checked pixel-for-pixel against
            // the live preview without smoothing hiding a mismatch.
            s.debugNativeBox = (debugAvailable && f.roiIsNative) ? targetBox : null;
          }

          if (s.debugNativeBox) {
            ctx.save();
            ctx.strokeStyle = 'rgba(0,255,180,0.9)';
            ctx.lineWidth = 1;
            ctx.strokeRect(s.debugNativeBox.x, s.debugNativeBox.y, s.debugNativeBox.width, s.debugNativeBox.height);
            ctx.restore();
          }

          if (s.presence > 0.01 && s.box) {
            drawScanFrame(ctx, s.box, s.presence, true);
            if (s.lashLine) {
              drawLashLine(ctx, s.lashLine, 1, s.presence);
              if (!lockedRef.current) {
                drawLashScanPulse(ctx, s.lashLine, time, 1400, s.presence * 0.9);
                if (lastFrameRef.current && lastFrameRef.current.rawCandidates) {
                  const nodes = lastFrameRef.current.rawCandidates.map(c => ({ t: c.t, appearedAt: time-150 }));
                  drawLashNodes(ctx, s.lashLine, nodes, time, s.presence * 0.55);
                }
              } else {
                const t2 = clamp((time - lockStartRef.current)/700, 0, 1);
                if (completionRef.current) {
                  const nodes = completionRef.current.candidates.map(c => ({ t: c.t, appearedAt: lockStartRef.current }));
                  drawLashNodes(ctx, s.lashLine, nodes, time, s.presence);
                }
                if (t2 < 1) drawLashFinalPulse(ctx, s.lashLine, t2, s.presence);
              }
            }
          }
          overlayRafRef.current = requestAnimationFrame(draw);
        };
        overlayRafRef.current = requestAnimationFrame(draw);
        return () => { if (overlayRafRef.current) cancelAnimationFrame(overlayRafRef.current); };
      }, []);

      const goNextEye = () => {
        bufferRef.current = [];
        completionRef.current = null;
        lockStartRef.current = -Infinity;
        setLocked(false);
        setProgress(0);
        setSide('right');
        setHintKey('natLashSearching');
      };
      const finish = () => {
        const comparison = compareNaturalLashes(leftProfile, rightProfile);
        // NLS2 VALIDATION DIAGNOSTIC — one compact log after both eyes,
        // plus debugMeta passed through onComplete (additive key,
        // read only by the debug-gated panel in NaturalLashProfileScreen;
        // left/right/comparison below are unchanged from before).
        if (debugAvailable) console.log('[NLS2 VALIDATION COMPARISON]', comparison);
        onCompleteRef.current({
          left: leftProfile, right: rightProfile, comparison,
          debugMeta: debugAvailable ? { left: leftMeta, right: rightMeta } : null,
        });
      };

      const sideLabel = side === 'left' ? t('natLashLeftEyeLabel', lang) : t('natLashRightEyeLabel', lang);
      const moveHint = side === 'left' ? t('natLashMoveLeftCloser', lang) : t('natLashMoveRightCloser', lang);
      const statusText = locked ? t('natLashLineLocked', lang) : t(hintKey, lang);

      return (
        <div className="h-full flex flex-col relative fade-in">
          <div className="absolute top-0 left-0 right-0 z-20 p-4 flex justify-between items-center">
            <BackButton onBack={onBack} />
            <div className="px-3 py-1.5 rounded-full glass flex items-center gap-2">
              <div className={`w-2 h-2 rounded-full ${locked ? 'bg-success' : 'bg-accent animate-pulse'}`}></div>
              <span className="text-xs font-medium text-textPrimary">{statusText}</span>
            </div>
            <div className="w-10"></div>
          </div>
          <div ref={containerRef} className="flex-1 relative bg-black overflow-hidden">
            {/* CAMERA FIX — preview-only mirror, always front camera
                here (acquireCameraStream hardcodes facingMode:'user').
                Same non-measurement note as LiveScanScreen: the ROI/
                face-api/lash-detection pipeline reads the raw <video>
                frame via canvas drawImage, which ignores this CSS
                transform entirely — this changes only what's on screen. */}
            <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" style={{ transform: 'scaleX(-1)' }} playsInline muted />
            <div className="absolute inset-0 pointer-events-none" style={{background: 'radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.55) 100%)'}}></div>
            <canvas ref={overlayCanvasRef} className="absolute inset-0 w-full h-full pointer-events-none" />
            <div className="absolute top-16 left-0 right-0 z-10 flex flex-col items-center pointer-events-none">
              <span className="label-tech mb-1">{t('natLashScanTitle', lang)}</span>
              <span className="text-sm font-semibold text-textPrimary uppercase tracking-wide">{sideLabel}</span>
            </div>
            {!modelsLoaded && <div className="absolute inset-0 flex items-center justify-center bg-black/80"><p className="text-sm text-textSecondary">{t('modelsLoading', lang)}</p></div>}
            {/* TEMP DIAGNOSTIC — on-screen [NLS DIAG] overlay, only when
                ?debug=1 is active. Sits in the vignette's dark bottom-
                left corner so it never covers the eye (center clear
                ellipse) or the bottom hint/button panel below. Remove
                this block together with the diag state/setDiag call
                above once real-device testing is done. */}
            {debugAvailable && diag && (
              <div className="absolute left-2 bottom-2 z-30 max-w-[68%] pointer-events-none rounded-md bg-black/70 px-2 py-1.5 font-mono text-[9px] leading-tight text-lime-300">
                <div>side: {diag.side}</div>
                <div>eyeWidthPx: {diag.eyeWidthPx}</div>
                <div>video: {diag.videoWidth}x{diag.videoHeight}</div>
                <div>container: {diag.containerW}x{diag.containerH}</div>
                <div>effVisW: {diag.effectiveVisibleWidth}</div>
                <div>widthFrac: {diag.widthFrac}</div>
                <div>roiW/H: {diag.roiW}/{diag.roiH}</div>
                <div>roiMinDim: {diag.roiMinDim}</div>
                <div>ear: {diag.ear}</div>
                <div>sharp/bright: {diag.sharpness}/{diag.brightness}</div>
                <div>reasons: {diag.reasons && diag.reasons.length ? diag.reasons.join(',') : '-'}</div>
              </div>
            )}
            {/* TEMP DIAGNOSTIC — Stage 2A/2B camera + native-ROI section,
                separate from the pre-existing panel above so the two
                don't get visually interleaved. Same removal note as
                the block above: delete together once real-device
                testing of Stage 2A/2B is done. */}
            {debugAvailable && diag && diag.camera && (
              <div className="absolute right-2 bottom-2 z-30 max-w-[68%] pointer-events-none rounded-md bg-black/70 px-2 py-1.5 font-mono text-[9px] leading-tight text-cyan-300">
                <div>[Camera Diagnostics]</div>
                <div>attempt: {diag.camera.requestedAttempt}</div>
                <div>actual: {diag.camera.actualSettings ? `${diag.camera.actualSettings.width}x${diag.camera.actualSettings.height}@${diag.camera.actualSettings.frameRate ? Math.round(diag.camera.actualSettings.frameRate) : '?'}` : '-'}</div>
                <div>videoNative: {diag.camera.videoNative.width}x{diag.camera.videoNative.height}</div>
                <div>faceApiInput: {diag.camera.faceApiInput.width}x{diag.camera.faceApiInput.height}</div>
                <div>mapScale: {diag.camera.mapping.scaleX}/{diag.camera.mapping.scaleY}</div>
                <div>eyeW face/native: {diag.camera.eye.eyeWidthFaceSpace}/{diag.camera.eye.eyeWidthNativeSpace}</div>
                <div>nativeROI: {diag.camera.roi ? `${diag.camera.roi.nativeWidth}x${diag.camera.roi.nativeHeight} @(${diag.camera.roi.nativeX},${diag.camera.roi.nativeY})` : '-'}</div>
                <div>highResAvailable: {String(diag.camera.highResAvailable)}</div>
                <div>usingFallbackPath: {String(diag.camera.usingFallbackPath)}</div>
              </div>
            )}
          </div>
          <div className="p-6 flex flex-col items-center gap-3 bg-bg">
            {!locked ? (
              <>
                <div className="w-full h-1 rounded-full bg-surface overflow-hidden">
                  <div className="h-full bg-accent transition-all duration-300" style={{width: `${Math.round(progress*100)}%`}}></div>
                </div>
                <p className="text-xs text-textSecondary text-center min-h-[16px]">{moveHint}</p>
              </>
            ) : (
              <button onClick={side === 'left' ? goNextEye : finish} className="w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]">
                {side === 'left' ? t('natLashContinueToRight', lang) : t('natLashViewProfile', lang)}
              </button>
            )}
          </div>
        </div>
      );
    }

    // Static-image analysis, reusing the exact same measurement +
    // classification + design-ranking engine as Live Scan. The only
    // difference is the source: one validated frame instead of an
    // aggregated multi-frame buffer, which is reflected honestly in
    // a reduced confidence multiplier and a `singleFrame` flag.
    function PhotoAnalysisScreen({ onComplete, onBack, modelsLoaded }) {
      const lang = useLang();
      const [state, setState] = useState('idle');
      const [previewUrl, setPreviewUrl] = useState(null);
      const fileInputRef = useRef(null);

      const analyze = async (file) => {
        if (!file) return;
        const url = URL.createObjectURL(file);
        setPreviewUrl(url);
        setState('analyzing');
        try {
          const img = await faceapi.fetchImage(url);
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const det = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 })).withFaceLandmarks();
          if (!det) { setState('error'); return; }

          const headPose = computeHeadPose(det.landmarks);
          const leftMetrics = computeEyeSideMetrics(det.landmarks, 'left', headPose);
          const rightMetrics = computeEyeSideMetrics(det.landmarks, 'right', headPose);
          // PHYSICAL EYE NORMALIZATION — see getPhysicalEyeLandmarks
          // above; leftEye/rightEye/leftBrowPts/rightBrowPts here are
          // the client's actual physical eyes, canonically ordered.
          const physicalLeft = getPhysicalEyeLandmarks(det.landmarks, 'left');
          const physicalRight = getPhysicalEyeLandmarks(det.landmarks, 'right');
          const leftEye = physicalLeft.eye, rightEye = physicalRight.eye;
          const brightness = sampleBrightness(ctx, leftEye.concat(rightEye));
          const sharpness = estimateSharpness(ctx, det.detection.box);
          const quality = assessFrameQuality({
            detScore: det.detection.score, headPose, leftEAR: leftMetrics.ear, rightEAR: rightMetrics.ear,
            brightness, sharpness, canvasWidth: canvas.width, boxWidth: det.detection.box.width,
          });
          console.log('[Photo] quality', quality);
          if (!quality.ok) { setState('error'); return; }

          const leftBrowPts = physicalLeft.brow, rightBrowPts = physicalRight.brow;
          const leftCrease = detectEyelidCrease(canvas, leftEye, leftBrowPts);
          const rightCrease = detectEyelidCrease(canvas, rightEye, rightBrowPts);
          leftMetrics.creaseValid = leftCrease.valid ? 1 : 0;
          leftMetrics.creaseProminence = leftCrease.valid ? leftCrease.prominence : 0;
          leftMetrics.creasePeak = leftCrease.valid ? leftCrease.peakVal : 0;
          leftMetrics.creaseYFrac = leftCrease.valid ? leftCrease.creaseYFrac : 0.5;
          leftMetrics.creaseReadQuality = leftCrease.valid ? leftCrease.readQuality : 0;
          rightMetrics.creaseValid = rightCrease.valid ? 1 : 0;
          rightMetrics.creaseProminence = rightCrease.valid ? rightCrease.prominence : 0;
          rightMetrics.creasePeak = rightCrease.valid ? rightCrease.peakVal : 0;
          rightMetrics.creaseYFrac = rightCrease.valid ? rightCrease.creaseYFrac : 0.5;
          rightMetrics.creaseReadQuality = rightCrease.valid ? rightCrease.readQuality : 0;

          // EYELID CREASE V2 — DEBUG SHADOW MODE ONLY, console-only
          // here. PhotoAnalysisScreen's analyze() calls onComplete()
          // immediately on success and unmounts — there is no stable
          // "review this photo" state to attach a persistent debug
          // panel to the way LiveScanScreen's ongoing tick loop has,
          // so adding the full CreaseV2DebugPanel UI here would mean
          // introducing a new intermediate screen state purely for
          // debug purposes — a real flow change, not a purely additive
          // one. Logging the V2 shadow result to console (inspectable
          // via Safari Web Inspector / remote debugging) captures the
          // same engineering data without altering this screen's
          // behavior at all. Never written into leftMetrics/rightMetrics.
          if (isDebugModeEnabled()) {
            console.log('[Photo] EYELID CREASE V2 (debug shadow, not used in classification)', {
              left: { v1: leftCrease, v2: detectEyelidCreaseV2(canvas, leftEye, leftBrowPts) },
              right: { v1: rightCrease, v2: detectEyelidCreaseV2(canvas, rightEye, rightBrowPts) },
            });
          }

          const verticalAsymRaw = (headPose.leftEyeCenter.y - headPose.rightEyeCenter.y) / Math.max(headPose.interEyeDistance, 1);
          const frame = { t: 0, leftMetrics, rightMetrics, headPose, faceBoxWidth: det.detection.box.width, verticalAsymRaw };
          const aggregated = aggregateBuffer([frame, frame, frame]);
          const imageQuality = clamp01(det.detection.score * (1 - Math.min(1, Math.abs(headPose.roll)/30)) * (1 - Math.min(1, Math.abs(headPose.yawProxy)/0.4)));
          const classified = classifyFeatures(aggregated, { singleFrame: true, stability: null, imageQuality });
          classified.overallConfidence = clamp01(classified.overallConfidence * 0.85);

          const leftIris = sampleIrisColor(ctx, leftEye), rightIris = sampleIrisColor(ctx, rightEye);
          const iris = combineIris(leftIris, rightIris);
          const designs = rankDesigns(classified, lang);
          console.log('[Photo] DESIGNS RANKED', designs.map(d => d.name + ' ' + d.score + '%').join(', '));

          onComplete({
            source: 'photo', eyeProfile: classified, iris, designs,
            originalImage: canvas.toDataURL('image/jpeg', 0.92), landmarks: det.landmarks,
            imageWidth: canvas.width, imageHeight: canvas.height, confidence: classified.overallConfidence,
          });
        } catch (e) {
          console.error('[Photo] PIPELINE ERROR', e);
          setState('error');
        }
      };

      return (
        <div className="h-full flex flex-col fade-in">
          <div className="p-4 flex justify-between items-center glass-strong">
            <BackButton onBack={onBack} />
            <span className="text-sm font-medium text-textPrimary">{t('photoBtn', lang)}</span>
            <div className="w-10"></div>
          </div>
          <div className="flex-1 flex flex-col items-center justify-center p-6">
            <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={e => analyze(e.target.files[0])} />
            <div className="w-full aspect-[4/5] rounded-lg bg-surface border border-border overflow-hidden flex items-center justify-center mb-6 relative">
              {previewUrl ? <img src={previewUrl} className="w-full h-full object-cover" alt="preview" /> : (
                <svg className="w-14 h-14 text-textMuted" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 7.5l-4.5-4.5m0 0L7.5 7.5m4.5-4.5v13.5"/></svg>
              )}
              {state === 'analyzing' && (
                <div className="absolute inset-0 bg-bg/80 flex flex-col items-center justify-center gap-3">
                  <div className="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
                  <p className="text-xs text-textSecondary uppercase tracking-wide">{t('photoAnalyzing', lang)}</p>
                </div>
              )}
            </div>
            {state === 'error' && (
              <div className="glass rounded-md p-4 border-danger/25 mb-4 w-full">
                <p className="text-xs text-danger leading-relaxed">{t('photoErrorQuality', lang)}</p>
              </div>
            )}
            <button onClick={() => fileInputRef.current?.click()} disabled={!modelsLoaded || state==='analyzing'} className={`w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale transition-colors disabled:opacity-50 ${!modelsLoaded || state==='analyzing' ? 'bg-white/10 text-textSecondary' : 'bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]'}`}>
              {state === 'error' ? t('photoTryAgain', lang) : t('photoSelect', lang)}
            </button>
            <p className="text-xs text-textMuted text-center mt-3">{t('photoHint', lang)}</p>
          </div>
        </div>
      );
    }

    // Single shared line-icon set — thin stroke, electric blue,
    // geometric, no emoji, no per-icon colors. Reused across Result,
    // Details, Lash Map and Application Plan cards.
    const PARAM_ICON_PATHS = {
      shape: 'M2.5 12c1.7-4 5-6.5 9.5-6.5s7.8 2.5 9.5 6.5c-1.7 4-5 6.5-9.5 6.5S4.2 16 2.5 12z|M12 14.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z',
      position: 'M4 15l5-6 4 3 7-8|M20 4h-4v4',
      size: 'M8 3v4M16 3v4M5 8h14a1 1 0 011 1v9a1 1 0 01-1 1H5a1 1 0 01-1-1V9a1 1 0 011-1z',
      symmetry: 'M12 3v18|M9 6L5 8v8l4 2|M15 6l4 2v8l-4 2',
      lid: 'M4 13c2-2.5 5-4 8-4s6 1.5 8 4|M4 13c2 2 5 3.5 8 3.5s6-1.5 8-3.5',
      iris: 'M12 3v3M12 18v3M3 12h3M18 12h3|circle:12,12,7|circle:12,12,2.6',
      curl: 'M4 18c0-6 4-11 11-11-3 0-6 2-6 6s3 5 6 5-2 4-6 4-5-1.5-5-4z',
      length: 'M4 12h13M13 7l4 5-4 5',
      density: 'M6 5v14M12 3v18M18 5v14',
      technique: 'M4 6h16M4 12h16M4 18h10',
      lashmap: 'M3 17c3-8 7-11 9-11s6 3 9 11|M6 9l1.5 3|M18 9l-1.5 3|M12 6v4',
      recommend: 'M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z',
      zoning: 'M4 5h16v14H4z|M4 12h16|M10 5v14',
      artist: 'M5 19l3.2-1 9-9-2.2-2.2-9 9L5 19z|M14.3 5.7l2.2 2.2',
      asymmetry: 'M12 3v18|M6 8l-2 4 2 4|M18 8l2 4-2 4',
    };
    function ParamIcon({ name, className }) {
      const spec = PARAM_ICON_PATHS[name] || PARAM_ICON_PATHS.shape;
      const parts = spec.split('|');
      return (
        <svg className={className || 'w-4 h-4 text-accent'} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          {parts.map((part, i) => part.startsWith('circle:') ? (
            <circle key={i} cx={part.split(':')[1].split(',')[0]} cy={part.split(':')[1].split(',')[1]} r={part.split(':')[1].split(',')[2]} />
          ) : (
            <path key={i} d={part} />
          ))}
        </svg>
      );
    }

    // Labels/values can legitimately be long ("Удлинённо-миндалевидная",
    // "Needs visual confirmation") — they wrap to a second line instead
    // of being cut off with an ellipsis, per the explicit requirement
    // that mobile UI never truncates these into "...".
    function EyeProfileRow({ icon, label, sublabel, value, confidence }) {
      return (
        <div className="flex justify-between items-start gap-3 py-3 border-b border-border/60 last:border-0">
          <div className="flex items-start gap-3 min-w-0 flex-1">
            <div className="w-8 h-8 rounded-md bg-white/[0.03] border border-border flex items-center justify-center flex-shrink-0 mt-0.5">
              <ParamIcon name={icon} className="w-4 h-4 text-accent" />
            </div>
            <div className="min-w-0">
              <p className="text-sm text-textPrimary leading-snug">{label}</p>
              {sublabel && <p className="text-[11px] text-textMuted leading-snug">{sublabel}</p>}
            </div>
          </div>
          <div className="flex flex-col items-end gap-1 flex-shrink-0 max-w-[42%] text-right">
            <span className="text-sm font-semibold text-cyan leading-snug">{value}</span>
            {typeof confidence === 'number' && <span className="text-[10px] text-textMuted">{Math.round(confidence*100)}%</span>}
          </div>
        </div>
      );
    }

    // Outer-corner tilt is reported as "needs confirmation" (rather than
    // a forced upturned/neutral/downturned guess) when its own computed
    // confidence is too low to trust — not when the value is simply
    // close to zero, since a small, consistently-measured tilt is a
    // real, valid "neutral" reading, not an uncertain one.
    const TILT_CONFIDENCE_FLOOR = 0.22;
    function eyeProfileLabels(p, iris, lang) {
      const shape = t('shape_' + p.eyeShapeCategory, lang);
      const tilt = p.tiltConfidence < TILT_CONFIDENCE_FLOOR ? t('tiltUncertain', lang)
        : p.tiltTendency === 'upturned' ? t('tiltUpturned', lang)
        : p.tiltTendency === 'downturned' ? t('tiltDownturned', lang)
        : t('tiltNeutral', lang);
      const hooding = p.eyelidCategory === 'pronounced' ? t('eyelidPronounced', lang)
        : p.eyelidCategory === 'moderate' ? t('eyelidModerate', lang)
        : p.eyelidCategory === 'mild' ? t('eyelidMild', lang)
        : p.eyelidCategory === 'open' ? t('eyelidOpen', lang)
        : t('eyelidUncertain', lang);
      // Raw crease-read label — always the true computed value, used
      // for the "most likely" note when the two eyelid signals
      // disagree. The DISPLAYED label (below) is suppressed to
      // "needs confirmation" in that case instead of showing a
      // confident diagnosis next to a contradicting one.
      const eyelidTypeRawLabel = p.eyelidType === 'openCrease' ? t('eyelidTypeOpenCrease', lang)
        : p.eyelidType === 'hooded' ? t('eyelidTypeHooded', lang)
        : p.eyelidType === 'monolid' ? t('eyelidTypeMonolid', lang)
        : t('eyelidTypeUncertain', lang);
      const eyelidTypeLabel = p.eyelidSignalsConflict ? t('eyelidTypeUncertain', lang) : eyelidTypeRawLabel;
      const spacing = t('eyeSet_' + p.eyeSetCategory, lang);
      const eyeSize = t('eyeSize_' + p.eyeSizeCategory, lang);
      const symmetry = t('symmetry_' + p.symmetryCategory, lang);
      const irisName = iris?.name ? (lang==='en' ? IRIS_NAMES[iris.name].en : IRIS_NAMES[iris.name].ru) : t('insufficientData', lang);
      return { shape, tilt, hooding, eyelidTypeLabel, eyelidTypeRawLabel, spacing, eyeSize, symmetry, irisName };
    }

    // ---- Eye Highlight ----
    // A short, positive, personalized line built ONLY from the real
    // classification result (dominant shape x corner direction, with an
    // asymmetry- or eyelid-aware variant) — never a fixed one-size-fits-
    // all sentence, never a numeric "attractiveness" score, never a
    // medical claim. Picks the most specific template it has real
    // evidence for; falls back to a generic-but-still-derived line when
    // shape/tilt are themselves uncertain.
    function generateEyeHighlight(c, lang) {
      const en = lang === 'en';
      const shape = c.eyeShapeCategory || 'uncertain';
      const tiltKnown = c.tiltConfidence >= TILT_CONFIDENCE_FLOOR;
      const tilt = tiltKnown ? c.tiltTendency : 'neutral';

      if (c.compositeAsymmetry > 0.09) {
        const asymBase = {
          almond: [en ? 'Your eyes have a naturally harmonious almond shape, with some individual left/right asymmetry — the artist can use it to personalize the design.' : 'У ваших глаз гармоничная миндалевидная форма с небольшой индивидуальной асимметрией левого и правого глаза — мастер может использовать эту особенность при персонализации схемы.'],
          round: [en ? 'Your round, open eyes carry a touch of natural left/right individuality — the artist can use it to fine-tune the balance of the design.' : 'У округлых, открытых глаз есть небольшая природная индивидуальность левого и правого глаза — мастер может использовать её для тонкой балансировки схемы.'],
          elongatedAlmond: [en ? 'Your elongated almond eyes show a bit of natural left/right individuality — the artist can use it to fine-tune peak position on each side.' : 'У вытянуто-миндалевидных глаз есть небольшая природная индивидуальность левого и правого глаза — мастер может использовать её для точной настройки положения пика с каждой стороны.'],
          narrow: [en ? 'Your eyes have a delicate, narrow opening with some natural left/right individuality — the artist can factor that into a balanced design.' : 'У глаз деликатное, узкое раскрытие с небольшой природной индивидуальностью левого и правого — мастер может учесть это в сбалансированной схеме.'],
        };
        return (asymBase[shape] || [en ? 'There’s a natural, individual asymmetry between your eyes — the artist can use it to personalize the lash design.' : 'У глаз есть естественная индивидуальная асимметрия — мастер может использовать её при персонализации схемы.'])[0];
      }

      const key = shape + '_' + tilt;
      const templates = {
        almond_upturned: [en ? 'Your almond eye shape pairs with a natural upward lift at the outer corner — an expressive combination the lash design can beautifully echo.' : 'Миндалевидная форма глаз сочетается с естественным подъёмом внешнего уголка — эту выразительную особенность легко красиво подчеркнуть направлением схемы.'],
        almond_neutral: [en ? 'Your eyes have a very harmonious almond shape — it supports both natural and more expressive lash designs equally well.' : 'У ваших глаз очень гармоничная миндалевидная форма. Она хорошо поддерживает как натуральные, так и более выразительные схемы наращивания.'],
        almond_downturned: [en ? 'Your almond eyes have a soft, gentle outer corner — a design with a lift toward the outer third can add an elegant accent.' : 'Миндалевидные глаза с мягким, спокойным внешним уголком — схема с акцентом на подъём во внешней трети добавит элегантный штрих.'],

    function App() {
      const [lang, setLangState] = useState(() => {
        try { return localStorage.getItem('lashStudioLang') || 'ru'; } catch (e) { return 'ru'; }
      });
      const setLang = (l) => {
        if (typeof Analytics !== 'undefined') Analytics.track('language_changed', { lang: l });
        setLangState(l);
        try { localStorage.setItem('lashStudioLang', l); } catch (e) {}
      };

      // ------------------------------------------------------------
      // CONSENT — Phase 1: consent foundation only. `consent` is the
      // stored decision record (or null = no decision made yet).
      // ConsentManager (consent-manager.js) is the ONLY thing that
      // reads/writes it; App() never touches localStorage directly for
      // this. Reject/Accept/Customize here ONLY ever change this local
      // choice — nothing in this file loads a script, calls a network
      // endpoint, or gates any scan/result functionality on it.
      // ------------------------------------------------------------
      const consentStorageRef = useRef(null);
      if (!consentStorageRef.current) {
        consentStorageRef.current = (typeof ConsentManager !== 'undefined') ? ConsentManager.defaultStorage() : null;
      }
      const [consent, setConsent] = useState(() => {
        try { return (typeof ConsentManager !== 'undefined') ? ConsentManager.getConsent(consentStorageRef.current) : null; } catch (e) { return null; }
      });
      const [consentSettingsOpen, setConsentSettingsOpen] = useState(false);
      const applyConsent = (analytics) => {
        try {
          if (typeof ConsentManager !== 'undefined') {
            setConsent(ConsentManager.setConsent(consentStorageRef.current, analytics));
          }
        } catch (e) { /* best-effort; UI still reflects the choice even if persistence fails */ }
        setConsentSettingsOpen(false);
      };

      // ------------------------------------------------------------
      // ANALYTICS — Phase 2, Stage 2.1-2.3. The ONLY place this app
      // reads consent for analytics purposes: whenever `consent`
      // changes (Accept/Reject/Customize-save/withdraw, including the
      // very first render for a returning already-decided user),
      // re-read the decision through the EXISTING
      // ConsentManager.isAnalyticsAllowed(storage) — the same function
      // the rest of the app already trusts as the single source of
      // truth for "is analytics allowed right now" — and forward that
      // boolean into Analytics.setConsent(...). This file never
      // recomputes the analytics-allowed boolean itself (no
      // `consent.analytics === true` duplicated here); it defers
      // entirely to ConsentManager. Analytics itself (analytics.js)
      // re-checks this on every track() call, not just here — so a
      // withdrawal takes effect immediately, not only on the next
      // render. Stage 2.1-2.3: the provider behind Analytics is an
      // inert no-op stub — this effect never causes a real
      // script/network request regardless of the boolean's value (see
      // analytics.js's header).
      // ------------------------------------------------------------
      useEffect(() => {
        if (typeof Analytics !== 'undefined' && typeof ConsentManager !== 'undefined') {
          Analytics.setConsent(ConsentManager.isAnalyticsAllowed(consentStorageRef.current));
        }
      }, [consent]);

      // Debug-only entry point: ?debug=library lands directly on the
      // read-only Professional Lash Library preview. Read once at
      // mount, never re-checked, never surfaced as a visible button —
      // ordinary users always start on 'home' exactly as before.
      const [screen, setScreen] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get('debug') === 'library' ? 'proLibraryPreview' : 'home';
        } catch (e) { return 'home'; }
      });
      // Debug-only: which canonical identity the library preview detail
      // screen is showing. Completely separate from every production
      // selection/result piece of state below — never read by, written
      // by, or fed into recommendation, ranking, scan, camera, Lash Map,
      // Try-On, or Application Plan logic.
      const [debugPreviewCanonicalId, setDebugPreviewCanonicalId] = useState(null);

      // ------------------------------------------------------------
      // CLIENT CARD — Phase 2. A single long-lived ClientStore instance
      // for this session (lazily created, same useRef pattern as
      // consentStorageRef above). activeClientId is the only piece of
      // navigation state this feature needs: null + screen==='clientForm'
      // means "creating a new client"; set + screen==='clientForm' means
      // "editing that client"; set + screen==='clientCard' means "viewing
      // that client's card". Completely separate from result/
      // naturalLashProfile/activeDesign — never read by, written by, or
      // fed into recommendation, ranking, scan, camera, Lash Map, or
      // Application Plan logic.
      // ------------------------------------------------------------
      const clientStoreRef = useRef(null);
      if (!clientStoreRef.current) {
        clientStoreRef.current = (typeof ClientStore !== 'undefined') ? ClientStore.createClientStore() : null;
      }
      const [activeClientId, setActiveClientId] = useState(null);
      const [clientDataConsentGranted, setClientDataConsentGranted] = useState(() => {
        try { return (typeof ClientDataConsent !== 'undefined') ? ClientDataConsent.isClientDataAllowed(ClientDataConsent.defaultStorage()) : false; } catch (e) { return false; }
      });
      const grantClientDataConsent = () => {
        try { if (typeof ClientDataConsent !== 'undefined') ClientDataConsent.setConsent(ClientDataConsent.defaultStorage(), true); } catch (e) { /* best-effort; UI still reflects the grant even if persistence fails */ }
        setClientDataConsentGranted(true);
      };
      // clientSelectForSave/pendingVisitSnapshot are defensively reset
      // here too — the normal Home -> Clients entry point must never
      // inherit save-mode state left over from an earlier flow.
      const openClientsList = () => { setClientSelectForSave(false); setPendingVisitSnapshot(null); setScreen('clients'); };
      const openClientCard = (id) => { setActiveClientId(id); setScreen('clientCard'); };
      const openNewClientForm = () => { setActiveClientId(null); setScreen('clientForm'); };
      const openEditClientForm = (id) => { setActiveClientId(id); setScreen('clientForm'); };

      // ------------------------------------------------------------
      // SAVE TO CLIENT — CLIENT-3. Wires the CLIENT-1 canonical Visit
      // snapshot (VisitSnapshot.buildVisitSnapshot) and the existing
      // Client Card data layer (ClientStore/ClientDataConsent) to the
      // completed analysis/design screens. pendingVisitSnapshot is a
      // transient, in-memory-only holder for one built snapshot while
      // the artist chooses/creates a client — never a second permanent
      // source of truth, never containing photo/landmark data (see
      // visit-snapshot.js's own boundary proof), and always cleared on
      // success, cancel, or consent decline.
      // ------------------------------------------------------------
      const [pendingVisitSnapshot, setPendingVisitSnapshot] = useState(null);
      const [saveVisitReturnScreen, setSaveVisitReturnScreen] = useState(null);
      const [saveConsentPromptOpen, setSaveConsentPromptOpen] = useState(false);
      const [clientSelectForSave, setClientSelectForSave] = useState(false);
      const [saveVisitBusy, setSaveVisitBusy] = useState(false);
      const saveVisitBusyRef = useRef(false);
      const [saveVisitToast, setSaveVisitToast] = useState(null);

      // Captures exactly what is currently on screen: the live result/
      // naturalLashProfile state plus the given ClientLashDesign v2
      // object. Never recomputes analysis, reruns recommendation, or
      // reruns calculateEyeLashMap — buildVisitSnapshot only reads
      // already-computed fields.
      const beginSaveToClient = (design) => {
        if (!result || typeof VisitSnapshot === 'undefined') return;
        const snapshot = VisitSnapshot.buildVisitSnapshot({ result, activeDesign: design || null, naturalLashProfile });
        setPendingVisitSnapshot(snapshot);
        setSaveVisitReturnScreen(screen);
        if (!clientDataConsentGranted) { setSaveConsentPromptOpen(true); return; }
        setClientSelectForSave(true);
        setScreen('clients');
      };

      // Full abandon: only reachable from the client-select list's own
      // back action — discards the pending snapshot, creates nothing.
      const cancelSaveToClient = () => {
        setPendingVisitSnapshot(null);
        setClientSelectForSave(false);
        setScreen(saveVisitReturnScreen || 'hero');
        setSaveVisitReturnScreen(null);
      };

      const handleSaveConsentAccept = () => {
        grantClientDataConsent();
        setSaveConsentPromptOpen(false);
        setClientSelectForSave(true);
        setScreen('clients');
      };
      // Consent declined: no Client/Visit record is ever created;
      // return safely to exactly where the artist was (screen was
      // never changed while the prompt was open).
      const handleSaveConsentDecline = () => {
        setSaveConsentPromptOpen(false);
        setPendingVisitSnapshot(null);
        setSaveVisitReturnScreen(null);
      };

      // One createVisit call per intentional Save-to-Client operation —
      // saveVisitBusy guards against double-tap/async re-entry. Used
      // both for an existing client (tapped directly from the
      // save-mode list) and for a brand-new client (called from
      // onSaved below) — exactly the "reuse the same handler" the
      // brief asks for. On failure, pendingVisitSnapshot is
      // deliberately NOT cleared so the artist can retry the same
      // save; the UI never claims a failed write was persisted.
      const finishSaveToClient = async (clientId) => {
        // saveVisitBusyRef guards synchronously, independent of React's
        // state-update batching/timing — saveVisitBusy (state) only
        // drives the UI's disabled affordance. Two calls arriving in
        // the same synchronous tick (not just two separate click
        // events) must still only ever create one Visit.
        if (saveVisitBusyRef.current || !pendingVisitSnapshot) return;
        saveVisitBusyRef.current = true;
        setSaveVisitBusy(true);
        const store = clientStoreRef.current;
        try {
          if (!store) throw new Error('client store unavailable');
          await store.createVisit(clientId, pendingVisitSnapshot);
          const mode = await store.whenReady();
          setSaveVisitToast({ ok: true, persistent: mode === 'indexeddb' });
          setPendingVisitSnapshot(null);
          setClientSelectForSave(false);
          setSaveVisitReturnScreen(null);
          setActiveClientId(clientId);
          setScreen('clientCard');
        } catch (e) {
          setSaveVisitToast({ ok: false });
        } finally {
          saveVisitBusyRef.current = false;
          setSaveVisitBusy(false);
        }
      };

      // Reused as ClientFormScreen's onSaved for BOTH ordinary client
      // creation/editing and the "create a new client mid-save" flow —
      // pendingVisitSnapshot is only ever non-null during an actual
      // Save-to-Client operation, so ordinary client creation from the
      // Clients screen is completely unaffected.
      const handleClientFormSaved = (client) => {
        if (pendingVisitSnapshot && clientSelectForSave) {
          // Keep the created client even if saving its visit fails. The
          // form now edits this record, so retry cannot create a duplicate.
          setActiveClientId(client.id);
          finishSaveToClient(client.id);
        } else {
          setActiveClientId(client.id);
          setScreen('clientCard');
        }
      };

      const [result, setResult] = useState(null);
      const [naturalLashProfile, setNaturalLashProfile] = useState(null);
      const [activeDesign, setActiveDesign] = useState(null);
      const [modelsLoaded, setModelsLoaded] = useState(false);
      const [loadError, setLoadError] = useState(false);
      const [loadAttempt, setLoadAttempt] = useState(0);

      // Models load once at the App root and are reused by every
      // screen — Live Scan and Photo Analysis both read the same
      // faceapi.nets singletons, never reloading them per screen.
      useEffect(() => {
        let cancelled = false;
        const load = async () => {
          setLoadError(false);
          try {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            if (!cancelled) setModelsLoaded(true);
          } catch (e) {
            // Store a flag, not a pre-formatted string — the message
            // is localized at render time from current `lang`, so a
            // language switch after a load failure still updates it
            // instead of leaving it frozen in the old language.
            if (!cancelled) setLoadError(true);
          }
        };
        load();
        return () => { cancelled = true; };
      }, [loadAttempt]);

      const handleComplete = (rec) => { if (typeof Analytics !== 'undefined') Analytics.track('scan_completed', { mode: screen === 'scan' ? 'live' : 'photo' }); setResult(rec); setNaturalLashProfile(null); setScreen('review'); };
      const handleReviewConfirm = (rec) => { if (typeof Analytics !== 'undefined') Analytics.track('results_viewed'); setResult(rec); setScreen('hero'); };
      const retryLoad = () => setLoadAttempt(a => a + 1);
      const viewMap = (design) => { setActiveDesign(design); setScreen('lashmap'); };
      const handleLashScanComplete = (profile) => { setNaturalLashProfile(profile); setScreen('lashprofile'); };
      // Hero saves its current first recommendation; only the map uses
      // activeDesign. Returning from a map must not leak that old selection
      // into a save from Hero. Choosing another card opens its current map.
      const handleSaveToClient = () => {
        if (!result) return;
        const design = screen === 'lashmap'
          ? activeDesign
          : (result.designs && result.designs.length)
            ? canonicalRecommendationProps(result.designs[0], result.eyeProfile, lang, 0).clientDesign
            : null;
        beginSaveToClient(design);
      };

      return (
        <LangContext.Provider value={lang}>
          <div className="app-container">
            {screen !== 'scan' && screen !== 'lashscan' && (
              <div className="absolute top-3 right-3 z-30 flex items-center gap-2">
                <ConsentIconButton lang={lang} onClick={() => setConsentSettingsOpen(true)} />
                <LangToggle lang={lang} setLang={setLang} />
              </div>
            )}
            {screen === 'home' && <HomeScreen onLive={() => { if (typeof Analytics !== 'undefined') Analytics.track('scan_started', { mode: 'live' }); setScreen('scan'); }} onPhoto={() => { if (typeof Analytics !== 'undefined') Analytics.track('scan_started', { mode: 'photo' }); setScreen('photo'); }} modelsLoaded={modelsLoaded} loadError={loadError} onRetry={retryLoad} onClients={openClientsList} />}
            {screen === 'clients' && <ClientsListScreen lang={lang} store={clientStoreRef.current} onOpenClient={openClientCard} onNewClient={openNewClientForm} onBack={clientSelectForSave ? cancelSaveToClient : () => setScreen('home')} saveMode={clientSelectForSave} onSelectForSave={finishSaveToClient} busy={saveVisitBusy} />}
            {screen === 'clientCard' && activeClientId && <ClientCardScreen lang={lang} clientId={activeClientId} store={clientStoreRef.current} onBack={() => setScreen('clients')} onEdit={openEditClientForm} onDeleted={() => { setActiveClientId(null); setScreen('clients'); }} />}
            {screen === 'clientForm' && <ClientFormScreen lang={lang} clientId={activeClientId} store={clientStoreRef.current} consentGranted={clientDataConsentGranted} onGrantConsent={grantClientDataConsent} onSaved={handleClientFormSaved} onCancel={() => setScreen(clientSelectForSave ? 'clients' : (activeClientId ? 'clientCard' : 'clients'))} />}
            {screen === 'scan' && <LiveScanScreen onComplete={handleComplete} onBack={() => setScreen('home')} modelsLoaded={modelsLoaded} onSetLang={setLang} />}
            {screen === 'photo' && <PhotoAnalysisScreen onComplete={handleComplete} onBack={() => setScreen('home')} modelsLoaded={modelsLoaded} />}
            {screen === 'review' && result && <ReviewScreen result={result} onConfirm={handleReviewConfirm} onBack={() => setScreen('home')} onRescan={() => { if (typeof Analytics !== 'undefined') Analytics.track('rescan_started'); setScreen('home'); }} />}
            {screen === 'hero' && result && <HeroScreen result={result} naturalLashProfile={naturalLashProfile} onViewMap={viewMap} onDetails={() => { if (typeof Analytics !== 'undefined') Analytics.track('details_viewed'); setScreen('details'); }} onAllDesigns={() => setScreen('catalog')} onScanLashes={() => setScreen('lashscan')} onViewLashProfile={() => setScreen('lashprofile')} onBack={() => setScreen('home')} onSaveToClient={handleSaveToClient} />}
            {screen === 'catalog' && result && <AllDesignsScreen result={result} onSelect={viewMap} onBack={() => setScreen('hero')} />}
            {screen === 'lashmap' && result && activeDesign && <LashMapScreen result={result} design={LashDesignDomain.recommendationPropsFromClientDesign(activeDesign)} naturalLashProfile={naturalLashProfile} onBack={() => setScreen('hero')} onSaveToClient={handleSaveToClient} />}
            {screen === 'details' && result && <DetailsScreen result={result} onBack={() => setScreen('hero')} />}
            {screen === 'lashscan' && <NaturalLashScanScreen onComplete={handleLashScanComplete} onBack={() => setScreen('hero')} modelsLoaded={modelsLoaded} />}
            {screen === 'lashprofile' && naturalLashProfile && <NaturalLashProfileScreen profile={naturalLashProfile} onDone={() => setScreen('hero')} onBack={() => setScreen('hero')} />}
            {screen === 'proLibraryPreview' && <ProLibraryPreviewScreen onBack={() => setScreen('home')} onSelect={(canonicalId) => { setDebugPreviewCanonicalId(canonicalId); setScreen('proLibraryDetail'); }} />}
            {screen === 'proLibraryDetail' && debugPreviewCanonicalId && <ProLibraryDetailScreen canonicalId={debugPreviewCanonicalId} onBack={() => setScreen('proLibraryPreview')} />}

            {/* First-visit consent banner: only while undecided, never
               during live-camera screens, and never together with the
               settings panel. Reject/Accept/Customize here never touch
               scan/result state above — screen, result, and every
               handler are completely untouched by consent. */}
            {!consent && !consentSettingsOpen && screen !== 'scan' && screen !== 'lashscan' && (
              <ConsentPanel
                lang={lang}
                mode="banner"
                currentConsent={consent}
                onAccept={() => applyConsent(true)}
                onReject={() => applyConsent(false)}
                onSaveCustom={(analytics) => applyConsent(analytics)}
              />
            )}
            {consentSettingsOpen && (
              <ConsentPanel
                lang={lang}
                mode="settings"
                currentConsent={consent}
                onAccept={() => applyConsent(true)}
                onReject={() => applyConsent(false)}
                onSaveCustom={(analytics) => applyConsent(analytics)}
                onClose={() => setConsentSettingsOpen(false)}
              />
            )}
            {saveConsentPromptOpen && (
              <ClientDataConsentPrompt lang={lang} onAccept={handleSaveConsentAccept} onDecline={handleSaveConsentDecline} />
            )}
            <SaveVisitToast toast={saveVisitToast} lang={lang} onDismiss={() => setSaveVisitToast(null)} />
          </div>
        </LangContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

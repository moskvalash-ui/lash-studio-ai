          const r = data[idx], g = data[idx+1], b = data[idx+2];
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          const lightness = (max+min)/2;
          const sat = max === min ? 0 : (lightness > 127 ? (max-min)/(510-max-min) : (max-min)/(max+min));
          const pixel = { x: x0+x, y: y0+y, r, g, b, lightness, sat };
          candidates.push(pixel);
          // face-api's 68-point model has eyelid contours but no iris
          // landmarks. The old full-disc sample therefore mixed the pupil
          // and lid/lash margins into the iris. Sample the stable visible
          // iris annulus instead: exclude the pupil core and the outer/lid
          // boundary while retaining all hues and luminance levels.
          const nx = dx / Math.max(radius, 1);
          const ny = dy / Math.max(radius * 0.82, 1);
          const radial = Math.sqrt(nx*nx + ny*ny);
          if (radial < 0.30) { rejected.push({ ...pixel, reason:'pupil_core' }); continue; }
          if (radial > 0.88) { rejected.push({ ...pixel, reason:'outside_iris_annulus' }); continue; }
          // Only near-white, near-achromatic pixels are catchlights. The old
          // >200/<0.25 rule also removed legitimate pale blue/gray iris.
          if (lightness > 235 && sat < 0.12) { rejected.push({ ...pixel, reason:'bright_specular' }); continue; }
          if (lightness < 25) { rejected.push({ ...pixel, reason:'dark_pupil_or_lash' }); continue; }
          samples.push(pixel);
        }
      }
      if (samples.length < 6) return { valid: true, roi, rgb: null, name: null, confidence: 0, samples: samples.length, candidates, accepted: [], rejected };
      let rMed = med(samples.map(s=>s.r)), gMed = med(samples.map(s=>s.g)), bMed = med(samples.map(s=>s.b));
      const withDist = samples.map(s => ({ ...s, d: (s.r-rMed)**2 + (s.g-gMed)**2 + (s.b-bMed)**2 }));
      withDist.sort((a,b) => a.d - b.d);
      const trimmed = withDist.slice(0, Math.max(6, Math.floor(withDist.length * 0.8)));
      for (const p of withDist.slice(trimmed.length)) rejected.push({ ...p, reason:'trimmed_outlier' });
      rMed = med(trimmed.map(s=>s.r)); gMed = med(trimmed.map(s=>s.g)); bMed = med(trimmed.map(s=>s.b));
      const name = classifyIrisColor(rMed,gMed,bMed);
      const medianDistance = med(trimmed.map(s => Math.sqrt((s.r-rMed)**2 + (s.g-gMed)**2 + (s.b-bMed)**2)));
      const colorConsistency = Math.max(0, Math.min(1, 1 - medianDistance/45));
      const sectors = [[],[],[],[]];
      for (const s of trimmed) {
        const sx = s.x - cx, sy = s.y - cy;
        sectors[(sy >= 0 ? 2 : 0) + (sx >= 0 ? 1 : 0)].push(s);
      }
      const sectorNames = sectors.filter(s => s.length >= 3).map(s => classifyIrisColor(med(s.map(p=>p.r)), med(s.map(p=>p.g)), med(s.map(p=>p.b))));
      const sectorAgreement = sectorNames.length ? sectorNames.filter(v => v === name).length / sectorNames.length : 0;
      const coverage = Math.min(1, trimmed.length/20);
      const confidence = coverage * (0.55*colorConsistency + 0.45*sectorAgreement);
      // RADIAL OUTER-BAND CORROBORATION (additive to the angular sectors
      // above -- never replaces them). A real iris can genuinely have a
      // different color at the outer/limbal band than at the pupil-
      // adjacent inner band (e.g. a warm inner ring with a cooler-hued
      // outer ring). The flat annulus-wide median above and the angular
      // quadrants both blend every radius together, which can dilute real
      // outer-band evidence down into 'uncertain'. Only trusted as a
      // genuine radial split (not noise) when: the outer band alone has
      // enough pixels and enough internal color agreement to stand on its
      // own, its color differs from the flat median's, and the inner band
      // still independently confirms the ORIGINAL flat-median category --
      // proving a real inner/outer split exists rather than uniformly
      // scattered noise. Symmetric across every color: nothing here
      // references green, brown, or any other specific hue.
      const radialBandWidth = (0.88 - 0.30) / 3;
      const radialGroups = [[], [], []];
      for (const s of trimmed) {
        const sx = s.x - cx, sy = s.y - cy;
        const nx = sx / Math.max(radius, 1), ny = sy / Math.max(radius * 0.82, 1);
        const radial = Math.sqrt(nx*nx + ny*ny);
        const band = radial < 0.30 + radialBandWidth ? 0 : radial < 0.30 + 2*radialBandWidth ? 1 : 2;
        radialGroups[band].push(s);
      }
      const [innerGroup, , outerGroup] = radialGroups;
      const innerName = innerGroup.length >= 3 ? classifyIrisColor(med(innerGroup.map(p=>p.r)), med(innerGroup.map(p=>p.g)), med(innerGroup.map(p=>p.b))) : null;
      let outerName = null, outerRgb = null, outerConsistency = 0;
      if (outerGroup.length >= 3) {
        outerRgb = [med(outerGroup.map(p=>p.r)), med(outerGroup.map(p=>p.g)), med(outerGroup.map(p=>p.b))];
        outerName = classifyIrisColor(...outerRgb);
        const outerMedianDistance = med(outerGroup.map(p => Math.sqrt((p.r-outerRgb[0])**2 + (p.g-outerRgb[1])**2 + (p.b-outerRgb[2])**2)));
        outerConsistency = Math.max(0, Math.min(1, 1 - outerMedianDistance/45));
      }
      const OUTER_MIN_PIXELS = 20, OUTER_MIN_CONSISTENCY = 0.55;
      const outerCorroborated = outerGroup.length >= OUTER_MIN_PIXELS && outerConsistency >= OUTER_MIN_CONSISTENCY &&
        outerName && outerName !== 'uncertain' && outerName !== 'mixed' && outerName !== name && innerName === name;
      const radialEvidence = { innerCount: innerGroup.length, innerName, outerCount: outerGroup.length, outerName, outerConsistency, outerCorroborated, source: outerCorroborated ? 'outer_radial' : 'global' };
      // A spatially split mixture is genuinely ambiguous even if its global
      // median happens to land in one category -- UNLESS the radial
      // corroboration above proves it's a real inner/outer split rather
      // than angularly-scattered noise, in which case the outer band's own
      // color is trusted instead of falling back to 'uncertain'.
      const selectedName = sectorNames.length < 3 || sectorAgreement < 0.6
        ? (outerCorroborated ? outerName : 'uncertain')
        : name;
      const selectedRgb = outerCorroborated ? outerRgb : [rMed, gMed, bMed];
      return { valid: true, roi, rgb:selectedRgb, name:selectedName, confidence, samples:trimmed.length, candidates, accepted:trimmed, rejected, medianDistance, colorConsistency, sectorAgreement, sectorNames, radialEvidence };
    }

    function sampleIrisColor(ctx, eyePoints) {
      const a = analyzeIrisSample(ctx, eyePoints);
      // Phase C3d: colorComposition is computed ADDITIVELY from
      // analyzeIrisSample's own already-accepted pixel set (a.accepted)
      // and its own already-computed roi -- analyzeIrisSample itself is
      // untouched, still the sole source of the accepted-pixel evidence,
      // still the sole owner of pupil/sclera/highlight rejection.
      const colorComposition = computeIrisColorComposition(a.accepted, a.roi);
      return { rgb:a.rgb, hex:a.rgb ? rgbToHex(...a.rgb) : null, name:a.name, confidence:a.confidence, samples:a.samples, colorComposition };
    }

    function rgbToHsl(r,g,b) {
      r/=255; g/=255; b/=255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h = 0, s = 0; const l = (max+min)/2;
      if (max !== min) {
        const d = max-min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        if (max === r) h = (g-b)/d + (g<b?6:0);
        else if (max === g) h = (b-r)/d + 2;
        else h = (r-g)/d + 4;
        h *= 60;
      }
      return { h, s, l };
    }

    const IRIS_NAMES = {
      dark: {ru:'Тёмно-карие', en:'Dark Brown'}, brown: {ru:'Карие', en:'Brown'},
      hazel: {ru:'Ореховые (hazel)', en:'Hazel'}, amber: {ru:'Янтарные', en:'Amber'},
      green: {ru:'Зелёные', en:'Green'}, blue: {ru:'Голубые', en:'Blue'},
      gray: {ru:'Серые', en:'Gray'}, mixed: {ru:'Смешанный оттенок', en:'Mixed'},
      // `uncertain` is a COLOR-classification outcome after a capture has
      // already passed assessFrameQuality; it is not a capture-quality
      // failure and must not tell the user to retry a valid scan.
      uncertain: {ru:'Оттенок не определён', en:'Color inconclusive'},
    };
    // Phase C3d composition model — additive label vocabulary only, never
    // consumed by classifyIrisColor/combineIris/analyzeIrisSample above.
    // IRIS_FAMILY_NAMES: short singular-adjective wording for the "X 47%
    // · Y 34%" percentage-breakdown line specifically (deliberately
    // distinct from IRIS_NAMES' plural "eyes are ___" wording above,
    // which reads wrong in a per-family percentage list).
    const IRIS_FAMILY_NAMES = {
      green: {ru:'Зелёный', en:'Green'}, blue: {ru:'Голубой', en:'Blue'},
      gray: {ru:'Серый', en:'Gray'}, brown: {ru:'Карий', en:'Brown'},
      amber: {ru:'Янтарный', en:'Amber'},
    };
    // IRIS_COMBO_NAMES: the new two-family primary labels. Deliberately
    // does NOT redefine 'mixed'/'uncertain' here -- those keep using the
    // existing, already-tested IRIS_NAMES.mixed/uncertain entries above
    // verbatim.
    const IRIS_COMBO_NAMES = {
      blueGray: {ru:'Сине-серый оттенок', en:'Blue-gray'},
      grayGreen: {ru:'Серо-зелёный оттенок', en:'Gray-green'},
      greenBrown: {ru:'Зелёно-карий оттенок', en:'Green-brown'},
      greenAmber: {ru:'Зелёно-янтарный оттенок', en:'Green-amber'},
      brownAmber: {ru:'Коричнево-янтарный оттенок', en:'Brown-amber'},
    };
    // Resolves any deriveIrisColorCompositionLabel() key to its {ru,en}
    // display string, checking the combo table first, then falling back
    // to the existing, protected IRIS_NAMES (covers pure dominant
    // families blue/green/brown/amber/gray plus hazel/mixed/uncertain).
    function resolveIrisColorLabel(key) {
      return IRIS_COMBO_NAMES[key] || IRIS_NAMES[key] || IRIS_NAMES.uncertain;
    }
    // Low lightness (<0.35) is colorimetrically ambiguous BY ITSELF: a
    // genuinely dark/brown iris and an underexposed light (blue/green/gray)
    // iris can both produce a dim reading. The two call sites below used to
    // return 'brown' unconditionally for anything this dim, regardless of
    // hue -- proven (real-capture regression fixture + full-hue-sweep test,
    // see tests/iris-color-audit.test.js) to force EVERY hue, including
    // pure blue/green, into 'brown' whenever l<0.32/0.35, which is why a
    // visually light iris photographed under typical (non-ideal) lighting
    // read brown at ~34% confidence in production.
    //
    // This routes by hue instead, using the SAME hue windows already
    // established below for hazel/amber/green/blue, but reuses production's
    // own existing s<0.15 "achromatic" bar (already used by the 'gray' rule
    // two lines down) to decide whether hue is trustworthy enough to route
    // on at all. Below that bar there is no additional evidence anywhere in
    // this pipeline to resolve dark-brown vs. underexposed-light -- so this
    // reports 'uncertain' rather than guessing either way.
    //
    // GREEN-MISREAD-AS-BROWN FOLLOW-UP (new real-world report): the
    // l<0.16 branch below was deliberately left OUT of the fix above --
    // it returned the hue-blind 'dark' category unconditionally,
    // labelled "Dark Brown" in the UI (IRIS_NAMES.dark) regardless of
    // actual hue. That is the exact same "darkness alone implies brown"
    // failure shape as the bug just fixed, just at a lower lightness
    // floor -- a genuinely dark GREEN or BLUE iris (very plausible under
    // ordinary phone-camera lighting) would be branded "Dark Brown" with
    // zero hue evidence considered. `veryDark` now routes l<0.16 through
    // this SAME tested hue/saturation logic instead of a separate
    // hue-blind rule, returning 'dark' (Dark Brown) only when there is
    // actual warm-hue evidence for it -- 'dark' remains a real, reachable
    // category for genuinely dark+warm irises, it just now requires the
    // same positive evidence every other category already requires.
    function classifyLowLightAmbiguous(h, s, veryDark) {
      if (s < 0.15) return 'uncertain';
      if (h >= 70 && h <= 170) return 'green';
      if (h > 170 && h <= 250) return 'blue';
      return veryDark ? 'dark' : 'brown'; // remaining warm (red/orange/brown) window, wrapping through 0deg: (250,360] U [0,70)
    }
    function classifyIrisColor(r,g,b) {
      const { h, s, l } = rgbToHsl(r,g,b);
      const chroma = Math.max(r,g,b) - Math.min(r,g,b);
      if (l < 0.16) return classifyLowLightAmbiguous(h, s, true);
      // Absolute chroma is more stable than HSL saturation for pale colors:
      // the same visible blue channel separation produces a lower HSL S as
      // luminance rises. Chroma <10 is treated as neutral gray; >=10 with a
      // cold hue is measurable blue evidence, not merely "light" evidence.
      if (l >= 0.35 && h >= 175 && h <= 250 && chroma >= 10) return 'blue';
      if (l < 0.32 && s < 0.35) return classifyLowLightAmbiguous(h, s, false);
      if (h >= 20 && h <= 45 && s > 0.25 && l >= 0.25 && l < 0.55) return 'hazel';
      if (h >= 40 && h <= 70 && s > 0.15 && l >= 0.35) return 'amber';
      if (h >= 70 && h <= 170 && s > 0.15) return 'green';
      if (h >= 180 && h <= 250 && s > 0.12) return 'blue';
      if (chroma < 10 && l >= 0.35 && l < 0.7) return 'gray';
      if (l < 0.35) return classifyLowLightAmbiguous(h, s, false);
      return 'mixed';
    }

    function combineIris(l, r) {
      if (!l.rgb && !r.rgb) return { color: null, hex: null, name: null, confidence: 0 };
      if (!l.rgb) return { color: true, hex: r.hex, name: r.confidence > 0 ? r.name : 'uncertain', confidence: r.confidence * 0.7 };
      if (!r.rgb) return { color: true, hex: l.hex, name: l.confidence > 0 ? l.name : 'uncertain', confidence: l.confidence * 0.7 };
      // Confidence-weighted blend, not a plain 50/50 average: an eye with
      // enough (>=6) accepted pixels to have a non-null rgb can still be
      // low-confidence (poor colorConsistency/sectorAgreement -- lid-
      // shadow contamination, blur, few sectors) while a confident eye's
      // rgb should not be diluted by it equally. Reduces to the original
      // plain average whenever both eyes carry equal confidence (the
      // common case, unchanged); only shifts when one eye's evidence is
      // markedly weaker than the other's. Falls back to an even 50/50
      // blend only when neither eye carries any confidence at all.
      const weightSum = l.confidence + r.confidence;
      const lWeight = weightSum > 0 ? l.confidence / weightSum : 0.5;
      const rgb = [
        l.rgb[0]*lWeight + r.rgb[0]*(1-lWeight),
        l.rgb[1]*lWeight + r.rgb[1]*(1-lWeight),
        l.rgb[2]*lWeight + r.rgb[2]*(1-lWeight),
      ];
      const diff = Math.sqrt((l.rgb[0]-r.rgb[0])**2 + (l.rgb[1]-r.rgb[1])**2 + (l.rgb[2]-r.rgb[2])**2);
      const consistency = Math.max(0, 1 - diff/80);
      const confidence = Math.min(l.confidence, r.confidence) * (0.5 + 0.5*consistency);
      // EVIDENCE-BASED UNCERTAINTY PROPAGATION (product decision: reliability
      // over forced classification). Previously only BOTH eyes already being
      // 'uncertain' forced the bilateral name to 'uncertain' -- a single eye
      // already flagged unreliable by its own real evidence (low sector
      // agreement, too few populated sectors, or colorimetric ambiguity in
      // classifyIrisColor itself) could still be silently overridden the
      // moment its partner eye was confident, since the blended rgb was
      // simply re-classified from scratch with no memory of that per-eye
      // verdict. Now EITHER eye's own 'uncertain' verdict is authoritative
      // and is never overridden by RGB blending/re-classification -- no new
      // confidence floor or disagreement threshold is introduced; this uses
      // only the categorical 'uncertain' signal analyzeIrisSample/
      // classifyIrisColor already compute today. The confident+confident
      // disagreement case (e.g. green vs brown, both individually reliable)
      // is deliberately NOT addressed here -- see the report for why.
      const eitherUncertain = l.name === 'uncertain' || r.name === 'uncertain';
      const name = !eitherUncertain && confidence > 0 ? classifyIrisColor(rgb[0],rgb[1],rgb[2]) : 'uncertain';
      return { color: true, hex: rgbToHex(rgb[0],rgb[1],rgb[2]), name, confidence };
    }

    // ============================================================
    // IRIS COLOR — PERCENTAGE COMPOSITION MODEL (Phase C3d).
    // ------------------------------------------------------------
    // ADDITIVE ONLY: analyzeIrisSample/classifyIrisColor/combineIris
    // above are completely unmodified by this block -- every existing
    // quality gate, pupil/sclera/highlight rejection, sector/radial
    // corroboration, and the categorical `selectedCategory`/`name`
    // pipeline behaves exactly as before. This block instead computes a
    // SECOND, continuous, evidence-weighted view (colorComposition) from
    // the SAME accepted-pixel population analyzeIrisSample already
    // produces (its `accepted` field), for the new percentage UI. It
    // never re-samples raw image pixels and never touches the pupil/
    // sclera/highlight rejection that already happened.
    //
    // FAMILY HUE WINDOWS reuse classifyIrisColor's OWN existing hue
    // boundaries (brown/amber/green/blue) as the centers of a soft,
    // triangular membership function, rather than an independently
    // invented window -- a pixel near a boundary (e.g. the old 'hazel'
    // zone, h20-45) is split fractionally between its two neighboring
    // families (green/brown/amber) instead of snapping to one, which is
    // exactly how a hazel-like COMPOSITION now emerges from evidence
    // instead of being its own hard-coded category.
    function classifyIrisColorFamilyWeights(r, g, b) {
      const { h } = rgbToHsl(r, g, b);

      // Hue reliability is CHROMA-based (not HSL saturation), matching
      // classifyIrisColor's own existing, documented reasoning for its
      // chroma-based blue rule: "Absolute chroma is more stable than
      // HSL saturation for pale colors -- the same visible channel
      // separation produces a lower HSL S as luminance rises." Using a
      // saturation-only bar here would systematically under-credit real
      // evidence (e.g. a confidently-blue, well-lit iris) purely because
      // its lightness is high, not because the color evidence is weak --
      // proven directly: the BLUE fixture's own accepted pixels have
      // real chroma (~20+) but HSL saturation as low as ~0.10-0.18,
      // which a saturation-only bar would have wrongly discounted. The
      // zero-point (chroma<10) reuses classifyIrisColor's OWN existing
      // gray-rule cutoff verbatim, so the two stay consistent; the
      // ramp-up band (10-14) avoids a hard cliff while still reaching
      // full trust quickly enough that the BLUE/BROWN fixtures' own
      // real accepted-pixel chroma (empirically ~19-24 for BLUE, higher
      // for BROWN) lands solidly at full reliability, not partially
      // discounted.
      const hueReliability = Math.max(0, Math.min(1, (chroma - 10) / 4));
      const weights = { green: 0, blue: 0, brown: 0, amber: 0, gray: 1 - hueReliability };
      if (hueReliability <= 0) return weights;
      const FAMILY_WINDOWS = [
        { family: 'brown', center: 10, span: 45 },
        { family: 'amber', center: 55, span: 30 },
        { family: 'green', center: 120, span: 60 },
        { family: 'blue', center: 215, span: 55 },
      ];
      const triangularWeight = (hue, center, span) => {
        let d = Math.abs(hue - center);

        return Math.max(0, 1 - d / span);

      const raw = FAMILY_WINDOWS.map(w => triangularWeight(h, w.center, w.span));
      const rawSum = raw.reduce((a, b2) => a + b2, 0);
      if (rawSum <= 0) {

        // to the single nearest family rather than discarding otherwise-
        // reliable hue evidence.

    // Per-eye composition: weights every pixel in analyzeIrisSample's
    // OWN already-accepted set (never raw candidates, never rejected

    // edge taper, and (c) a radial-BAND trust multiplier. (b): pixels
    // within ~8% of the pupil-exclusion edge (radial just above 0.30) or
    // the outer-exclusion edge (radial just below 0.88) are slightly
    // more prone to partial-pixel blending with the pupil or sclera
    // boundary, so they contribute somewhat less (floor 0.5x, never
    // zero -- a confidence taper, not a second rejection gate;
    // analyzeIrisSample already owns rejection). (c): the OUTER third of
    // the sampled annulus is trusted somewhat more than the inner third
    // (using the SAME three-band split analyzeIrisSample's own radial-
    // corroboration mechanism already defines) -- proven necessary, not
    // stylistic: real-capture evidence (the established green-eye
    // fixture) shows the outer/limbal band can carry genuinely different,
    // more representative color evidence than the pupil-adjacent inner
    // band, which is exactly why that existing mechanism already elevates
    // outer-band trust for the categorical pipeline. This composition
    // model uses a continuous version of the same principle rather than
    // the categorical pipeline's own outer-band-corroboration machinery
    // (which stays completely untouched). roi is analyzeIrisSample's own
    // returned roi (cx/cy/radius) -- no geometry is re-derived or guessed.

      if (!acceptedPixels || !acceptedPixels.length || !roi) return null;

      let totalWeight = 0;
      const EDGE = 0.08;

    // still sums to 1.

      if (!leftComposition && !rightComposition) return null;

          // reads as the familiar "hazel" idiom; a lopsided pair (one
          // side clearly dominating the other) is reported as the
          // honest, specific "Green-brown"/"Green-amber" mixture instead
          // of overclaiming a hazel identity the evidence doesn't
          // support as strongly.

    // family's short name via IRIS_FAMILY_NAMES.

        .map(([family, frac]) => [family, Math.round(frac * 100)])
        .filter(([, pct]) => pct > 0)

    }

    function debugBuildIrisContextFeatures(ctx,leftEye,rightEye,leftAudit,rightAudit,leftIris,rightIris) {

      const right=debugBuildIrisContextEye(ctx,rightEye,rightAudit,rightIris,'right');

    // NEW THIS TURN — forward-looking DEBUG-ONLY instrumentation for the

    // Purely descriptive geometric summary of the pixels ALREADY tagged

    // useful to a human reviewer, never used to decide anything.
    function debugIrisPupilCandidate(rejectedPixels, roi) {

      const totalWeight = 3 + thresholds.foreheadWeight;
      return {
        total: (wLen + wJaw + wChin + wBrow * thresholds.foreheadWeight) / totalWeight,
        withoutForehead: (wLen + wJaw + wChin) / 3,
      };
    }

    // opts.singleFrame mirrors classifyFeatures' own flag (photo-
    // sourced reads have no temporal stability signal). opts.imageQuality
    // is the same 0..1 proxy already computed by the caller for
    // classifyFeatures — reused, not recomputed.
    function classifyFaceShape(landmarks, headPose, opts) {
      opts = opts || {};
      const T = FACE_SHAPE_PROVISIONAL_THRESHOLDS;
      const qualityFlags = [];
      const positions = landmarks && landmarks.positions;

      // Raw jaw-outline + inner-brow indices only — see the landmark
      // map in the audit. Using raw positions[] (not face-api's
      // left/right-named getters) sidesteps this file's own
      // documented image-side-vs-physical-side ambiguity entirely,
      // since these are symmetric width/distance measurements where
      // anatomical handedness doesn't matter.
      const REQUIRED_INDICES = [0, 4, 6, 8, 10, 12, 16, 21, 22];
      const hasAllPoints = Array.isArray(positions) && positions.length >= 68 &&
        REQUIRED_INDICES.every((i) => positions[i] && typeof positions[i].x === 'number' && typeof positions[i].y === 'number');

      if (!hasAllPoints) {
        return { category: 'uncertain', confidence: 0, isUncertain: true, measurements: null, qualityFlags: ['missing_landmarks'] };
      }

      // ---- face-shape-specific pose gate — independent of, and never
      // affecting, assessFrameQuality/the eye-analysis frame-acceptance
      // decision. This can only ever make THIS result 'uncertain'. ----
      const roll = headPose && typeof headPose.roll === 'number' ? headPose.roll : null;
      const yawProxy = headPose && typeof headPose.yawProxy === 'number' ? headPose.yawProxy : null;
      const pitchProxy = headPose && typeof headPose.pitchProxy === 'number' ? headPose.pitchProxy : null;
      if (roll === null || yawProxy === null || pitchProxy === null) qualityFlags.push('missing_head_pose');
      if (roll !== null && Math.abs(roll) > T.pose.maxRollDeg) qualityFlags.push('excessive_roll');
      if (yawProxy !== null && Math.abs(yawProxy) > T.pose.maxYawProxy) qualityFlags.push('excessive_yaw');
      if (pitchProxy !== null && (pitchProxy < T.pose.pitchProxyMin || pitchProxy > T.pose.pitchProxyMax)) qualityFlags.push('excessive_pitch');

      let poseHeadroom = 0;
      if (roll !== null && yawProxy !== null && pitchProxy !== null) {
        const rollHeadroom = 1 - Math.abs(roll) / T.pose.maxRollDeg;
        const yawHeadroom = 1 - Math.abs(yawProxy) / T.pose.maxYawProxy;
        const pitchMid = (T.pose.pitchProxyMin + T.pose.pitchProxyMax) / 2;
        const pitchHalfRange = (T.pose.pitchProxyMax - T.pose.pitchProxyMin) / 2;
        const pitchHeadroom = pitchHalfRange > 0 ? 1 - Math.abs(pitchProxy - pitchMid) / pitchHalfRange : 0;
        poseHeadroom = clamp01(Math.min(rollHeadroom, yawHeadroom, pitchHeadroom));
      }

      const p = positions;
      const templeWidth = dist(p[0], p[16]);
      const jawWidth = dist(p[4], p[12]);
      const chinWidth = dist(p[6], p[10]);
      const browMid = { x: (p[21].x + p[22].x) / 2, y: (p[21].y + p[22].y) / 2 };
      const lowerFaceLength = dist(browMid, p[8]);
      const browWidth = dist(p[17], p[26]);
      const rawDistances = { templeWidth, jawWidth, chinWidth, lowerFaceLength, browWidth };

      const interEyeDistance = headPose && typeof headPose.interEyeDistance === 'number' && headPose.interEyeDistance > 0
        ? headPose.interEyeDistance : null;
      let plausible = Object.values(rawDistances).every((d) => typeof d === 'number' && isFinite(d) && d > 0);
      if (plausible && interEyeDistance) {
        plausible = Object.values(rawDistances).every((d) => {
          const r = d / interEyeDistance;
          return r >= T.plausibility.minRatioToInterEye && r <= T.plausibility.maxRatioToInterEye;
        });
      }
      if (!plausible) qualityFlags.push('implausible_geometry');

      const mustBeUncertain = qualityFlags.some((f) =>
        f === 'missing_head_pose' || f === 'excessive_roll' || f === 'excessive_yaw' || f === 'excessive_pitch' || f === 'implausible_geometry');
      if (mustBeUncertain) {
        return { category: 'uncertain', confidence: 0, isUncertain: true, measurements: { ...rawDistances }, qualityFlags };
      }

      const ratios = {
        lengthToWidth: lowerFaceLength / templeWidth,
        jawTaper: jawWidth / templeWidth,
        chinTaper: chinWidth / jawWidth,
        foreheadSoft: browWidth / templeWidth,
      };

      const shapeNames = Object.keys(T.shapeTargets);
      const scored = shapeNames.map((name) => {
        const s = scoreFaceShapeCandidate(ratios, T.shapeTargets[name], T);
        return { name, score: s.total, scoreWithoutForehead: s.withoutForehead };
      }).sort((a, b) => b.score - a.score);

      const top = scored[0];
      const runnerUp = scored[1];
      const margin = top.score - runnerUp.score;

      // Is the win mainly explained by the weak forehead proxy? If
      // dropping it would swap the ranking, or would itself leave too
      // thin a margin, this decision leans too heavily on the
      // weakest measurement and must clear a stricter bar.
      const withoutForeheadSorted = scored.slice().sort((a, b) => b.scoreWithoutForehead - a.scoreWithoutForehead);
      const foreheadDriven = withoutForeheadSorted[0].name !== top.name ||
        (withoutForeheadSorted[0].scoreWithoutForehead - withoutForeheadSorted[1].scoreWithoutForehead) < T.minMargin;
      if (foreheadDriven) qualityFlags.push('forehead_proxy_dependent');
      const requiredMargin = foreheadDriven ? T.minMarginWhenForeheadDriven : T.minMargin;

      const measurements = { ...rawDistances, ratios, scores: scored };

      // ---- confidence, via the SAME shared primitive classifyFeatures
      // uses (computeConfidence) — not a new confidence math. ----
      const jawSymmetry = clamp01(1 - Math.abs(dist(p[0], p[8]) - dist(p[16], p[8])) / Math.max(dist(p[0], p[8]), dist(p[16], p[8]), 1));
      const confidenceResult = computeConfidence({
        measurementAgreement: top.score,
        landmarkStability: opts.singleFrame ? 0.35 : 0.6,
        imageQuality: typeof opts.imageQuality === 'number' ? opts.imageQuality : 0.5,
        lrAgreement: jawSymmetry,
        poseQuality: poseHeadroom,
      });

      if (top.score < T.minTopScore) {
        qualityFlags.push('low_match_score');
        return { category: 'uncertain', confidence: confidenceResult.score, isUncertain: true, measurements, qualityFlags };
      }
      if (margin < requiredMargin) {
        qualityFlags.push('ambiguous_margin');
        return { category: 'uncertain', confidence: confidenceResult.score, isUncertain: true, measurements, qualityFlags };
      }

      return { category: top.name, confidence: confidenceResult.score, isUncertain: false, measurements, qualityFlags };
    }

    // Turns aggregated measurements into independent, labeled
    // tendencies with their own confidence — never one forced hard
    // category when the geometry is ambiguous. `opts.stability` (from
    // computeStability, live-scan only) and `opts.imageQuality`
    // (0..1 proxy from detector score + sharpness/brightness) feed
    // the confidence engine; `opts.singleFrame` marks a photo-sourced
    // read where there is no temporal stability signal at all.
    function classifyFeatures(aggregated, opts) {
      opts = opts || {};
      const singleFrame = !!opts.singleFrame;
      const stability = opts.stability || null;
      const imageQuality = clamp01(opts.imageQuality ?? 0.6);
      const poseQuality = clamp01(1 - Math.abs(aggregated.headPose?.roll || 0) / 20);
      const stabilityFactor = (key) => {
        if (singleFrame || !stability || !stability.variance || !stability.variance[key]) return 0.35;
        const [sl, sr] = stability.variance[key];
        const norm = key === 'tilt' || key === 'taper' ? 4 : key === 'hooding' ? 0.06 : 0.12;
        return clamp01(1 - ((sl + sr) / 2) / norm);
      };
      const { left, right, interEyeDistance, faceBoxWidth, verticalAsymRaw } = aggregated;

      // ---- EYE SHAPE — multi-signal classifier ----
      // Never decided from width/height ratio alone. Combines, per
      // side: horizontal elongation (width/aperture), the REAL taper
      // angle at each corner (a genuine geometric measurement — sharp
      // angle = tapered/almond-like, wide angle = rounder — not
      // derived from the elongation ratio), and how symmetric the
      // aperture is between the two ends of the eye. Elongated-Almond
      // requires BOTH strong elongation AND almond-like tapering at
      // once (a large width/height ratio alone is not enough — see
      // scoreElongatedAlmond's extra clamp01 term). Narrow is scored
      // from aperture directly but is a MEDIAN across the whole
      // stable-frame buffer, which already suppresses momentary
      // blink/squint frames rather than reacting to any single frame.
      const sideShapeSignals = (m) => ({
        whRatio: m.shapeRatio,
        avgTaper: (m.innerTaperDeg + m.outerTaperDeg) / 2,
        taperAsymmetry: Math.abs(m.innerTaperDeg - m.outerTaperDeg) / Math.max((m.innerTaperDeg + m.outerTaperDeg) / 2, 1),
        apertureAsymmetry: m.apertureAsymmetry,
      });
      const Lsig = sideShapeSignals(left), Rsig = sideShapeSignals(right);
      const avg2 = (a, b) => (a + b) / 2;
      const whRatio = avg2(Lsig.whRatio, Rsig.whRatio);
      const avgTaper = avg2(Lsig.avgTaper, Rsig.avgTaper);
      const apertureAsymmetryAvg = avg2(Lsig.apertureAsymmetry, Rsig.apertureAsymmetry);

      const scoreRound = gaussianBump(whRatio, 2.0, 0.30) * gaussianBump(avgTaper, 82, 22) * (0.6 + 0.4*apertureAsymmetryAvg);
      const scoreAlmond = gaussianBump(whRatio, 2.55, 0.38) * gaussianBump(avgTaper, 58, 20) * (0.6 + 0.4*apertureAsymmetryAvg);
      const scoreElongatedAlmond = gaussianBump(whRatio, 3.25, 0.5) * gaussianBump(avgTaper, 52, 18) * clamp01((whRatio - 2.85) / 0.6) * (0.6 + 0.4*apertureAsymmetryAvg);
      const avgEarForShape = avg2(left.ear, right.ear);
      // EAR alone (aperture/width) can look "narrow" purely because
      // width is unusually large, not because the aperture itself is
      // genuinely small — dampen the narrow score as elongation
      // climbs past a realistic range so extreme width/height ratios
      // read as elongated-almond, not narrow.
      const scoreNarrow = gaussianBump(avgEarForShape, 0.18, 0.055) * clamp01((0.27 - avgEarForShape) / 0.09 + 0.25) * clamp01(1 - Math.max(0, whRatio - 3.6) / 2);

      const shapeScores = { round: scoreRound, almond: scoreAlmond, elongatedAlmond: scoreElongatedAlmond, narrow: scoreNarrow };
      // Raw (pre-normalization) top score matters as much as the
      // normalized margin: if every category's raw fit is poor (an
      // out-of-typical-range geometry that doesn't really match any
      // of the modeled shapes), normalizing four near-zero numbers
      // can still produce a "confident-looking" 99% share for
      // whichever is least-tiny — the raw floor below stops that.
      const rawTopScore = Math.max(...Object.values(shapeScores));
      const shapeScoreSum = Object.values(shapeScores).reduce((a,b) => a+b, 0) || 1;
      const eyeShapeTendencies = Object.fromEntries(Object.entries(shapeScores).map(([k,v]) => [k, v/shapeScoreSum]));
      const shapeEntriesNew = Object.entries(eyeShapeTendencies).sort((a,b) => b[1]-a[1]);
      const [topShapeKey, topShapeScore] = shapeEntriesNew[0];
      const shapeMargin = topShapeScore - shapeEntriesNew[1][1];

      const shapeMeasurementAgreement = clamp01(1 - avg2(Lsig.taperAsymmetry, Rsig.taperAsymmetry) / 0.6);
      const shapeLrAgreement = clamp01(1 - Math.abs(Lsig.whRatio - Rsig.whRatio)/1.2) * 0.5 + clamp01(1 - Math.abs(Lsig.avgTaper - Rsig.avgTaper)/25) * 0.5;
      const shapeConf = computeConfidence({
        measurementAgreement: shapeMeasurementAgreement,
        landmarkStability: stabilityFactor('widthRatio'),
        imageQuality, lrAgreement: shapeLrAgreement, poseQuality,
      });
      // A category only wins if it's the clear top score (real margin
      // over the runner-up), that raw fit is actually meaningful (not
      // a near-zero fit against every modeled category), AND the
      // engine is confident enough — otherwise this is an honest
      // "uncertain", never a forced pick.
      let eyeShapeCategory = (topShapeScore > 0.34 && shapeMargin > 0.08 && rawTopScore > 0.05 && shapeConf.score > 0.4) ? topShapeKey : 'uncertain';
      const eyeShapeConfidence = eyeShapeCategory === 'uncertain' ? clamp01(shapeConf.score * 0.6) : shapeConf.score;

      // Legacy-compatible fields — every DESIGN_CATALOG score/why/goal/
      // cautions function and recommendCurl/generateApplicationPlan
      // already reads dominantShape/shapeTendencies/shapeConfidence by
      // these exact names; they're derived from the SAME new scores
      // above rather than recomputed, so recommendation behavior stays
      // consistent with what the user now sees on screen.
      const LEGACY_SHAPE_MAP = { round: 'round', almond: 'almond', elongatedAlmond: 'elongated', narrow: 'mixed', uncertain: 'mixed' };
      const dominantShape = LEGACY_SHAPE_MAP[eyeShapeCategory];
      const shapeConfidence = eyeShapeConfidence;
      const shapeTendencies = (() => {
        const t = { round: eyeShapeTendencies.round, almond: eyeShapeTendencies.almond, elongated: eyeShapeTendencies.elongatedAlmond };
        const s = t.round + t.almond + t.elongated || 1;
        return { round: t.round/s, almond: t.almond/s, elongated: t.elongated/s };
      })();

      const avgWidthRatio = (left.widthRatio + right.widthRatio) / 2;
      const appearanceWidth = avgWidthRatio < 0.41 ? 'narrow' : avgWidthRatio > 0.49 ? 'wide' : 'balanced';
      const appearanceConfidence = Math.max(0.15, Math.min(1, Math.abs(avgWidthRatio - 0.45) / 0.06));

      // ---- OUTER CORNER DIRECTION ----
      // tiltCorrected already subtracts head roll (computeEyeSideMetrics).
      // Confidence now also factors in L/R agreement — if the two
      // corners' measured direction genuinely disagree by a lot, that's
      // usually measurement noise for a single unified label, not real
      // anatomy, and should lower confidence rather than average away.
      // RIGHT is expressed in the mirrored landmark coordinate frame.
      // Normalize it before deriving the bilateral direction, just as
      // the asymmetry calculation below already does.
      const leftPhysicalTilt = left.tiltCorrected;
      const rightPhysicalTilt = mirrorReflectDeg(right.tiltCorrected);
      const avgTilt = (leftPhysicalTilt + rightPhysicalTilt) / 2;
      let tiltTendency = 'neutral';
      if (avgTilt < -4) tiltTendency = 'upturned';
      else if (avgTilt > 4) tiltTendency = 'downturned';
      const tiltLrAgreement = clamp01(1 - shortestAngleDiffDeg(leftPhysicalTilt, rightPhysicalTilt) / 8);
      const tiltConf = computeConfidence({
        measurementAgreement: clamp01(Math.abs(avgTilt) / 10),
        landmarkStability: stabilityFactor('tilt'),
        imageQuality, lrAgreement: tiltLrAgreement, poseQuality,
      });
      const tiltConfidence = tiltConf.score;

      // ---- Eyelid coverage / hooding — multi-signal classifier ----
      // Never a single brow->lid distance. Combines four independent
      // reads per side (brow-to-lid gap at the center, inner corner and
      // outer corner, each scaled by the eye's own width, plus a second
      // gap-vs-eye-OPENING-height cross-check using a different
      // denominator entirely) into one coverage index, and only commits
      // to a confident category when those signals actually agree with
      // each other AND between left/right AND the eyes aren't just
      // squinting (very low EAR makes the geometry unreliable). When
      // they don't agree, the result is honestly reported as needing
      // visual confirmation rather than forcing a guess.
      const avgHoodingA = (left.hoodingRatio + right.hoodingRatio) / 2; // kept for downstream compat (unused in the new category math)
      const avgCovCenter = (left.covCenterByWidth + right.covCenterByWidth) / 2;
      const avgCovInner = (left.covInnerByWidth + right.covInnerByWidth) / 2;
      const avgCovOuter = (left.covOuterByWidth + right.covOuterByWidth) / 2;
      const avgCovByHeight = (left.covByHeight + right.covByHeight) / 2;
      const avgEar = (left.ear + right.ear) / 2;

      const coverageIndex = avgCovCenter * 0.5 + avgCovInner * 0.25 + avgCovOuter * 0.25;
      const coverageSpread = Math.max(avgCovCenter, avgCovInner, avgCovOuter) - Math.min(avgCovCenter, avgCovInner, avgCovOuter);
      // avgCovByHeight lives on a different numeric scale (divided by the
      // much-smaller eye-opening height); ~0.36 is the typical eye
      // height:width ratio at a natural, non-squinting eye opening, used
      // only to bring the two signals onto a comparable axis — not a
      // hooding threshold itself.
      const heightCrossCheck = avgCovByHeight * 0.36;
      const signalAgreement = clamp01(1 - Math.abs(coverageIndex - heightCrossCheck) / 0.15);
      const lrGapDiff = Math.abs(left.covCenterByWidth - right.covCenterByWidth);
      const lrAgreement = clamp01(1 - lrGapDiff / 0.18);
      const earReliability = clamp01((avgEar - 0.14) / 0.10); // near-closed eyes make this geometry unreliable, not just "more hooded"
      const spreadPenalty = clamp01(1 - coverageSpread / 0.22);

      let eyelidCategory;
      if (coverageIndex < 0.20) eyelidCategory = 'pronounced';
      else if (coverageIndex < 0.28) eyelidCategory = 'moderate';
      else if (coverageIndex < 0.36) eyelidCategory = 'mild';
      else eyelidCategory = 'open';

      const boundaryDist = Math.min(Math.abs(coverageIndex - 0.20), Math.abs(coverageIndex - 0.28), Math.abs(coverageIndex - 0.36), 0.06) / 0.06;
      const hoodConf = computeConfidence({
        measurementAgreement: (signalAgreement + spreadPenalty) / 2,
        landmarkStability: stabilityFactor('hooding'),
        imageQuality: clamp01(imageQuality * 0.5 + earReliability * 0.5),
        lrAgreement, poseQuality,
      });
      let eyelidCategoryConfidence = clamp01(hoodConf.score * (0.5 + boundaryDist * 0.5));
      if (eyelidCategoryConfidence < 0.32) eyelidCategory = 'uncertain';

      // Backward-compatible fields the existing design-scoring/plan-text
      // engine already reads (recommendCurl, DESIGN_CATALOG score/why/
      // goal/cautions, generateApplicationPlan) — derived from the same
      // richer signal above rather than a separate calculation, so
      // scoring behavior stays consistent with what the user now sees.
      let isHooded = eyelidCategory === 'pronounced' || eyelidCategory === 'moderate';
      let hoodedConfidence = eyelidCategory === 'uncertain' ? 0.25 : eyelidCategoryConfidence;
      const hoodingSignalsAgree = signalAgreement > 0.6 && lrAgreement > 0.6;
      let hoodingLevel = eyelidCategory === 'pronounced' ? 'full' : eyelidCategory === 'moderate' ? 'partial' : 'none';

      // ---- Eyelid TYPE — crease-aware classification (CONSERVATIVE V1) ----
      // Three explicitly separated signals, per-eye first:
      //   Signal A (this block) — CREASE VISIBILITY, evaluated
      //     independently for each eye from detectEyelidCrease's
      //     unmodified peak/prominence/readQuality output, THEN
      //     combined only when both eyes actually agree.
      //   Signal B — eyelidCategory/coverageIndex above (geometry).
      //     Read here, NEVER mutated here — geometry stays an
      //     independent measurement regardless of what the crease
      //     signal finds (this was the source of a real bug: the
      //     previous version force-overwrote eyelidCategory to
      //     reconcile it with the pixel read, which corrupted the
      //     one signal meant to be independently verifiable).
      //   Signal C (eyelidType below) — the combined assessment,
      //     which only asserts a strong anatomical label (hooded /
      //     monolid) when A and B are genuinely compatible; any
      //     disagreement, ambiguity, or insufficient per-eye evidence
      //     resolves to 'uncertain' directly from the decision tree,
      //     not via a confidence-score gate (see the note below on
      //     why the old <0.32 rescue gate was removed).
      //   openCrease — both eyes show a clear fold, geometry doesn't
      //                independently read moderate/pronounced
      //   hooded     — both eyes show a clear fold AND geometry
      //                independently reads moderate/pronounced
      //                (position alone can no longer trigger this —
      //                see the ambiguous-position branch below)
      //   monolid    — both eyes are readable with no fold found, AND
      //                geometry independently reads open (genuinely
      //                compatible evidence — anything else is a
      //                conflict, not a confirmation)
      //   uncertain  — either eye unreadable, the two eyes disagree,
      //                a clear-but-low-position crease meets open/mild
      //                geometry (deep-set anatomy can look like this
      //                without true hooding), or a "no fold" read
      //                meets non-open geometry — NEVER silently
      //                resolved into one of the other three
      const avgCreaseYFrac = (left.creaseYFrac + right.creaseYFrac) / 2;
      const creaseLrAgreement = clamp01(1 - Math.abs(left.creaseProminence - right.creaseProminence) / 8);

      // Absolute gray-level floors, NOT a peak/baseline ratio — same
      // rationale and same values as before (detectEyelidCrease and
      // these floors are unchanged): a ratio blows up the instant
      // sensor/JPEG noise nudges one row a little above an already-
      // tiny median, which is exactly the case (perfectly flat,
      // crease-free skin) that most needs an honest "no fold found"
      // instead of a false positive.
      const CREASE_PEAK_FLOOR = 7;
      const CREASE_PROMINENCE_FLOOR = 5;

      // ---- Signal A, per eye, independently ----
      // A reading that fails the fold floor is NOT automatically
      // treated as confident evidence of absence — a peak/prominence
      // that narrowly misses the floor (e.g. 6.9 vs the 7 floor) is
      // just as consistent with measurement noise near the boundary
      // as with a genuinely creaseless eyelid, and must not be
      // strong enough on its own to support a monolid conclusion.
      // CREASE_ABSENCE_MARGIN draws that line at HALF of the existing,
      // unchanged floor — a plain, symmetric buffer around the SAME
      // CREASE_PEAK_FLOOR/CREASE_PROMINENCE_FLOOR values already
      // shipped and unmodified here, not a new pixel measurement and
      // not a recalibrated confidence score. It only ever makes the
      // classifier MORE conservative (narrows what counts as
      // "confidently absent"); it can never turn a borderline miss
      // into a positive detection.
      const CREASE_ABSENCE_MARGIN = 0.5;
      const eyeCreaseVerdict = (m) => {
        const readable = m.creaseValid > 0.5 && m.creaseReadQuality > 0.28;
        if (!readable) return 'uncertain';
        const fold = m.creasePeak > CREASE_PEAK_FLOOR && m.creaseProminence > CREASE_PROMINENCE_FLOOR;
        if (fold) return 'detected';
        const confidentlyAbsent = m.creasePeak < CREASE_PEAK_FLOOR * CREASE_ABSENCE_MARGIN
          && m.creaseProminence < CREASE_PROMINENCE_FLOOR * CREASE_ABSENCE_MARGIN;
        return confidentlyAbsent ? 'confidentlyAbsent' : 'borderline';
      };
      const leftCreaseVerdict = eyeCreaseVerdict(left);
      const rightCreaseVerdict = eyeCreaseVerdict(right);
      // Combined Signal A: only trusted when BOTH eyes independently
      // land on the same verdict. One eye unreadable, one eye
      // borderline, or the two eyes disagreeing outright (e.g. left
      // clearly shows a fold, right doesn't), is real per-eye
      // information that must not be silently resolved into a single
      // bilateral anatomical claim — it resolves to 'uncertain'
      // rather than picking a side.
      const combinedCreaseSignal = (leftCreaseVerdict === rightCreaseVerdict) ? leftCreaseVerdict : 'uncertain';

      // ---- creaseState / hoodingState — PRODUCT SEMANTICS SPLIT ----
      // Two independent, user-facing axes derived alongside (never in
      // place of) the existing eyelidType enum, per the hooding audit:
      // crease visibility (Signal A, proven reliable) and hooding
      // (Signal B) describe different anatomical properties and must
      // not be collapsed into one value. creaseState is safe to derive
      // automatically from the same, unmodified combinedCreaseSignal
      // above. hoodingState is NOT derived from eyelidCategory — the
      // audit proved coverageIndex/eyelidCategory cannot reliably
      // detect isolated upper-lid skin overhang, so the automatic
      // pipeline never asserts a confident hoodingState; only a
      // human's visual confirmation (ReviewScreen) can set it to
      // 'hooded'/'nonHooded'. This intentionally mirrors this app's
      // existing uncertain/low-confidence convention rather than
      // inventing a new one.
      const creaseState = combinedCreaseSignal === 'detected' ? 'visible'
        : combinedCreaseSignal === 'confidentlyAbsent' ? 'absent'
        : 'uncertain';
      const hoodingState = 'uncertain';

      let eyelidType;
      let eyelidSignalsConflict = false;
      if (combinedCreaseSignal === 'uncertain' || combinedCreaseSignal === 'borderline') {
        eyelidType = 'uncertain';
        // A shared 'borderline' verdict is itself a form of insufficient
        // evidence (not a disagreement between the eyes), so it's not
        // flagged as a signals conflict — only genuine L/R disagreement is.
        eyelidSignalsConflict = leftCreaseVerdict !== rightCreaseVerdict;
      } else if (combinedCreaseSignal === 'detected') {
        if (eyelidCategory === 'moderate' || eyelidCategory === 'pronounced') {
          eyelidType = 'hooded';
        } else if (avgCreaseYFrac > 0.62) {
          // Clear fold on both eyes, low position, but geometry does
          // NOT independently read moderate/pronounced — ambiguous.
          // A low crease position alone is equally consistent with
          // deep-set anatomy that has no true hooding; do not guess,
          // and do not force geometry to agree either way.
          eyelidType = 'uncertain';
          eyelidSignalsConflict = true;
        } else {
          eyelidType = 'openCrease';
        }
      } else { // combinedCreaseSignal === 'confidentlyAbsent' on both eyes
        if (eyelidCategory === 'open') {
          eyelidType = 'monolid'; // the one case where "no fold found" and geometry are genuinely compatible
        } else {
          eyelidType = 'uncertain'; // "no fold found" but geometry reads mild/moderate/pronounced/uncertain — a real conflict, not a confirmation
          eyelidSignalsConflict = true;
        }
      }

      // ---- Confidence, computed AFTER classification, describing
      // strength — never used to rescue or override the decision tree
      // above. (The previous `if (eyelidTypeConfidence < 0.32)
      // eyelidType = 'uncertain'` line is removed: computeConfidence's
      // 5-factor geometric mean has a proven mathematical floor of
      // 0.35, so that gate could never fire for any input — it was
      // dead code providing no real safety, only the appearance of
      // one. Real safety now comes entirely from the decision tree
      // itself, which is unconditional and cannot be out-voted by a
      // high confidence number. See tests/eyelid-classification.test.js
      // for a regression test proving this explicitly.)
      const minCreasePeak = Math.min(left.creasePeak, right.creasePeak);
      const minCreaseProminence = Math.min(left.creaseProminence, right.creaseProminence);
      const avgCreaseReadQuality = (left.creaseReadQuality + right.creaseReadQuality) / 2;
      const creasePeakRatio = minCreasePeak / CREASE_PEAK_FLOOR;
      const creaseProminenceRatio = minCreaseProminence / CREASE_PROMINENCE_FLOOR;
      const failingCreaseRatios = [creasePeakRatio, creaseProminenceRatio].filter(r => r <= 1);
      const closestFailRatio = failingCreaseRatios.length ? Math.max(...failingCreaseRatios) : 0;
      const eyelidTypeMeasurementAgreement = combinedCreaseSignal === 'detected'
        ? clamp01(1 - Math.abs(avgCreaseYFrac - (eyelidType === 'hooded' ? 0.75 : 0.4)) / 0.4)
        : clamp01(1 - closestFailRatio) * clamp01((avgCreaseReadQuality - 0.28) / 0.35);
      const eyelidTypeConf = computeConfidence({
        measurementAgreement: eyelidTypeMeasurementAgreement,
        landmarkStability: stabilityFactor('hooding'),
        imageQuality: clamp01(imageQuality * 0.4 + avgCreaseReadQuality * 0.6),
        lrAgreement: creaseLrAgreement, poseQuality,
      });
      const eyelidTypeConfidence = eyelidTypeConf.score;

      // isHooded/hoodedConfidence/hoodingLevel — the DESIGN_CATALOG-
      // facing combined fields. eyelidCategory itself (Signal B) is
      // never touched above; these derived fields still incorporate
      // the crease read, same as before, but hoodedConfidence is
      // explicitly capped for 'uncertain' so recommendation scoring's
      // existing `c.isHooded ? c.hoodedConfidence*W : ...` pattern
      // can't read an unresolved disagreement as a confident signal
      // in either direction. 0.25 matches the existing low-confidence
      // convention already used elsewhere in this function (the
      // eyelidCategory==='uncertain' fallback above) — not a new
      // invented threshold.
      if (eyelidType === 'hooded') {
        isHooded = true;
        hoodedConfidence = Math.max(hoodedConfidence, eyelidTypeConfidence);
        hoodingLevel = eyelidCategory === 'pronounced' ? 'full' : 'partial';
      } else if (eyelidType === 'monolid') {
        isHooded = false;
        hoodedConfidence = Math.min(hoodedConfidence, 0.25);
        hoodingLevel = 'none';
      } else if (eyelidType === 'uncertain') {
        hoodedConfidence = Math.min(hoodedConfidence, 0.25);
      }

      // ---- EYE SET ----
      const spacingRatio = interEyeDistance / ((left.width + right.width) / 2);
      const isCloseSet = spacingRatio < 0.9;
      const isWideSet = spacingRatio > 1.4;
      const eyeSetCategory = isCloseSet ? 'close' : isWideSet ? 'wide' : 'balanced';
      const spacingBoundaryDist = clamp01(Math.min(Math.abs(spacingRatio-0.9), Math.abs(spacingRatio-1.4), 0.2) / 0.2);
      const widthLrAgreement = clamp01(1 - Math.abs(left.width-right.width)/Math.max(left.width,right.width,1)/0.15);
      const spacingConf = computeConfidence({
        measurementAgreement: spacingBoundaryDist, landmarkStability: stabilityFactor('widthRatio'),
        imageQuality, lrAgreement: widthLrAgreement, poseQuality,
      });
      const spacingConfidence = spacingConf.score;

      // ---- EYE SIZE ---- relative to FACE proportions only — never
      // millimeters, since there is no physical scale calibration.
      const relativeEyeSize = faceBoxWidth > 0 ? ((left.width + right.width) / 2) / faceBoxWidth : 0.32;
      const eyeSizeCategory = relativeEyeSize < 0.30 ? 'small' : relativeEyeSize > 0.38 ? 'large' : 'medium';
      const eyeSizeConf = computeConfidence({
        measurementAgreement: clamp01(Math.min(Math.abs(relativeEyeSize-0.30), Math.abs(relativeEyeSize-0.38), 0.08)/0.08),
        landmarkStability: stabilityFactor('widthRatio'), imageQuality, lrAgreement: widthLrAgreement, poseQuality,
      });
      const eyeSizeConfidence = eyeSizeConf.score;

      const opennessDiff = Math.abs(left.ear - right.ear);

      // ---- SYMMETRY ---- six independent axes (never one number
      // alone deciding "asymmetric"): width, height, outer-corner
      // direction, eyelid opening, hooding coverage, vertical position.
      const asymmetryBreakdown = {
        width: Math.abs(left.width - right.width) / Math.max(left.width, right.width),
        height: Math.abs(left.height - right.height) / Math.max(left.height, right.height),
        tilt: shortestAngleDiffDeg(left.tiltCorrected, mirrorReflectDeg(right.tiltCorrected)),
        openness: opennessDiff / Math.max(left.ear, right.ear, 0.01),
        hooding: Math.abs(left.hoodingRatio - right.hoodingRatio) / Math.max(left.hoodingRatio, right.hoodingRatio, 0.01),
        vertical: Math.abs(verticalAsymRaw || 0),
      };
      const compositeAsymmetry = clamp01(
        asymmetryBreakdown.width * 0.32 + asymmetryBreakdown.height * 0.18 +
        Math.min(1, asymmetryBreakdown.tilt/10) * 0.18 + asymmetryBreakdown.openness * 0.12 +
        asymmetryBreakdown.hooding * 0.10 + Math.min(1, asymmetryBreakdown.vertical*8) * 0.10
      );
      const symmetryCategory = compositeAsymmetry < 0.05 ? 'balanced' : compositeAsymmetry < 0.12 ? 'mild' : 'noticeable';
      // A noisy read (poor image quality/pose/stability) can LOOK like
      // asymmetry without being real anatomy — confidence reflects
      // that; a genuinely low-confidence read is reported as needing
      // confirmation rather than a confident "noticeable asymmetry".
      const symmetryReliability = computeConfidence({
        measurementAgreement: clamp01(1 - (asymmetryBreakdown.width + asymmetryBreakdown.height) / 2 / 0.3),
        landmarkStability: (stabilityFactor('widthRatio') + stabilityFactor('tilt')) / 2,
        imageQuality, lrAgreement: 0.7, poseQuality,
      });
      const symmetryConfidence = symmetryReliability.score;
      const symmetryCategoryFinal = symmetryConfidence < 0.32 ? 'uncertain' : symmetryCategory;

      // ---- DEPTH / PROTRUSION ---- deliberately NOT estimated with
      // any confidence worth acting on: a single frontal 2D photo
      // gives no real depth cue, and this app never runs stereo/depth
      // sensing. depthConfidence is capped low on purpose so the UI
      // always shows the "cannot be reliably determined" copy instead
      // of a number.
      const depthProxy = avgHoodingA;
      const depthConfidence = Math.min(0.32, Math.max(0.1, 1 - Math.abs(depthProxy - 0.17) * 2));

      const overallConfidence = clamp01(
        (shapeConfidence*0.25 + tiltConfidence*0.2 + hoodedConfidence*0.2 + spacingConfidence*0.15) +
        0.2 * (1 - compositeAsymmetry)
      );

      const debug = {
        left: { whRatio: Lsig.whRatio, avgTaperDeg: Lsig.avgTaper, innerTaperDeg: left.innerTaperDeg, outerTaperDeg: left.outerTaperDeg, apertureAsymmetry: Lsig.apertureAsymmetry, ear: left.ear, width: left.width, height: left.height, covCenter: left.covCenterByWidth, covInner: left.covInnerByWidth, covOuter: left.covOuterByWidth, tiltCorrectedDeg: left.tiltCorrected },
        right: { whRatio: Rsig.whRatio, avgTaperDeg: Rsig.avgTaper, innerTaperDeg: right.innerTaperDeg, outerTaperDeg: right.outerTaperDeg, apertureAsymmetry: Rsig.apertureAsymmetry, ear: right.ear, width: right.width, height: right.height, covCenter: right.covCenterByWidth, covInner: right.covInnerByWidth, covOuter: right.covOuterByWidth, tiltCorrectedDeg: right.tiltCorrected },
        aggregated: { whRatio, avgTaperDeg: avgTaper, coverageIndex, heightCrossCheck, spacingRatio, relativeEyeSize },
        shapeScores, shapeDecision: eyeShapeCategory, shapeMargin, rawTopScore, shapeConfidenceFactors: shapeConf.factors,
        hoodingDecision: eyelidCategory, hoodingConfidenceFactors: hoodConf.factors,
        eyelidTypeDecision: eyelidType, eyelidTypeConfidenceFactors: eyelidTypeConf.factors,
        // Per-eye evidence preserved for inspection (CONSERVATIVE V1 —
        // eyelidType above is decided per-eye-first; these are the
        // exact per-eye verdicts that decision was built from).
        crease: {
          left: { valid: left.creaseValid > 0.5, peak: left.creasePeak, prominence: left.creaseProminence, yFrac: left.creaseYFrac, readQuality: left.creaseReadQuality, verdict: leftCreaseVerdict },
          right: { valid: right.creaseValid > 0.5, peak: right.creasePeak, prominence: right.creaseProminence, yFrac: right.creaseYFrac, readQuality: right.creaseReadQuality, verdict: rightCreaseVerdict },
          combinedVerdict: combinedCreaseSignal, avgYFrac: avgCreaseYFrac,
        },
        tiltConfidenceFactors: tiltConf.factors, spacingConfidenceFactors: spacingConf.factors,
        symmetryConfidenceFactors: symmetryReliability.factors,
        imageQuality, poseQuality, singleFrame,
        notReliablyMeasurable: ['depth/protrusion (needs stereo or multi-angle capture)', 'exact crease-line position when makeup/lighting/hair obscure it (pixel read, not a landmark — see eyelidType/eyelidTypeConfidence)', 'scleral show relative to iris (no iris/pupil landmark in this model)'],
      };

      return {
        shapeTendencies, dominantShape, shapeConfidence,
        eyeShapeCategory, eyeShapeConfidence, shapeMargin,
        appearanceWidth, appearanceConfidence,
        tiltTendency, tiltConfidence, tiltDegrees: avgTilt,
        perEyeTiltDegrees: { left: leftPhysicalTilt, right: rightPhysicalTilt },
        isHooded, hoodedConfidence, hoodingSignalsAgree, hoodingRatio: avgHoodingA, hoodingLevel,
        eyelidCategory, eyelidCategoryConfidence,
        eyelidType, eyelidTypeConfidence, eyelidSignalsConflict,
        creaseState, hoodingState,
        isCloseSet, isWideSet, spacingRatio, spacingConfidence, eyeSetCategory,
        relativeEyeSize, eyeSizeCategory, eyeSizeConfidence,
        compositeAsymmetry, asymmetryBreakdown, symmetryCategory: symmetryCategoryFinal, symmetryConfidence,
        depthConfidence,
        debug,
        leftEye: left, rightEye: right,
        overallConfidence, singleFrame,
      };
    }

    // ============================================================
    // RELIABLE-FRAME EYELID-TYPE CONSENSUS — production integration.
    // ------------------------------------------------------------
    // Real-iPhone frame trace evidence (productionEyelidTrace) proved
    // detectEyelidCrease V1 sometimes locks onto its search-band
    // boundary instead of the true crease on a subset of accepted
    // frames within one scan — those frames read prominence=0/
    // creaseYFrac=1 (the same boundary artifact documented at
    // detectEyelidCrease's own call sites) and correctly resolve to
    // eyelidType='uncertain' when classified individually. The
    // PREVIOUS finalization path fed classifyFeatures a single
    // field-median aggregate across the WHOLE buffer (still exactly
    // as before, unchanged, still computed the same way) — this layer
    // adds a SEPARATE, ADDITIONAL cross-check: classify each accepted
    // frame INDIVIDUALLY (same aggregateBuffer([frame]) +
    // singleFrame:true pattern already used throughout this project's
    // debug tooling), and require the frame-level reliable votes to
    // actually support the final type before trusting it.
    //
    // "Reliable" is not a new concept or a new threshold — a frame's
    // OWN per-frame eyelidType is already 'uncertain' whenever
    // classifyFeatures' existing readable/fold/absence/bilateral-
    // agreement/geometry-agreement gates were not satisfied FOR THAT
    // FRAME (same exact gates, same exact constants, already proven
    // and unmodified). A frame's vote counts only when its own
    // eyelidType is NOT 'uncertain'.
    //
    // Consensus rule — STRICT MAJORITY over ALL accepted production
    // frames (not just among the reliable ones). Deliberately
    // introduces NO calibrated numeric threshold: "> half" is the
    // parameter-free mathematical definition of majority, not a tuned
    // confidence percentage — there is no 60%/70%/3-of-5 anywhere here.
    //   - unreliable/uncertain frames cast NO anatomical type vote,
    //     but they DO still count toward totalAcceptedFrames (the
    //     denominator) — they cannot be silently excluded from the
    //     count, only from casting a vote.
    //   - a candidate type X wins only if
    //     supportCount(X) > totalAcceptedFrames / 2
    //   - if no type reaches strict majority (including the case of a
    //     small number of reliable votes swamped by unreliable/
    //     boundary frames, or genuinely conflicting reliable types
    //     that individually fall short) -> uncertain.
    //   - a single spurious "reliable-looking" frame can therefore
    //     never dominate a scan on its own — it would need to be a
    //     strict majority of ALL accepted frames, not just agree with
    //     itself.
    // An unreliable/boundary-artifact frame can still never vote
    // monolid (or anything else) — it has no vote to cast in the first
    // place, only a seat in the denominator.
    // ============================================================

    // Pure. One frame's real per-frame classifyFeatures result — the
    // SAME technique already used by the debug frame trace
    // (buildEyelidFrameTrace) and the debug "CURRENT TYPE" preview,
    // reused here for production, not duplicated as a new heuristic.
    function classifyFrameForConsensus(frameEntry) {
      const singleAggregated = aggregateBuffer([frameEntry]);
      return classifyFeatures(singleAggregated, { singleFrame: true, stability: null, imageQuality: frameEntry.qualityScore });
    }

    // Pure. buffer is the same array already accepted into
    // bufferRef.current — no separate/parallel frame list.
    function resolveReliableFrameConsensus(buffer) {
      const frameResults = buffer.map(classifyFrameForConsensus);
      const totalCount = buffer.length;
      const reliable = frameResults.filter(r => r.eyelidType !== 'uncertain');
      const supportCounts = {};
      for (const r of reliable) supportCounts[r.eyelidType] = (supportCounts[r.eyelidType] || 0) + 1;
      const candidateTypes = Object.keys(supportCounts);
      // "> half of ALL accepted frames" — the plain mathematical
      // definition of strict majority, evaluated against totalCount
      // (which includes the unreliable frames), not against
      // reliable.length.
      const majorityType = candidateTypes.find(t => supportCounts[t] > totalCount / 2);
      if (majorityType) {
        const representative = reliable.find(r => r.eyelidType === majorityType);
        return { type: majorityType, reliableCount: supportCounts[majorityType], totalCount, conflict: false, representative, supportCounts };
      }
      // No type reached strict majority. Distinguish "genuinely
      // conflicting reliable types" (>1 distinct non-uncertain type
      // present, matching classifyFeatures' own conflict semantics)
      // from "insufficient support" (zero or one type present, just
      // not enough of it) purely for the eyelidSignalsConflict flag.
      const conflict = candidateTypes.length > 1;
      return { type: 'uncertain', reliableCount: reliable.length, totalCount, conflict, representative: null, supportCounts };
    }

    // Pure. Applies the consensus verdict onto the real aggregate-based
    // `classified` result, overriding ONLY the six fields proven
    // semantically coupled to eyelidType inside classifyFeatures
    // itself (eyelidType, eyelidTypeConfidence, eyelidSignalsConflict,
    // isHooded, hoodedConfidence, hoodingLevel — see that function's
    // own eyelidType-override block). When overriding TO a confident
    // type, all six values are taken verbatim from one real
    // representative frame's own already-internally-consistent
    // classifyFeatures result (never hand re-derived). When overriding
    // TO uncertain, isHooded/hoodedConfidence/hoodingLevel are
    // recomputed from the UNCHANGED geometry-only Signal B
    // (classified.eyelidCategory/eyelidCategoryConfidence) using the
    // exact same baseline formula classifyFeatures itself already uses
    // before its own eyelidType-override block (drift-tested). Eye
    // Geometry (eyelidCategory/eyelidCategoryConfidence) and every
    // other field on `classified` are returned completely untouched.
    function applyReliableFrameConsensus(classified, consensus) {
      if (consensus.type === classified.eyelidType) return classified;
      if (consensus.type === 'uncertain') {
        const isHooded = classified.eyelidCategory === 'pronounced' || classified.eyelidCategory === 'moderate';
        const hoodedConfidenceBaseline = classified.eyelidCategory === 'uncertain' ? 0.25 : classified.eyelidCategoryConfidence;
        const hoodedConfidence = Math.min(hoodedConfidenceBaseline, 0.25);
        const hoodingLevel = classified.eyelidCategory === 'pronounced' ? 'full' : classified.eyelidCategory === 'moderate' ? 'partial' : 'none';
        return { ...classified, eyelidType: 'uncertain', eyelidSignalsConflict: consensus.conflict, isHooded, hoodedConfidence, hoodingLevel };
      }
      const r = consensus.representative;
      return {
        ...classified,
        eyelidType: r.eyelidType, eyelidTypeConfidence: r.eyelidTypeConfidence, eyelidSignalsConflict: r.eyelidSignalsConflict,
        isHooded: r.isHooded, hoodedConfidence: r.hoodedConfidence, hoodingLevel: r.hoodingLevel,
      };
    }

    // ============================================================
    // NATURAL LASH SCAN — analysis module.
    // ------------------------------------------------------------
    // This stack has no trained per-lash detection model (face-api's
    // 68-point landmarks only describe the eye's outer contour — there
    // is no lash-level ground truth anywhere in this pipeline). Rather
    // than simulate detection with random points, every function below
    // is a classical, deterministic image-processing heuristic that
    // reads real pixels from a magnified eye ROI: gradient/contrast
    // ridge-finding along the lash line, spatially/temporally matched
    // across frames. It is genuinely responsive to the actual camera
    // image (same input -> same output; different input -> different,
    // correlated output) but it is NOT equivalent to counting real
    // individual eyelashes — the report accompanying this change says
    // so explicitly, and so does the in-product copy (always "~",
    // always a range, always a qualitative bucket instead of a bare
    // number). Detection logic (this module) is kept fully separate
    // from rendering (LashScanOverlay, later in the file).
    // ============================================================

    // Crops a magnified ROI around one eye from the SAME processing
    // canvas the (real) face landmarks were just computed on. Returns
    // null if the eye box is degenerate — callers must treat that as
    // "no ROI available" and ask the user to reposition, never invent
    // one.
    // sourceW/sourceH (optional) let a caller pass the source's real
    // pixel bounds explicitly — needed for Stage 2B, where the source
    // is the <video> element itself: HTMLVideoElement has no
    // .width/.height pixel-buffer properties (only .videoWidth/
    // .videoHeight), unlike a canvas. Omitted, this falls back to
    // sourceCanvas.width/height exactly as before — both existing
    // call sites (detectEyelidCrease, the processing-canvas ROI in
    // NaturalLashScanScreen) are byte-for-byte unaffected.
    function extractEyeROI(sourceCanvas, eyePoints, browPoints, marginFrac, sourceW, sourceH) {
      const clampW = sourceW != null ? sourceW : sourceCanvas.width;
      const clampH = sourceH != null ? sourceH : sourceCanvas.height;
      const xs = eyePoints.map(p=>p.x), ys = eyePoints.map(p=>p.y);
      const browYs = browPoints.map(p=>p.y);
      const x0raw = Math.min(...xs), x1raw = Math.max(...xs);
      const y0raw = Math.min(...browYs), y1raw = Math.max(...ys);
      const w0 = x1raw - x0raw, h0 = y1raw - y0raw;
      if (w0 < 4 || h0 < 2) return null;
      const mx = w0 * marginFrac, my = h0 * marginFrac * 1.3;
      const x0 = Math.max(0, Math.round(x0raw - mx)), y0 = Math.max(0, Math.round(y0raw - my));
      const x1 = Math.min(clampW, Math.round(x1raw + mx)), y1 = Math.min(clampH, Math.round(y1raw + my));
      const w = Math.max(1, x1-x0), h = Math.max(1, y1-y0);
      const roi = document.createElement('canvas');
      roi.width = w; roi.height = h;
      const rctx = roi.getContext('2d', { willReadFrequently: true });
      rctx.drawImage(sourceCanvas, x0, y0, w, h, 0, 0, w, h);
      const toLocal = (p) => ({ x: p.x - x0, y: p.y - y0 });
      return { canvas: roi, ctx: rctx, x0, y0, w, h, eyeLocal: eyePoints.map(toLocal), browLocal: browPoints.map(toLocal) };
    }

    // Real quality gate for the close-up scan — reuses the same
    // sharpness/brightness primitives as the face scanner. eyeWidthPx
    // is the real, detected eye width in FULL-FRAME pixels (before any
    // CSS/display magnification) — the actual signal that tells us
    // whether the user has physically moved the eye close enough for
    // this ROI to carry any real information.
    function assessLashFrameQuality(roi, ear, eyeWidthPx, frameWidthPx) {
      const reasons = [];
      if (!roi) { reasons.push('lash_no_eye'); return { ok: false, reasons }; }
      const minDim = Math.min(roi.w, roi.h);
      const widthFrac = eyeWidthPx / Math.max(frameWidthPx, 1);
      // Real-iPhone diagnostic round 2 (video 480x640, container
      // 393x571): widthFrac=0.087 and 0.104 both still failed at 0.11
      // on frames confirmed comfortable/usable (EAR/sharpness/
      // brightness all healthy, roiMinDim already clearing 60).
      // Lowered further to 0.08 to let a confirmed-good frame through
      // this preliminary gate and see what the next pipeline stage
      // does — not yet claimed as the final calibrated value.
      if (widthFrac < 0.08) reasons.push('lash_too_far');
      // Split from the distance gate: minDim<60 is an absolute pixel
      // count on the (possibly downscaled) processing canvas, not a
      // distance measurement — it answers "is there enough resolved
      // detail in the ROI", which a low-resolution camera stream can
      // fail even at a perfectly good distance. Telling the user to
      // move closer for THIS doesn't help (and can make framing worse)
      // — it's a genuinely different problem needing its own message.
      if (minDim < 60) reasons.push('lash_insufficient_resolution');
      if (ear < 0.12) reasons.push('lash_eye_closed');
      const sharpness = estimateSharpness(roi.ctx, { x: 0, y: 0, width: roi.w, height: roi.h });
      if (sharpness < 5) reasons.push('lash_blurry');
      const brightness = sampleBrightness(roi.ctx, [{x:0,y:0},{x:roi.w,y:roi.h}]);
      if (brightness < 40) reasons.push('lash_too_dark');
      if (brightness > 235) reasons.push('lash_too_bright');
      return { ok: reasons.length === 0, reasons, sharpness, brightness, roiWidth: roi.w, roiHeight: roi.h, widthFrac };
    }

    // The visible lash-line: NOT a per-lash curve, just a real,
    // landmark-derived approximation of where the lash root sits,
    // offset slightly below the upper eye-opening contour (four real
    // points from face-api: outer corner, two upper-lid points, inner
    // corner) toward the lash root, by a small fraction of the eye's
    // own measured height.
    function detectLashLine(eyeLocal) {
      const upper = [eyeLocal[0], eyeLocal[1], eyeLocal[2], eyeLocal[3]];
      const eyeH = Math.max(4, dist(eyeLocal[1], eyeLocal[5]));
      const offset = eyeH * 0.12;
      return upper.map(p => ({ x: p.x, y: p.y + offset }));
    }
    // NLS-1: curvePointAt, detectVisibleLashCandidates,
    // aggregateLashFrames, computeLashConfidence,
    // computeLashObservations and compareNaturalLashes moved to
    // lash-scan-core.js (loaded as a plain global <script> above,
    // right after face-api.js) so this core logic can be required
    // directly by tests/lash-scan-core.test.js in Node with zero
    // duplication. Behavior is unchanged except the arc-length zoning
    // fix and the additive occupancy/confidence/sparse-area fields
    // documented in that file — call sites below are unaffected,
    // since the functions are still plain globals.
    const LASH_ZONE_KEYS = ['lashInner', 'lashCenter', 'lashOuter'];

    function lashDensityLabel(d, lang) {
      return d==='high' ? (lang==='en'?'High':'Высокая') : d==='medium' ? (lang==='en'?'Medium':'Средняя') : (lang==='en'?'Low':'Низкая');
    }
    function lashDirectionLabel(d, lang) {
      return d==='upward' ? (lang==='en'?'Upward':'Вверх') : d==='downward' ? (lang==='en'?'Slightly downward':'Слегка вниз') : d==='straight' ? (lang==='en'?'Straight / upward':'Прямо / вверх') : (lang==='en'?'Not enough data':'Недостаточно данных');
    }
    function lashLengthLabel(l, lang) {
      return l==='long' ? (lang==='en'?'Long':'Длинные') : l==='medium' ? (lang==='en'?'Medium':'Средние') : l==='short' ? (lang==='en'?'Short':'Короткие') : l==='mixed' ? (lang==='en'?'Mixed':'Смешанные') : (lang==='en'?'Not enough data':'Недостаточно данных');
    }
    function lashDistributionText(obs, lang) {
      if (!obs.hasData) return lang==='en' ? 'Not enough data' : 'Недостаточно данных';
      if (obs.gapZones.length === 0) return lang==='en' ? 'Mostly even along the lash line' : 'В целом равномерная по линии роста';
      const zoneName = (i) => [lang==='en'?'inner third':'внутренней трети', lang==='en'?'central zone':'центральной зоне', lang==='en'?'outer third':'внешней трети'][i];
      const zones = obs.gapZones.map(zoneName).join(lang==='en' ? ' and ' : ' и ');
      return lang==='en' ? `Slightly less even in the ${zones}` : `Небольшая неоднородность в ${zones}`;
    }

    // AI-advisory text for the Application Plan — Parts 21-22. Always
    // phrased as a suggestion ("AI suggests / can consider"), never a
    // command, and always tied to the actually-computed observations
    // above (nothing here is templated independent of the real scan
    // result).
    function generateLashApplicationNotes(left, right, comparison, lang) {
      const en = lang === 'en';
      const observations = [];
      const considerations = [];
      [['left', left], ['right', right]].forEach(([side, obs]) => {
        if (!obs || !obs.hasData) {
          observations.push(en ? `${side==='left'?'Left':'Right'} eye: scan quality was insufficient for a reliable read.` : `${side==='left'?'Левый':'Правый'} глаз: качество скана было недостаточным для надёжной оценки.`);

      });
      if (comparison?.hasComparison && comparison.notableZone !== null) {

        const side = comparison.notableZoneLowerSide === 'left' ? (en?'left':'левого') : (en?'right':'правого');

          ? `Visual density in the ${zoneName} zone is a little lower on the ${side} eye. The artist can factor this difference in when building the map.`

      [['left', left], ['right', right]].forEach(([side, obs]) => {
        if (!obs?.hasData) return;

            ? `AI suggests reviewing lash placement density in the noted zone(s) of the ${side} eye before finalizing the map.`
            : `AI предлагает проверить плотность размещения ресниц в отмеченных зонах ${side==='left'?'левого':'правого'} глаза перед финализацией схемы.`);

            ? `Natural lash direction looks slightly downward in part of the ${side} eye — it's recommended to confirm the final curl choice in person.`
            : `Направление натуральных ресниц ${side==='left'?'левого':'правого'} глаза местами визуально направлено вниз — выбор итогового изгиба рекомендуется подтвердить очно.`);

    }

    const CURL_CATALOG = [
      { id:'J', liftStrength:1, geometry:{ru:'почти прямой, минимальный подъём',en:'nearly straight, minimal lift'}, suitable:{ru:'очень прямые натуральные ресницы, минимальная коррекция',en:'very straight natural lashes, minimal correction'} },
      { id:'B', liftStrength:2, geometry:{ru:'лёгкий изгиб',en:'gentle curve'}, suitable:{ru:'мягкая естественная коррекция',en:'soft natural correction'} },
      { id:'C', liftStrength:3, geometry:{ru:'универсальный изгиб средней силы',en:'universal medium-strength curve'}, suitable:{ru:'большинство форм глаз, базовый выбор',en:'most eye shapes, default choice'} },
      { id:'CC', liftStrength:4, geometry:{ru:'выраженный подъём',en:'pronounced lift'}, suitable:{ru:'опущенные уголки, лёгкое нависание',en:'downturned corners, mild hooding'} },
      { id:'D', liftStrength:5, geometry:{ru:'сильный драматичный подъём',en:'strong dramatic lift'}, suitable:{ru:'глубоко посаженные, очень прямые натуральные ресницы',en:'deep-set eyes, very straight natural lashes'} },
      { id:'L', liftStrength:4, geometry:{ru:'плоское основание с резким подъёмом у кончика',en:'flat base with a sharp lift near the tip'}, suitable:{ru:'нависшее веко, ресницы растут вниз',en:'hooded eyelids, downward-growing natural lashes'} },
      { id:'L+', liftStrength:5, geometry:{ru:'усиленный вариант L с более выраженным плоским основанием',en:'stronger L variant with a more pronounced flat base'}, suitable:{ru:'выраженное нависание века',en:'pronounced eyelid hooding'} },
      { id:'M', liftStrength:4.5, geometry:{ru:'похож на L, но с более мягким переходом',en:'similar to L with a softer transition'}, suitable:{ru:'нависание, если нужен менее резкий подъём чем у L',en:'hooding, when a less abrupt lift than L is preferred'} },
    ];
    function recommendCurl(c, design, lang) {
      let primary = design.baseCurl;
      let reason = lang==='en' ? 'Matches the base geometry of the selected design.' : 'Соответствует базовой геометрии выбранного дизайна.';
      // Hooding removed as a recommendation input (product decision:
      // hooding is no longer a trusted parameter). The isHooded/
      // hoodedConfidence/hoodingLevel-driven L/L+ override that used to
      // sit here is deleted, not replaced — no other eyelid parameter
      // substitutes for it. The downturned-tilt branch below is
      // unchanged and now simply applies to a broader set of clients
      // (those previously intercepted by the hooding branch first).
      if (c.tiltTendency === 'downturned' && c.tiltConfidence > 0.35) {
        primary = 'CC';
        reason = lang==='en' ? 'Compensates a downturned corner with a stronger curve.' : 'Компенсирует опущенный уголок за счёт более сильного изгиба.';
      }
      const idx = CURL_CATALOG.findIndex(x=>x.id===primary);
      const alternatives = [CURL_CATALOG[idx-1], CURL_CATALOG[idx+1]].filter(Boolean).map(x=>x.id);
      return { primary, alternatives, reason };
    }

    // ------------------------------------------------------------
    // TECHNIQUE CATALOG — application method, independent of DESIGN.
    // ------------------------------------------------------------
    const TECHNIQUE_CATALOG = [
      { id:'classic', label:'Classic 1:1', diameter:'0.15–0.20 mm' },
      { id:'light2d', label:'Light Volume 2D', diameter:'0.07 mm' },
      { id:'volume3d', label:'Volume 3D', diameter:'0.07 mm' },
      { id:'volume4d', label:'Volume 4D', diameter:'0.05–0.07 mm' },
      { id:'volume5d', label:'Volume 5D+', diameter:'0.05 mm' },
      { id:'mega', label:'Mega Volume', diameter:'0.03–0.05 mm' },
      { id:'wet', label:'Wet Technique / Wet Set', diameter:'0.05–0.10 mm' },
    ];

    // ------------------------------------------------------------
    // DESIGN CATALOG — ~20 real geometry families (each with its own
    // 5-zone map + score function driven purely by measured eye
    // features), covering the full requested naming list through
    // canonical + alias names rather than duplicating logic per name.
    // category ∈ natural | opening | lifting | elongating | textured
    //            | wet | creative | correction
    // ------------------------------------------------------------
    const ZONE_NAMES = ['INNER','TRANSITION','BODY','PEAK','OUTER'];

    // Display-only expansion of the five professional control zones.
    // Key zones keep their exact quarter-line positions; intermediate
    // sectors fill each transition in <= 1 mm steps. The source map is
    // never mutated, so AI L/R correction and Custom editing still own
    // the same five values as before.
    // `zoneNames` is an optional 4th parameter (Phase 1S) defaulting to the
    // module-level ZONE_NAMES, so every existing call site (all 21
    // DESIGN_CATALOG designs, always exactly 5 zones) is byte-for-byte
    // unaffected. It exists only so the Professional Lash Map Library
    // renderer adapter can supply a referenceTemplate's own physical
    // position labels for zone counts other than 5 -- see
    // professionalReferenceTemplateToDiagramProps below.
    function expandLashMapSectors(zones, peakIdx, curve={}, zoneNames=ZONE_NAMES) {
      if (!Array.isArray(zones) || zones.length === 0) return [];
      if (zones.length === 1) return [{ len: zones[0], t: 0, keyZoneIndex: 0, label: zoneNames[0], isKey: true, isPeak: peakIdx === 0 }];
      const positions=Array.isArray(curve.zonePositions)&&curve.zonePositions.length===zones.length
        ? curve.zonePositions : zones.map((_,i)=>i/(zones.length-1));
      const intervalShape=i=>i===peakIdx?curve.postPeakShape:i===peakIdx-1?curve.plateauShape:null;
      const shapeSlope=shape=>shape==='frontLoaded'?1.6:shape==='shoulder'?1.5:1;
      const desiredSteps=zones.slice(0,-1).map((v,i)=>Math.max(2,Math.ceil(Math.abs(zones[i+1]-v)*shapeSlope(intervalShape(i)))));
      // Eight intervals (nine points) preserve readable curve shape even
      // for flat profiles. Thirteen intervals cap the display at fourteen
      // points; steeper creative maps may therefore retain >1 mm visual
      // jumps where the point-count and <=1 mm constraints cannot coexist.
      while(desiredSteps.reduce((a,b)=>a+b,0)>13){
        const reducible=desiredSteps.map((v,i)=>({v,i})).filter(x=>x.v>2).sort((a,b)=>b.v-a.v||a.i-b.i)[0];
        if(!reducible)break;
        desiredSteps[reducible.i]--;
      }
      const shapeFraction=(shape,u)=>{
        if(shape==='frontLoaded')return u<=.5?1.6*u:.8+.4*(u-.5);
        if(shape==='shoulder')return u<=.5?1.5*u:.75+.5*(u-.5);
        return u;
      };
      const sectors = [];
      for (let i = 0; i < zones.length - 1; i++) {
        const start = zones[i], end = zones[i + 1];
        const steps = desiredSteps[i];
        if (i === 0) sectors.push({ len: start, t: 0, keyZoneIndex: 0, label: zoneNames[0], isKey: true, isPeak: peakIdx === 0 });
        for (let step = 1; step <= steps; step++) {
          const frac = step / steps;
          const isKey = step === steps;
          const shape=intervalShape(i);
          const shapedFrac=shapeFraction(shape,frac);
          sectors.push({
            len: isKey?end:Math.round((start+(end-start)*shapedFrac)*10)/10,
            t: isKey?positions[i+1]:positions[i]+(positions[i+1]-positions[i])*frac,
            keyZoneIndex: isKey ? i + 1 : null,
            label: isKey ? zoneNames[i + 1] : null,
            isKey,
            isPeak: isKey && i + 1 === peakIdx,
          });
        }
      }
      return sectors;
    }

    // Professional Lash Map projection. The mapping engine owns `sectors`;
    // this helper only places those existing samples on the real upper-lid
    // contour. Physical eye normalization guarantees eye[0] is INNER and
    // eye[3] is OUTER for both sides, independent of their image x direction.
    function buildProfessionalEyeProjection(eye, sectors, imageWidth, imageHeight) {
      if (!Array.isArray(eye) || eye.length < 6 || !Array.isArray(sectors) || !imageWidth || !imageHeight) return null;
      const upper = [eye[0], eye[1], eye[2], eye[3]].map(p => ({x:+p.x,y:+p.y}));
      if (upper.some(p => !Number.isFinite(p.x) || !Number.isFinite(p.y))) return null;
      const pointAt = t => {
        const u=1-t;
        return {
          x:u*u*u*upper[0].x+3*u*u*t*upper[1].x+3*u*t*t*upper[2].x+t*t*t*upper[3].x,
          y:u*u*u*upper[0].y+3*u*u*t*upper[1].y+3*u*t*t*upper[2].y+t*t*t*upper[3].y,
        };
      };
      const tangentAt=t=>{
        const u=1-t;
        const dx=3*u*u*(upper[1].x-upper[0].x)+6*u*t*(upper[2].x-upper[1].x)+3*t*t*(upper[3].x-upper[2].x);
        const dy=3*u*u*(upper[1].y-upper[0].y)+6*u*t*(upper[2].y-upper[1].y)+3*t*t*(upper[3].y-upper[2].y);
        const magnitude=Math.hypot(dx,dy);
        return magnitude>1e-6?{x:dx/magnitude,y:dy/magnitude}:null;
      };
      const eyeXs=eye.map(p=>+p.x),eyeYs=eye.map(p=>+p.y);
      const eyeW=Math.max(1,Math.max(...eyeXs)-Math.min(...eyeXs));
      const eyeH=Math.max(1,Math.max(...eyeYs)-Math.min(...eyeYs));
      const apertureCenter={x:eyeXs.reduce((a,b)=>a+b,0)/eyeXs.length,y:eyeYs.reduce((a,b)=>a+b,0)/eyeYs.length};
      const padX=eyeW*.28,padTop=Math.max(eyeH*2.6,eyeW*.36),padBottom=Math.max(eyeH*1.45,eyeW*.12);
      const x=Math.max(0,Math.min(...eyeXs)-padX),y=Math.max(0,Math.min(...eyeYs)-padTop);
      const right=Math.min(imageWidth,Math.max(...eyeXs)+padX),bottom=Math.min(imageHeight,Math.max(...eyeYs)+padBottom);
      // Display-only height: a bounded ADAPTIVE amount derived from this
      // design's own local min/max sector length (the same saturating-
      // span principle approved for the DIAGRAM profile), scaled to this
      // photo's own eye width so it never depends on a fixed pixel
      // constant. A flat map (every sector the same length) gets zero
      // height. Deliberately not an effect rule -- reads only `len`,
      // and never claims a physical pixel-to-millimeter calibration.
      const sectorLens=sectors.map(s=>s.len);
      const localMin=Math.min(...sectorLens),localMax=Math.max(...sectorLens),localSpan=localMax-localMin;
      // Capped as a fraction of this eye's own width so the profile
      // reads as a lash map drawn close to the lash line, not a chart:
      // comfortably inside the padTop headroom above (eyeW*.36 at
      // minimum) with real margin, so the crop never has to expand far
      // to fit it and the eyelid stays the visual anchor.
      const maxProfileAmplitude=eyeW*.22,profileSaturationMm=3;
      const localProfileAmplitude=localSpan>0?maxProfileAmplitude*localSpan/(localSpan+profileSaturationMm):0;
      const projected=sectors.map(sector=>{
        const baseline=pointAt(Math.max(0,Math.min(1,sector.t)));
        const profileHeight=localSpan>0?localProfileAmplitude*(sector.len-localMin)/localSpan:0;
        const tangent=tangentAt(Math.max(0,Math.min(1,sector.t)));
        if(!tangent)return {...sector,...baseline,profileHeight,normal:null};
        const candidates=[{x:-tangent.y,y:tangent.x},{x:tangent.y,y:-tangent.x}];
        const radial={x:baseline.x-apertureCenter.x,y:baseline.y-apertureCenter.y};
        const radialMagnitude=Math.hypot(radial.x,radial.y);
        const normal=candidates.sort((a,b)=>(b.x*radial.x+b.y*radial.y)-(a.x*radial.x+a.y*radial.y))[0];
        const outwardness=radialMagnitude>1e-6?(normal.x*radial.x+normal.y*radial.y)/radialMagnitude:-1;
        return {...sector,...baseline,profileHeight,tangent,normal,outwardness,profileX:baseline.x+normal.x*profileHeight,profileY:baseline.y+normal.y*profileHeight};
      });
      const segmentsCross=(a,b,c,d)=>{
        const turn=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
        return turn(a,b,c)*turn(a,b,d)<0&&turn(c,d,a)*turn(c,d,b)<0;
      };
      const hasCrossing=projected.some((_,i)=>i<projected.length-1&&projected.some((__,j)=>j>i+1&&j<projected.length-1&&segmentsCross(
        {x:projected[i].profileX,y:projected[i].profileY},{x:projected[i+1].profileX,y:projected[i+1].profileY},
        {x:projected[j].profileX,y:projected[j].profileY},{x:projected[j+1].profileX,y:projected[j+1].profileY}
      )));
      const normalSafe=projected.every((point,index)=>point.normal&&point.outwardness>.15&&
        point.profileX>=x&&point.profileX<=right&&point.profileY>=y&&point.profileY<=bottom&&
        (!index||point.normal.x*projected[index-1].normal.x+point.normal.y*projected[index-1].normal.y>.35));
      const projectionMode=normalSafe&&!hasCrossing?'normal':'vertical-fallback';
      const points=projectionMode==='normal'?projected:projected.map(point=>({...point,normal:{x:0,y:-1},outwardness:null,profileX:point.x,profileY:point.y-point.profileHeight}));
      return {
        path:`M ${upper[0].x} ${upper[0].y} C ${upper[1].x} ${upper[1].y} ${upper[2].x} ${upper[2].y} ${upper[3].x} ${upper[3].y}`,
        crop:{x,y,width:Math.max(1,right-x),height:Math.max(1,bottom-y)},
        points,
        projectionMode,
        profilePath:points.map((point,index)=>`${index?'L':'M'} ${point.profileX} ${point.profileY}`).join(' '),
      };
    }

    // PHOTO labels all five source anchors, then admits changed derived
    // values only where compact staggered lanes remain collision-safe.
    function selectProfessionalEyeLabels(points, crop) {
      if(!Array.isArray(points)||!crop)return [];
      const result=Array(points.length).fill(null);
      // Reserved band for the fixed HTML "edit map" button pinned to the
      // top of the PHOTO card (data-photo-edit-controls). photoCrop
      // always matches the card's own fixed aspect ratio, so a fraction
      // of crop height maps consistently onto that same physical region
      // regardless of eye size, zoom, or side -- geometry-relative, not
      // a per-effect or per-screenshot pixel constant.
      const reservedTopY=crop.y+crop.height*.16;
      points.forEach((point,index)=>{
        if(!point.isKey)return;
        const kind=point.isPeak?'PEAK':point.label;
        const priority=point.isPeak?5:kind==='OUTER'?4:(kind==='INNER'||kind==='BODY'||kind==='TRANSITION')?3:2;
        // Lane is keyed to the zone's own fixed identity (keyZoneIndex),
        // not its incidental position in the interpolated array: PEAK
        // (index 3) and OUTER (index 4) therefore always land in
        // different lanes, even though they often sit close together
        // in the compressed outer-corner region -- without this they
        // could coincidentally share a lane (and collide) for some
        // effects while not for others, depending only on how many
        // interpolation samples happen to fall between them.
        const lane=point.keyZoneIndex%2;
        const y=Math.max(reservedTopY,point.mapY-crop.height*(.032+lane*.016));
        result[index]={x:point.mapX,y,priority,kind,zone:kind,isDerived:false,lane};
      });
      const placed=result.filter(Boolean),minX=crop.width*.038,minY=crop.height*.055;
      let previousVisible=null;
      points.forEach((point,index)=>{
        if(result[index]){previousVisible=point.len;return;}
        if(point.len===previousVisible)return;
        const lane=index%2;
        const y=point.mapY-crop.height*(.03+lane*.015);
        // Canonical labels (PEAK/OUTER/INNER/BODY/TRANSITION) always
        // outrank interpolation-only numeric labels: an interpolation
        // label is suppressed, never a canonical one, whenever it would
        // sit under the reserved button band or collide with anything
        // already placed (canonical labels are placed first, above).
        if(y<reservedTopY)return;
        const candidate={x:point.mapX,y,priority:1,kind:'DERIVED',zone:null,isDerived:true,lane};
        if(placed.some(label=>Math.abs(label.x-candidate.x)<minX&&Math.abs(label.y-candidate.y)<minY))return;
        result[index]=candidate;placed.push(candidate);previousVisible=point.len;
      });
      return result;
    }

    // One display-only working curve: the physical upper-eye cubic and all
    // of its engine-t samples receive the same small upward image-space
    // offset. This keeps LEFT/RIGHT equally smooth and effect-independent.
    function buildProfessionalPhotoLine(eye, points) {
      if(!Array.isArray(eye)||eye.length<4||!Array.isArray(points))return null;
      const upper=[eye[0],eye[1],eye[2],eye[3]].map(point=>({x:+point.x,y:+point.y}));
      if(upper.some(point=>!Number.isFinite(point.x)||!Number.isFinite(point.y)))return null;
      const eyeW=Math.max(1,Math.max(...upper.map(point=>point.x))-Math.min(...upper.map(point=>point.x))),offset=Math.max(1,eyeW*.055);
      return {
        offset,
        path:`M ${upper[0].x} ${upper[0].y-offset} C ${upper[1].x} ${upper[1].y-offset} ${upper[2].x} ${upper[2].y-offset} ${upper[3].x} ${upper[3].y-offset}`,
        points:points.map(point=>({...point,mapX:point.x,mapY:point.y-offset})),
      };
    }

    const createManualPhotoAdjustment=()=>({translationX:0,translationY:0,innerDelta:{x:0,y:0},peakDelta:{x:0,y:0},outerDelta:{x:0,y:0}});
    const isAutomaticPhotoAdjustment=adjustment=>!adjustment||(adjustment.translationX===0&&adjustment.translationY===0&&adjustment.innerDelta.x===0&&adjustment.innerDelta.y===0&&adjustment.peakDelta.x===0&&adjustment.peakDelta.y===0&&adjustment.outerDelta.x===0&&adjustment.outerDelta.y===0);

    // Presentation-only cubic deformation. The three manual anchor deltas
    // are interpolated by a quadratic displacement field at t=0/PEAK/1.
    // Adding that field to the automatic cubic remains one finite, smooth
    // cubic; engine t/length/key/PEAK fields are copied byte-for-byte.
    function applyManualPhotoAdjustment(eye,points,adjustment,peakT) {
      const automatic=buildProfessionalPhotoLine(eye,points);
      if(!automatic||isAutomaticPhotoAdjustment(adjustment))return automatic;
      const p=Math.max(.08,Math.min(.92,+peakT||.5)),a=adjustment;
      const controls=automatic.path.match(/-?\d+(?:\.\d+)?/g).map(Number);
      const base=[{x:controls[0],y:controls[1]},{x:controls[2],y:controls[3]},{x:controls[4],y:controls[5]},{x:controls[6],y:controls[7]}];
      const baseAt=t=>{const u=1-t;return {x:u*u*u*base[0].x+3*u*u*t*base[1].x+3*u*t*t*base[2].x+t*t*t*base[3].x,y:u*u*u*base[0].y+3*u*u*t*base[1].y+3*u*t*t*base[2].y+t*t*t*base[3].y};};
      const baseDerivative=t=>{const u=1-t;return {x:3*u*u*(base[1].x-base[0].x)+6*u*t*(base[2].x-base[1].x)+3*t*t*(base[3].x-base[2].x),y:3*u*u*(base[1].y-base[0].y)+6*u*t*(base[2].y-base[1].y)+3*t*t*(base[3].y-base[2].y)};};
      const deltas=[a.innerDelta,a.peakDelta,a.outerDelta];
      const displacement=t=>{const weights=[(t-p)*(t-1)/p,t*(t-1)/(p*(p-1)),t*(t-p)/(1-p)];return {x:a.translationX+weights.reduce((sum,w,i)=>sum+w*deltas[i].x,0),y:a.translationY+weights.reduce((sum,w,i)=>sum+w*deltas[i].y,0)};};
      const displacementDerivative=t=>{const weights=[(2*t-p-1)/p,(2*t-1)/(p*(p-1)),(2*t-p)/(1-p)];return {x:weights.reduce((sum,w,i)=>sum+w*deltas[i].x,0),y:weights.reduce((sum,w,i)=>sum+w*deltas[i].y,0)};};
      const at=t=>{const b=baseAt(t),d=displacement(t);return {x:b.x+d.x,y:b.y+d.y};};
      const derivative=t=>{const b=baseDerivative(t),d=displacementDerivative(t);return {x:b.x+d.x,y:b.y+d.y};};
      const c0=at(0),c3=at(1),d0=derivative(0),d1=derivative(1),c1={x:c0.x+d0.x/3,y:c0.y+d0.y/3},c2={x:c3.x-d1.x/3,y:c3.y-d1.y/3};
      const adjustedPoints=automatic.points.map(point=>{const mapped=at(point.t);return {...point,mapX:mapped.x,mapY:mapped.y};});
      if([c0,c1,c2,c3,...adjustedPoints.map(point=>({x:point.mapX,y:point.mapY}))].some(point=>!Number.isFinite(point.x)||!Number.isFinite(point.y)))return automatic;
      return {offset:automatic.offset,path:`M ${c0.x} ${c0.y} C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${c3.x} ${c3.y}`,points:adjustedPoints,manual:true};
    }

    // PHOTO is rendered in a 16:9 card with `meet`, so its viewBox must
    // share that aspect. Framing the anatomical INNER/OUTER span at 75%

        goal: (c,l) => l==='en' ? 'Visually balance a measured left/right asymmetry.' : 'Визуально сбалансировать измеренную асимметрию левого/правого глаза.',
        cautions: () => [], correctionMultiplier: 2 },
    ];

    function calculateEyeLashMap(entry, c, side) {
      const eye = side === 'left' ? c.leftEye : c.rightEye;
      const other = side === 'left' ? c.rightEye : c.leftEye;
      const physicalTilt = c.perEyeTiltDegrees?.[side]
        ?? (side === 'left' ? eye.tiltCorrected : mirrorReflectDeg(eye.tiltCorrected));
      // PAIR HARMONIZATION (Phase 1T audit — see
      // tests/pair-eye-harmonization.test.js). c.tiltDegrees is the SAME
      // pair-level, L/R-agreement-checked composite tilt already computed
      // once per client (the tiltTendency/tiltConfidence aggregation) and
      // already used to drive the SHARED curl recommendation
      // (recommendCurl) — not a new signal. Reusing it here for the
      // categorical PEAK-zone decision makes that decision a genuine
      // shared pair-design choice instead of two independent per-eye
      // reads of a raw, sub-degree-noisy angle.
      //
      // PROVEN BUG this fixes (coordinate-level, see the test file): a
      // 0.2deg per-eye tilt difference straddling the existing +/-4deg
      // boundary (e.g. LEFT=3.9, RIGHT=4.1 — well inside plausible
      // landmark-measurement noise) previously put PEAK in a different
      // NAMED zone on each eye for Natural/Doll/Cat/Squirrel (Fox was
      // already exempt from this specific branch).
      const sharedTilt = Number.isFinite(c.tiltDegrees) ? c.tiltDegrees : physicalTilt;

      // The catalog supplies only design intent. The peak and all five
      // lengths are rebuilt independently from this eye's measurements.
      let peakZone = entry.peakZone;
      // Domain decision: Fox's professionally authored outer/pre-outer
      // peak (zonePositions[3] = 0.85) must survive upturned tilt, not
      // be silently demoted to BODY. This exemption applies to Fox only.
      // Shared pair-design baseline: both eyes start from the SAME
      // tilt-driven decision.
      if (entry.id !== 'fox' && sharedTilt > 4 && peakZone > 1) peakZone -= 1;
      if (sharedTilt < -4 && peakZone < 3 && entry.category !== 'correction') peakZone += 1;
      // Bounded per-eye PEAK correction: fires only when (a) this eye's
      // own measured tilt independently crosses the same +/-4deg boundary
      // the shared pair signal above did not already cross, AND (b) the
      // already-existing pair-level compositeAsymmetry evidence (reused
      // verbatim from the correctionMm gate below — not a new threshold)
      // confirms this is real, measured, cross-checked anatomical
      // asymmetry rather than single-eye noise. This preserves genuine
      // corrective asymmetry (one eye measurably more downturned) without
      // letting noise alone move PEAK to a different named zone.
      if (c.compositeAsymmetry > 0.07) {
        if (entry.id !== 'fox' && physicalTilt > 4 && sharedTilt <= 4 && peakZone > 1) peakZone -= 1;
        if (physicalTilt < -4 && sharedTilt >= -4 && peakZone < 3 && entry.category !== 'correction') peakZone += 1;
      }

      const avgWidth = Math.max((eye.width + other.width) / 2, 1);
      const widthScale = clamp01(0.5 + eye.width / avgWidth / 2);
      const openingScale = clamp01((eye.ear - 0.14) / 0.22);
      const sizeScale = clamp01((c.relativeEyeSize - 0.26) / 0.16);
      const peakLength = Math.round(Math.max(8, Math.min(13,
        8.5 + sizeScale * 2.2 + widthScale * 1.1 + openingScale * 0.7
      )));
      const template=entry.baseZones,templatePeak=entry.peakZone,templatePeakLength=template[templatePeak];
      const profilePeakLength=Math.max(peakLength,5+templatePeakLength-Math.min(...template));
      const sampleTemplate=x=>{
        const lo=Math.max(0,Math.min(4,Math.floor(x))),hi=Math.max(0,Math.min(4,Math.ceil(x)));
        if(lo===hi)return template[lo];
        return template[lo]+(template[hi]-template[lo])*(x-lo)/(hi-lo);
      };
      // Move the complete professional profile with the measured peak:
      // each side is independently stretched/compressed around PEAK,
      // preserving TRANSITION/BODY/shoulder intent instead of rebuilding
      // a generic linear ramp from only the two endpoint drops.
      const warpedTemplate=Array.from({length:5},(_,i)=>{
        if(i===peakZone)return templatePeakLength;
        if(i<peakZone)return sampleTemplate(templatePeak*i/Math.max(peakZone,1));
        return sampleTemplate(templatePeak+(4-templatePeak)*(i-peakZone)/Math.max(4-peakZone,1));
      });
      const innerAdjustment=(c.isCloseSet?1:0)+(eye.innerTaperDeg<55?1:0);
      // Same pair-harmonization reasoning as the PEAK-zone decision above,
      // applied to this length-only (max +/-1mm across the profile, not a
      // named-zone identity change) tilt term: shared pair signal first,
      // then the identical asymmetry-gated per-eye override. innerTaperDeg/
      // outerTaperDeg below are untouched — they are per-eye eyelid-corner
      // angle measurements with no existing pair-level composite in this
      // codebase to reuse (unlike tilt, which already has one), so
      // introducing a dead-band for them would require a new, unevidenced
      // threshold — see the phase report's unresolved-threshold section.
      const outerTiltAdjustment = (sharedTilt > 4 || (c.compositeAsymmetry > 0.07 && physicalTilt > 4)) ? 1 : 0;
      const outerAdjustment=outerTiltAdjustment+(eye.outerTaperDeg>80?1:0);
      const zones=warpedTemplate.map((v,i)=>{
        const profileLength=profilePeakLength+(v-templatePeakLength);
        const innerPenalty=i<peakZone?innerAdjustment*(peakZone-i)/Math.max(peakZone,1):0;
        const outerPenalty=i>peakZone?outerAdjustment*(i-peakZone)/Math.max(4-peakZone,1):0;
        return Math.max(5,Math.round(profileLength-innerPenalty-outerPenalty));
      });

      const widthDeficit = Math.max(0, (other.width - eye.width) / Math.max(other.width, 1));
      const openingDeficit = Math.max(0, (other.ear - eye.ear) / Math.max(other.ear, 0.01));
      const measuredCorrection = clamp01(widthDeficit * 0.65 + openingDeficit * 0.35);
      const correctionMm = c.compositeAsymmetry > 0.07 && measuredCorrection > 0.04
        ? Math.min(2, Math.max(1, Math.round(measuredCorrection * (entry.correctionMultiplier || 1) * 4)))
        : 0;
      if (correctionMm > 0) {
        zones[peakZone] = Math.min(14, zones[peakZone] + correctionMm);
        const neighbour = peakZone === 4 ? 3 : peakZone + 1;
        zones[neighbour] = Math.min(zones[peakZone], zones[neighbour] + Math.max(0, correctionMm - 1));
      }
      return { zones, peakZone, correctionMm };
    }

    function buildEyeZones(entry, c) {
      const left = calculateEyeLashMap(entry, c, 'left');
      const right = calculateEyeLashMap(entry, c, 'right');
      return { left: left.zones, right: right.zones, leftPeakZone: left.peakZone, rightPeakZone: right.peakZone, leftCorrectionMm: left.correctionMm, rightCorrectionMm: right.correctionMm };
    }

    const CLIENT_LASH_DESIGN_REGISTRY = new WeakMap();
    function getCanonicalClientLashDesign(legacyDesign) { return CLIENT_LASH_DESIGN_REGISTRY.get(legacyDesign) || null; }

    function buildDesignResult(entry, c, lang) {
      const score = entry.score(c);
      const { left, right, leftPeakZone, rightPeakZone, leftCorrectionMm, rightCorrectionMm } = buildEyeZones(entry, c);
      const curlRec = recommendCurl(c, entry, lang);
      const legacyDesign = {
        id: entry.id, category: entry.category,
        name: lang === 'en' ? entry.enName : entry.ruName,
        ruName: entry.ruName, enName: entry.enName, aliases: entry.aliases,
        score, whyItWorks: entry.why(c, lang), correctionGoal: entry.goal(c, lang),
        limitations: entry.cautions(c, lang), baseCurl: entry.baseCurl, curlOptions: entry.curlOptions,
        defaultTechnique: entry.defaultTechnique,
        peakZone: leftPeakZone === rightPeakZone ? leftPeakZone : entry.peakZone,
        leftPeakZone, rightPeakZone, leftCorrectionMm, rightCorrectionMm,
        texture: entry.texture || null,
        curve:{zonePositions:entry.zonePositions||null,postPeakShape:entry.postPeakShape||'linear',plateauShape:entry.plateauShape||'linear'},
        leftZones: left, rightZones: right, curlRec,
      };
      // Additive Phase 1 wrapper only: the returned legacy object and
      // every production consumer remain unchanged. Canonical data is
      // held out-of-band for parity tests/debugging and future adapters.
      if (typeof LashDesignDomain !== 'undefined') {
        CLIENT_LASH_DESIGN_REGISTRY.set(legacyDesign, LashDesignDomain.legacyToClientLashDesign({
          design: legacyDesign, catalogEntry: entry, eyeProfile: c, expandSectors: expandLashMapSectors,
        }));
      }
      return legacyDesign;
    }
    function rankDesignsAll(c, lang) { return DESIGN_CATALOG.map(e => buildDesignResult(e, c, lang)).sort((a,b) => b.score - a.score); }

    // A `design` result object built by buildDesignResult() has its
    // text fields (name/whyItWorks/correctionGoal/limitations/
    // curlRec.reason) baked in for whatever `lang` was active at
    // build time — score and zone geometry never change, but if the
    // UI language is switched afterward (e.g. on Result or the Lash
    // Map, after the design was already selected), those frozen
    // strings would silently stay in the old language. This re-derives
    // only the text fields for the *current* language from the same
    // catalog entry and generator functions already used to build
    // the design — no scoring/geometry recomputed, nothing new.
    function localizeDesign(design, c, lang) {
      const entry = DESIGN_CATALOG.find(e => e.id === design.id);
      if (!entry) return design;
      return {
        ...design,
        name: lang === 'en' ? entry.enName : entry.ruName,
        whyItWorks: entry.why(c, lang),
        correctionGoal: entry.goal(c, lang),
        limitations: entry.cautions(c, lang),
        curlRec: recommendCurl(c, entry, lang),
      };
    }
    function rankDesigns(c, lang) { return rankDesignsAll(c, lang).slice(0, 6); }

    // Phase 2D Recommendation output boundary. Ranking and localization stay
    // legacy; the UI receives an immutable canonical presentation view.
    function canonicalRecommendationProps(legacyDesign, c, lang, rank) {
      const localizedLegacy=localizeDesign(legacyDesign,c,lang);
      const canonicalBase=getCanonicalClientLashDesign(legacyDesign)||LashDesignDomain.legacyToClientLashDesign({
        design:legacyDesign,catalogEntry:DESIGN_CATALOG.find(entry=>entry.id===legacyDesign.id),eyeProfile:c,expandSectors:expandLashMapSectors,
      });
      const clientDesign=LashDesignDomain.withRecommendationRuntime(canonicalBase,{rank,localizedLegacy});
      return LashDesignDomain.recommendationPropsFromClientDesign(clientDesign);
    }

    // ---- Lash Design Considerations ----
    // Deliberately reuses the SAME, unmodified recommendation engine
    // (DESIGN_CATALOG + buildDesignResult + recommendCurl) that
    // rankDesigns already uses — no new scoring logic, no invented
    // suitability numbers. This just packages five named, well-known
    // directions' ALREADY-computed real fields (score, why, peak
    // zone, curl options, cautions, L/R zone difference) into the
    // suitability/visual-goal/peak/curl/cautions/L-R-correction shape
    // the brief asks for, so the master sees multiple real options
    // side by side instead of one "correct" design.
    const LASH_DESIGN_CONSIDERATION_IDS = ['natural', 'squirrel', 'softcat', 'doll', 'wispy'];
    function suitabilityLabel(score, lang) {
      const en = lang === 'en';
      if (score >= 65) return en ? 'Strong fit' : 'Хорошо подходит';
      if (score >= 45) return en ? 'Worth considering' : 'Можно рассмотреть';
      return en ? 'Situational' : 'Ситуативно';
    }
    function generateLashDesignConsiderations(result, lang) {
      const c = result.eyeProfile;
      return LASH_DESIGN_CONSIDERATION_IDS.map(id => {
        const entry = DESIGN_CATALOG.find(e => e.id === id);
        if (!entry) return null;
        const legacyDesign = buildDesignResult(entry, c, lang);
        const d = canonicalRecommendationProps(legacyDesign, c, lang, null);
        const maxLeft = Math.max(...d.leftZones), maxRight = Math.max(...d.rightZones);
        const lrDiffers = Math.abs(maxLeft - maxRight) >= 1 || d.leftZones.some((v,i) => Math.abs(v - d.rightZones[i]) >= 1);
        const lrNote = lrDiffers
          ? (lang==='en' ? `Peak length is adjusted slightly between left/right (${maxLeft}mm / ${maxRight}mm) to compensate for the measured difference.` : `Пиковая длина слегка скорректирована между левым/правым (${maxLeft}мм / ${maxRight}мм) для компенсации измеренной разницы.`)
          : (lang==='en' ? 'No L/R correction needed — both sides use the same zone lengths.' : 'Коррекция L/R не требуется — обе стороны используют одинаковые длины зон.');
        return {
          id: d.id, name: d.name, score: d.score, suitability: suitabilityLabel(d.score, lang),
          visualGoal: d.whyItWorks, peakZone: zoneLabel(ZONE_NAMES[d.peakZone], lang),
          lengthDistribution: lang==='en' ? `${ZONE_NAMES[0]} ${d.leftZones[0]}mm → ${ZONE_NAMES[d.peakZone]} ${maxLeft}mm → ${ZONE_NAMES[4]} ${d.leftZones[4]}mm` : `${zoneLabel(ZONE_NAMES[0],lang)} ${d.leftZones[0]}мм → ${zoneLabel(ZONE_NAMES[d.peakZone],lang)} ${maxLeft}мм → ${zoneLabel(ZONE_NAMES[4],lang)} ${d.leftZones[4]}мм`,
          curls: [d.curlRec.primary, ...d.curlRec.alternatives].filter((v,i,a)=>a.indexOf(v)===i),
          cautions: d.limitations, lrNote,
        };
      }).filter(Boolean).sort((a,b) => b.score - a.score);
    }

    // ---- Lash Correction Opportunity ----
    // A soft, advisory note (never a claim) shown only when real
    // measured asymmetry is meaningful enough to matter for mapping —
    // never framed as a flaw, always framed as something the artist
    // CAN use, and never shown when the read itself is uncertain.
    function generateLashCorrectionOpportunity(c, lang) {
      if (c.symmetryCategory === 'balanced' || c.symmetryCategory === 'uncertain') return null;
      const en = lang === 'en';
      const b = c.asymmetryBreakdown;
      const axis = Object.entries({ width: b.width, height: b.height, hooding: b.hooding }).sort((x,y)=>y[1]-x[1])[0][0];
      const axisText = {
        width: en ? 'eye width' : 'ширине глаза',
        height: en ? 'eye opening height' : 'высоте раскрытия глаза',
        hooding: en ? 'eyelid coverage' : 'покрытию века',
      }[axis];
      return en
        ? `The most noticeable difference between your left and right eye is in ${axisText}. A slightly adjusted peak position or length can visually balance this — a soft, optional refinement, not a requirement.`
        : `Наиболее заметное различие между левым и правым глазом — по ${axisText}. Небольшая корректировка положения пика или длины может визуально сбалансировать это — мягкая, необязательная настройка, а не требование.`;
    }

    function tierBadge(rank, score, category, lang) {
      if (rank === 0) return t('bestMatch', lang);
      if (score < 50) return t('useWithCaution', lang);
      if (category === 'textured') return t('texturedOption', lang);
      if (category === 'creative') return t('creativeOption', lang);
      if (score >= 85) return t('highlySuitable', lang);
      return t('suitable', lang);
    }

    // ------------------------------------------------------------
    // Spike/ray geometry for textured designs (Wispy/Kim/Manga/...).
    // Computed once from the design's own zone lengths + texture
    // descriptor, shared by both the SVG diagram and the written
    // Spike/Ray Plan so the picture and the text never diverge.
    // Positions use a deterministic hash (not Math.random) so the
    // "irregular" look of soft patterns is stable across re-renders.
    // ------------------------------------------------------------
    function pseudoJitter(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

    function computeSpikeGeometry(zones, texture) {
      if (!texture) return null;
      const n = zones.length;
      const spikes = [];
      for (let i = 0; i < n - 1; i++) {
        for (let s = 1; s <= texture.frequency; s++) {
          const segFrac = s / (texture.frequency + 1);
          const jitter = texture.pattern === 'uniform' ? (pseudoJitter(i*7+s) - 0.5) * 0.06 : 0;
          const t = i/(n-1) + (segFrac + jitter) * (1/(n-1));
          const baseLen = zones[i] + (zones[i+1]-zones[i]) * segFrac;
          const tall = texture.pattern === 'kim' ? (s % 2 === 1) : texture.pattern === 'manga' ? true : (s % 2 === 0);
          const diff = tall ? texture.baseToSpikeDiff : texture.baseToSpikeDiff * 0.35;
          const spikeLen = Math.round((baseLen + diff) * 10) / 10;
          spikes.push({ t, zoneIdx: i, tall, baseLen: Math.round(baseLen*10)/10, spikeLen, diff: Math.round(diff*10)/10 });
        }
      }
      const tallSpikes = spikes.filter(sp => sp.tall);
      const spikeLens = spikes.map(sp => sp.spikeLen);
      const mainSpike = tallSpikes.reduce((best, sp) => !best || sp.spikeLen > best.spikeLen ? sp : best, null);
      return {
        spikes, count: tallSpikes.length,
        baseMin: Math.min(...zones), baseMax: Math.max(...zones),
        spikeMin: Math.min(...spikeLens), spikeMax: Math.max(...spikeLens),
        diff: texture.baseToSpikeDiff, pattern: texture.pattern,
        mainSpikeZone: mainSpike ? ZONE_NAMES[Math.min(mainSpike.zoneIdx+1, ZONE_NAMES.length-1)] : ZONE_NAMES[3],
      };
    }

    // ------------------------------------------------------------
    // LASH APPLICATION PLAN generator — a real structured, per-design
    // work plan (not static copy). Every section is built from the
    // actual eye profile, the selected design/technique/curl, the
    // zone lengths currently shown on the map, and (for textured
    // designs) the shared spike geometry above. UI only renders the
    // returned object; no plan text is hardcoded in JSX. Phrasing is
    // advisory ("рекомендуется" / "recommended"), never prescriptive
    // — the artist makes the final call. No medical/diagnostic
    // claims are made anywhere in this function.
    // ------------------------------------------------------------
    function designNarrative(design, lang) {
      const en = lang === 'en';
      const byId = {
        squirrel: { body: en ? 'Length builds gradually toward the peak in the outer third, then eases back slightly toward the outer corner — a soft lift without weighing the corner down.' : 'Длина постепенно увеличивается до пика во внешней трети, а затем немного уменьшается к внешнему углу — мягкий лифтинг без утяжеления уголка.' },
        cat: { body: en ? 'Length elongates progressively toward the outer sector for a classic elongated look.' : 'Длина постепенно вытягивается к внешнему сектору, создавая классический эффект вытянутого взгляда.' },
        doll: { body: en ? 'Maximum length sits closer to the central zone, visually opening the eye.' : 'Максимальная длина расположена ближе к центральной области, визуально открывая взгляд.' },
        fox: { body: en ? 'Pronounced horizontal elongation toward the temple. With a tilt that doesn’t support this direction, the effect can look unnatural — double-check against the eye profile first.' : 'Выраженное горизонтальное вытяжение к виску. При недостаточно подходящем наклоне уголков эффект может выглядеть неестественно — сверьтесь с профилем глаз перед стартом.' },
        reverse: { body: en ? 'Geometry is the mirror of a classic cat-eye: the peak sits toward the inner-central zone to balance an already prominent outer lift.' : 'Геометрия противоположна классическому cat-eye: пик смещён к внутренне-центральной зоне, балансируя уже выраженный внешний подъём.' },
      };
      if (byId[design.id]) return byId[design.id];
      if (design.texture) return { body: en ? 'The map is built from two layers — a base length map, and a spike/ray layer on top of it (see the Spike/Ray Plan below).' : 'Схема состоит из двух слоёв — базовой карты длин (BASE) и слоя лучей (SPIKE) поверх неё (см. раздел «Работа с лучиками» ниже).' };
      const byCategory = {
        natural: en ? 'Length increases gently toward a moderate central peak, staying close to the eye’s natural geometry.' : 'Длина мягко нарастает к умеренному центральному пику, оставаясь близко к естественной геометрии глаза.',
        opening: en ? 'Length builds toward a peak near the center, opening the eye visually.' : 'Длина нарастает к пику ближе к центру, визуально открывая взгляд.',
        lifting: en ? 'Length builds toward the peak in the outer third for a gentle lift.' : 'Длина нарастает к пику во внешней трети для мягкого лифтинг-эффекта.',
        elongating: en ? 'Length builds steadily toward the outer third for maximum elongation toward the temple.' : 'Длина последовательно нарастает к внешней трети для максимального вытяжения к виску.',
        wet: en ? 'Density stays deliberately sparse — the effect relies on gloss and texture, not on length contrast.' : 'Плотность остаётся намеренно разреженной — эффект строится на глянце и текстуре, а не на контрасте длины.',
        creative: en ? 'Length contrast is deliberately pronounced for a bold, graphic look.' : 'Контраст длины подчёркнуто выражен для смелого графичного образа.',
        correction: en ? 'Zone lengths are adjusted individually to balance the left and right eye.' : 'Длины зон скорректированы индивидуально для баланса левого и правого глаза.',
      };
      return { body: byCategory[design.category] || byCategory.natural };
    }

    function generateLegacyApplicationPlan(c, design, technique, curl, zones, otherZones, spikeGeom, curve, lang) {
      const en = lang === 'en';
      const push = (arr, ru, enS) => arr.push(en ? enS : ru);
      const peakIdx = zones.indexOf(Math.max(...zones));
      const peakLen = zones[peakIdx];
      const innerLen = zones[0], outerLen = zones[4];
      const asym = c.compositeAsymmetry > 0.07;
      const narrative = designNarrative(design, lang);
      const displaySectors = expandLashMapSectors(zones, peakIdx, curve);
      const displaySequence = displaySectors.map(s => `${s.len}mm`).join(' → ');

      // -------- PREPARATION --------
      const preparation = [];
      push(preparation, 'Подтвердите с клиентом выбранный эффект и желаемую интенсивность.', 'Confirm the selected effect and desired intensity with the client.');
      push(preparation, 'Оцените состояние натуральных ресниц перед процедурой.', 'Assess the condition of the natural lashes before starting.');
      push(preparation, 'Очистите ресницы и межресничную зону от косметики и загрязнений.', 'Cleanse the lashes and lash line of makeup and residue.');
      push(preparation, 'Подготовьте рабочую зону и изолируйте нижние ресницы.', 'Prepare the work area and isolate the lower lashes.');
      push(preparation, 'Проверьте положение патчей.', 'Check patch placement.');
      push(preparation, `Выполните разметку зон: ${ZONE_NAMES.map(z=>zoneLabel(z,lang)).join(' / ')}.`, `Mark the zones: ${ZONE_NAMES.join(' / ')}.`);
      push(preparation, `Сверьте максимальную длину (${Math.max(...zones)} mm) и изгиб (${curl}) с выбранной схемой.`, `Confirm max length (${Math.max(...zones)} mm) and curl (${curl}) against the selected map.`);
      push(preparation, 'Подготовьте необходимые палетки длин и изгибов.', 'Prepare the required length and curl trays.');
      if (asym) push(preparation, 'Обнаружена асимметрия — перед началом отдельно разметьте peak для левого и правого глаза.', 'Asymmetry detected — mark the peak separately for the left and right eye before starting.');
      if (spikeGeom) push(preparation, 'До начала работы отметьте позиции основных лучей/spikes.', 'Before starting, mark the positions of the main spikes/rays.');
      // Hooding removed as a recommendation input — the isHooded-gated
      // preparation note that used to sit here is deleted, not replaced.
      push(preparation, 'AI-анализ не заменяет визуальный осмотр состояния ресниц и кожи века мастером — при признаках раздражения или повреждения проконсультируйтесь со специалистом перед процедурой.', 'AI analysis does not replace the artist’s own visual inspection of lash and lid condition — if you notice irritation or damage, refer the client to a specialist before proceeding.');

      // -------- APPLICATION STEPS --------
      const dropAfterPeak = Math.round((peakLen - outerLen) * 10) / 10;
      const steps = [
        { title: t('stepMappingTitle', lang), body: en
          ? `Divide the lash line using the five control zones (${zones.map((v,i)=>`${ZONE_NAMES[i]} ${v}mm`).join(', ')}) and the displayed smooth sequence: ${displaySequence}.`
          : `Разделите lash line по пяти контрольным зонам (${zones.map((v,i)=>`${zoneLabel(ZONE_NAMES[i],lang)} ${v}мм`).join(', ')}) и отображаемой плавной последовательности: ${displaySequence}.` },
        { title: t('stepInnerTitle', lang), body: en
          ? `Inner corner: ${innerLen}mm, curl ${curl}. Start the transition gently${c.isCloseSet ? ' — eyes are close-set, avoid adding extra length here' : ''}.`
          : `Внутренний угол: ${innerLen}mm, изгиб ${curl}. Начинайте переход плавно${c.isCloseSet ? ' — глаза близко посажены, не добавляйте здесь длину' : ''}.` },
        { title: t('stepBodyTitle', lang), body: narrative.body },
        { title: t('stepPeakTitle', lang), body: en
          ? `Peak zone: ${ZONE_NAMES[peakIdx]}, ${peakLen}mm. This is where the design's correction goal is concentrated — avoid shifting it further out or in than the mapped position.${design.limitations && design.limitations[0] ? ' Note: ' + design.limitations[0] : ''}`
          : `Пиковая зона: ${zoneLabel(ZONE_NAMES[peakIdx],lang)}, ${peakLen}mm. Здесь сосредоточена коррекционная задача дизайна — не переносите пик дальше отмеченной позиции.${design.limitations && design.limitations[0] ? ' Примечание: ' + design.limitations[0] : ''}` },
        { title: t('stepOuterTitle', lang), body: en
          ? `Outer sector: ${outerLen}mm${dropAfterPeak > 0 ? `, a ${dropAfterPeak}mm drop after the peak` : ''}. This sector carries the design's correction goal: ${design.correctionGoal.charAt(0).toLowerCase()+design.correctionGoal.slice(1)}`
          : `Внешний сектор: ${outerLen}mm${dropAfterPeak > 0 ? `, снижение на ${dropAfterPeak}mm после пика` : ''}. Этот сектор выполняет коррекционную задачу дизайна: ${design.correctionGoal.charAt(0).toLowerCase()+design.correctionGoal.slice(1)}` },
        { title: t('stepFinalTitle', lang), body: en
          ? `Check the smoothness of transitions, verify direction, and confirm the result matches the correction goal.${asym ? ' Asymmetry was detected — compare the left and right peak position directly rather than assuming a mirrored result.' : ' Compare left and right for consistency.'}`
          : `Проверьте плавность переходов, направление ресниц и соответствие результата correction goal.${asym ? ' Обнаружена асимметрия — сравните позицию пика левого и правого глаза напрямую, не полагаясь на зеркальность.' : ' Сравните левый и правый глаз на предмет единообразия.'}` },
      ];

      // -------- SPIKE / RAY PLAN --------
      let spikePlan = null;
      if (spikeGeom) {
        spikePlan = {
          base: `${spikeGeom.baseMin}–${spikeGeom.baseMax} mm`,
          spikes: `${spikeGeom.spikeMin}–${spikeGeom.spikeMax} mm`,
          diff: `+${spikeGeom.diff} mm`,
          count: spikeGeom.count,
          mainZone: spikeGeom.mainSpikeZone,
          pattern: design.name,
          notes: [],
        };
        push(spikePlan.notes, `Основной луч рекомендуется располагать в зоне ${zoneLabel(spikeGeom.mainSpikeZone,lang)}, совпадая с пиком карты.`, `Recommended to place the main spike in the ${spikeGeom.mainSpikeZone} zone, aligned with the map's peak.`);
        push(spikePlan.notes, 'Сохраняйте единый ритм чередования базовых и акцентных ресниц по всей линии.', 'Keep a consistent rhythm alternating base and accent lashes across the line.');
        if (spikeGeom.pattern === 'kim') push(spikePlan.notes, 'Проверьте контраст между базой и лучами перед заполнением — он должен оставаться заметным.', 'Check the base-to-spike contrast before filling in — it should stay clearly visible.');
        if (spikeGeom.pattern === 'manga') push(spikePlan.notes, 'Направление лучей — ключевой элемент образа; сверьте его перед заполнением базы.', 'Spike direction is a key part of this look — confirm it before filling in the base.');
        if (spikeGeom.pattern === 'uniform') push(spikePlan.notes, 'Лучи могут располагаться не строго регулярно — это часть эффекта.', 'Spikes don’t need to be perfectly regular — that irregularity is part of the effect.');
      }

      // -------- ARTIST NOTES (advisory, not prescriptive) --------
      const artistNotes = [];
      if (c.isCloseSet) push(artistNotes, 'Рекомендуется не перегружать внутренний угол.', 'Recommended: avoid overloading the inner corner.');
      if (c.isWideSet) push(artistNotes, 'AI предлагает распределить длину равномерно по всей линии роста.', 'AI suggests distributing length evenly across the lash line.');
      // Hooding removed as a recommendation input — the isHooded-gated
      // artist note that used to sit here is deleted, not replaced.
      if (c.tiltTendency === 'downturned') push(artistNotes, 'При опущенных уголках рекомендуется не делать максимальную длину в крайнем наружном секторе.', 'With downturned corners, it’s recommended to avoid maximum length in the extreme outer sector.');
      if (spikeGeom) push(artistNotes, 'Для данной карты предусмотрена проверка направления лучей перед заполнением базы.', 'For this map, checking spike direction before filling in the base is recommended.');
      if (asym) push(artistNotes, 'При выраженной асимметрии не рекомендуется делать одинаковую коррекцию для левого и правого глаза.', 'With pronounced asymmetry, applying identical correction to LEFT and RIGHT is not recommended.');
      else push(artistNotes, 'Рекомендуется сохранять лёгкость во внутреннем уголке.', 'Recommended: keep the inner corner light.');
      push(artistNotes, 'Финальное профессиональное решение остаётся за мастером.', 'The final professional decision remains with the artist.');

      return { preparation, steps, spikePlan, artistNotes, displaySectors };
    }

    // Phase 2A consumer boundary: Application Plan reads only the
    // canonical ClientLashDesign. The legacy text generator above is
    // intentionally unchanged and receives a lossless compatibility
    // view, preserving every current string and section byte-for-byte.
    function generateApplicationPlan(clientDesign, lang) {
      const runtime=clientDesign.mapping.applicationPlan;
      const text=clientDesign.presentation.localizedText;
      return generateLegacyApplicationPlan(
        clientDesign.evidence.applicationPlanProfile,
        {
          id:clientDesign.legacyDesignId,
          name:clientDesign.display.name,
          category:clientDesign.display.category,
          texture:clientDesign.texture.legacyDescriptor,
          limitations:text.limitations,
          correctionGoal:text.correctionGoal,
        },
        clientDesign.application.selectedTechnique,
        clientDesign.curl.selected,
        runtime.active.finalMm,
        runtime.other.finalMm,
        clientDesign.texture.spikeGeometry,
        runtime.topology,
        lang
      );
    }

    // ------------------------------------------------------------
    // Coordinate transform for the live cinematic overlay: our
    // landmark coordinates live in the downscaled processing-canvas
    // space. We map processing-canvas -> native video pixels ->
    // displayed box pixels (which uses CSS object-cover).
    // ------------------------------------------------------------
    function mapVideoPointToDisplay(x, y, videoW, videoH, dispW, dispH) {
      const scale = Math.max(dispW / videoW, dispH / videoH);
      const offX = (dispW - videoW*scale) / 2;
      const offY = (dispH - videoH*scale) / 2;
      return { x: x*scale + offX, y: y*scale + offY };
    }
    function drawCornerBracket(ctx, x, y, dirX, dirY, len) {
      ctx.beginPath();
      ctx.moveTo(x + dirX*len, y);
      ctx.lineTo(x, y);
      ctx.lineTo(x, y + dirY*len);
      ctx.stroke();
    }

    // ============================================================
    // SCANNER OVERLAY MODULE — V2 ("cinematic biometric scanner")
    // Pure, read-only presentation layer for Live Scan: smoothing +
    // several independent visual layers (subject lock, holographic
    // face mesh, depth grid, eye isolation, scan field, iris
    // micro-scan, data-extraction tags, data-flow convergence,
    // completion sequence). Every function here only ever reads
    // tracking coordinates and phase/alignment flags the pipeline
    // already computed — nothing draws or infers anything the real
    // analysis didn't already produce, and nothing here touches or
    // duplicates classifyFeatures/rankDesigns/measurement math.
    //
    // V1 (simpler bracket+ellipse+beam scanner) is preserved as a
    // full file backup at lash-studio-backups/index.scanner-v1.html
    // for easy rollback if V2 doesn't land well.
    // ============================================================
    function lerpPt(cur, target, f) {
      if (!cur) return { x: target.x, y: target.y };
      return { x: cur.x + (target.x - cur.x) * f, y: cur.y + (target.y - cur.y) * f };
    }
    function lerpNum(cur, target, f) { return cur + (target - cur) * f; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; const x = clamp(t,0,1) - 1; return 1 + c3*x*x*x + c1*x*x; }

    const TINTS = {
      cyan: '125,211,252',
      amber: '251,191,36',
      complete: '226,244,255',
    };

    // ---- Layer: Subject Lock (acquire/reacquire) ----
    // t: 0..1 progress since a face was (re)acquired, ~450ms window.
    // Deliberately minimal — a brief corner flash, not a persistent
    // bounding box; the mesh itself is the primary visual, this is
    // just a short "target found" acknowledgement.
    function drawSubjectLock(ctx, box, t, reduceMotion) {
      if (t < 0 || t >= 1) return;
      const cx = box.x + box.width/2, cy = box.y + box.height/2;
      const overshoot = reduceMotion ? 1 : 1 + 0.25 * (1 - easeOutBack(clamp(t/0.6, 0, 1)));
      const w = box.width * overshoot, h = box.height * overshoot;
      const x0 = cx - w/2, y0 = cy - h/2, x1 = cx + w/2, y1 = cy + h/2;
      const bl = Math.min(w, h) * 0.14;
      ctx.save();
      ctx.globalAlpha = clamp(1 - t/0.7, 0, 1);
      ctx.strokeStyle = 'rgba(210,245,255,0.85)';
      ctx.lineWidth = 1.3;
      ctx.shadowColor = 'rgba(190,235,255,0.7)'; ctx.shadowBlur = 8;
      drawCornerBracket(ctx, x0, y0, 1, 1, bl);
      drawCornerBracket(ctx, x1, y0, -1, 1, bl);
      drawCornerBracket(ctx, x0, y1, 1, -1, bl);
      drawCornerBracket(ctx, x1, y1, -1, -1, bl);
      ctx.restore();
    }

    // ---- Layer: persistent scan frame ----
    // Four small minimal corner brackets tracking the real face
    // bounding box for the whole duration of the scan — never a
    // full square around the face, just light "camera focus"-style
    // marks so the mesh (not a HUD box) stays the primary subject.
    function drawScanFrame(ctx, box, presence, aligned) {
      if (presence <= 0.01) return;
      const pad = Math.min(box.width, box.height) * 0.1;
      const x0 = box.x - pad, y0 = box.y - pad, x1 = box.x + box.width + pad, y1 = box.y + box.height + pad;
      const bl = Math.min(x1-x0, y1-y0) * 0.09;
      ctx.save();
      ctx.globalAlpha = presence * 0.55;
      ctx.strokeStyle = aligned ? 'rgba(83,199,255,0.8)' : 'rgba(240,169,59,0.7)';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = aligned ? 'rgba(10,140,255,0.5)' : 'rgba(240,169,59,0.4)'; ctx.shadowBlur = 5;
      drawCornerBracket(ctx, x0, y0, 1, 1, bl);
      drawCornerBracket(ctx, x1, y0, -1, 1, bl);
      drawCornerBracket(ctx, x0, y1, 1, -1, bl);
      drawCornerBracket(ctx, x1, y1, -1, -1, bl);
      ctx.restore();
    }

    // ============================================================
    // Facial Surface Mesh geometry (V3)
    // ------------------------------------------------------------
    // The 68-point landmark model gives real coverage of jaw, brows,
    // nose, eyes and mouth — but no forehead, temple or cheek-surface
    // points at all. To make the mesh actually lie on the whole face
    // (not just its contour), buildFaceMesh() adds a small set of
    // VISUAL-ONLY points for those regions, each one a pure geometric
    // extrapolation/interpolation of two-or-more REAL tracked points
    // (e.g. "forehead point = brow point, shifted along the face's
    // own up-axis"). These points are only ever consumed by the
    // rendering functions below — they are never passed to
    // classifyFeatures/rankDesigns/computeHeadPose or any other
    // analysis function, and they carry no invented numeric data
    // (no fake confidence/depth values), only positions derived from
    // real detections.
    // ============================================================
    function avgPts(pts) {
      let x = 0, y = 0;
      for (const p of pts) { x += p.x; y += p.y; }
      return { x: x/pts.length, y: y/pts.length };
    }
    function lerpPt2(a, b, f) { return { x: a.x+(b.x-a.x)*f, y: a.y+(b.y-a.y)*f }; }

    function buildFaceMesh(d) {
      if (!d || !d.jaw || d.jaw.length < 17 || !d.leftBrow || !d.rightBrow || !d.nose || !d.leftEye || !d.rightEye || !d.mouth) return null;
      const jaw = d.jaw, browA = d.leftBrow, browB = d.rightBrow, nose = d.nose;
      const eyeA = d.leftEye, eyeB = d.rightEye, mouth = d.mouth;
      const chin = jaw[8];
      const browMid = { x: (browA[2].x+browB[2].x)/2, y: (browA[2].y+browB[2].y)/2 };
      const dx = browMid.x-chin.x, dy = browMid.y-chin.y;
      const faceVert = Math.hypot(dx,dy) || 1;
      const up = { x: dx/faceVert, y: dy/faceVert };
      const eyeACenter = avgPts(eyeA), eyeBCenter = avgPts(eyeB);

      // VISUAL-ONLY: forehead coverage, extrapolated upward from the
      // real brow line along the face's own up-axis (so it follows
      // head roll/tilt exactly like the real points do). The 68-point
      // model has no forehead/hairline landmarks at all, so this row
      // is hard-clamped against a ceiling derived from the REAL
      // landmark bounding box — never allowed to rise past a bounded
      // fraction of the face's own real height above its highest real
      // point (the eyebrows) — so it self-scales correctly with face
      // size/distance and can never reach into hair or background,
      // regardless of this face's proportions. Used only for the
      // LOCAL forehead triangulation below — never joined into an
      // outer perimeter/contour line.
      const allReal = [...jaw, ...browA, ...browB, ...nose, ...eyeA, ...eyeB, ...mouth];
      const realMinY = Math.min(...allReal.map(p => p.y));
      const realMaxY = Math.max(...allReal.map(p => p.y));
      const realBoxH = Math.max(1, realMaxY - realMinY);
      const foreheadCeilingY = realMinY - realBoxH * 0.26;
      const clampRise = (p, riseFrac) => {
        const target = { x: p.x + up.x*faceVert*riseFrac, y: p.y + up.y*faceVert*riseFrac };
        if (up.y < 0 && target.y < foreheadCeilingY) {
          const f = (p.y - foreheadCeilingY) / ((p.y - target.y) || 1);
          return { x: p.x + (target.x-p.x)*f, y: foreheadCeilingY };
        }
        return target;
      };
      const browSpan = [browA[0], browA[2], lerpPt2(browA[4], browB[0], 0.5), browB[2], browB[4]];
      const f1 = browSpan.map(p => clampRise(p, 0.19));
      const f2 = [0.15, 0.5, 0.85].map(t => clampRise(lerpPt2(browSpan[0], browSpan[4], t), 0.30));
      // VISUAL-ONLY: cheek anchors, blended between jaw + eye/mouth.
      const cheekAU = lerpPt2(jaw[3], eyeACenter, 0.45);
      const cheekAL = lerpPt2(jaw[5], mouth[0], 0.4);
      const cheekBU = lerpPt2(jaw[13], eyeBCenter, 0.45);
      const cheekBL = lerpPt2(jaw[11], mouth[6], 0.4);

      return { jaw, browA, browB, nose, eyeA, eyeB, mouth, browSpan, f1, f2, cheekAU, cheekAL, cheekBU, cheekBL, eyeACenter, eyeBCenter, chin, browMid, faceVert };
    }

    // Fixed connectivity over the point set above — this is what
    // actually makes it read as a "mesh" (a connected web of thin
    // triangulated edges) instead of a scattered dot cloud. Topology
    // is constant; only coordinates move, frame to frame.
    function meshEdgeList(m) {
      const E = [];
      const push = (a,b) => { if (a && b) E.push([a,b]); };
      const chain = (pts, closed) => { for (let i=0;i<pts.length-1;i++) push(pts[i],pts[i+1]); if (closed) push(pts[pts.length-1],pts[0]); };
      chain(m.jaw, false);
      chain(m.browA, false); chain(m.browB, false);
      chain(m.nose.slice(0,4), false); chain(m.nose.slice(4,9), false);
      chain(m.eyeA, true); chain(m.eyeB, true);
      chain(m.mouth, true);
      chain(m.f1, false); chain(m.f2, false);
      for (let i=0;i<5;i++) push(m.browSpan[i], m.f1[i]);
      push(m.f1[0],m.f2[0]); push(m.f1[1],m.f2[0]); push(m.f1[1],m.f2[1]);
      push(m.f1[2],m.f2[1]); push(m.f1[3],m.f2[1]); push(m.f1[3],m.f2[2]); push(m.f1[4],m.f2[2]);
      push(m.browA[0], m.jaw[0]); push(m.browB[4], m.jaw[16]);
      push(m.f1[0], m.jaw[0]); push(m.f1[4], m.jaw[16]);
      push(m.eyeA[1], m.browA[1]); push(m.eyeA[2], m.browA[3]);
      push(m.eyeB[1], m.browB[1]); push(m.eyeB[2], m.browB[3]);
      push(m.nose[0], m.eyeA[3]); push(m.nose[0], m.eyeB[0]);
      push(m.jaw[3], m.cheekAU); push(m.cheekAU, m.eyeA[4]); push(m.cheekAU, m.nose[2]);
      push(m.jaw[5], m.cheekAL); push(m.cheekAL, m.mouth[0]); push(m.cheekAL, m.cheekAU);
      push(m.jaw[13], m.cheekBU); push(m.cheekBU, m.eyeB[1]); push(m.cheekBU, m.nose[2]);
      push(m.jaw[11], m.cheekBL); push(m.cheekBL, m.mouth[6]); push(m.cheekBL, m.cheekBU);
      push(m.jaw[4], m.mouth[0]); push(m.jaw[12], m.mouth[6]);
      push(m.chin, m.mouth[8]); push(m.nose[6], m.mouth[3]);
      return E;
    }
    function meshTriangleList(m) {
      const T = [];
      const push = (a,b,c) => { if (a&&b&&c) T.push([a,b,c]); };
      push(m.browSpan[0], m.f1[0], m.f1[1]); push(m.browSpan[1], m.f1[1], m.browSpan[0]);
      push(m.browSpan[1], m.f1[1], m.f1[2]); push(m.browSpan[2], m.f1[2], m.browSpan[1]);
      push(m.browSpan[2], m.f1[2], m.f1[3]); push(m.browSpan[3], m.f1[3], m.browSpan[2]);
      push(m.browSpan[3], m.f1[3], m.f1[4]); push(m.browSpan[4], m.f1[4], m.browSpan[3]);
      push(m.f1[0], m.f2[0], m.f1[1]); push(m.f1[1], m.f2[0], m.f2[1]); push(m.f1[1], m.f2[1], m.f1[2]);
      push(m.f1[2], m.f2[1], m.f1[3]); push(m.f1[3], m.f2[1], m.f2[2]); push(m.f1[3], m.f2[2], m.f1[4]);
      push(m.jaw[3], m.cheekAU, m.jaw[4]); push(m.cheekAU, m.jaw[5], m.jaw[4]);
      push(m.cheekAU, m.cheekAL, m.jaw[5]); push(m.cheekAL, m.mouth[0], m.jaw[5]);
      push(m.jaw[13], m.cheekBU, m.jaw[12]); push(m.cheekBU, m.jaw[11], m.jaw[12]);
      push(m.cheekBU, m.cheekBL, m.jaw[11]); push(m.cheekBL, m.mouth[6], m.jaw[11]);
      return T;
    }
    function meshNodeList(m) {
      const N = [];
      const add = (p) => { if (p) N.push(p); };
      for (let i=0;i<m.jaw.length;i+=2) add(m.jaw[i]);
      m.browA.forEach(add); m.browB.forEach(add);
      m.nose.forEach(add);
      m.f1.forEach(add); m.f2.forEach(add);
      add(m.cheekAU); add(m.cheekAL); add(m.cheekBU); add(m.cheekBL);
      m.eyeA.forEach(add); m.eyeB.forEach(add);
      for (let i=0;i<m.mouth.length;i+=2) add(m.mouth[i]);
      return N;
    }

    // ---- Layer: Facial Surface Mesh render ----
    // revealMode/wavefrontY: during the ~2s post-lock acquisition
    // window, only geometry above the scan wavefront is drawn ("mesh
    // builds top -> bottom behind the beam"); once the initial
    // reconstruction is done the whole mesh stays visible. beamY
    // gives every vertex a soft brightness boost as the ambient beam
    // sweeps past it. depth weighting dims points further from the
    // face center — presentation only, never alters the video.
    function drawFaceMeshV3(ctx, m, opts) {
      if (!m || opts.presence <= 0.01) return;
      const { revealMode, wavefrontY, beamY, presence, boxCenter, faceHalfW } = opts;
      const edges = meshEdgeList(m);
      const tris = meshTriangleList(m);
      const nodes = meshNodeList(m);
      const depthWeight = (x,y) => {
        const dist = Math.hypot(x-boxCenter.x, y-boxCenter.y) / faceHalfW;
        return clamp(1 - dist*0.6, 0.35, 1);
      };
      const revealed = (y) => !revealMode || y <= wavefrontY + 10;
      const nearBeam = (y) => clamp(1 - Math.abs(y-beamY)/70, 0, 1);

      ctx.save();
      ctx.fillStyle = 'rgba(150,225,255,1)';
      for (const [a,b,c] of tris) {
        const my = (a.y+b.y+c.y)/3;
        if (!revealed(my)) continue;
        const w = depthWeight((a.x+b.x+c.x)/3, my), boost = nearBeam(my);
        ctx.globalAlpha = presence * w * (0.02 + boost*0.05);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(150,225,255,1)';
      ctx.lineWidth = 0.7;
      for (const [a,b] of edges) {
        const my = (a.y+b.y)/2;
        if (!revealed(my)) continue;
        const w = depthWeight((a.x+b.x)/2, my), boost = nearBeam(my);
        ctx.globalAlpha = presence * w * (0.16 + boost*0.5);
        ctx.shadowColor = 'rgba(150,225,255,0.5)'; ctx.shadowBlur = 1.5 + boost*3;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(200,238,255,1)';
      for (const p of nodes) {
        if (!revealed(p.y)) continue;
        const w = depthWeight(p.x, p.y), boost = nearBeam(p.y);
        ctx.globalAlpha = presence * w * (0.35 + boost*0.55);
        ctx.beginPath(); ctx.arc(p.x, p.y, 1 + boost*0.8, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // ---- Layer: sparse "digital dust" near the active scan region.
    // Deliberately tiny/sparse — a texture cue, never a starfield. ----
    function drawDust(ctx, box, beamY, active, time) {
      if (!active) return;
      ctx.save();
      ctx.fillStyle = 'rgba(210,240,255,0.7)';
      for (let i = 0; i < 10; i++) {
        const seed = i*47.3;
        const px = box.x + ((Math.sin(seed)+1)/2) * box.width;
        const py = beamY + Math.sin(time/900 + seed)*14 + Math.cos(seed*1.7)*22;
        ctx.globalAlpha = 0.15 + 0.25*Math.abs(Math.sin(time/500+seed));
        const s = (i%3===0) ? 1.1 : 0.6;
        ctx.fillRect(px, py, s, s);
      }
      ctx.restore();
    }

    // ============================================================
    // LashScanOverlay — Natural Lash Scan visual layer. Same palette
    // and restrained, minimal-HUD language as the face scanner, but a
    // distinct macro-analysis composition: eye ROI lock brackets, a
    // thin lid-contour glow, a scan pulse along the real detected
    // lash line, and luminous nodes that only ever mark an actually-
    // stabilized candidate (never a decorative random point).
    // ============================================================
    function curveLerp(a, b, f) { return { x: a.x+(b.x-a.x)*f, y: a.y+(b.y-a.y)*f }; }
    function pointOnCurve(pts, t) {
      const seg = clamp(t,0,1) * (pts.length-1);
      const i = Math.min(pts.length-2, Math.floor(seg));
      return curveLerp(pts[i], pts[i+1], seg-i);
    }
    function drawLashLine(ctx, pts, revealFrac, presence) {
      if (presence <= 0.01 || !pts) return;
      const n = Math.max(2, Math.round(pts.length * clamp(revealFrac,0,1)));
      ctx.save();
      ctx.globalAlpha = presence * 0.8;
      ctx.strokeStyle = 'rgba(83,199,255,0.9)';
      ctx.lineWidth = 1.3;
      ctx.shadowColor = 'rgba(10,140,255,0.6)'; ctx.shadowBlur = 6;
      ctx.beginPath();
      for (let i=0;i<n;i++) { const p=pts[i]; i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
      ctx.stroke();
      ctx.restore();
    }
    function drawLashScanPulse(ctx, pts, time, cycleMs, presence) {
      if (presence <= 0.01) return;
      const t = (time % cycleMs) / cycleMs;
      const p = pointOnCurve(pts, t);
      ctx.save();
      ctx.globalAlpha = presence;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
      grad.addColorStop(0, 'rgba(224,247,255,0.9)');
      grad.addColorStop(1, 'rgba(83,199,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(230,250,255,0.95)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return p;
    }
    // candidates: [{t, appearedAt}] in display-mapped curve space
    function drawLashNodes(ctx, pts, candidates, time, presence) {
      if (presence <= 0.01) return;
      ctx.save();
      for (const c of candidates) {
        const age = time - c.appearedAt;
        const fadeIn = clamp(age/300, 0, 1);
        const pulse = 0.6 + 0.4*Math.sin(time/500 + c.t*20);
        const p = pointOnCurve(pts, c.t);
        ctx.globalAlpha = presence * fadeIn * pulse;
        ctx.fillStyle = 'rgba(200,238,255,0.95)';
        ctx.shadowColor = 'rgba(83,199,255,0.8)'; ctx.shadowBlur = 4;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    function drawLashFinalPulse(ctx, pts, t, presence) {
      if (presence <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = presence * (1-t) * 0.9;
      ctx.strokeStyle = 'rgba(224,247,255,0.95)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(83,199,255,0.9)'; ctx.shadowBlur = 10;
      const n = pts.length;
      ctx.beginPath();
      for (let i=0;i<n;i++) { const p=pts[i]; i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
      ctx.stroke();
      ctx.restore();
    }

    // ---- Layer: Eye targeting (isolation-aware) ----
    function drawEyeTarget(ctx, center, rx, ry, innerPt, outerPt, label, illum, presence, time, isolating, lockPulse) {
      if (presence <= 0.01) return;
      const pulse = 0.5 + 0.5 * Math.sin(time/600 + (label==='R' ? 1.4 : 0));
      const glow = Math.min(1, 0.35 + illum*0.65);
      const scale = 1 + (lockPulse||0)*0.14;
      const rxS = rx*scale, ryS = ry*scale;
      ctx.save();
      ctx.globalAlpha = presence * glow;
      ctx.strokeStyle = `rgba(186,230,253,${(0.5+0.3*pulse).toFixed(2)})`;
      ctx.lineWidth = 1.1;
      ctx.shadowColor = 'rgba(125,211,252,0.5)'; ctx.shadowBlur = 4 + illum*6 + (lockPulse||0)*8;
      ctx.beginPath();
      ctx.ellipse(center.x, center.y, rxS, ryS, 0, 0, Math.PI*2);
      ctx.stroke();

      for (let i = 0; i < 8; i++) {
        const a = (i/8) * Math.PI*2 + time/4000;
        const nx = center.x + Math.cos(a)*rxS, ny = center.y + Math.sin(a)*ryS;
        const ex = center.x + Math.cos(a)*(rxS+4), ey = center.y + Math.sin(a)*(ryS+4);
        ctx.beginPath(); ctx.moveTo(nx,ny); ctx.lineTo(ex,ey); ctx.stroke();
      }
      [innerPt, outerPt].forEach(p => {
        ctx.beginPath(); ctx.moveTo(p.x, p.y - 4); ctx.lineTo(p.x, p.y + 4); ctx.stroke();
      });

      if (isolating) {
        const bx0 = center.x-rxS-7, by0 = center.y-ryS-7, bx1 = center.x+rxS+7, by1 = center.y+ryS+7;
        const bl = Math.min(rxS,ryS)*0.45;
        ctx.lineWidth = 1;
        drawCornerBracket(ctx, bx0, by0, 1, 1, bl);
        drawCornerBracket(ctx, bx1, by0, -1, 1, bl);
        drawCornerBracket(ctx, bx0, by1, 1, -1, bl);
        drawCornerBracket(ctx, bx1, by1, -1, -1, bl);
      }

      ctx.shadowBlur = 0;
      ctx.font = '600 9px -apple-system, sans-serif';
      ctx.fillStyle = `rgba(226,244,255,${(0.55+0.25*pulse).toFixed(2)})`;
      ctx.textAlign = 'center';
      ctx.fillText(label, center.x, center.y - ryS - 8);
      ctx.restore();
    }

    // ---- Layer: Scanning Field ----
    // Multi-layer beam: bright core + wide glow plane + forward
    // trail + vertical data streaks + particle noise. Returns the
    // beam's current display-Y so callers can react (mesh boost,
    // eye illumination) to it physically passing through.
    function drawScanBeam(ctx, box, time, cycleMs, softness, reduceMotion) {
      if (softness <= 0.01) return -9999;
      const frac = (time % cycleMs) / cycleMs;
      const margin = box.height * 0.12;
      const y = box.y - margin + frac * (box.height + margin*2);
      const x0 = box.x - box.width*0.08, x1 = box.x + box.width*1.08;
      const w = x1 - x0;
      ctx.save();
      ctx.globalAlpha = softness;
      const grad = ctx.createLinearGradient(0, y-30, 0, y+30);
      grad.addColorStop(0, 'rgba(125,211,252,0)');
      grad.addColorStop(0.5, 'rgba(186,230,253,0.3)');
      grad.addColorStop(1, 'rgba(125,211,252,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x0, y-30, w, 60);

      ctx.strokeStyle = 'rgba(224,247,255,0.92)';
      ctx.lineWidth = 1.4;
      ctx.shadowColor = 'rgba(186,230,253,0.9)'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();

      ctx.shadowBlur = 0;
      const trailGrad = ctx.createLinearGradient(0, y-44, 0, y);
      trailGrad.addColorStop(0, 'rgba(125,211,252,0)');
      trailGrad.addColorStop(1, 'rgba(125,211,252,0.11)');
      ctx.fillStyle = trailGrad;
      ctx.fillRect(x0, y-44, w, 44);

      if (!reduceMotion) {
        // vertical data streaks near the plane
        ctx.strokeStyle = 'rgba(190,235,255,0.35)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
          const sx = x0 + ((i*97 + (time/7)) % w);
          const sh = 6 + (i%3)*4;
          ctx.beginPath(); ctx.moveTo(sx, y-sh); ctx.lineTo(sx, y+sh); ctx.stroke();
        }
        // particle noise
        ctx.fillStyle = 'rgba(224,247,255,0.5)';
        for (let i = 0; i < 12; i++) {
          const nx = x0 + ((i*53 + (time/11)) % w);
          const ny = y + Math.sin(i*12.9 + time/300) * 10;
          const s = (i%3===0) ? 1.4 : 0.8;
          ctx.globalAlpha = softness * (0.12 + 0.22*Math.abs(Math.sin(i+time/400)));
          ctx.fillRect(nx, ny, s, s);
        }
      }
      ctx.restore();
      return y;
    }

    // ---- Layer: Iris micro-scan ----
    // Tight, precise focus animation (concentric ring, short sweep,
    // rotating arc, radial ticks) — deliberately small, not a
    // half-face circle.
    function drawIrisMicroScan(ctx, center, rx, ry, time) {
      const t = (time % 1500) / 1500;
      const sweepX = center.x - rx*0.7 + t * rx*1.4;
      ctx.save();
      ctx.beginPath(); ctx.ellipse(center.x, center.y, rx*1.05, ry*1.05, 0, 0, Math.PI*2); ctx.clip();
      ctx.strokeStyle = 'rgba(224,247,255,0.85)';
      ctx.lineWidth = 1.1;
      ctx.shadowColor = 'rgba(186,230,253,0.8)'; ctx.shadowBlur = 7;
      ctx.beginPath(); ctx.moveTo(sweepX, center.y-ry); ctx.lineTo(sweepX, center.y+ry); ctx.stroke();
      ctx.restore();

      const ringPulse = 0.5 + 0.5*Math.sin(time/380);
      ctx.save();
      ctx.strokeStyle = `rgba(125,211,252,${(0.35+0.35*ringPulse).toFixed(2)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(center.x, center.y, rx*0.4, ry*0.4, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(210,245,255,0.7)';
      ctx.lineWidth = 1.3;
      const arcStart = (time/900) % (Math.PI*2);
      ctx.beginPath(); ctx.ellipse(center.x, center.y, rx*0.62, ry*0.62, 0, arcStart, arcStart+Math.PI*0.55); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(190,235,255,0.6)'; ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI*2 + time/2600;
        const ax0 = center.x+Math.cos(a)*rx*0.75, ay0 = center.y+Math.sin(a)*ry*0.75;
        const ax1 = center.x+Math.cos(a)*rx*0.92, ay1 = center.y+Math.sin(a)*ry*0.92;
        ctx.beginPath(); ctx.moveTo(ax0,ay0); ctx.lineTo(ax1,ay1); ctx.stroke();
      }
      ctx.restore();
    }

    // ---- Layer: floating data-extraction tags ----
    // events: [{label, ts}] — each rendered for ~900ms with a fade
    // envelope and a checkmark, then discarded by the caller.
    function drawDataTags(ctx, box, events, time) {
      let row = 0;
      for (const ev of events) {
        const age = time - ev.ts;
        if (age < 0 || age > 900) continue;
        const fadeIn = clamp(age/150, 0, 1), fadeOut = 1 - clamp((age-650)/250, 0, 1);
        const a = Math.min(fadeIn, fadeOut);
        const y = box.y - 10 - row*14;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = '600 9px -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(190,235,255,0.5)';
        ctx.fillText(ev.label, box.x + box.width - 6, y);
        ctx.fillStyle = 'rgba(134,239,172,0.9)';
        ctx.fillText(' ✓', box.x + box.width + 12, y);
        ctx.restore();
        row++;
      }
    }

    // ---- Layer: data-flow convergence (left eye + right eye -> node) ----
    function drawDataFlow(ctx, le, re, node, t) {
      if (t < 0 || t > 1) return;
      const drawFrac = clamp(t/0.55, 0, 1);
      ctx.save();
      ctx.strokeStyle = 'rgba(190,235,255,0.75)';
      ctx.lineWidth = 1;
      ctx.shadowColor = 'rgba(150,225,255,0.6)'; ctx.shadowBlur = 5;
      ctx.globalAlpha = clamp(1 - Math.max(0,(t-0.8)/0.2), 0, 1);
      [le, re].forEach(eye => {
        const ex = eye.x + (node.x-eye.x)*drawFrac, ey = eye.y + (node.y-eye.y)*drawFrac;
        ctx.beginPath(); ctx.moveTo(eye.x,eye.y); ctx.lineTo(ex,ey); ctx.stroke();
      });
      if (t > 0.5) {
        const pulseT = (t-0.5)/0.5;
        ctx.globalAlpha = (1-pulseT)*0.8+0.2;
        ctx.beginPath(); ctx.arc(node.x, node.y, 3+pulseT*10, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(220,248,255,0.9)';
        ctx.beginPath(); ctx.arc(node.x, node.y, 2, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // ---- Layer: data-flow fan (one eye -> several nearby mesh
    // anchors: temple / nose / cheek / center), fired once right
    // after that eye's iris geometry has been captured. Each target
    // pulse starts with a small stagger so it reads as data
    // propagating outward through the mesh, not one flat flash. ----
    function drawDataFlowFan(ctx, eye, targets, t) {
      if (t < 0 || t > 1) return;
      const drawFrac = clamp(t/0.6, 0, 1);
      const fadeOut = clamp(1 - Math.max(0,(t-0.8)/0.2), 0, 1);
      ctx.save();
      ctx.strokeStyle = 'rgba(190,235,255,0.65)';
      ctx.lineWidth = 0.8;
      ctx.shadowColor = 'rgba(150,225,255,0.5)'; ctx.shadowBlur = 4;
      targets.forEach((node, i) => {
        if (!node) return;
        const delay = i*0.06;
        const lt = clamp((drawFrac-delay)/(1-delay), 0, 1);
        if (lt <= 0) return;
        ctx.globalAlpha = fadeOut * (0.3+lt*0.5);
        const ex = eye.x + (node.x-eye.x)*lt, ey = eye.y + (node.y-eye.y)*lt;
        ctx.beginPath(); ctx.moveTo(eye.x,eye.y); ctx.lineTo(ex,ey); ctx.stroke();
        if (lt > 0.92) {
          ctx.fillStyle = 'rgba(220,248,255,0.85)';
          ctx.beginPath(); ctx.arc(node.x, node.y, 1.6, 0, Math.PI*2); ctx.fill();
        }
      });
      ctx.restore();
    }

    // ---- Small centered floating label (SUBJECT LOCKED / IRIS
    // SAMPLE ACQUIRED / ANALYSIS COMPLETE...) with its own fade
    // envelope, driven by a caller-supplied age in ms. ----
    function drawCenterLabel(ctx, x, y, label, age, inMs, holdMs, outMs) {
      const total = inMs+holdMs+outMs;
      if (age < 0 || age > total) return;
      let a;
      if (age < inMs) a = age/inMs;
      else if (age < inMs+holdMs) a = 1;
      else a = 1 - (age-inMs-holdMs)/outMs;
      ctx.save();
      ctx.globalAlpha = clamp(a,0,1);
      ctx.font = '600 10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(220,248,255,0.95)';
      ctx.shadowColor = 'rgba(190,235,255,0.6)'; ctx.shadowBlur = 6;
      ctx.fillText(label, x, y);
      ctx.restore();
    }

    function drawCompletionBurst(ctx, box, t) {
      const cx = box.x + box.width/2, cy = box.y + box.height/2;
      const r = Math.max(box.width, box.height) * (0.5 + t*0.6);
      ctx.save();
      ctx.globalAlpha = (1-t) * 0.5;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(224,247,255,0.35)');
      grad.addColorStop(1, 'rgba(224,247,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // 7-segment diagnostic rail: FACE/ALIGN/EYES/LIDS/IRIS/SYMMETRY/
    // DESIGN — a coarser, presentational grouping of the same real
    // internal phases (no new thresholds; tracking/mapping share a
    // segment, as do symmetry/stabilizing).
    const RAIL_SEGMENTS = ['railFace','railAlign','railEyes','railLids','railIris','railSymmetry','railDesign'];
    function railSegmentForPhase(phase) {
      switch (phase) {
        case 'aligning': return 1;
        case 'tracking': case 'mapping': return 2;
        case 'eyelids': return 3;
        case 'iris': return 4;
        case 'symmetry': case 'stabilizing': return 5;
        case 'finalizing': return 6;
        default: return -1;
      }
    }

    // ============================================================
    // UI COMPONENTS
    // ============================================================

    function LangToggle({ lang, setLang }) {
      return (
        <div className="flex rounded-full bg-surface p-0.5 text-[11px] font-semibold">
          {['ru','en'].map(l => (
            <button key={l} onClick={() => setLang(l)} className={`px-2.5 py-1 rounded-full transition-all ${lang===l ? 'bg-white/15 text-white' : 'text-textSecondary'}`}>{l.toUpperCase()}</button>
          ))}
        </div>
      );
    }

    // ============================================================
    // CONSENT UI — Phase 1: consent foundation. Purely presentational
    // + local state; all persistence goes through window.ConsentManager
    // (consent-manager.js). No analytics SDK/script/network request
    // exists anywhere in this codebase yet — these components only
    // read/write the user's consent CHOICE, never scan data.
    // ============================================================
    function ShieldIcon({ className }) {
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="1.6" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 3l7 3v5c0 4.5-3 8.25-7 10-4-1.75-7-5.5-7-10V6l7-3z" />
        </svg>
      );
    }

    function ConsentToggleRow({ label, desc, checked, disabled, onChange }) {
      return (
        <div className="flex items-start justify-between gap-3 py-3 border-b border-border last:border-b-0">
          <div className="flex-1 pr-2">
            <p className="text-[13px] font-semibold text-textPrimary mb-0.5">{label}</p>
            <p className="text-[12px] text-textSecondary leading-relaxed">{desc}</p>
          </div>
          <button
            type="button"
            role="switch"
            aria-checked={checked}
            disabled={disabled}
            onClick={() => !disabled && onChange(!checked)}
            className={`relative flex-shrink-0 w-11 h-6 rounded-full transition-colors ${disabled ? 'bg-white/10 opacity-60 cursor-not-allowed' : (checked ? 'bg-accent' : 'bg-white/15')}`}
          >
            <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white transition-transform ${checked ? 'translate-x-5' : ''}`} />
          </button>
        </div>
      );
    }

    // Shared consent UI. mode="banner": compact, non-blocking, shown
    // pinned to the TOP of the screen (never over the primary Live
    // Scan / Photo CTAs, which live lower in the layout) until a
    // first decision is made — Reject/Accept/Customize all dismiss it
    // and NOTHING it renders disables or covers any existing screen
    // control. mode="settings": the same content reopened later from
    // the privacy icon, as a centered dismissible panel, to change or
    // withdraw the choice at any time. The ONLY optional choice ever
    // surfaced here is analytics; essential storage is shown as
    // informational/always-on, never as a toggle (it does not require
    // consent — see STRINGS.consentEssentialDesc).
    function ConsentPanel({ lang, mode, currentConsent, onAccept, onReject, onSaveCustom, onClose }) {
      const [customizing, setCustomizing] = useState(false);
      const [pendingAnalytics, setPendingAnalytics] = useState(!!(currentConsent && currentConsent.analytics));

      const statusText = !currentConsent
        ? t('consentStatusUndecided', lang)
        : (currentConsent.analytics ? t('consentStatusOn', lang) : t('consentStatusOff', lang));

      const body = (
        <>
          <div className="flex items-start gap-3 mb-3">
            <div className="w-8 h-8 rounded-md bg-white/[0.03] border border-border flex items-center justify-center flex-shrink-0">
              <ShieldIcon className="w-4 h-4 text-accent" />
            </div>
            <div>
              <h3 className="text-[14px] font-semibold text-textPrimary">{mode === 'banner' ? t('consentBannerTitle', lang) : t('consentSettingsTitle', lang)}</h3>
              {mode === 'settings' && (
                <p className="text-[11px] text-textMuted mt-0.5">
                  {statusText}
                  {currentConsent ? ` · ${t('consentUpdatedAt', lang)} ${new Date(currentConsent.updatedAt).toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US')}` : ''}
                </p>
              )}
            </div>
          </div>
          <p className="text-[13px] text-textSecondary leading-relaxed mb-4">{t('consentBannerBody', lang)}</p>

          {customizing && (
            <div className="glass rounded-md px-3 mb-4">
              <ConsentToggleRow
                label={t('consentAnalyticsLabel', lang)}
                desc={t('consentAnalyticsDesc', lang)}
                checked={pendingAnalytics}
                onChange={setPendingAnalytics}
              />
              <ConsentToggleRow
                label={t('consentEssentialLabel', lang)}
                desc={t('consentEssentialDesc', lang)}
                checked={true}
                disabled={true}
                onChange={() => {}}
              />
            </div>
          )}

          <div className="flex flex-col gap-2">
            {customizing ? (
              <button onClick={() => onSaveCustom(pendingAnalytics)} className="w-full py-3 rounded-md bg-accent text-white text-sm font-semibold press-scale">
                {t('consentSave', lang)}
              </button>
            ) : (
              <div className="flex gap-2">
                <button onClick={onAccept} className="flex-1 py-3 rounded-md bg-accent text-white text-sm font-semibold press-scale">
                  {t('consentAccept', lang)}
                </button>
                <button onClick={onReject} className="flex-1 py-3 rounded-md bg-white/10 text-textPrimary text-sm font-medium press-scale">
                  {t('consentReject', lang)}
                </button>
              </div>
            )}
            {!customizing && (
              <button onClick={() => setCustomizing(true)} className="w-full py-2 rounded-md text-textSecondary text-[13px] font-medium underline underline-offset-2">
                {t('consentCustomize', lang)}
              </button>
            )}
            {mode === 'settings' && (
              <button onClick={onClose} className="w-full py-2 rounded-md text-textMuted text-[13px] font-medium">
                {t('consentClose', lang)}
              </button>
            )}
            {mode === 'banner' && (
              <p className="text-[11px] text-textMuted text-center leading-relaxed mt-1">{t('consentChangeLaterNote', lang)}</p>
            )}
          </div>
        </>
      );

      if (mode === 'banner') {
        // Pinned under the top header row, NOT at the bottom — the

        return (

      // settings mode: centered modal with backdrop; backdrop click
      // closes it (equivalent to onClose — never a destructive action,
      // never changes the stored consent by itself). Same inline-style
      // positioning rationale as the banner above.
      return (
        <div style={{ position: 'absolute', inset: 0, zIndex: 60 }} className="flex items-center justify-center p-4 bg-black/60" onClick={onClose}>
          <div className="glass-strong rounded-lg p-4 w-full max-h-[85vh] overflow-y-auto hide-scrollbar" onClick={(e) => e.stopPropagation()}>
            {body}
          </div>
        </div>
      );
    }

    function ConsentIconButton({ onClick, lang }) {
      return (
        <button onClick={onClick} aria-label={t('consentOpenSettingsAria', lang)} className="w-8 h-8 rounded-full glass flex items-center justify-center text-textSecondary press-scale">

    function Section({ title, defaultOpen, children }) {
      const [open, setOpen] = useState(!!defaultOpen);

          <button onClick={() => setOpen(o=>!o)} className="w-full flex justify-between items-center p-4">

    // One numbered, icon-labeled subsection of the Application Plan

    function HomeScreen({ onLive, onPhoto, modelsLoaded, loadError, onRetry, onClients }) {

        <div className="h-full flex flex-col p-6 fade-in overflow-y-auto hide-scrollbar">

          {loadError ? (

              <p className="text-xs text-textSecondary mb-3">{t('modelsLoadFailed', lang)}</p>

            <div className="space-y-3 mb-6">
              <button onClick={onLive} disabled={!modelsLoaded} className={`w-full py-4 rounded-md font-semibold text-[15px] uppercase tracking-wide press-scale transition-colors ${modelsLoaded ? 'bg-gradient-to-b from-[#149EFF] to-[#0A78E0] text-white shadow-[0_0_0_1px_rgba(83,199,255,0.25),0_8px_28px_rgba(10,140,255,0.35)]' : 'bg-white/10 text-textSecondary'}`}>

              <button onClick={onPhoto} disabled={!modelsLoaded} className={`w-full py-4 rounded-md font-medium text-[15px] uppercase tracking-wide press-scale border ${modelsLoaded ? 'border-border text-textPrimary bg-white/[0.03]' : 'border-border/50 text-textMuted'}`}>

          <button onClick={onClients} className="w-full py-3.5 rounded-md font-medium text-[14px] press-scale glass flex items-center justify-center gap-2 text-textPrimary mb-4">

            {t('clientsNavLabel', lang)}
          </button>
          <div className="glass rounded-lg p-4 mb-1">
            <p className="label-tech mb-2">{t('recentSessions', lang)}</p>
